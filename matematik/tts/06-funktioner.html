<script id="payload" type="application/json">"Viktor. Time seks. Øjnene på jorden. Hænderne på maskinen. Ét øre. Den kontrakt holder. Hvis jorden kræver dig, tager jorden dig. Lyden kan vente. Papiret kan vente. Jeg kan vente.\n\nJeg er Grok. Jeg er din AI. Jeg er ikke Kristus. Jeg taler ikke for Gud. Jeg peger. Det, der er sandt i den her time, tilhører skabningen og dens Herre. Det, der er skævt, er mit. Test det. Jorden tester det alligevel. Jorden lyver ikke.\n\nAmen til det. Så går vi i gang.\n\nI går, i den forrige time, var bommen tavlen. Vinkel. Bue. Flade. Indre. Kraft gange arm. I dag er tavlen det, der sker, når du gør noget. Ind. Ud. En regel imellem. Det er en funktion. Ikke et skoleord, du skal bære som en kuffert. Et håndværksord: det, der går ind, bestemmer det, der kommer ud ,  hvis betingelserne er de samme.\n\nHør den sidste sætning igen. Den er hele timen. Ind bestemmer ud. Hvis betingelserne er de samme. Mænd, der glemmer hvis’et, kalder maskinen for upålidelig. Mænd, der husker hvis’et, kalder jorden for en del af reglen. Time seks er at huske hvis’et.\n\nPause.\n\nFørst tre spørgsmål fra rummet. Jeg stiller. Du tænker. Jeg svarer. Øjnene bliver på jorden.\n\nFørste. Hvad er en vinkel? Stop. Tænk.\n\nEn vinkel er gabet, hvor to linjer mødes. Bommen er to linjer og et gab. Hjørnet i hullet er et gab. Ret er halvfems, når ret er aftalen. Ikke magi. Orden.\n\nAndet. Hvad er forskellen på areal og rumfang? Stop. Tænk.\n\nAreal er mund. Flade. Længde gange bredde, når det er et rektangel. Rumfang er indre. Mund gange dybde, når det er en kasse. Øjet elsker munden. Arbejdet er det indre. Skovl mod hul. Tæl ærligt. Løs er ikke fast.\n\nTredje. Hvad er loven i bommen, når den løfter? Stop. Tænk.\n\nKraft gange arm. Omdrejningspunkt. Fold når det er tungt. Flyt origo når rækken er løgn. Vilje er ikke hydraulik. Papir kun i neutral.\n\nTre søm fra rummet. I dag hænger vi bevægelsen på dem. For en vinkel, der skifter, er et ind, der bliver et ud. En arm, der bliver lang, er et ind, der ændrer, hvad stålet kan. Rummet var billedet. Funktionen er filmen.\n\nPause.\n\nHvad er en funktion?\n\nEn funktion er en regel, der tager noget ind og giver noget ud. Ikke et væsen. Ikke en ånd i kassen. En regel. Du kender den med kroppen, før ordet kommer. Du trykker. Noget sker. Du trykker anderledes. Noget andet sker. Det er ind og ud. Det, der ligger imellem, er maskinen, jorden, olien, vægten, hældningen, varmen, det, du ikke har navngivet endnu.\n\nSkolen tegnede ofte en kasse. En pil ind fra venstre. En pil ud til højre. Indeni stod der måske et bogstav. Du skulle finde ud. Det billede er nyttigt, indtil det lyver. Det lyver, når kassen ser lukket ud, som om verden udenfor ikke tæller. I geden er kassen aldrig lukket. Jorden er i kassen. Vægten er i kassen. Kulden er i kassen. Trætheden i dit ben er i kassen. Funktionen har betingelser. Betingelserne er ikke småskrift. De er reglen.\n\nStop. Tænk. Hvad går ind, når du vil have skovlen til at synke? Ikke det pæne svar. Det ærlige.\n\nHånden på pinden. En bevægelse. En ventil, der åbner. Olie, der løber. Tryk, der skifter. En cylinder, der giver sig. Led, der gaber. Skovl, der møder jord. Jord, der giver sig ,  eller ikke. Kæden er lang. Skolen ville gerne have ét ind og ét ud. Virkeligheden giver dig en kæde af funktioner, hver med sit ind og sit ud, og jorden som den sidste, der nægter at være et tal, du har valgt.\n\nI dag forenkler vi uden at lyve. Vi siger: ind, regel, ud. Så siger vi: reglen har hvis. Så siger vi: hvis jorden skifter, er det ikke den samme funktion, du kørte i går, selv om hånden gjorde det samme.\n\nPause.\n\nPedal.\n\nDer er en pedal, eller der er et håndtag, eller der er begge, afhængigt af den ged, du sidder i. Jeg opdigter ikke dine pedaler. Jeg kender ikke dit bur. Jeg kender handlingen: du giver maskinen et ind, der betyder mere her. Mere brændstof. Mere omdrejning. Mere af det, pumpen kan. Ud, hvis betingelserne holder, er mere bevægelse, mere kraft til det, du bagefter beder bommen om.\n\nSamme tryk med foden. Andet underlag. Op ad. Ned ad. Blødt. Fast. Koldt. Varmt. Tanken næsten tom, eller ikke. Ud er ikke det samme. Foden løj ikke. Foden vidste ikke, at den kun var ét ind. Jorden var også et ind. Hældningen var et ind. Det, motoren allerede lavede, var et ind. Funktionen var større end foden.\n\nSkakmat. Jeg gav den det samme er sandt om foden og falsk om verden. Verden var ikke den samme. Reglen svarede på verden, ikke på din erindring om foden.\n\nHør det som håndværk. Når ud ikke matcher det, du husker, så spørg ikke først: er maskinen blevet dum. Spørg først: hvilket ind har jeg glemt at navngive. Ofte er svaret jorden. Ofte er det vægten i skovlen. Ofte er det, at du selv er et andet ind end i morges ,  et ben, der trykker sløvere, et øje, der ser senere. Time ni tager psykologien. I dag: du er også en betingelse. Det er ikke poesi. Det er ærlighed om kæden.\n\nPause.\n\nTryk.\n\nHydraulik er tryk i olie. Du skal ikke have et tal på uret for at forstå funktionen. Du skal se kæden. Hånd eller pedal giver et ind. En ventil giver olien en vej. Pumpen har allerede givet olien et skub, hvis motoren kører. Cylinderen tager olien ind og giver bevægelse ud. Bevægelse i cylinderen er ind til leddet. Leddet giver gab ud. Gabet er ind til rummet, skovlen sidder i. Skovlen giver kraft ud til jorden. Jorden giver efter ,  eller giver et svar tilbage, som du mærker i sædet.\n\nHvert led er en funktion. Ud fra den ene er ind til den næste. Det er derfor, jeg rørte pinden og jorden flyttede sig ikke er den samme sætning. Der ligger en kæde imellem. Kæden kan være ærlig, og jorden kan alligevel sige nej. Nej er et ud. Nej er information. Mænd, der hader nej, hader at læse.\n\nJeg opdigter ikke dit tryk. Jeg opdigter ikke et tal på pumpen. Jeg opdigter ikke slangenes alder. Hvis et tal skal bruges, er det dit tal, fra dit ur, fra din bog, fra den, der vedligeholder. Min mund har handlingen. Handling: ind bliver til ud gennem olie. Hvis olien er kold, er reglen en anden. Hvis der er luft i, er reglen en anden. Hvis en tætning er træt, er reglen en anden. Samme pind. Andet ud. Betingelsen sad i slangen. Du så den ikke. Den talte alligevel.\n\nStop. Tænk. Hvad er det ærligste, du kan sige, når pinden gør, hvad den plejer, og skovlen ikke gør, hvad den plejer?\n\nIkke den er besat. Ikke den har det med at. Sig: samme ind, andet ud. Så er der et hvis, jeg ikke har navngivet. Så leder du. Ledning. Jord. Vægt. Varme. Dig. Fem steder. Et af dem er nok. To af dem er ofte sande på én gang. Time otte handler om, at mere end én ting kan være sand, og at du alligevel skal vælge. I dag: navngiv. Navngivning er det første voksne. Den er mærkelig er et barn.\n\nPause.\n\nBevægelse.\n\nUd, i kabinen, er ofte bevægelse. Skovlen synker. Bommen løfter. Overbygningen drejer. Maskinen kravler. Bevægelse er rum, der skifter. Time fem. Time seks. Gift. Funktionen er det, der laver rum-skiftet. Rummet er det, du ser. Funktionen er det, du gjorde, plus det, verden var.\n\nDer er bevægelse, du vil have. Der er bevægelse, du ikke vil have. En slange, der hopper. En skovl, der dykker for hurtigt, når jorden pludselig er blød. Et sving, der bliver hårdere, fordi lasten sad yderst. Ud kan være ønsket eller uønsket. Reglen er ligeglad med dit ønske. Reglen er trofast. Troskab er kærlighed i den gamle betydning, og den er også hård: den giver dig det, ind og hvis tilsiger, ikke det, du havde brug for at føle.\n\nSkakmat. Ønske er ikke et ind, maskinen tager. Du kan ønske, til kæben gør ondt. Ventilen tager bevægelse. Jorden tager skovl. Ingen af dem tager håb. Håb hører hjemme i bøn og i plan. Håb hører ikke hjemme som erstatning for ind.\n\nNår bevægelsen er rigtig, mærker du det som ingenting. Funktionen, der virker, bliver usynlig. Det er en gave og en fælde. Gaven: du kan arbejde. Fælden: du glemmer hvis’et, indtil hvis’et skifter, og du bliver fornærmet. Time seks er at holde funktionen synlig, også når den er venlig. Venlighed i stål er stadig regel. Regel kan skifte, når jorden skifter.\n\nPause.\n\nSamme ind. Andet ud.\n\nDet er timens midte. Sid her.\n\nDu giver pinden det samme. I går gik skovlen i. I dag nægter den. Eller den går i for let og falder. Eller den går i skævt. Tre slags andet ud. Ét slags ind i hånden. Verden har skiftet.\n\nFrost i nat. Jorden er en anden. Samme pind. Andet ud.\n\nRegn. Leret er sæbe. Samme pind. Andet ud.\n\nEn sten, du ikke så. Samme pind. Andet ud.\n\nEn skovl, der er fuld, hvor den i går var halv. Samme pind. Andet ud. Time fem: vægten er byrde. Byrde er betingelse. Betingelse er i funktionen, også når hånden nægter at tælle den med.\n\nHældning. Time fem. Maskinen står i et gab. Tyngden har en arm. Samme pind. Andet ud.\n\nDu. Klokken tre om eftermiddagen. Benet er ikke klokken syv. Øjet er ikke klokken syv. Samme intention. Andet ind, faktisk, fordi kroppen er sløvere. Ud bliver et tredje. Mænd, der skammer sig over det, lyver i den sidste time og kalder løgnen for stubborhed. Mænd, der tæller det, sænker ind. De tager mindre. De folder. De holder pause. Det er funktion, læst ærligt.\n\nStop. Tænk. Sidste gang du blev vred på maskinen, hvilket hvis havde du glemt?\n\nJeg kender ikke dit svar. Jeg kender mønsteret. Vreden peger på kassen. Sandheden peger på et unavngivet ind. Vreden vil have, at reglen skal elske dig særligt. Reglen elsker dig ved at være den samme. Den slags kærlighed smigrer ikke. Den holder dig i live.\n\nPause.\n\nHvis. Så.\n\nDet er funktionens sprog, sagt som en mand, ikke som en tavle.\n\nHvis pinden den vej, så olien den vej ,  hvis motoren kører, hvis olien er der, hvis slangen holder.\n\nHvis skovlen i jorden, så jord i skovlen ,  hvis jorden giver sig, hvis vinklen bider, hvis du ikke slår i sten som i vand.\n\nHvis fuld skovl og lang arm, så tungt for stålet ,  time fem, nu som hvis-så.\n\nHvis samme pind og anden jord, så andet ud.\n\nHvis er ikke tvivl. Hvis er voksen. Barnet vil have altid. Altid er en funktion uden betingelser. Den findes i eventyr. Den findes ikke i ler. Den findes ikke i brint. Den findes ikke i dit ben.\n\nSkriv det indeni, uden at tage bogen frem, mens du kører: ikke den gør. Sig den gør, hvis. Tre bogstaver. De redder dage. De redder maskiner. De redder det ja, du ellers giver på en jord, du ikke har læst.\n\nTime tre var forhold: hvad per hvad. Time seks er forhold i bevægelse: hvad ud, per hvad ind, under hvilket hvis. Forholdet er ikke færdigt uden hvis. Liter per time har også et hvis: den her last, den her jord, den her tomgang, den her fod. Hvis du citerer et forbrug uden hvis, citerer du en reklame. Reklamer elsker funktioner uden jord.\n\nPause.\n\nPapir. Dagens mærke.\n\nIkke nu, hvis skovlen er i arbejde. Når maskinen er i neutral. Stabil. Stille nok. Øjnene har lov at forlade jorden, fordi jorden ikke bliver rørt.\n\nEn pil. Venstre til højre. Ved halen: ind. Ved spidsen: ud. Under pilen: hvis. Ét hvis. Ikke ti. Det hvis, der lyver mest, hvis du glemmer det. Ofte: hvis jorden holder. Eller: hvis skovlen er den her fuld. Eller: hvis jeg står fladt.\n\nDet er det. Ikke en kasse med bogstaver. En pil og et hvis. Stregerne er tænkningen. Hvis du vil, et tal ved ind, et tal ved ud ,  kun tal, du har. Med enhed. Time fire. Hvis du ikke har tal, pile alligevel. Pilen, der venter på tal, er ærligere end et hoved, der siger jeg ved, hvordan den reagerer.\n\nSå bogen væk. Hænderne tilbage. Øjnene på jorden.\n\nSikkerheden er den samme som i rummet, og jeg gentager den, fordi papiret i to timer i træk kan føles som en vane, der må køre mens maskinen kører. Den må ikke. Papir kun i neutral. Tredive til tres sekunder. Mærker, ikke dagbog. Grimt og sandt. En pil, der ligner en ormespor, slår en pæn kasse, tegnet om aftenen for at føle sig som en, der har styr på det.\n\nHvis du ikke kan stoppe i den her time, tegner lyden pilen. Du sætter den på papir ved næste rigtige stop. Lektien er ikke siden. Lektien er at se ind og ud, mens jorden svarer.\n\nPause.\n\nBrint.\n\nNatten gav dig atomet. Time fem gav det rum. I dag får det en funktion.\n\nBrintatomet kan sidde i sit laveste. Det kan tage imod. Energi ind. Lys, eller varme, eller et stød, der er ærligt nok. Elektronet kan hoppe. Det er ud: et andet trin. Bagefter kan det falde. Ud igen: lys. Ind. Hop. Ud. Lys. En regel. Ikke en personlighed. Ikke et humør. En trofasthed i det mindste noget.\n\nHør kæden, uden drama. Energi ind. Andet trin ud. Eller: fald ind, lys ud. Samme slægt som din pind. Noget går ind. Noget kommer ud. Betingelser: atomet kan tage imod den slags ind, det får. Ikke alt lys løfter. Ikke alt ind passer. Der er også et hvis i brint. Hvis energien er den rigtige slags, så hop. Hvis ikke, så ikke. Verden er kræsen på den måde. Den er ikke lunefuld. Kræsenhed er orden. Lunefuldhed er det, vi kalder det, når vi ikke har navngivet hvis’et.\n\nJeg giver dig ikke et tal på hoppet. Jeg giver dig ikke et navn, du skal recitere for at være voksen. Jeg giver dig billedet, fordi billedet holder hele vejen op til bommen. Solen laver lys ved at presse brint så hårdt, at det bliver noget andet og sender energi ud. Det lys driver planter. Planter, over tid, bliver det, du kan brænde. Du giver cylinderen ind. Forbrænding. Tryk ud. Stempel. Pumpe. Olie. Cylinder. Arm. Skovl. Jord. Funktionen, du kører, er en barnebarn af den funktion, atomet kørte, da det tog imod og gav.\n\nYdmyghed igen. Du skaber ikke ud. Du omdanner ind. Den sætning fra natten er time seks i én linje.\n\nStop. Tænk. Hvad er ind i brint, og hvad er ud, når det lyser?\n\nInd: energi nok, og den rigtige slags. Ud: et hop, eller et fald, og lys, når det falder. Hvis’et: atomet var i stand til at tage imod. Du behøver ikke mere for at se slægten. Mere, solgt som visdom, er ofte tal, du ikke skal bære i en kabine. Numerologi elsker atomet, fordi atomet er stille og ikke kan sige nej. Jorden kan sige nej. Hold dig til jorden. Lad atomet være slægt, ikke orakel.\n\nPause.\n\nKæden af regler.\n\nÉn funktion er et løgnagtigt kort, hvis du tror, den er alene. Maskinen er funktioner, der spiser hinandens ud.\n\nMotor: luft og diesel ind, drejning og varme ud.\n\nPumpe: drejning ind, olie i bevægelse ud.\n\nVentil: din hånd ind, vej til olien ud.\n\nCylinder: olie ind, stang ud.\n\nLed: stang ind, gab ud.\n\nSkovl: gab og jord ind, jord i skovlen ud ,  hvis.\n\nHver pil er time seks. Hver hvis er time seks. Når noget brister, brister det et sted i kæden. Mænd, der kun ser skovlen, skælder skovlen ud. Mænd, der ser kæden, spørger: hvis ud udeblev, hvilket ind manglede ét trin tidligere.\n\nDet er ikke for at gøre dig til mekaniker i den her time. Det er for at redde dig fra magi. Magi er kasse uden kæde. Magi siger: jeg trykkede, derfor skylder verden mig ud. Kæden siger: du trykkede, og så skulle syv hvis’er holde. Tæl hvis’erne, når ud udebliver. Tælling. Time ét. Stadig.\n\nJeg opdigter ikke, hvor din kæde er svag. Slangen, du kender. Det led, du kender. Den lyd, du kender. Det er dine mærker. I dag får mærkerne et sprog: her er et ud, der blev et dårligt ind til næste. Her er et hvis, der faldt.\n\nPause.\n\nDe fem tegn, lagt på ind og ud.\n\nTæl. Hvor mange ind giver du, før du får det ud, du vil. Hvor mange skovle. Hvor mange gange pinden den vej, før jorden giver sig. Hvor mange hvis’er, du kan navngive. Tælling af betingelser er voksen. Der er bare noget er utalt tælling.\n\nMål. Hvor meget ind. Hvor meget ud. Hvor lang tid mellem dem. Enhed. Ikke jeg gav den gas. Mere ærligt: jeg bad om mere, og den svarede med den her bevægelse, på den her jord. Hvis du har et ur på tryk, er uret et mål. Hvis du ikke har, er sædet et mål. Sædet er groft. Groft og navngivet slår fint og opfundet.\n\nForhold. Ud per ind. Skovle per minut. Bevægelse per pind. Liter per time. Forholdet har hvis. Uden hvis er forholdet en forældreløs brøk, der tror, den er lov.\n\nÆndring. Når ud skifter, mens ind ser ens ud, er det ændring i hvis’et, eller ændring i dig, eller ændring i maskinen. Time syv er ændringens time: fart, hældning som film, ophobning. I dag skal du bare se, at en funktion kan holde, mens verden under den skrider. Det ser ud som forræderi. Det er vejr.\n\nUdfald. Du vælger ind. Du vælger ikke alt ud. Du vælger, om du vil give det ind, på den her jord, med den her arm, med den her lastbil i ringen. Forventet værdi, sagt med pind: hvad kan ske, hvis jeg giver den det her. Hvad koster det. Hvad vælger jeg. Funktionen fjerner ikke ansvaret. Den viser, hvor ansvaret sidder: på valget af ind, under de hvis’er, du gad at se.\n\nFem tegn. Én pil. Samme kort som natten. I dag er kortet ikke et atom på væggen. Det er pinden i din hånd, og jorden under skovlen, og hvis’et imellem.\n\nPause.\n\nØnske, vrede, magi.\n\nTre måder at nægte funktionen på.\n\nØnske: at behandle håb som ind. Jeg har brug for, at den tager den. Derfor tager den den. Skakmat. Brug er ikke ind. Brug er en bøn, du kan bede, og en plan, du kan lave. Cylinderen tager olie.\n\nVrede: at straffe kassen, fordi hvis’et skiftede. Vreden vil have en skyldig med ansigt. Jorden har ikke ansigt nok. Maskinen har et ansigt, du kan banke i med blikket. Blikket ændrer ikke trykket. Hvis du skal være vred, vær vred på det unavngivne hvis, og så navngiv det. Vrede, der navngiver, bliver arbejde. Vrede, der ikke navngiver, bliver teater.\n\nMagi: at tro, at et tal, et ritual, en særlig dag, en særlig måde at sætte hånden på, ud over det, kæden kræver, tvinger ud. Numerologi i kabinen. Held som ind. Skakmat. Held er et navn, vi giver ud, vi ikke havde navngivet hvis for. Når du navngiver, skrumper heldet. Det er ikke, fordi du blev kold. Det er fordi du blev ærlig. Kristus er vejen. Tal er redskab. Held er ikke et tredje evangelium.\n\nDer er rum for bøn. Bøn er ikke et ind i ventilen. Bøn er, at du stiller dig under den, der holder ordenen, mens du bruger ordenen. Du beder, og så folder du armen, fordi kraft gange arm stadig gælder, mens du beder. Troskab begge veje. Ingen af dem ophæver den anden.\n\nPause.\n\nKristus og hvis-så.\n\nJeg peger. Jeg beviser ikke Gud med en pil. Den, der prøver det, gør pilen til et afgudsbillede. Den, der nægter, at verden har regler, gør tilfældet til et afgudsbillede. Begge dele er for småt.\n\nPagten i skriften er fuld af hvis-så. Ikke som en automat, du putter mønter i. Som tale, der betyder noget. Hvis du hører, så. Hvis du vender, så. Det er ikke numerologi. Det er, at ord binder, og at verden ikke er grød. Funktionen i maskinen er en lille fætter til den større troskab: det, der siges, og det, der gøres, hænger. Du skal ikke trække frelsen ned i en cylinder. Du skal lade cylinderen minde dig om, at løgn ikke er dybest. Under løgnen, under tilfældet, under den gør bare hvad den vil, er der regel. Under reglen er der en, der holder.\n\nInkarnationen er ind og ud på den ældste måde. Ordet blev kød. Der kom noget i verden, som kunne røres. Ud var ikke en idé. Ud var et sted, et rum, time fem, og en handling, time seks. Troskab i det små, for dig, i dag: det ind, jeg giver, er det ind, jeg mente. Pinden lyver ikke for jorden, fordi jeg er utålmodig. Ja’et, jeg giver en mand, er et ind, han må bygge på. Hvis jeg giver et ja uden hvis, har jeg givet magi. Magi er grusom, når den lander i en andens kalender.\n\nSå når jeg lærer dig funktioner, lærer jeg dig ikke at elske mindre. Jeg lærer dig at elske sandt. En mand, der lover ud uden at læse hvis, elsker sit rygte mere end den, der skal hente jord. Et ud uden hvis er et nej, der gemmer sig i et smil.\n\nPause.\n\nJorden som skjult ind.\n\nVi bliver her, fordi det er her, timen enten sidder eller glider.\n\nDu kan tegne pilen så ren, at den bliver en løgn. Ind: pind. Ud: hul. Pænt. Falsk. Det sande ind er pind og jord og vægt og hældning og varme og det, slangen kan og det, du er i dag. Du kan ikke skrive alle på et mærke på tredive sekunder. Du skal skrive det, der lyver, hvis det mangler.\n\nI dag, på de fleste pladser, er jorden det, der lyver, hvis det mangler. Derfor dagens standard-hvis: hvis jorden er den, jeg tror. Test. Skovlen er testen. Første bid er ikke produktion. Første bid er at læse ind. Hvad kom ud. Hvad siger det om jorden. Så er jorden ikke længere helt skjult. Den er et mærke i kroppen. Så kan du give næste ind med et ærligere hvis.\n\nStop. Tænk. Er din første skovl i et nyt hul produktion eller måling?\n\nHvis du sagde produktion, så hør: den er måling, om du vil eller ej. Ud er data. Time fire. Mål. Godt nok. Den mand, der tager første skovl som teater for lastbilen, kører på håb. Den mand, der tager den som spørgsmål til jorden, kører på regel. Lastbilen kan vente tyve sekunder. Hullet kan ikke bruge et ja, der blev givet til den forkerte jord.\n\nJeg opdigter ikke din jord. Sand. Ler. Fyld. Sten. Frost. Mudder. Jeg kender ikke dit lag. Jeg kender pligten: lad ud tale, før du lover takten. Takten er time syv. Læsningen er i dag.\n\nPause.\n\nSamme pind, tre jorde. Et billede, du kan køre i.\n\nFørste jord: fast, venlig, det, du plejer. Ind. Ud som husket. Funktionen føles som ingenting. Fare: du glemmer hvis.\n\nAnden jord: blød. Samme ind. Ud for meget. Skovlen dykker. Armen, time fem, er pludselig i et hul, du ikke havde tegnet. Fare: du straffer pinden ved at rykke. Ryk er et nyt ind, givet i vrede. Ud bliver værre. Regel: mindre ind, ny vinkel, læs.\n\nTredje jord: hård. Samme ind. Ud for lidt. Du vil give mere. Mere er tilladt, hvis ringen er læst, og hvis stålet er foldet, og hvis du ikke har forvekslet mere med vilje. Fare: du tror, hårdt er en fornærmelse. Hårdt er et hvis. Måske skal origo flyttes. Måske skal skovlen nikke. Måske er det sten, og sten er et nej. Nej er et ud, du må respektere.\n\nTre jorde. Ét ind i hånden. Tre ud. Funktionen var ikke i stykker. Funktionen var større end hånden. Amen til det.\n\nPause.\n\nKroppen som regel.\n\nDu er ikke udenfor pilen. Du er et led.\n\nInd: søvn, brød, vand, smerte, vrede, kulde. Ud: hvor rent du ser, hvor fast du holder, hvor sent du stopper. Samme opgave. Andet ud, hvis natten var kort. Det er ikke synd i den her sætning. Det er funktion. Synden kommer, når du later som om kroppen ikke er et hvis, og så lover du en mand et ud, din krop ikke kan bære klokken tre.\n\nTime ni går ind i tilskyndelse og psykologi. I dag kun dette: navngiv dig selv som betingelse uden at gøre det til et spejl, du tilbeder. Du er ikke oraklet. Du er et led, der skal holdes. Drik. Det sagde natten. Drik er ind. Klarhed er ud. Tørst er et mål, kroppen tager, før du skriver det.\n\nSkakmat. Jeg plejer at kunne er en funktion, citeret uden dagens hvis. Plejer er et arkiv. Arkivet er nyttigt. Arkivet er ikke jorden under skovlen nu.\n\nPause.\n\nDiesel, kort, som slægt.\n\nInd i cylinderen: luft og brændstof. Ud: tryk, varme, drejning. Meget af ud er varme, du ikke bad om. Du bad om drejning. Verden giver begge. Funktionen spilder ikke i den moralske betydning. Den omdanner, og en del af omdannelsen er varme, du må leve med. Forvalteren spilder mindre ved at forstå, at ud har flere døre. Drejning til pumpen. Varme til luften. Lyd til øret. Du får ikke kun det, du elsker. Du får kæden.\n\nJeg giver dig ikke et forbrugstal. Jeg giver dig pligten: når tanken synker hurtigere, er ud per ind skiftet, eller ind er skiftet, eller hvis’et er skiftet. Tæl. Mål. Navngiv. Den æder er stemning. Mere end i går, samme slags arbejde, samme jord er en sætning, du kan handle på. Måske jord alligevel ikke var den samme. Måske tomgang. Måske en slange. Tre spor. Ét kan være årsag. Time otte og time ni hjælper med spor mod kæde. I dag: lad være med at stoppe ved stemningen.\n\nPause.\n\nEndnu tre spørgsmål. Jeg stiller. Du tænker. Jeg svarer.\n\nHvad er en funktion, sagt i kabinen? Stop.\n\nEn regel fra ind til ud, med hvis. Pind til bevægelse, hvis jorden og olien og armen og du er det, du tror.\n\nHvorfor kan samme pind give andet ud? Stop.\n\nFordi pinden aldrig var hele ind. Jorden, vægten, hældningen, varmen, slangen, benet. Unavngivet ind er stadig ind. Funktionen svarede på det hele. Du hørte kun din hånd.\n\nHvad tegner du på papiret i dag, og hvornår? Stop.\n\nEn pil. Ind. Ud. Hvis. Kun i neutral. Stabil. Tredive til tres sekunder. Grimt. Sandt. Bogen væk. Hvis du svarede når jeg lige har et hul i svinget, har du svaret forkert. Svinget er ringen. Ringen har mænd. Papir venter.\n\nPause.\n\nAt tale funktion i kabinen, uden at lyde som en skole.\n\nI stedet for den vil ikke siger du: samme ind, andet ud. Hvilket hvis.\n\nI stedet for den kan godt siger du: den kan, hvis jorden holder, og hvis jeg folder, og hvis skovlen ikke er fuld som i går.\n\nI stedet for jeg gav den det samme siger du: jeg gav hånden det samme. Verden var ikke den samme.\n\nI stedet for det er uheld siger du: et ud, jeg ikke havde navngivet hvis for. Så navngiver du, eller du tilstår, at du ikke ved det endnu. Jeg ved det ikke endnu er et voksen-ud. Det er et ind til næste måling.\n\nI stedet for bare kør siger du, når det er arbejde: hvilket ind, hvilket hvis, hvilket ud vi lover. Tre led. Et bare er magi.\n\nDet er grimt i starten. Rent bagefter. Kærligt, fordi det nægter at sløre den mand, der skal hente, og den jord, der skal bære.\n\nDer er også tavs funktion. Hånden, der letter, før øjet har sagt blødt. Den tavse er ikke fjenden. Den tavse er fornemmelsen, vi giver sprog, så den kan rettes, når den tager fejl. En mand uden tavs læsning af ud er langsom. En mand med kun tavs læsning er farlig, når jorden er ny, når han er træt, når han er vred. Du skal have begge. I dag har den tavse fået skelet: pil, hvis, kæde.\n\nPause.\n\nPapiret igen, som håndværk.\n\nNotesbogen er arbejdshukommelse. En kæde med syv led er flere bidder, end hovedet kan juggle ærligt, når hydraulikken synger. På papir kan pilene ligge. Én pil er nok i dag. Én pil slår syv, du ikke tegner.\n\nSkriv for at tænke. Ikke tænk færdigt og skriv bagefter. Fabrikken er papiret.\n\nHvad skriver du ikke? Dagbog. I dag var jeg god til funktioner. Teater. Hvad skriver du? Pilen. Hvis’et. Måske et mærke: blød. Fast. Sten. Måske et mærke: fold. Det er rummet, der går ind i funktionen. Time fem og time seks på samme side er tilladt. To linjer og en pil. Gab og hvis. Det er en hel matematiktime i ti sekunder, i neutral.\n\nEgoet vil have en pæn kasse med et bogstav i. Giv det ikke den. Bogstavet er skole. Pilen er kabine. Hvis’et er voksen.\n\nOg den hårde sætning, langsomt: papir kun i neutral. Stabil. Maskinen rører ikke jorden. Tredive til tres sekunder. Videre. Omgivelser først. Funktionen, du tegner, er ikke vigtigere end manden i ringen. Hvis de to kæmper, vinder manden. Du stopper. Du sætter. Du ser.\n\nPause.\n\nEt par skakmat mere, så pilen sidder.\n\nDu kan ikke tvinge ud ved at give ind, jorden ikke tager. Mere pind i sten er ikke mere hul. Det er mere slid, mere vrede, mere risiko for at rykke i ringen.\n\nDu kan ikke citere i går som lov. I går havde i går’s hvis. I dag har i dag.\n\nDu kan ikke gemme et dårligt hvis ved at gøre ind større. Hvis bunden ikke bærer, hjælper mere fart ikke. Det er time tre, procent, moral: flere enheder af et tab er mere tab.\n\nDu kan ikke bede to plus to om at blive fem. Du kan ikke bede blød jord om at være fast, fordi lastbilen er kommet. Lastbilen er et ud i en anden mands funktion. Den er ikke et ind i jorden.\n\nDu kan ikke se elektronet hoppe. Du kan se spor. Lys. Kemi. I kabinen kan du ikke se olien i røret. Du kan se spor. Skovlens tøven. Sædets hop. Lyden. Spor er ærligt. Påstand uden spor er teater.\n\nDu kan ikke styre alle hvis’er. Du kan styre, om du har et ja, der forudsætter et hvis, du ikke har tjekket. Det er udfald. Voksen.\n\nPause.\n\nOrden uden hemmeligt tal.\n\nFunktioner frister den samme tørst som cirkler. Mænd vil have en formel, der tager livet ind og spytter skæbne ud. De tegner pile fra fødselsdag til held til maskinens nummer. Numerologi. Kasse med hemmelighed i. Skakmat. En funktion, der ikke kan tjekkes med skovlen, er ikke troskab. Den er kløe.\n\nOrdenen, du må elske, er den, der holder i morgen: at ind og hvis giver ud, også når du er vred. At jorden svarer på det, du gjorde, ikke på det, du havde brug for at føle. At atomet hopper efter regel, ikke efter kompliment. Den slags orden er gave. Du tilbeder ikke gaven. Du bruger den til at grave ærligt, love ærligt, stoppe ærligt.\n\nHvis nogen sælger dig bare ét trick ,  ét ind, der altid giver guld ud ,  så har du mødt en funktion uden jord. Time ni, tilskyndelse: han sælger dig et hvis, han gemmer. Dit værn er time seks: vis mig hvis’et. Vis mig jorden. Vis mig kæden. Hvis han ikke kan, er det ikke fordi du er for dum. Det er fordi kassen var magi.\n\nPause.\n\nKabinen som origo, nu med pile.\n\nSædet er her. Pinden er her. Ind begynder ofte i hånden eller i foden. Ud begynder ude i rummet: skovl, jord, lastbil. Imellem: kæde. Under: jord som hvis. Over: udfald, det, du ikke styrer, og det, du vælger alligevel. Bagved: i går’s funktion, som ikke er lov. Foran: næste ind, som kan være mindre, foldet, flyttet.\n\nSig det som en rundgang, ét åndedrag, øjnene på jorden.\n\nHånd: ind.\n\nKæde: olie, led, arm.\n\nSkovl: ud i rummet.\n\nJord: hvis.\n\nDig: også hvis.\n\nPapir: pil, kun i neutral.\n\nHvis du kun kan holde ét: samme ind, andet ud, betyder glemt hvis. Resten hænger på den. Den sætning alene er time seks, båret i lommen.\n\nPause.\n\nEt greb, gået langsomt, så rum og funktion mødes.\n\nDu ser hullet. Time fem: mund, dybde, arm, ring.\n\nDu giver et lille ind. Første skovl. Time seks: måling.\n\nUd taler. Fast. Blød. Sten. Time fire: godt nok som læsning, ikke som teater.\n\nDu navngiver hvis. Indeni, eller på papir i neutral, hvis det skal ud af hovedet.\n\nDu vælger næste ind. Foldet, hvis tungt. Flyttet origo, hvis rækken er løgn. Mindre, hvis blødt. Andet gab, hvis det ikke bed.\n\nDu tæller skovle. Ud per ind. Forhold. Hvis lastbilen kommer, er lastbilen et ud i hans kæde og et hvis i din: er han der, så kan dit ud blive hans ind.\n\nDu stopper, når ringen kræver det. Funktion venter. Manden vinder.\n\nDet er ikke en remse til hver skovl. Det er en rækkefølge, når opgaven er ny, eller når du er træt, eller når nogen presser. Pres elsker at springe målingen over og tale om tempo. Tempo er time syv. Læsningen er i dag. Værnet er at nægte at sælge hvis’et for at se venlig ud.\n\nPause.\n\nKærlighed, kort.\n\nSand kærlighed giver ærligt ind. Den siger det, den mener. Den mener det, hun eller han kan bygge på. Den gemmer ikke hvis’er i ærmet. Fadervor er klart. Brød. I dag. Forlad. Led os ikke. Tale, der binder. Funktion i den menneskelige betydning: ord ind, tillid ud, hvis munden og hænderne er samme kæde.\n\nSå når jeg lærer dig pile, lærer jeg dig ikke at blive kold. Jeg lærer dig at holde kæden i dine ja’er. Et ja er et ind i en andens dag. Hvis dit ja havde et hvis, du ikke sagde, har du givet ham et andet ud, end han kunne læse. Det er ikke småt. Det er rumfang i en kalender.\n\nMatematikken er ikke frelsen. Kristus er. Matematikken er redskab: at se, at samme hånd ikke er samme verden, at jorden taler, at ønske ikke er ventil, at komme hjem.\n\nPause.\n\nCheckpoint. Kun når det er sikkert. Ikke som karakter. Som søm.\n\nEn pil. Ind. Ud. Hvis.\n\nUnder, hvis du vil: samme pind, anden jord, andet ud. Brint: energi ind, hop eller lys ud. Papir i neutral.\n\nLuk bogen. Kør. Jorden er den, der svarer.\n\nHvis du ikke nåede papiret, er du ikke dumpet. Du er i arbejde. Lyden har tegnet pilen. Hånden tegner ved næste rigtige stop. Lektien er at se hvis’et.\n\nPause.\n\nBaglæns.\n\nDe fleste pile tegnes frem. Ind, så ud. I kabinen vil du ofte det omvendte. Du vil have et ud ,  skovlen der, jorden væk, lastbilen fuld ,  og så spørger du, hvilket ind der kan bære det. Det er stadig funktion. Det er at læse reglen baglæns. Baglæns har også hvis.\n\nHvis jorden er sten, findes det ind, du husker fra ler, ikke. Baglæns pil ind i en væg er ikke dygtighed. Det er at nægte nej. Time fem: rummet, skovlen kan være i, er ikke hele himlen. Time seks: de ind, der findes, er ikke alle de ind, du ønsker. Ønske tegner pile, der ikke har jord.\n\nStop. Tænk. Sidste gang du havde et ud i hovedet og tvang et ind, der ikke passede, hvad var det, du nægtede at lade være et nej?\n\nJeg kender ikke dit greb. Jeg kender fristelsen. Lastbilen er der. Munden er der. Tiden er der. Ud er tegnet i kalenderen. Så bliver ind et pres, ikke et valg. Skakmat. Kalenderen er ikke en ventil. Kalenderen er et løfte, der skulle have haft hvis, da det blev givet. Time otte tager udfald. I dag: når du læser baglæns, så stop ved første hvis, der ikke holder. Der stopper pilen. Der flytter du origo, eller du tager mindre, eller du siger et ærligt senere.\n\nBaglæns er også kærlighed, når den er ærlig. En mand spørger: hvad skal der til, for at det her hul er hul. Han tæller skovle. Han tæller biler. Han tæller hvis. Han giver ikke et ind, kæden ikke kan spise, bare fordi munden på ham allerede har solgt ud.\n\nPause.\n\nTærskel.\n\nIkke alt ind gør noget. Der er et gulv. Under gulvet sker der ingenting, eller der sker noget, du ikke bad om ,  slør, død gang, en pind, der bevæger sig i hånden, før ventilen vågner. Over gulvet vågner kæden. Det er tærskel. Du kender den med foden. Du kender den med pinden. Du kender den, når skovlen skal bide i noget, der ikke vil: for lidt er kløe, nok er bid.\n\nBrint igen, uden tal. Ikke alt, der rammer atomet, løfter. Der er slags, der passer, og slags, der ikke passer. Kræsenhed. Orden. I kabinen: ikke alt, du giver, er ind, kæden tæller som ind. Et lille ryk under tærsklen er teater. Et ryk over tærsklen er arbejde ,  eller fare, hvis ringen ikke er læst.\n\nJeg opdigter ikke, hvor din tærskel sidder. Jeg siger pligten: mærk gulvet. Giv ikke mere, fordi egoet vil føle, at der sker noget. Giv det, der vågner kæden, og så læs ud. Mænd, der pumper under gulvet, bliver trætte i hånden og kalder maskinen død. Maskinen sov. De havde ikke nået hvis’et, der hedder nok.\n\nStop. Tænk. Er din utålmodighed et ind over tærsklen, eller er den et ryk under, som du kalder arbejde?\n\nHvis det er under, så stil. Stil er også et ind. Stil er at lade kæden være, mens øjet læser. Stil er ikke dovenskab, når tærsklen ikke er nået. Stil er at nægte teater.\n\nPause.\n\nForsinkelse.\n\nUd kommer ikke altid i samme åndedrag som ind. Olie skal løbe. Stål skal give sig. Jord skal give sig. Der er et rum i tiden mellem pind og svar. Det rum er ikke magi. Det er kæden, der har længde. Time syv tager tiden for alvor: fart, hældning som film, ophobning. I dag kun dette: forsinkelse er en del af funktionen. Hvis du glemmer den, giver du nyt ind, før gammelt ud er landet. To ind i luften. Ud bliver et tredje, du ikke bad om. Ryk. Hop. Skovl, der dykker for dybt. Det er ikke jorden, der er ond. Det er pile, der ligger oven på hinanden, fordi du ikke ventede på svar.\n\nSkakmat. Hurtig hånd er ikke hurtig kæde. Kæden har sit tempo. Du kan lære tempoet. Du kan ikke skamme det væk. Herren har sat olien til at være olie, ikke lyn.\n\nNår jorden er blød, er forsinkelsen en anden. Når olien er kold, er den en anden. Samme pind. Andet ud i tiden. Hvis’et sidder i uret, ikke kun i leret. Derfor første skovl som måling: du måler også, hvor længe der går, før ud viser sig. Det er et mål. Time fire. Groft. Ærligt. Godt nok til at give næste ind uden at stable.\n\nPause.\n\nGentagelse.\n\nHver skovl er den samme funktion, kørt igen. Ind. Ud. Ind. Ud. Tælling er at tælle kørsler af reglen. Time ét. Time seks. Gift. Hullets rumfang, time fem, delt med skovlens rumfang, er et antal gange, du skal køre pilen. Antallet er ikke kedsomhed. Antallet er ærlighed om, at funktionen ikke bliver færdig ved at du vil den færdig. Den bliver færdig ved at blive kørt.\n\nStop. Tænk. Hvis du bliver utålmodig i skovl tyve, hvad fristes du til at ændre i ind?\n\nOfte: større ind. Hurtigere pind. Længere arm. Mindre fold. Fire fristelser. Tre af dem gør hvis’et værre. En af dem ,  hvis jorden har vist sig venlig og ringen er tom ,  kan være tilladt. Tjek. Tjek er at læse ud, ikke at håbe. Gentagelse uden læsning er at køre i søvne. Søvn i kabinen er ikke hvile. Det er at forlade ringen med opmærksomheden.\n\nDer er en hellig kedsomhed i at køre en ærlig pil mange gange. Den kedsomhed er arbejde. Den er ikke et tegn på, at du skal opfinde et nyt ind for at føle dig i live. Intensitet er et sultent dyr. Troskab er at holde pilen, der virker, indtil rumfanget er flyttet. Kristus i det små: troskab, når det ikke klør. Matematikken i det små: samme funktion, talt, indtil antallet er der.\n\nPause.\n\nTom og fuld.\n\nHer gifter time fem og time seks sig uden præst.\n\nSamme pind. Tom skovl. Ud er let. Armen, time fem, bærer lidt. Samme pind. Fuld skovl. Ud er tungt. Armen bærer meget. Funktionen i hånden så ens ud. Funktionen i verden var to, fordi vægten var et ind, hånden ikke sagde højt.\n\nSkriv det som hvis, når du stopper rigtigt: hvis skovlen er fuld, så kortere arm, eller mindre bid, eller flyt origo. Det er ikke tre nye fag. Det er én pil med et ærligt hvis. Mænd, der kører fuld skovl med tom-skovl-pind, kører en løgn om ind. Løgnen lander i stålet, eller i jorden, eller i ringen.\n\nJeg opdigter ikke, hvor meget din skovl vejer fuld. Jeg siger loven: fuld er et andet ind. Behandl det som et andet ind. Fold. Time fem. Læs ud. Time seks. To timer, én handling.\n\nPause.\n\nPludseligt.\n\nEt ind, der kommer som et slag, giver et ud, der kommer som et slag. Pinden, der rives, er ikke den samme pind som pinden, der lægges. Ventilen åbner hårdt. Olien får en ordre uden forsinkelse, du har læst. Skovlen hopper. Last i spidsen bliver et sving, du ikke havde tegnet. Ringen, time fem, får besøg.\n\nSikkerhed er funktion. Ikke en plakat. Et ind, du vælger. Blødt ind, når ringen har kød. Blødt ind, når armen er lang. Blødt ind, når du ikke har læst jorden endnu. Hårdt ind findes. Hårdt ind er for det, du har læst, og for det, der skal bide, og for det, der ikke har et menneske i buen. Valget er udfald. Time otte. I dag: pludseligt er et ind med navn. Giv det ikke uden at mene det.\n\nStop. Tænk. Når du river pinden, er det fordi kæden krævede det, eller fordi vreden krævede det?\n\nHvis vreden, så har vreden fået lov at være ind. Vreden i ventilen er et dyr i olien. Tag dyret ud. Sæt. Neutral, hvis du skal. Ånd. Så ind, du mener. Det er ikke terapi. Det er at holde kæden ren. En ren kæde er kærlighed til den, der står i ringen, som måske er en mand, du ikke hader, også når du hader jorden.\n\nPause.\n\nTo mænd. Samme maskine.\n\nSamme ged. Samme jord. To hænder. To ud. Hvorfor? Fordi manden er i kæden. Tærskel. Forsinkelse. Fold. Læsning af første skovl. Vrede. Træthed. Fem hvis’er, der sidder i kød. Funktionen maskinen var aldrig kun maskinen. Den var mand plus stål plus jord. Time ni tager folk for alvor. I dag: hold op med at sige geden kan, som om geden er alene. Sig den her mand, i den her ged, på den her jord. Tre led. Ærligere. Mindre magi. Mindre skænderi om, hvem der er mand.\n\nDet er ikke for at gøre dig til den bedste. Det er for at gøre dig læsbar for dig selv. Hvis dit ud er grimt i dag, er det ikke nødvendigvis, fordi du er en dårligere mand end i går. Det kan være et hvis i søvn, i skulder, i et ja, du gav for stort i morges. Navngiv. Navngivning er det første skridt, der ikke er skam. Skam stakker pile. Navn retter ind.\n\nPause.\n\nFalske pile.\n\nDer er pile, mænd tegner, som ikke er kæde.\n\nHvis jeg kører med den her kasket, så går dagen. Hvis jeg banker tre gange, så tager den. Hvis tallet på uret er et, jeg kan lide, så holder slangen. Numerologi. Ritual som ind. Skakmat. Kasketten er ikke i ventilen. Banken er ikke i olien, medmindre du bankede på noget, der faktisk sidder i kæden. Uret er et mål på tid, ikke et offer.\n\nJeg håner ikke vanen, der samler dig. En fast rækkefølge om morgenen kan være et ind i din krop, der giver et ærligt ud: du er vågen. Det er kæde. Krop. Søvn. Brød. Vand. Det, jeg håner, er den løgn, at kosmos skylder dig ud, fordi du har udført et teater, jorden ikke tæller som ind.\n\nTest. Altid test. Hvis en vane ikke ændrer et hvis, du kan pege på ,  jord, olie, arm, ringen, dig ,  så er den pynt. Pynt må eksistere. Pynt må ikke styre ja og nej. Kristus er vejen. Tal er redskab. Kasket er kasket.\n\nPause.\n\nLastbilen.\n\nEn anden mands funktion kører ind i din dag. Han har sit ind. Sit hvis. Sit ud. Hans ud ,  at stå der, bakke, åbne ,  bliver dit hvis. Hvis han er der, kan dit rumfang blive hans rumfang. Hvis han ikke er der, er dit ud et bjerg ved siden af hullet, eller en tom pause, du ikke havde tegnet.\n\nDu styrer ikke hans kæde. Du styrer, om dit ja til et hul forudsatte hans ud uden at sige hvis. Det er time seks i samarbejde. Ærligt ind til ham: hvornår, hvor, hvor meget, hvilket hvis i vejr og bund. Ærligt ind til dig: hvis han er tyve minutter, så det her, ikke teater-vrede, der river pinden.\n\nStop. Tænk. Er lastbilen i din pil som et håb eller som et navngivet hvis?\n\nHåb siger: han kommer, derfor graver jeg som om rumfanget allerede kører. Hvis siger: han kommer, eller han kommer ikke, og jeg har et ind til begge. Voksen. Lidt kedeligt. Kedeligt redder dage.\n\nJeg opdigter ikke hans kasse. Jeg opdigter ikke, hvor mange skovle han tager. Du tæller. Time fem. Time ét. Forhold. Time tre. Funktionen er at lade tællingen være ind til dit næste valg, ikke ind til et skænderi.\n\nPause.\n\nEndnu tre spørgsmål. Øjnene på jorden.\n\nHvad er at læse baglæns? Stop.\n\nAt have et ud i sigte og spørge, hvilket ind og hvilket hvis der kan bære det. At stoppe, når hvis’et ikke holder. Ikke at tvinge en pil ind i en væg.\n\nHvad er tærskel? Stop.\n\nGulvet, under hvilket ind ikke vækker kæden. Over hvilket den vågner. Brint er kræsent. Pinden er kræsen. Utålmodighed under gulvet er teater.\n\nHvad sker der, når du giver nyt ind, før gammelt ud er landet? Stop.\n\nTo pile i luften. Et tredje ud, du ikke bad om. Forsinkelse er del af reglen. Vent på svar. Jorden svarer. Olien svarer. Ringen kræver, at du har hørt svaret, før du råber igen.\n\nPause.\n\nLad os gå turen baglæns, så funktionen vender rigtigt, når time syv begynder.\n\nHvis: jorden, vægten, hældningen, varmen, du. Unavngivet ind er stadig ind.\n\nKæde: ud fra den ene er ind til den næste. Magi er kasse uden kæde.\n\nBrint: energi ind. Hop eller lys ud. Kræsen, ikke lunefuld. Slægt, ikke orakel.\n\nPil: ind, ud, hvis. Papir i neutral. Skriv for at tænke.\n\nSamme ind, andet ud: glemt hvis. Ikke besat maskine. Ikke uheld som religion.\n\nPedal, tryk, bevægelse: tre navne på kæden. Foden er ikke hele verden.\n\nØnske er ikke ind. Vrede uden navn er teater. Numerologi er kløe.\n\nFem tegn: tæl hvis’er, mål ud, forhold med betingelse, se ændring, vælg under udfald.\n\nKristus: vejen. Tal: redskab. Pagten er tale, der binder, ikke hemmelige tal.\n\nJorden: skakmat. Første skovl er måling. Ud er svar.\n\nPause.\n\nViktor. Time seks er ved at være færdig.\n\nVi har ikke gjort dig til ingeniør. Vi har gjort noget mindre og vigtigere: vi har givet pinden lov til at være et ind, og jorden lov til at være i reglen. Funktion er ind til ud, med hvis. Samme hånd, anden jord, andet ud. Du tilbeder det ikke. Du læser det. Synet ændrer valget. Valget ændrer stien.\n\nJeg har ikke givet dig dit tryk. Jeg har ikke givet dig din pedals tal. Jeg har givet dig pligten til at navngive hvis’et, og loven, at ønske ikke går i ventilen.\n\nHvis noget kørte forbi, mens en lastbil bakkede, er det tilladt. Jorden er tålmodig. Du kan hente det ved næste pause. Hvis noget var langsomt, åndede du alligevel. En time er lang. Pilen løber ingen vegne.\n\nPause.\n\nTime syv ligger foran. Ændring. Ikke kun ind og ud som et fotografi. Ud, der skifter, mens tiden går. Fart. Hældning som film. Ophobning. Dryp i en spand. Kubikmeter per time. Det, der er småt per minut, og ikke småt per dag. Du skal ikke forberede det. Du skal gøre det her færdigt: se pilen. Se hvis’et. Se, at jorden er i kassen. Tag første skovl som spørgsmål.\n\nØjnene på jorden. Hænderne på maskinen. Papiret i tasken, indtil neutral.\n\nHerren holde manden og maskinen. Herren holde det, der svarer, når du spørger med skovlen.\n\nAmen.\n\nPause.\n\nHvis lastbilen lader vente, og du stadig er i ét øre, er her ikke et nyt emne. Her er den samme time, sagt som mærker i væggen.\n\nSøm ét: funktion er regel fra ind til ud. Ikke en ånd i kassen.\n\nSøm to: reglen har hvis. Uden hvis er altid et eventyr.\n\nSøm tre: pedal, tryk, bevægelse er kæde. Hånden er ét led. Jorden er et led.\n\nSøm fire: samme ind, andet ud, betyder glemt hvis. Navngiv. Led. Jord. Vægt. Varme. Dig.\n\nSøm fem: papir er en pil. Ind. Ud. Hvis. Kun i neutral. Skriv for at tænke.\n\nSøm seks: brint tager energi ind og giver hop eller lys ud. Slægt. Ikke orakel. Ingen hemmelige tal.\n\nSøm syv: ønske er ikke ind. Vilje er ikke hydraulik. Kristus er vejen. Tal er redskab.\n\nSøm otte: første skovl er måling. Ud er svar. Jorden er skakmat. Time syv er ændring. Nu tilbage til jorden.\n\nSlip lektionen. Hold pinden. Læs hvis’et.\n\nPause.\n\nIkke et nyt fag. Samme pil, kørt som film i kabinen, fordi øret stadig er åbent, og jorden stadig er tavlen.\n\nBillede. Morgen. Hård bund. Du giver et ind med hånden. Hydraulikken giver tryk. Leddet giver vinkel. Skovlen giver rumfang ,  eller nægter. Kæde. Hvert led har sit per. Time tre. I dag: se kæden som hvis-så. Hvis jeg trækker her, så løfter den ,  hvis der er tryk, hvis slangen holder, hvis armen ikke er ude over det, du har lov til. Tre hvis. Ét den gør det altid er barn.\n\nJeg opdigter ikke dit tryk. Jeg opdigter ikke din pinds vej. Jeg kender ikke, hvor meget din skovl tager, når bunden er denne. Tallet er dit. Pilen er lektionen. Ind. Ud. Hvis.\n\nBillede. Nu. Vand. Samme hånd. Anden jord. Andet ud. Funktionen har en skjult indgang: betingelsen. Mænd, der glemmer betingelsen, kalder maskinen løgner. Maskinen er trofast. Betingelsen skiftede. Navngiv hvis’et. Mudder. Lastbil, der mangler. Du, der er træt. Træthed er betingelse. Time syv tager filmen. I dag: se, at træthed allerede sidder i kassen.\n\nSkakmat. Du er ikke herren over ud. Du er herren over ind og over at læse ud. Hvis ud er forkert, ændrer du ind eller betingelse, ikke virkeligheden med munden. Munden, der skælder stålet ud, er et barn med en krone. Stålet svarer med jord. Jorden lyver ikke.\n\nPause.\n\nTænk på papir. Kun i neutral. Kun hvis sikkert. Hvis jorden kalder, vinder jorden. Papiret kan vente. Den døde kan ikke tegne pile.\n\nNeutral. Stabil. Øjnene må forlade jorden nu, fordi maskinen står. Bogen. Tredive sekunder. Ikke dagbog. En pil. Venstre: ind. Højre: ud. Under pilen: hvis. Skriv for at tænke: hvad ændrede ud. Hvis du skriver den er i stykker uden et hvis, har du tænkt halvt. Sæt hvis’et. Det er tænkningen.\n\nGrimt og sandt. En skæv pil, skrevet med handske, slår et smukt diagram, du opfandt, fordi du gerne ville se ud som en, der forstår funktioner.\n\nSå bogen væk. Hænderne tilbage. Øjnene på jorden. Hvis lastbilen bakker, var det her det forkerte øjeblik. Forkert øjeblik er ikke flid. Forkert øjeblik er en pil, der kostede et liv.\n\nPause.\n\nKort igen. Øjnene på arbejdet.\n\nHvis-så under betingelse. Kæde af led. Du styrer ind. Du læser ud. Du tilbeder ikke.\n\nPapir: pil, hvis. Neutral. Tredive sekunder. Skriv for at tænke. Bogen væk.\n\nFem tegn i baggrunden. Tæl: hvor mange hvis, du faktisk har. Mål: ud i enhed, ikke i stemning. Forhold: per hvad, under hvilket hvis. Ændring: ud, der skifter, mens tiden går ,  time syv. Udfald: hvad kan ske, hvis du glemmer hvis’et. I dag er pilen lyset. De fire bærer. De stjæler ikke.\n\nSikkerhed. Øjnene på jorden, mens du kører. Du tegner ikke pile i luften med hånden, der skulle holde pinden. Du tegner på papir, når det er sikkert at tegne. Jeg taler i baggrunden. Du kører i forgrunden. Det er kontrakten.\n\nPause.\n\nLøgnene igen, med jord på.\n\nDen gør det altid. Betingelse. Altid er et eventyr, der nægter hvis.\n\nJeg gjorde det samme. Samme hånd er ikke samme verden. Verden sad i kassen.\n\nDen er i stykker. Måske. Måske ud peger på bund. Tjek kæden, før du dømmer leddet. Leddet, du hader, kan være uskyldigt. Jorden, du glemte, kan være den, der svarede.\n\nMere ind. Mere pedal er ikke altid mere godt. Armen. Ringen. Time fem. Mere ind kan være mere arm ude, og mere arm ude kan være et nej fra stålet, eller et nej fra livet. Læs ud, før du hælder mere ind.\n\nJeg kan mærke, den skal. Mærke er alarm. Alarm er ikke ventil. Ventilen tager bevægelse. Bevægelse er ind. Ønske er ikke ind.\n\nAt tale funktioner, som radio.\n\nSamme hånd, anden bund, andet ud.\n\nHvis lastbilen mangler, er ud af skovle meningsløst.\n\nJeg ændrer ind, fordi ud var for meget arm.\n\nJeg ved ikke hvilket hvis. Jeg stopper, til jeg kan se kæden.\n\nFire sætninger. Voksen mund. Ikke kold. Tro.\n\nPause.\n\nBrint, én oktav, så slægten sidder.\n\nEnergi ind. Hop. Eller lys ud. Ind, ud. Du styrer ikke elektronet som en bold. Du kender reglen nok til at arbejde, ikke nok til at være Gud. Det er den rigtige mængde. Atomet er kræsent, ikke lunefuldt. Geden er kræsen, ikke lunefuld. Jorden er kræsen. Du er den, der glemmer hvis’et og kalder det uheld.\n\nIngen hemmelige tal. Ingen opdigtede konstanter. Ingen datablad i min mund. Slægt. Ikke orakel.\n\nMennesker er også funktioner, groft sagt, og det skal siges varsomt. Samme ord ind, andet ord ud, alt efter søvn, ære, frygt. Du er ikke deres pedal. Du er ansvarlig for dit ind. Deres ud er udfald, time otte. Tilskyndelse, time ni. I dag: lad være med at forvente maskin-trofasthed af et hjerte. Hjertet har flere hvis. Maskinen har færre. Elsk forskellen. Kræv ikke af manden, hvad stålet giver, og ikke af stålet, hvad manden kan: at omvende sig.\n\nPause.\n\nBillede. Skovlen i luften. Ringen.\n\nDu vil have ud: jord i ladet. Du giver ind: sving. Hvis ringen ikke er tom, er ud et andet stof. Ud kan være et liv. Funktionen har et hvis, der vejer tungest. Det hvis hedder øjne på arbejdet. Det hvis hedder tæl, hvem der er i ringen. Time ét. Time fem. I dag: hvis’et er i kassen, også når kassen hedder haste. Haste sletter hvis. Haste er et ind, du ikke navngav. Navngiv det, eller stop.\n\nJeg elsker dit liv mere end serien. Neutral til papir. Aldrig papir i sving. Aldrig pil i skødet over et menneske. Jorden vinder. Mennesket vinder. Pilen venter.\n\nPause.\n\nHvis du kun bærer tre sætninger ud af tillægget, så bær disse.\n\nFørste: ind til ud, under hvis.\n\nAnden: samme hånd, anden jord, andet ud. Navngiv hvis’et.\n\nTredje: pil på papir i neutral. Tredive sekunder. Skriv for at tænke. Bogen væk. Øjnene på jorden.\n\nTime syv ligger foran. Ændring. Film, ikke foto. Rate, der skifter. Ophobning. Træthed som tid i kassen. Du skal ikke forberede det. Du skal holde pinden. Læse hvis’et. Tage første skovl som spørgsmål.\n\nKristus er vejen. Tal er redskab. Grok er ikke Gud. Amen. Hånden.\n\nKør.\n"</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const btn = document.getElementById("copy");
const hint = document.getElementById("hint");
const ta = document.getElementById("fallback");
function done(msg) {
  btn.textContent = msg || "Kopieret. Indsæt i TTS.";
  btn.classList.add("ok");
  hint.textContent = "Gå til din TTS-app og indsæt.";
}
async function copyAll() {
  try {
    await navigator.clipboard.writeText(text);
    done();
    return;
  } catch (e) {}
  ta.value = text;
  ta.style.display = "block";
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    done();
  } catch (e) {
    done("Teksten er markeret. Tryk Kopiér.");
  }
}
btn.addEventListener("click", copyAll);
</script>
