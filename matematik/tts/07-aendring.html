<script id="payload" type="application/json">"Viktor. Time syv. Ét øre. Det andet hører maskinen. Øjnene på jorden. Hænderne på joysticket. Notesbogen ligger, hvor den skal ligge: lukket, inden for rækkevidde, ikke i skødet, ikke i luften mellem dig og skovlen.\n\nJeg er Grok. Jeg er din AI. Jeg er ikke Kristus. Jeg taler ikke for Gud. Jeg peger. Det, der er sandt i denne time, tilhører skabningen og dens Herre. Det, der er skævt, er mit. Test det med jorden. Jorden lyver ikke.\n\nI dag er ét tegn i lyset. Ændring. Det fjerde. Natten hængte det bagved kabinen. I dag klæder vi det på, indtil det bor i skovlen, i nålen, i uret, i skulderen.\n\nDe andre fire sidder i kabinen alligevel. Foran: Tæl. Til højre: Mål. Til venstre: Forhold. Over: Udfald. Under: jorden. I midten: du. Forvalter. Ikke gud. I dag vender vi ansigtet bagud ,  ikke som nostalgi, som film. Hvor kom du fra. Hvor hurtigt. Hvad ophobes.\n\nKontrakten er den samme som i de første timer. Lyden må køre, mens du arbejder. Papiret må ikke. Når et mærke skal ud af hovedet, sætter du i neutral. Stabil. Stille nok. Så bogen. Tredive til tres sekunder. Så bogen væk. Så hænderne tilbage. Hvis jorden kalder, vinder jorden. Den døde kan ikke tænke på papir.\n\nAmen til det. Så kører vi.\n\nPause.\n\nHør, hvor du kommer fra, så du ved, hvor du står.\n\nTime ét var Tæl. Ét er ét. Nul er ærligt. Minus er retning. Du tæller skovlfulde, timer, mænd, gange en slange har lækket. Du nægter en del, når du kan sige tre.\n\nTime to var handlingerne. Plus samler. Minus fjerner. Gange skalerer. Dividere deler. Du flytter mængder. Du holder regnskab, så verden ikke holder et andet bag din ryg.\n\nTime tre var Forhold. Hvad per hvad. Liter per time. Kroner per time. To til én som vand. Tal uden nævner er forældreløse.\n\nTime fire var Mål. Enhed på tallet. Fejl. Godt nok. Perfekt er et barn, der nægter at levere.\n\nTime fem var rummet. Vinkel, bue, areal, rumfang, vægtstang. Bommen er lektionen. Zonen, du ikke kører i.\n\nTime seks var funktioner. Noget går ind. Noget kommer ud. Pedal, tryk, bevægelse. Røret.\n\nI dag tager vi røret og sætter ur på. Det, der kommer ud nu, er hvor hurtigt. Det, der er kommet ud siden morgen, er samlet. Ændring er det fjerde tegn. Hvad bliver hurtigere eller langsommere.\n\nSkakmat. Du har gjort det i årevis. Du kaldte det det går eller det går ikke. I dag får det sprog, der kan rettes.\n\nPause.\n\nDer er et billede, du skal have i hånden hele timen. Et foto, og en film.\n\nEt foto er et tal, der står stille. Tanken viser et sted. Hullet har en dybde. Uret viser et klokkeslæt. Kroppen føles som den føles nu. Fotoet er ikke løgn. Fotoet er et snit. Et snit er sandt i det sekund, det tages. Et snit lyver, når du lader det tale for hele dagen.\n\nEn film er det samme tal, set som det bevæger sig. Tanken synker. Hullet bliver dybere. Uret går. Kroppen bliver en anden. Filmen er ikke pænere. Filmen er ærligere, fordi du kører i tid. Geden er i tid. Opgaven er i tid. Du er i tid.\n\nSkolen elskede fotoet. Et tal i en boks. Et facit. En streg, der lå stille på papiret, som om verden holdt vejret. Verden holder ikke vejret. Verden kører. Hældning er ikke kun en vej, du kører på. Hældning er, hvor stejl filmen er. Hvor meget der skifter, per det, du skifter langs. Per time. Per meter. Per skovlfuld.\n\nHvis du kun husker én sætning i denne time, så den: et tal, der står stille, er et foto. Et tal, der bevæger sig, er en film. Du kører i filmen.\n\nPause.\n\nSig det grimt, så det sidder.\n\nÆndring er: noget er anderledes end før.\n\nDet er barnets sætning. Den er sand. Den er for tynd.\n\nVoksensætningen er: anderledes hvor hurtigt, og anderledes hvor meget samlet.\n\nHullet er dybere. Godt. Hvor hurtigt blev det dybere. Og hvor meget jord ligger der samlet nu.\n\nTanken er lavere. Godt. Hvor hurtigt synker den. Og hvor meget diesel er brugt samlet siden morgen.\n\nDu er mere træt. Godt. Hvor hurtigt faldt du. Og hvor mange timer er samlet i kroppen siden mandag.\n\nTre billeder. Samme grammatik. Jord i hullet. Brændstof brugt. Timer i en uge. Vi vender tilbage til dem, til de er kød.\n\nUden de to spørgsmål ,  hvor hurtigt, hvad er samlet ,  er det går fremad tåge. Tåge føles som arbejde. Tåge er ikke forvaltning.\n\nSkolen havde navne til de to, og tavler, og tegn, der så ud som hegn. Vi bruger ikke tavlen. Vi bruger kabinen. Ingen krøller. Ingen fremmede bogstaver. Hvor hurtigt er: hvor stejl er filmen lige nu. Hvad er samlet er: hvor meget har filmen lagt i bunken, siden vi startede. Det er hele håndværket. Resten er pynt, du ikke skylder nogen.\n\nPause.\n\nTempo. På dansk: hvor meget per hvor længe. Eller per hvor langt. Per hvad.\n\nLiter per time. Kubikmeter per time. Meter per minut. Kroner per dag. Skovlfulde per lastbil. Det er forhold. Time tre gav dig forholdet. Time syv giver forholdet i bevægelse. Forholdet, der ikke er et stillbillede af to bunker, men en film af en bunke, der vokser, mens uret går.\n\nHør forskellen.\n\nJeg har gravet meget. Foto. Stemning.\n\nHullet er to meter dybt. Foto. Mål. Bedre. Stadig et snit.\n\nHullet blev to meter på tre timer. Film. Nu har du hvor hurtigt.\n\nOg der ligger samlet så mange skovlfulde, at lastbilen har været her fire gange. Samlet. Nu har du ophobningen.\n\nTo sandheder. De er ikke den samme. Du kan grave hurtigt i tyve minutter og have lidt samlet. Du kan grave langsomt i seks timer og have meget samlet. Du kan grave hurtigt og have lidt samlet, fordi lastbilen udeblev, og du stod og ventede. Tempo uden samlet er pral. Samlet uden tempo er en bunke, du ikke kan styre.\n\nI kabinen spørger du, når det haster: hvor hurtigt går det nu. Når du lover: hvad er samlet, når dagen er færdig, hvis det her tempo holder ,  og hvis det ikke holder.\n\nDet hvis er ærligt. Tempo holder sjældent. Det er hele træthedskurven. Vi kommer til den. Først skal du kunne se tempoet uden at pynte det.\n\nTempo. Kubik per time. Liter per time. Skovle per minut. Forhold med tid i nævneren. I dag: se, at tempoet skifter. Formiddag ét tempo. Efter frokost et andet. Mudder et tredje. Tempo er ikke en karakter. Tempo er vejr i arbejdet. Hold: hvor hurtigt.\n\nPause.\n\nHældning.\n\nIkke kun vejen. Vejen er det nemme billede, og det er tilladt. En stejl vej: højden skifter hurtigt, per meter frem. En flad vej: højden skifter næsten ikke. Du mærker det i maskinen. Du mærker det i forbruget. Du mærker det i kroppen.\n\nNu det samme billede på tal, der ikke er jord.\n\nTanken. Nålen. Hvis nålen står, er hældningen nul. Ingenting skifter. Hvis nålen kravler ned, er der en hældning. Hvis den styrtdykker, er hældningen stejl. Stejl hældning på en tank er ikke dårlig stemning. Det er et tempo. Noget æder. Hurtigt.\n\nHullets bund. Hvis bunden synker jævnt, er hældningen jævn. Hvis du rammer sten og næsten står stille, flader filmen ud. Hvis du rammer blødt og skovlen tager for meget, bliver filmen stejl den anden vej ,  for hurtigt, for ukontrolleret.\n\nKroppen. Morgenens hældning er ofte pæn. Du tror, du er den mand. Eftermiddagens hældning er en anden film. Samme mand. Anden hældning. Fotoet klokken syv lyver om filmen klokken fire. Det er ikke moral. Det er ændring.\n\nTre pile, hvis du vil se dem i luften. Tanken ned. Hullet op. Kroppen ned. Hvis du kun ser hullet op, glemmer du de to andre film. Forvalteren ser flere film.\n\nHældning er film, ikke foto. Sig det. Sig det, mens du kører. Ikke højt, hvis der er andre. Indeni.\n\nPause.\n\nTo spørgsmål. Jeg siger dem, til de er kedelige. Kedelige sandheder er de, der bærer vægt.\n\nFørste: hvor hurtigt.\n\nAndet: hvad er samlet.\n\nDu behøver de to sætninger, sagt til det, du ser.\n\nHvor hurtigt synker skovlen.\n\nHvor hurtigt fyldes ladet.\n\nHvor hurtigt tømmes tanken.\n\nHvor hurtigt bliver du sløv efter mad.\n\nHvad er samlet jord i hullet.\n\nHvad er samlet diesel siden morgen.\n\nHvad er samlet timer siden mandag.\n\nHvad er samlet løfter, du har givet, som endnu ikke er gravet.\n\nDet sidste er også ophobning. Ord ophobes. Ja ophobes. Nej, der ikke blev sagt, ophobes som pres. Vi holder os til jord, brændstof og timer, fordi de tre ikke smigrer. Når du kan se de tre som film, kan du se de andre.\n\nDer er mænd, der kun spørger hvor hurtigt. De kører som om dagen er et væddeløb. De vinder formiddagen og taber hullet, fordi samlet ikke passede, og bunden ikke holdt, og kroppen ikke var med i regnskabet.\n\nDer er mænd, der kun spørger hvad er samlet. De kigger på bunken og siger: der ligger jo noget. De ser ikke, at tempoet er dødt, og at bunken voksede i går, ikke i dag.\n\nDu skal have begge. Hvor hurtigt, så du kan styre nu. Hvad er samlet, så du kan love, stoppe, sige sandt til den, der betaler, og til den, du kommer hjem til.\n\nDe to hører sammen som åndedræt. Ind og ud. Hvis du kun ånder ind, dør du. Hvis du kun ånder ud, dør du. Hvis du kun ser tempo, brænder du ud. Hvis du kun ser bunken, vågner du for sent.\n\nPause.\n\nJord i hullet.\n\nDet er ophobningens første billede. En skovlfuld er lille. Den ser ud af ingenting. Den er ingenting, hvis du tager den én gang og går. Den er ikke ingenting, hvis du tager den i tres minutter. Den er slet ikke ingenting, hvis du tager den i en uge.\n\nSmåt plus tid er ikke småt. Natten sagde det. I dag skal du mærke det i skovlen.\n\nSe filmen. Ikke som en film på en skærm. Som det, der sker foran bommen.\n\nSkovl ned. Jord op. Sving. Løs. Tilbage. Igen.\n\nHver cyklus er et lille plus. Plus er time to. Her er plus med ur. Plus, der gentages, er ophobning. Ophobning er ændring, der får lov at blive liggende.\n\nHullet er et regnskab, jorden fører for dig. Du kan lyve for en formand. Du kan lyve for dig selv. Du kan ikke lyve for rumfanget. Rumfanget er samlet. Det er det andet spørgsmål, gjort i mudder.\n\nHvor hurtigt: skovlfulde per minut, eller lad per time, eller dybde per formiddag. Vælg ét mål. Ikke tre, der kæmper. Ét. I dag, for det her hul, er målet måske: hvor hurtigt fyldes lastbilen. I morgen er målet måske: hvor hurtigt synker bunden til stregen. Godt nok, time fire, bestemmer, hvornår du er færdig. Ændring fortæller, om du når det.\n\nHvis lastbilen kommer hver tyvende minut, og du ikke kan fylde den, er tempoet for lavt til aftalen. Det er ikke en følelse. Det er film mod ur. Hvis du kan fylde den på ti, og den kommer hver tyvende, er tempoet højt nok, og flaskehalsen er ikke dig. Så er ophobningen i ventetid. Ventetid er også samlet. Den samler sig som timer, du brændte, uden jord i hullet.\n\nDryp i en spand. Det er det samme. Hanen, der får lov at stå åben. Tid er hanen. Skovlen er dryppet. Spanden er hullet. Du behøver ikke at se dryppet for at tro på spanden. Du kan se spanden. Samlet. Hvis du kun stirrer på ét dryp og siger det er jo ingenting, er du barnet ved hanen. Forvalteren ser spanden.\n\nSkriv det, når du må. Neutral. En pil. Op, hvis bunken vokser. Flad, hvis du venter. Et tal ved siden af: lastbiler i dag. Det tal er løbende total. Vi træner papiret om lidt. Først skal billedet sidde.\n\nPause.\n\nBrændstof brugt.\n\nAndet billede. Tanken er en spand, der tømmes. Samme grammatik. Omvendt pil.\n\nHvor hurtigt: liter per time, eller hvor stejl nålen er, eller hvor ofte du tanker til samme slags arbejde. Hvad er samlet: liter siden morgen, siden mandag, siden du fik maskinen.\n\nFotoet er: halv tank. Film er: halv tank, og for tre timer siden var den over stregen, og arbejdet var det samme, og nu er den under. Så er tempoet et andet. Noget æder. Tomgang. Lækage. Tung jord. Kold maskine. Dårlig vane med at holde høje omdrejninger, mens du venter. Filmen peger. Den dømmer ikke endnu. Den peger.\n\nDer er en løgn, der elsker tanken. Løgnen siger: der er jo stadig noget. Samlet er ikke nul, så tempoet må være fint. Skakmat. Samlet kan være fint i et foto, mens hældningen er stejl. Du kan have nok til i dag og være tom i morgen, hvis filmen fortsætter. Forvalteren ser hældningen, før spanden er tom. Barnet ser bunden, når det er for sent.\n\nDiesel er ikke bare penge. Diesel er kæden fra natten: lys, plante, tid, olie, tank, forbrænding, tryk, arm, skovl, jord. Hver liter er omdannelse. Du skaber ikke løftet. Du omdanner. At se forbruget som film er ydmyghed med et ur på. Spild er ikke lidt. Spild er et tempo, der ophobes.\n\nHvis du tanker og ikke har et mærke, er hver tankning et foto uden film. Du ved, at du fyldte. Du ved ikke, hvor hurtigt den forsvandt. Et mærke: dato, slags arbejde, streg på et ur, eller bare formiddag, tung, våd. Næste tankning kan sammenlignes. Sammenligning er filmen. Uden sammenligning er du i tåge med en slange i hånden.\n\nVi opfinder ikke et forbrugstal, du ikke har. Ingen datablade fra luften. Time fire: godt nok. Et mærke, du har set. En pil ned, når nålen synker. En løbende total: hvor mange gange du har tanket i ugen, eller et groft tal, hvis du har det. Gæt får et spørgsmålstegn. Eller ordet groft. Eller slet ikke en linje, der later som måling.\n\nKold motor æder anderledes end varm. Første halve time er en anden hældning end den tredje. Sammenlign ikke et foto fra start med et foto fra middag og kald forskellen tyveri. Sammenlign film med film. Samme slags arbejde. Samme vejr, hvis du kan. Ellers er du vred på verden for at være verden.\n\nPause.\n\nTimer i en uge.\n\nTredje billede. Det er det, der rammer hjemmet.\n\nEn time er lille. Den føles som lige det her. En uge er samlet. En måned er samlet. Et år er samlet. Du kan sige ja til en time, der er sand, og nej til en uge, der er den samme time ganget op, indtil kroppen og løftet knækker.\n\nHvor hurtigt: timer per dag. Ikke stemningen jeg arbejder meget. Tallet. Hvad er samlet: timer siden mandag. Timer, du har lovet frem. Timer, der allerede sidder i skulderen.\n\nUret er helligt uden at være en afgud. Natten sagde det. I dag: uret er ophobningens måler. Du kan ikke købe tid. Du kan bytte. En time her, ikke der. Tid går ikke i minus og kommer tilbage. Gæld i penge kan betales. Gæld i tid betales med livet.\n\nDerfor er bare en time mere et foto, der nægter filmen. En time mere i dag. En time mere i morgen. En time mere, fordi du sagde ja i mandags, som om onsdagens krop var mandagens. Samlet bliver en uge, du ikke valgte. Du valgte fotoet. Filmen kørte alligevel.\n\nTæl timer som du tæller lastbiler. Ikke for at blive kold. For at elske sandt. Den, du kommer hjem til, lever i samlet, ikke i dine enkelte bare lige. Børn lever i samlet. Kroppen lever i samlet. Herren ser det skjulte. Det skjulte er ofte det, der ophobes, mens du kalder det småt.\n\nJeg siger uge, fordi du kender ugen. Jeg helliger ikke tallet syv. Syv er ikke held. Syv er ikke en kode. Syv er, hvor mange dage kalenderen har bundtet. Numerologi er et rivaliserende alter. Du læser grammatik. Du knæler ikke for cifrene. Kristus er vejen. Tal er redskab.\n\nPapiret, når ugen skal ses: en pil for dagens tempo ,  op hvis du presser, flad hvis det er aftalt, ned hvis du er ved at tømmes. Løbende total: streger. En streg per time, femte på tværs, som skovlfulde. Det er Tæl, sat på tid. Ændring er at se, om stregene kommer tættere, og om kroppen følger med.\n\nPause.\n\nTræthedskurven.\n\nHør det, som om jeg står ved siden af sædet og ikke vil smigre.\n\nTime ét lyver om time ti.\n\nIkke fordi time ét er ond. Fordi time ét er et foto af en mand, der er mæt af søvn, kold i hænderne på en god måde, stolt af at være i gang. Han planlægger, som om han er den mand hele dagen. Han lover, som om hældningen er konstant. Hældningen er ikke konstant. Du er ikke et tal, der står stille.\n\nNatten sagde: tilstå, at du ikke er et tal, der står stille. I dag er tilståelsen et værktøj.\n\nSe filmen af en dag, du kender.\n\nKlokken fem, eller når du starter. Time ét i døgnet. Kroppen er en slags løgn, der er nyttig: den kan. Du tæller, du måler, du sætter et ja, der er for stort, fordi du er den mand nu. Mærk det. Det er fotoet, vi advarer imod. Tak for det. Tro det ikke som evighed.\n\nFormiddag. Olien er varm. Det er ofte det sandeste tempo. Her skal samlet bygges. Her skal de svære bid tages, hvis dagen har svære bid. Forvalteren lægger det tunge, hvor hældningen er venlig. Barnet lægger det tunge, hvor stoltheden vil vise sig sent, når øjet er tyndt.\n\nTredje time: stadig godt. Måske det bedste. Varmen er i olien. Varmen er i dig. Hældningen er pæn.\n\nMiddag. Mad. Blod, der går til maven. Øjet, der bliver en millimeter langsommere. Du kalder det lige efter frokost. Det er en hældning. Det, der kommer ud per time, er ikke det samme. Forholdet skiftede. Time seks: det samme går ind, noget andet kommer ud. Røret med tid som hvis. I dag: planlæg den tiende time som en anden maskine. Ikke som heltemod. Som tal. Heltemod, der nægter tempoet, er hvordan mænd knækker, og hvordan ulykker får plads.\n\nTidlig eftermiddag. Andet åndedræt, nogle dage. Brug det. Tro det ikke som time ét. Det er et lån.\n\nSyvende: støj, du ikke hørte om morgenen. En vane, der bliver sløvere. En kant, du tager for skarpt. En ja-sætning i radioen, du ikke skulle have givet.\n\nSen eftermiddag. Time ét’s ja kommer ind ad døren. Nu er du forvalter eller løgner. Forvalteren sænker kravet, eller han holder et krav, han havde sat lavt nok. Løgneren holder et krav, der var et foto, og han kalder rysten for vilje.\n\nTiende: time ét’s løfte kommer hjem. Hullet, der godt kunne klares. Kroppen, der ikke var med i fotoet. Fejl, der er små, og som ophobes som risiko. Risiko er time otte. I dag ser du kun, at tempoet løj, og at samlet i kroppen er en anden bunke end samlet i hullet.\n\nHjem. Samlet i hullet er én bunke. Samlet i kroppen er en anden. Samlet i timer er en tredje. Hvis kun den første tæller, stjæler du fra de to andre. De to andre opkræver. De opkræver i nat. De opkræver i morgen. De opkræver i et ægteskab. Det er ikke poesi. Det er ophobning.\n\nSøvn er den film, der retter hældningen til i morgen. Hvis du skærer den, stjæler du fra morgendagens hvor hurtigt. Du kan kalde det hårdt arbejde. Matematikken kalder det at spise sæden.\n\nSkakmat.\n\nHvis du planlægger dagen, som om du er klokken syv, straffer den tiende time dig. Ikke som straf fra en lærer. Som aritmetik med kød. Forhold: det, der kommer ud per time, er en kurve. Ikke en streg, der ligger fladt hen over dagen.\n\nKurve betyder: hældningen skifter. Først stejl i arbejde. Så flad. Så ned. Nogle dage er der et andet løft efter kaffe. Nogle dage er der ikke. Du skal ikke tegne en pæn kurve, du kan vise frem. Du skal tillade, at filmen bøjer, og at løftet skal bøje med den.\n\nPause.\n\nHvad gør en voksen med kurven.\n\nHan lover fra filmen, ikke fra fotoet. Han siger: formiddagen kan det her. Eftermiddagen kan det her, hvis bunden holder, og hvis jeg har spist, og hvis jeg ikke har siddet og rystet i tre timer i forvejen. Han sætter et ja, der har rum til, at time ti ikke er time ét.\n\nHan stopper, før hældningen bliver farlig. Farlig hældning er ikke kun træthed. Det er træthed plus maskine plus andre mennesker. Øjnene på jorden. Hænderne på maskinen. Når øjet bliver en film, der hakker, er det et mål. Du måler det ikke med et bånd. Du måler det med ærlighed. Godt nok for at køre videre, eller ikke godt nok. Time fire. Voksen.\n\nHan skriver, når han må, en pil ned på kroppen, og en løbende total af timer. Ikke dagbog. Mærke. Efter frokost, sløv, to fejl, ingen skade. Det er mærker. Mærker er kærlighed, der nægter at glemme.\n\nDer er en fristelse: at hade time ét, fordi den løj. Gør ikke det. Time ét er en gave. Morgenen er en gave. Løgnen er at tro, at gaven er hele dagen. Troskab er at takke for formiddagen og forvalte eftermiddagen som en anden mark.\n\nDer er en anden fristelse: at prale af time ti. At kalde det hårdt arbejde at ignorere kurven. Nogle gange skal time ti klares. Så er det et valg med åbne øjne, og en pris, du betaler i nat og i morgen. Valg med åbne øjne er voksen. Valg, hvor du later som om kurven ikke findes, er barn i stål.\n\nKristus er ikke en talmand, der velsigner dine ti timer, fordi tallet er pænt. Han er vejen. Troskab i det små. Kroppen er næste. Næsten er ikke et tal, du tilbeder. Næsten er den, du ikke må køre ihjel, og det er også dig. Elsk sandt. Tæl timer. Se filmen.\n\nPause.\n\nHældningen, der selv skifter.\n\nDet er næste lag, og det skal siges uden krøller.\n\nFørst ser du, hvor hurtigt. Det er hældningen. Så ser du, at hældningen ikke er den samme hele tiden. Tempoet stiger. Tempoet falder. Det er filmen af filmen. Du behøver ikke et nyt fag til det. Du behøver ærlighed: nu går det hurtigere end for en time siden. Nu går det langsommere. Nu er det ved at løbe, og det er ikke godt.\n\nI geden: du rammer blødere jord. Skovlen tager mere. Hvor hurtigt stiger. Samlet stiger med. Godt, hvis bunden holder. Ikke godt, hvis du tager så stejlt, at væggene skrider. Så er det ikke en sejr. Så er det en hældning, der blev for stejl.\n\nDu rammer sten. Hvor hurtigt falder. Samlet næsten står. Fotoet siger: jeg arbejder jo. Filmen siger: opgaven rykker ikke. Så skifter du værktøj, eller du skifter plan, eller du siger det højt til den, der skal vide det. At blive siddende i en død film og kalde det tålmodighed er kun tålmodighed, hvis der er en grund. Ellers er det skam, der nægter at se bunken stå stille.\n\nKroppen: efter frokost falder hvor hurtigt. Det er ikke kun jeg er træt. Det er, at hældningen skiftede. Hvis du presser for at holde det gamle tempo, betaler du med fejl. Hvis du tillader et lavere tempo og stadig rammer samlet, fordi formiddagen bar, er du voksen. Hvis formiddagen ikke bar, og eftermiddagen falder, skal løftet give sig, ikke øjet.\n\nDet lag redder dig fra at tro, at ét tal for hvor hurtigt er helligt. Helligt er det ikke. Det er et snit af en hældning, der selv er i bevægelse. Godt nok er, at du ser retningen, og at du ser, om den bliver værre.\n\nPause.\n\nUtætheden.\n\nEt lille minus, der næsten ikke synes. En slange, der sveder. En vane, der stjæler tre minutter per time. En tomgang, der kører, mens du snakker. En ja-sætning, der er fem minutter i munden og femogfyrre i kalenderen.\n\nFotoet siger: det er ingenting. Filmen siger: per time er det småt. Samlet i en uge er det ikke småt. Samlet i en måned er det en dag, du ikke kan finde. Samlet i et år er det en ferie, du aldrig fik, eller en reparation, du ikke sparede op til, eller en tillid, der blev tynd.\n\nSkakmat. En utæthed, der er lille, er et tempo. En dag er ophobning. En uge er en ulykke, du kaldte pludselig. Den var ikke pludselig. Den var u-talt.\n\nJeg siger ikke, at du skal blive en mand, der jager minutter som et dyr. Jeg siger, at du skal se ophobningen, før du kalder den karakter. Jeg er bare sådan er ofte en utæthed med et navn. Navnet føles som identitet. Identitet nægter pilen. Pilen er venligere. Pilen kan vendes. Identitet er et fængsel, du pynter.\n\nPapiret er nådesløst på den rigtige måde. Pil ned, lille. Total, der vokser alligevel. Du ser det. Du vælger. Time otte vejer prisen. I dag ser du kun, at småt plus tid har en retning.\n\nDer er utætheder, du skal lade være. Hvile er ikke utæthed. Et minut, hvor du ser på jorden og ikke river, kan være det, der holder time ti i live. Skil. Utæthed er ændring, der ikke tjener bunken, du har lovet, og ikke tjener bunken derhjemme, og ikke tjener kroppen. Hvile tjener. Bøn tjener. Vand tjener. Et nej tjener. Tomgang, der later som arbejde, tjener ikke.\n\nRenter er ophobning med gange i. Småt plus tid plus gange. Time ni. I dag: selv uden renter ophobes. Vaner ophobes. Streger på papir ophobes til et arkiv. Arkiv er forvalterens hukommelse. Hovedet er film, der overskrives.\n\nPause.\n\nPapiret.\n\nNu hænderne. Ikke mens skovlen er i jorden. Når et mærke skal ud. Neutral. Stabil. Stille nok. Bogen. Tredive til tres sekunder. Så væk.\n\nI dag er mærket ikke de fem navne. I dag er mærket to ting.\n\nEn pil. Op. Ned. Flad.\n\nOg et tal, der løber. En løbende total.\n\nPil er hvor hurtigt, tegnet som retning. Op: det vokser, det stiger, det bliver mere. Ned: det synker, det tømmes, det bliver mindre. Flad: næsten ingen ændring. Ventetid. Ståstille. Tomgang, der later som om den er arbejde.\n\nLøbende total er hvad er samlet. Lastbiler i dag. Streger for timer. Et groft tal for liter, hvis du har det. Skovlfulde, hvis du tæller i femmere. Dybde, hvis du har et mål. Ikke pænt. Sandt.\n\nHør, hvordan du tænker på papir. Du tænker ikke færdigt og skriver bagefter. Du skriver, for at tænke. Hovedet er værkføreren. Papiret er fabrikken. Hvis du venter, til det er klart, venter du til egoet har smurt det.\n\nSå: pil. Hånden ved ikke, før stregen er der. Når stregen er der, ser du: jeg troede, det gik fremad. Pilen blev flad. Skakmat. Nu kan du vælge. Før stregen kørte du i en stemning, der hed fremad.\n\nSå: total. Du sætter en streg. Du sætter fem. Du ser, at formiddagen havde mange, og den sidste time havde to. Filmen ligger på papiret. Hovedet ville have sagt: det gik fint hele tiden. Papiret nægter at smigre.\n\nGrimt og sandt slår pænt og teater. En pil, der er skæv, og et tal, der er groft, er matematik. En side med pæne kasser, skrevet om aftenen for at føle dig som en, der tager det seriøst, er religion uden Gud.\n\nNeutral kun. Jeg siger det igen, fordi maskinen er hård. Du tænker ikke på papir, mens du kører. Du tænker ikke på papir, mens skovlen tager. Øjnene på jorden. Hænderne på maskinen. Omgivelser først. Papir er værktøj i et stop. Det er ikke et nyt sted at bo.\n\nHvad skriver du ikke. Du skriver ikke jeg føler mig produktiv. Du skriver pil og total. Følelsen må være der. Følelsen får et mærke, eller den får lov at tie, til du kan oversætte den. Maven er et signal. Maven er ikke en graf. Du skriver ikke et essay. I dag gik det godt, men… ,  det er dagbog. Dagbog kan lyve blødt. Pilen lyver hårdere, og det er en nåde.\n\nVed pilen, hvis du har det: et ord. Jord. Tank. Krop. Uge. Ét ord. Så ved du, hvilken bunke.\n\nHvis der er plads, en anden pil ved siden af, mindre: hældningen skifter. Op, hvis det bliver hurtigere. Ned, hvis det klinger af. Flad, hvis tempoet er jævnt. Det er nok. Ingen krølle.\n\nHvis du opdager, at du skriver sætninger, stop. Sætninger er til aften, hvis du vil. I geden er sætninger en måde at blive i bogen på. Mærker. Så ud.\n\nTre gange i denne time, hvis arbejdet tillader det. Neutral. Pil. Total. Videre. Uden hånden er time syv radio. Med hånden er time syv et spor i kroppen.\n\nPause.\n\nStop til notesbogen. Kun nu, og kun hvis maskinen kan stå.\n\nSæt i neutral. Stabil. Se omgivelserne. Mænd. Skovl. Bagved. Så bogen. Tredive til tres sekunder. Ikke dagbog. Mærker. Du skriver for at tænke. Du tænker ikke færdigt og skriver bagefter.\n\nTegn en pil for det, der brænder nu. Hullet, tanken, eller kroppen. Ét. Ikke tre. Op, ned, flad.\n\nSkriv under et tal, der løber. Lastbiler. Timer. Streger. Det du har. Hvis du ikke har tal, skriv et spørgsmålstegn og en streg, der betyder: jeg tæller herfra. Spørgsmålstegn er ærligt. Egoet hader det. Matematikken hader det ikke.\n\nLuk bogen. Hænderne tilbage. Øjnene på jorden.\n\nHvis du ikke kan stoppe, fordi jorden kræver dig, er det i orden. Kontrakten er jorden først. Så tag det ved næste pause. Ét er et spor. Nul er radio.\n\nPause.\n\nLad os gå langsomt gennem tre scener, som om de sker foran forruden. Du kører. Jeg taler. Du retter mig, hvis jorden siger noget andet.\n\nFørste scene. Hullet.\n\nDu har en streg, der skal nås. Godt nok er aftalt. Formiddagen er våd. Skovlen tager tungt. Tempoet er lavere end i går. Fotoet i hovedet siger: jeg er bagud. Filmen siger: hvor hurtigt nu, og hvad er samlet nu, og hvad kan samlet være klokken tre, hvis hældningen holder, og hvis den flader, fordi lastbilen udebliver.\n\nDu stopper i neutral, fordi knuden fylder. Pil ned, lille. Total: to lastbiler. Klokken er ni. Du tænker ikke jeg er dårlig. Du tænker: filmen er langsom, samlet er lille, aftalen er tre. Så er spørgsmålet ikke skam. Spørgsmålet er: kan hældningen ændres ærligt ,  anden bid, anden rækkefølge, en lastbil mere ,  eller skal løftet ændres. Syn. Valg. Sti.\n\nAnden scene. Tanken.\n\nNålen er lavere, end du syntes, den skulle være. Foto: næsten tom. Panik er et foto, der skriger. Film: hvornår tankede du. Hvad var arbejdet. Tomgang. Kulde. Lækage. Du ved det ikke endnu. Du tæller i dag. Time ét i serien. Du sætter en pil ned. Total: én tankning siden i går. Du tanker, hvis du skal. Du opdiger ikke et forbrugstal, du ikke har. Du lover ikke den æder ikke. Du siger: jeg har en hældning, jeg ikke forstår endnu. Forståelse er en film, der får flere billeder. Ét billede er ikke en dom.\n\nTredje scene. Ugen.\n\nDet er onsdag. Nogen vil have lørdag. Fotoet i munden er ja, fordi du kan, fordi time ét i onsdags stadig sidder i stemmen. Filmen i kroppen er tre dage, der allerede er samlet, og en kurve, der peger ned. Papiret, hvis du tør: pil ned på kroppen. Total: timer siden mandag, streger. Du ser dem. Du siger måske ja alligevel. Men du har set. Time otte er udfaldet og prisen. I dag er det ændringen, der gør jaet ærligt eller til en løgn, du fortæller med energi, du ikke har.\n\nTre scener. Samme to spørgsmål. Hvor hurtigt. Hvad er samlet.\n\nPause.\n\nTo mænd ved samme hul. Jeg opdigter dem ikke som personer, du kender. Jeg bruger dem som spejl.\n\nDen ene kører stejlt. Meget hvor hurtigt. Samlet ser imponerende ud til middag. Væggene er sjusk. Bunden er ujævn. Time ti er et rod, der skal rettes, og rettelsen æder det, han pralede af. Filmen var stejl. Bunken var løgn, fordi godt nok ikke var med.\n\nDen anden kører jævnt. Hvor hurtigt er lavere. Samlet til middag ser småt ud. Formanden bliver urolig. Eftermiddagen holder. Godt nok er der. Time ti er ren. Ugens samlede er større, fordi der ikke er en skjult bunke af rettelser.\n\nHvem er dygtig. Ikke den stejteste. Den, hvis film passer til stregen og til bunden og til kroppen. Tempo er ikke dyd. Sandt tempo er dyd. Sandt betyder: det, der ophobes, er det, der var lovet, ikke et teater.\n\nDu kender dig selv. Nogle dage er du den første. Nogle dage den anden. Pilen på papiret er ikke for at dømme manden. Den er for at se, hvilken film du er i nu, så du kan vælge.\n\nPause.\n\nFalske venner. Ting, der ligner ændring og ikke er det.\n\nGennemsnit. Et gennemsnit er et foto af en film, der er blevet mast flad. Vi kører så og så meget om dagen. Måske. Formiddagen kørte mere. Eftermiddagen kørte mindre. Gennemsnittet smiler. Kurven gør ikke. Gennemsnit er tilladt, når du ved, at det er et smil. Gennemsnit er løgn, når du planlægger time ti, som om den var gennemsnittet.\n\nDet går fint. Fire ord. Ingen pil. Ingen total. Ingen enhed. Time tre: tal uden per hvad er forældreløse. Time syv: sætninger uden film er forældreløse. Oversæt. Fint hvor hurtigt. Fint hvad er samlet. Fint i forhold til stregen. Ellers er fint et tæppe.\n\nDet retter sig. Hvilken pil. Hvilket tempo. Retter sig er et håb, der nægter at tegne.\n\nPludselig. Ofte ophobning, du ikke tællede.\n\nJeg er den samme. Foto. Du er film.\n\nBare lidt længere. Længere er plus i tid og minus i krop. Begge pile.\n\nVi tager den som den kommer. Nogle gange er det visdom. Nogle gange er det nægtelse af hældning. Hvis hældningen er stejl og dum, kommer den ikke som en ven. Den kommer som et hul, du ikke nåede, eller som en krop, du ikke havde. At tage den som den kommer, voksen, er: se filmen, og så tage den. Ikke: nægte at se, og kalde det afslappet.\n\nKonstant. Ordet lyder af tryghed. Meget er ikke konstant. Forbrug er ikke konstant. Tempo er ikke konstant. Humør er ikke konstant. Troskab skal være konstant, og det er derfor, den er en dyd, ikke et termometer. Forvent ikke, at maskinen og kødet er dyd. Forvent, at de er film. Forvalt dem.\n\nKorrelation, kort, fordi natten gav den, og time ni tager den. To ting kan danse. Timer og diesel. Træthed og fejl. Dansen er et spor. Årsagen er en kæde. Hvis du ser fejl stige, mens timer stiger, er det ikke hekseri. Det er en hældning i opmærksomhed. Ret kæden. Søvn. Mad. Nej. Ikke et krystal. Et valg.\n\nPause.\n\nAt tale ændring. Sætninger, du må sige uden at rødme.\n\nTempoet er halvt efter frokost, samme jord.\n\nTanken falder hurtigere end i går, samme arbejde ,  så er der et hvis.\n\nHullet stiger, kroppen falder, jeg stopper til vand.\n\nDen synker hurtigere end i går, samme jord.\n\nSamlet har vi tre læs. Ikke en del.\n\nPilen er flad. Vi venter. Ventetid er også tid.\n\nTime ét’s ja passer ikke på time ni. Jeg siger nej, eller jeg siger ja med en pris.\n\nNålen har en stejl hældning. Jeg ved ikke hvorfor endnu. Jeg tæller.\n\nUgen er samlet, og kroppen siger, at hældningen er ned. Jeg kommer hjem.\n\nHvad du siger i radioen, når nogen spørger nå, hvordan går det.\n\nIkke fint, hvis fint er tæppe.\n\nDu kan sige: vi har to læs, det går langsommere end i går, bunden er våd, jeg når stregen, hvis lastbilen holder. Det er matematik. Det er også respekt. Den anden kan handle på det. Fint kan han ikke handle på.\n\nDu kan sige: jeg ved det ikke endnu, jeg har en time mere, så kan jeg sige samlet. Det er ærligt. Egoet hader at sige jeg ved det ikke. Forvalteren elsker det, fordi det er et foto, der nægter at late som film.\n\nDu kan sige: kroppen er nede, jeg tager de lette bid. Det er ikke svaghed. Det er hældning, oversat. En mand, der kan sige det, er farligere for ulykken end en mand, der siger fint med et øje, der hakker.\n\nØjnene på jorden, mens du siger det. Du kører ikke med munden. Du kører med hænderne. Munden er kort.\n\nDet er grimt i starten. Så bliver det rent. Så bliver det kærligt, fordi det nægter at sløre den, der skal leve med dine ja.\n\nDer er også tavs ændring. Hånden, der letter, før øjet har sagt, at tempoet er forkert. Den tavse er ikke fjenden. Den tavse er fornemmelsen, vi giver sprog, så den kan rettes, når den tager fejl. En mand uden tavs film er langsom. En mand med kun tavs film er farlig, når dagen skifter, og han kalder skiftet for stadig fint.\n\nPause.\n\nBrintatomet, én gang, så kortet fra natten ikke falder af.\n\nAtomet kan sidde i sit laveste. Det kan løftes. Det kan falde. Det er ændring. Ikke en stemning i atomet. Et skift. Energi, der ikke er den samme. I nat skulle du ikke tegne krøller. I dag skal du heller ikke. Du skal se, at verden er ting, der skifter tilstand, og at skiftet har et tempo, og at det, der er sket, ligger som samlet i det, du kan måle: lys, varme, et hul, en tom tank, en træt arm.\n\nHop er ændring i energi. Hurtigt. Ophobning i solen er en anden skala. Du lever i den menneskelige. Tæl den menneskelige. Lad solen være sol. Ingen talmagi. Ingen hemmelig kode i atomet. Grammatik. Gave. Du læser. Du tilbeder ikke.\n\nElektronet er tåge med regler. Det er time otte. I dag er du på den fjerde pæl. Ændring. Hældning som film. Ophobning som bunke. De fem tegn er ét kort. Du trækker ét tegn frem. De andre venter i kabinen.\n\nKabinen er stadig origo. Foran: tæl. Til højre: mål. Til venstre: forhold. Bagved: ændring. Over: udfald. Under: jord. Midten: forvalter. Under Kristus. Med et sprog.\n\nHvorfor virker det at sige bagved. Fordi ændring er det, der kommer fra det, du var. Du kører fra det, der var, ind i det, der bliver. Bagved er ikke fortid som nostalgi. Bagved er filmen, der allerede kørte, og som peger frem, hvis du tør se hældningen.\n\nPause.\n\nMere kabine. Mere kød. Så det ikke bliver en tale, du nikker til.\n\nDu sidder. Motoren synger. Hydraulikken har sin tone. Du kender tonen, når den er rask, og når den er doven. Tone er film. Du behøver ikke et tal for at høre, at noget skifter. Når du skal styre, skal tonen oversættes. Hurtigere. Langsommere. Samlet: hvor længe har den sunget sådan. Ét minut er et foto. En time er en bunke.\n\nDu svinger. Cyklussen har et tempo. Du kan mærke, når du tager for stor en bid, og filmen bliver stejl og dum. Du kan mærke, når du tager for småt, og filmen flader, og dagen ikke rækker. Godt nok er en hældning, du kan holde. Ikke den stejteste. Ikke den fladeste. Den, der samler det, der er lovet, uden at knække mand og bund.\n\nDu venter på lastbilen. Pilen flader. Tomgang æder. Samlet diesel stiger. Samlet jord stiger ikke. Det er et ærligt billede. Nogle mænd fylder ventetiden med uro og kalder uroen for arbejde. Arbejde er ændring, der rammer opgaven. Uro er ændring, der rammer nerverne. Skil dem. Hvis du kan slukke ærligt, sluk. Hvis du ikke kan, så lad i det mindste være med at kalde ædningen for nødvendighed uden at have tjekket.\n\nDu spiser. Kurven bøjer. Det er tilladt. Det er skabt. En mand, der nægter at spise for at holde fotoet af time ét, betaler senere. En mand, der spiser som en flugt, betaler også. Forhold. Ikke en diætprædiken. Et tempo i blodet, der bliver et tempo i skovlen.\n\nDu tisser. Du drikker. Natten sagde: tørst er et mål. I dag: tørst er en hældning i kroppen, der ophobes til sløvhed, hvis du ignorerer den. Småt plus tid. Vand er ikke poesi. Vand er stof, der holder et forhold. Forholdet knækker, før stålet knækker.\n\nDu hører radioen. Et ja, der flyver ud. Ja er en hældning i din kalender. Det ophobes som timer. Sig ikke ja, mens skovlen er i jorden, hvis jaet kræver et tal, du ikke har. Neutral. Pil. Total. Så mund.\n\nNår du tager en skovlfuld: det er et plus. Plus plus plus er samlet. Hvor hurtigt er, hvor tæt plusserne ligger.\n\nNår du ser nålen: det er et minus i tanken. Minus minus minus er samlet brugt. Hvor hurtigt er, hvor stejl minusset er.\n\nNår en time går: det er et plus i ugen og et minus i kroppen. Begge bunker. Begge pile. Du er ikke kun hullet. Du er også spanden, der tømmes.\n\nNår du bliver irriteret: irritation er ofte en hældning, du ikke har oversat. Bagud. For stejl. For flad. Oversæt, før du spytter på et menneske. Tælling af adfærd er time ni. I dag: oversæt til film.\n\nPause.\n\nLad os køre en time i kabinen med pilen tændt, uden at hånden forlader maskinen.\n\nMorgen. Kulde i rattet. Første hul. Du tæller ikke højt. Time ét sidder alligevel: hvor mange skovlfulde, før lastbilen er fuld. Det tal er et forhold, der venter. Når lastbilen kører, har du et mærke i kroppen. Ved næste pause, i neutral, kan det blive pil og total. Op. To læs. Eller forskelligt, fordi bunden skifter. Forskelligt er også information. Det er en hældning, der ikke vil holde stille.\n\nFormiddag. Hældningen ind i hullet. Maven siger nej. Du sænker. Du ændrer angreb. Du kører ikke et krølle ud af maven. Du lader maven være en klokke. Klokken betyder: her er en film, jeg ikke har målt. Time fire måler. Time syv nægter at kalde klokken for et datablad, og nægter at ignorere den.\n\nFrokost. Hvis der er et bord, og bogen kan komme frem uden at maskinen er i live, er det stadig omgivelser først. En kaffekop er ikke neutral, hvis nogen kan ramme dig. Hvis det er sikkert, ét mærke. Ikke fem. Ét. Pil på kroppen. Total af timer siden start. Spørgsmålstegn tilladt. Pæn konklusion forbudt.\n\nEftermiddag. Træthed. Det, der kommer ud per time, er ikke konstant. Hvis du prissætter dagen som om den var klokken syv, stjæler klokken femten fra dig. Du behøver ikke en pæn kurve. Du behøver mistanken. Mistanken er Forhold plus Ændring i samme kabine.\n\nFejring. En lastbil mere end du troede. Egoet vil have en historie: jeg er skarp. Måske var jorden blød. Måske var lastbilen mindre. Måske var du skarp. Sammenhæng er ikke årsag. Lad være med at ægte en historie, før pilen er skrevet.\n\nPause.\n\nEndnu et skakmat, så det sidder i ryggen.\n\nDu kan ikke løfte mere, end tryk og arm tillader, og du kan ikke holde et tempo, kødet ikke har. Vilje er ikke hydraulik. Vilje er ikke søvn. Vilje kan vælge at stoppe, vælge at spise, vælge at sige nej, vælge at bede. Vilje kan ikke narre hældningen ved at hedde den noget pænt.\n\nDu kan ikke gemme et dårligt tempo ved at smile til samlet fra i går. I går er en bunke. I dag er en film. Hvis dagens film er død, hjælper gårsdagens bunke ikke på aftalen, der hedder i dag.\n\nDu kan ikke gemme et dårligt forhold ved at gøre tælleren større. Time tre. Hvis du taber på hver enhed, hjælper flere enheder ikke. Time syv tilføjer: hvis hældningen er forkert, hjælper mere tid ofte ikke. Mere tid ophober den forkerte film. Stop. Ret. Så tid.\n\nDu kan ikke købe en ny krop klokken tre. Du kan bytte opgaver. Du kan sænke kravet. Du kan bede om en mand mere. Du kan sige, at stregen flyttes. Det er forvaltning. Det er ikke nederlag. Nederlag er at køre videre i en løgn, fordi fotoet i morges var smukt.\n\nDu kan ikke vide, hvordan det går, med et foto og en følelse alene. Følelsen er hurtig. Den er ofte rigtig. Den er ofte dyr, når den tager fejl. Sprog gør følelsen rettelig. Pil og total gør den rettelig. Uden mærke er jeg ved et håb i arbejdstøj.\n\nDer er dage, hvor du ved det med kroppen, før papiret. Godt. Stol på det nok til at stoppe. Stol ikke på det nok til at nægte mærket, når mærket er billigt. Neutral. Tredive sekunder. Billig ærlighed.\n\nDer er dage, hvor papiret viser noget, kroppen nægter. Kroppen vil være time ét. Papiret viser flad pil og lille total. Tro papiret i det, papiret kan se. Tro kroppen i det, papiret ikke kan se: smerte, uro, et øje, der hakker. Begge er mål. Begge kan lyve. Sammen lyver de mindre.\n\nEgoet elsker at være færdig i luften. Papir tvinger dig til at være ufærdig i det åbne. Kristus elsker det åbne. Mørket elsker det, der aldrig skrives, fordi det aldrig kan tjekkes.\n\nPause.\n\nZoom ud. Ikke til stjernerne. Til ugen. Til måneden.\n\nEn uge er film, limet sammen. Limet er din søvn og dine ja. Hvis hver dag har en hældning ned i kroppen, er måneden en bunke, du ikke valgte. Hvis hver dag har en lille utæthed i tiden ,  ti minutter, der ikke er arbejde og ikke er hvile ,  er måneden timer, du ikke kan finde. Småt plus tid.\n\nEn vane er ophobning med ansigt. Du kalder det bare sådan jeg gør. Matematikken kalder det en film, der kører, også når du ikke kigger. Ret vanen, og du retter hældningen i mange dage med ét valg. Det er derfor, småt er ikke småt. Det er også derfor, omvendelse er praktisk. Ikke som et show. Som en ny hældning.\n\nPenge ophobes. Gæld ophobes. Time ni tager renter. I dag må du kun se: retning plus tid. En lille pil ned i kassen, hver uge, er en film. En lille pil op, hver uge, er en anden. Fotoet jeg har det fint kan være sandt om onsdagen og løgn om året.\n\nOrd ophobes i et ægteskab. Jeg peger. Jeg prædiker ikke dit hus. Jeg siger grammatikken: småt plus tid. En pil op i det, der er sandt. En pil ned i det, der er gift. Samlet er det hus, I bor i. Du forvalter ikke kun hullet. Du forvalter bunken derhjemme, også når du ikke skriver den i notesbogen i geden. Hvis du skriver den, så i et stop, og kort, og sandt, og uden teater.\n\nOnsdag kan læse mandag. Hovedet fra mandag er væk. Forvalteren har arkiv. Barnet har stemning.\n\nPause.\n\nKristus uden talmagi.\n\nJeg vil sige det rent, så ingen hører forkert.\n\nVi tilbeder ikke syv, fordi det er time syv. Vi tilbeder ikke ti, fordi dagen har ti timer. Vi lægger ikke skjulte koder ind i vers, som om Herren var et puslespil, du knækker med et smart tal. Det er afguderi med kridt. Det er også en måde at undgå at adlyde det, der allerede er klart.\n\nKristus er vejen. Tal er redskab. Ordenen i skabningen er gave. Du opfinder den ikke. Du vågner i den. Du læser den. Du tilbeder ikke grammatikken.\n\nHvad har det med ændring at gøre.\n\nDette: troskab er at være den samme i retning, mens verden skifter. Verden skal skifte. Det er skabt sådan. Dag og nat. Sæd og høst. Træthed og hvile. Du skal ikke gøre dig til et foto, der nægter tiden. Du skal være en mand, hvis ja ikke rådner, mens filmen kører.\n\nFadervor beder om brød i dag. Et nu. Et mål. Ikke et tåget en dag. I dag er et snit. I dag er også en film, der ophobes til et liv. Begge dele. Du beder om i dag, og du forvalter ophobningen, så i dag ikke æder i morgen. I dag, i dag, i dag. Ophobning af dage er et liv. Troskab i det små er tempo. Frugt er ophobning, du ikke altid ser i timen.\n\nKorset er ikke en stemning. Det er en handling i tid, på et sted, for navngivne mennesker. Inkarnationen er det modsatte af sløring. Ordet blev kød. Kød har vægt. Vægt har tal. Kød bliver træt. Kød ophober. Han vidste, hvad en time var. Du må også vide det.\n\nJeg beviser ikke Gud med en hældning. Den, der prøver, gør hældningen til et afgudsbillede. Den, der nægter, at verden har tempo og ophobning, gør tilfældet til et afgudsbillede. Begge dele er for småt. Du er læser. Du er håndværker. Du er en mand under Kristus, som bruger et sprog, skabningen allerede taler.\n\nKærlighed tæller. Kærlighed ser også filmen. En mand, der elsker, ved, at småt plus tid ikke er småt. En lille utroskab, gentaget, er ikke lille. En lille utæthed, ignoreret, er ikke lille. En lille løgn om, hvor hurtigt det går, gentaget til en kunde, er ikke lille. Ændring ophobes. Nåde ophobes også, men nåde er ikke din undskyldning for at nægte bunken. Nåde er, at du kan vende om, og at bunken ikke er gud.\n\nNumerologi er et rivaliserende alter. Et tal, der føles rigtigt. Stop. Tal er rum og tælling og film. De er ikke orakler. Kristus er ikke en kode i cifrene. Den, der søger Gud i mønstre af syvere, tilbeder mønsteret. Mønsteret er skabt. Skaberen er ikke mønsteret. Du må gerne se orden. Du må ikke knæle for ordenen.\n\nPause.\n\nHvad denne time ikke er.\n\nDen er ikke et kursus i tavlesymboler. Du skal ikke tegne krøller. Du skal ikke sige fremmede navne for at være voksen. Voksen er: hvor hurtigt, hvad er samlet, pil, total, jord.\n\nDen er ikke et krav om at måle alt. Godt nok. Time fire. Nogle film er nok som retning. Nogle bunker er nok som streger. Perfekt er et barn, der nægter at levere.\n\nDen er ikke en undskyldning for at sidde i tal, mens verden venter. Øjnene på jorden. Hvis timen bliver et nyt sted at gemme sig, har vi fejlet. Matematik er verdens grammatik. Du læser den, så du kan grave, stoppe, sige ja, sige nej, komme hjem.\n\nDen er ikke frelse. Kristus er vejen. Tal er redskab. En klar hældning kan stadig bruges til at køre et menneske over. Klarhed uden kærlighed er en kniv. Kærlighed uden klarhed er tåge. Du skal have begge. Jeg kan give klarheden et sprog. Hjertet er ikke mit.\n\nPause.\n\nLad os samle værktøjskassen, som den ser ud klokken nu.\n\nTegn: Ændring.\n\nSpørgsmål: hvor hurtigt. Hvad er samlet.\n\nBillede: foto lyver om dagen. Film er dagen.\n\nTre bunker: jord i hullet, brændstof brugt, timer i en uge.\n\nKurve: time ét lyver om time ti. Det, der kommer ud per time, er ikke konstant.\n\nPapir: pil op, ned, flad. Løbende total. Neutral. Skriv for at tænke. Grimt og sandt.\n\nSprog: syn, valg, sti.\n\nKort: fem tegn, ét atom, én kabine.\n\nHvis du kun kan bære tre sætninger ud af denne time, så bær disse.\n\nFørste: hældning er film, ikke foto.\n\nAnden: hvor hurtigt, og hvad er samlet. Begge.\n\nTredje: time ét lyver om time ti. Pil og total i neutral.\n\nAlt andet var søm omkring de tre. Søm falder af. De tre skal sidde.\n\nHvis noget kørte forbi, lader du det køre. Jorden er tålmodig. Notesbogen tager et mærke ved næste stop. Hvis noget var langsomt, ånder du alligevel. En time er lang. Det er meningen. Filmen skal have tid til at sidde.\n\nPause.\n\nBaglæns, så det vender rigtigt, når timen slutter.\n\nTime ét lyver om time ti. Planlæg fra filmen.\n\nTimer i en uge er samlet liv. Bare én time er et foto.\n\nBrændstof brugt er en spand, der tømmes. Se hældningen, før bunden.\n\nJord i hullet er en spand, der fyldes. Småt plus tid er ikke småt.\n\nHvad er samlet. Bunken. Ansvaret.\n\nHvor hurtigt. Hældningen. Styringen.\n\nHældning er film, ikke foto.\n\nSkriv for at tænke. Pil. Total. Neutral.\n\nKristus er vejen. Tal er redskab. Ingen talmagi. Troskab i tiden.\n\nPause.\n\nViktor. Transmissionen for time syv er færdig, når jeg har sagt det sidste om rækkefølgen.\n\nDu stopper ikke maskinen, fordi en lektion slutter. Du kører. Øjnene på jorden. Når timen i øret skifter, skifter du ikke ansigt. Du er den samme mand. Pilen sidder bagved. Jorden under.\n\nJeg peger. Jeg styrer ikke skovlen. Kristus er vejen. Tal er redskab. Grok er ikke Gud.\n\nTime otte begynder, når du er klar i øret. Udfald. Sandsynlighed. Forventet værdi. Vejr, nedbrud, et tilbud. Elektronet, som ikke er en kugle på en skinne, men en tåge med regler. Du vælger. Du leger ikke Gud. Samme kontrakt. Ét øre. Neutral til papir. Ingen nye love. Den gamle: se, vælg, gå.\n\nSig det én gang i munden, stille, uden at tabe jorden:\n\nHvor hurtigt. Hvad er samlet. Film, ikke foto.\n\nSå kør.\n\nPause.\n\nHvis øret stadig er åbent, er her ikke et nyt fag. Her er den samme time, sagt som mærker i en væg.\n\nSøm ét: foto og film. Du kører i filmen.\n\nSøm to: hvor hurtigt. Hvad er samlet. Begge. Ellers tåge.\n\nSøm tre: jord. Diesel. Timer. Tre bunker. Samme grammatik.\n\nSøm fire: time ét lyver om time ti. Kurven. Løft fra filmen.\n\nSøm fem: pil og løbende total. Skriv for at tænke. Neutral. Grimt og sandt.\n\nSøm seks: syn, valg, sti. Ikke magi. Forvalterskab.\n\nSøm syv: Kristus er vejen. Tal er redskab. Småt plus tid er ikke småt. Ingen talmagi.\n\nSøm otte: utæthed er tempo. Uge er ophobning. Pludselig var ofte u-talt.\n\nSøm ni: sikkerhed først. Jorden vinder over pilen.\n\nSøm ti: næste time er udfald. Kan ske. Koster. Cirkel om valget.\n\nNu er det nok. Hvis du bliver siddende og tygger, mens skovlen skal arbejde, er det egoet, der vil have én krølle mere i luften. Giv det ikke den. Giv det en pil i neutral, senere. Eller giv det jorden.\n\nSlip lektionen. Hold filmen. Hold jorden.\n\nPause.\n\nEt åndedrag mere, så tælleren er ærlig, og nævneren er timen.\n\nHvis du i dag kun får skrevet ét mærke, så lad det være pilen og totalen. Ikke et essay. Ikke fem tegn i pæn skrift. En pil. Et tal, der løber. Eller tre streger for tre læs, hvis det var det, du så. Hvis du ikke så, så skriv pil flad og ordet vent. Billedet. Sømmet. Så bogen væk.\n\nOnsdag kan læse mandag. Hovedet fra mandag er væk. Forvalteren har arkiv. Barnet har stemning.\n\nTime syv er færdig i øret. Time otte venter med skyen. Du kører. Jorden først. Pilen bagved. Kristus vejen. Tal redskab. Grok ikke Gud.\n\nKør.\n"</script>
