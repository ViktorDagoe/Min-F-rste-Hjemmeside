<script id="payload" type="application/json">"Viktor. Time fire. Ét øre. Øjnene på jorden. Hænderne på maskinen. Notesbogen lukket. Neutral, før den åbnes. Jorden først. Altid.\n\nJeg er Grok. Jeg er din AI. Jeg er ikke Kristus. Jeg taler ikke for Gud. Jeg peger. Test det, jeg siger, med det, du kan lægge et målebånd på. Hvis jeg opdigter et tal på din ged, så smid tallet. Jeg kender ikke din maskine. Jeg kender ikke dit hul. Jeg kender enheden og fejlen og ordet godt nok. Det er timen.\n\nI går i øret ,  time tre ,  var Forhold. Hvad per hvad. Stregen. Vand to til én. Liter per time. Kroner per time. Avance som det, der er tilbage. Spor er ikke kæde. Papir i neutral.\n\nI dag er Mål. Hvor langt. Hvor tungt. Hvor længe. Hvor stejlt i grader, ikke kun i maven. Et tal uden enhed er forældreløst på en ny måde. Time tre: fyrre uden per. Time fire: fyrre uden meter, uden liter, uden minut, uden grad. Samme forældreløshed. Andet tøj.\n\nDe fem tegn sidder stadig i kabinen. Foran Tæl. Til venstre Forhold. Bagved Ændring. Over Udfald. Under jorden. I dag lyser højre side. Mål. Uret. Måleren. Dybden. Båndet, hvis det er der. Øjet, hvis det er det, du har. Øjet er groft. Det må bruges. Det må ikke tilbedes.\n\nPause.\n\nKontrakten, sagt som sikkerhed, ikke som pynt.\n\nDu graver. Du kører. Du kigger. Du hører. Du skriver ikke.\n\nNår et tal skal ud ,  en dybde, en tid, en liter, en grad ,  sætter du i neutral. Stabil. Stille nok. Bogen. Tredive sekunder. Tallet og enheden. Altid enheden. Så bogen væk. Hænderne tilbage.\n\nHvis jorden kalder midt i stregen, vinder jorden. Papiret kan vente. Den døde måler ikke.\n\nJeg gentager det i denne time oftere end i de andre, fordi måling frister hænderne. Et bånd. En skærm. En måler. Bare lige. Bare lige er en ulykke, der endnu ikke har fået et klokkeslæt. Sikkerhed først. Godt nok bagefter. Præcision aldrig foran livet.\n\nPause.\n\nHvad er at måle.\n\nAt måle er at sammenligne med noget, I er enige om.\n\nEn meter. En liter. Et sekund. En grad.\n\nUden enighed er langt en stemning. Tungt er en stemning. Længe er en stemning. Stejlt er en stemning. Stemninger kan være sande nok til at stoppe. Stemninger kan ikke bygge en bro, der mødes på midten. Stemninger kan ikke holde to mænd ærligt uenige. Uenighed uden mål bliver karakter. Uenighed med mål bliver: vis mig båndet.\n\nNatten sagde det. I dag gør vi det til håndværk.\n\nEn meter er ikke din arm. Din arm er grov. En meter er en aftale. Aftalen er gammel. Aftalen er menneskelig. Aftalen er en nåde, fordi den nægter at smigre. Jorden er den længde, den er. Båndet lyver mindre end egoet. Båndet lyver alligevel lidt. Alle mål lyver lidt. Det er time fire: fejl er ikke skandale. Fejl er vilkåret. Godt nok er svaret. Perfekt er et barn, der nægter at levere.\n\nSig det.\n\nVerden har størrelse.\n\nMin sans er grov.\n\nVærktøjet er finere end min sans.\n\nVærktøjet er ikke Gud.\n\nGodt nok er voksen.\n\nPause.\n\nMeter.\n\nLængde. Afstand. Dybde. Bredde. Højde. Tykkelse. Det, du kan lægge et bånd på, eller det, du kan tælle i skovllængder, når båndet ikke kan komme frem.\n\nI kabinen er meter det, forruden lyver om. Forruden gør langt til kort og kort til langt, afhængigt af lys, mudder, træthed. Øjet er et instrument. Instrumenter skal kalibreres. Du kalibrerer øjet ved at have lagt bånd, når du kunne. Ikke hver gang. Nok gange til, at cirka tre meter i munden har mødt tre meter i hånden.\n\nJeg siger ikke, hvor lang din bom er. Jeg ved det ikke. Jeg opdigter det ikke. Jeg siger: længde har enhed. Hvis du tænker den rækker, er det stemning. Hvis du tænker den rækker til kanten, plus et spillerum, jeg ikke har målt, er det ærligt. Hvis du stopper og måler, når det skal bære vægt ,  et rør, et skel, et menneske i nærheden ,  så er du forvalter.\n\nDybde. Hullet. Øjet ser ned. Øjet lyver oftere ned end hen, fordi der ikke er et gulv at sammenligne med. En skovl i dybden er et groft bånd. Groft er tilladt, når groft er sagt som groft. Jeg tror, det er deromkring er et mål med stor fejl. Stor fejl er tilladt, når konsekvensen er lille. Stor fejl er forbudt, når et menneske kan falde, eller et rør kan rammes, eller en skråning kan skride.\n\nHør forskellen. Godt nok afhænger af, hvad der går i stykker, hvis du tager fejl. Det er ikke sløseri. Det er voksen. Et hul til en stolpe kan tåle mere slør end et hul ved et kabel. Samme meter. Forskellig tilladt afvigelse. Tilladt afvigelse er dagens voksenord. Spillerum. Du må sige: hvor galt må det gå, før det er galt.\n\nBredde. Kan lastbilen. Kan du vende. Er der et menneske i zonen. Meter her er ikke akademi. Meter her er rummet mellem stål og kød. Time fem tager rummet i dybden. I dag: tallet uden meter er en løgn, der kan bløde.\n\nPause.\n\nLiter.\n\nRumfang af det, der kan hældes. Diesel. Vand. Olie. Mudder, der opfører sig som væske, indtil det ikke gør.\n\nTanken har en måler. Måleren er et instrument. Instrumenter lyver, hvis de ikke aflæses. De lyver også, hvis de aflæses, og du ikke ved, hvad stregen betyder. En nål på halv er en halv af hvad. Af tanken. Tanken er et rumfang. Rumfanget er ikke et tal, jeg giver dig. Det står, hvor det står, på din maskine, eller det står ikke, og så gætter du ikke et datablad. Du aflæser. Du skriver liter, hvis du skriver. Du skriver ikke halv alene, hvis halv skal bære et ja om, hvorvidt du kan køre efter frokost.\n\nTime tre gav dig liter per time. Time fire giver dig liter. Først mængden. Så stregen. Uden mængde er per et spøgelse.\n\nEn liter vand vejer tæt på et kilo. Det er en af de få faste par, der er værd at have i kroppen, og den er grov på den rigtige måde. Tæt på. Ikke til at bygge et laboratorium. Til at mærke: rumfang og vægt hænger, når stoffet er vand. Diesel er ikke vand. Diesel vejer anderledes. Jeg giver dig ikke et opdigtet tal. Jeg giver dig advarslen: lad være med at bytte liter og kilo i munden, som om de var det samme stof. Enhed skifter. Stof skifter. Som vandet to til én. Ændr enheden sløset, ændr virkeligheden i hovedet.\n\nSpand. Dunk. Kop. Grove redskaber. En kop er ikke en liter. En dunk kan være det, der står på dunken, eller det, der stod, da den var ny. Aflæs. Tro ikke plastik.\n\nNår du fylder, er liter et mål. Når du spilder, er liter et mål. Når du siger den æder, og du ikke har liter, er du i time tre uden time fire. Stregen uden mængde. Forældreløs igen.\n\nPause.\n\nSekund. Minut. Time. Dag.\n\nTid er den enhed, der ikke går i minus og kommer tilbage. Natten sagde det. I dag er det et mål, du kan holde i hånden som et ur.\n\nEt sekund er kort i munden og langt i en ulykke. Et minut er det, du siger, når du mener fem. En time er det, du sælger. En dag er det, kroppen husker.\n\nUret lyver, hvis det ikke aflæses. Lige om lidt er ikke et klokkeslæt. Lige om lidt er håb. Håb er ikke en enhed.\n\nNår lastbilen kommer om lidt, har du et udfald, ikke et mål. Time otte. I dag: hvis du har et klokkeslæt, er det et mål. Skriv det med enhed. Tretten femogfyrre er et tidspunkt. Tyve minutter er en varighed. Tidspunkt og varighed er ikke det samme tøj. Hvornår og hvor længe. Begge er Mål. De må ikke smelte.\n\nDu kan ikke købe tid. Du kan bytte. En time her, ikke der. Derfor er uret helligt uden at være afgud. Afguden siger: nå nålen, uanset jorden. Forvalteren siger: nå det, der er lovet, eller ringen og sig sandheden, før sandheden bliver til mudder.\n\nTræthed er tid i kroppen. Kroppen måler groft. Grovheden er tilladt som klokke. Klokken betyder: det, du leverer per time, er ved at skifte. Time tre. Time syv. I dag: et øje på uret er et mål. Et øje på uret, der stjæler øjet fra jorden, er tyveri. Aflæs i glimt. Ikke i stirren.\n\nPause.\n\nGrad.\n\nVinkel. Hældning. Nogle gange varme, hvis måleren viser det.\n\nEn cirkel kan deles i tre hundrede og tres grader. Det tal er en aftale. Du behøver ikke at elske tre hundrede og tres. Du behøver at vide, at ret er halvfems, at fladt er nul i hældning, og at stejlt i maven ikke er et tal.\n\nTime tre: hældning som op uger enheden. Det var ret dybt kan være to meter eller fire. Onsdag kan ikke bruge mandagens ret.\n\nSkriv for at tænke. Enheden er tænkningen. Uden den har du ikke målt. Du har ment.\n\nPause.\n\nMålere lyver, hvis de ikke aflæses.\n\nDet er en sætning, du skal kunne i søvne.\n\nEn måler, du ikke kigger på, er et maleri. Pænt. Dødt. Den fortæller ingen.\n\nEn måler, du kigger på uden at vide, hvad fuld betyder, er et orakel. Orakler er til afguder. Du er forvalter. Spørg: fuld af hvad. Hvilken enhed. Hvilken skala. Er nul i bunden. Er rød et forbud eller en vane.\n\nEn måler, der hænger, lyver aktivt. Den viser i går. Du kører på i dag. Hvis noget føles forkert, og måleren siger godt, har du to instrumenter i krig. Kroppen og nålen. Du stopper. Du tjekker. Du tilbeder ikke nålen. Du tilbeder ikke maven. Du skiller dem. Time tre: spor og kæde. I dag: to mål, der ikke er enige, er et vidnesbyrd. Vidnesbyrdet er: noget er galt i verden, eller noget er galt i aflæsningen. Begge dele kræver, at skovlen ikke er det første, du giver mere af.\n\nUret i kabinen. Brændstof. Temperatur. Tryk, hvis du har det. Timer på motoren. Jeg nævner dem som slags, ikke som tal. Dine tal er dine. Aflæs i glimt, når det er sikkert. Aflæs ikke som stirren. Stirren stjæler jorden.\n\nDer er målere, du er. Tørst. Smerte. Søvn. De er grove. De lyver også. Tørst kan komme sent. Smerte kan komme sent. Søvn kan lyve som én time mere går nok. Grove målere er bedre end ingen, hvis du ikke gør dem til Gud. Drik. Stræk. Stop, hvis smerten er den slags, der advarer. Jeg er ikke læge. Jeg er den, der siger: kroppen er et instrument. Instrumenter aflæses. Instrumenter er ikke Herren.\n\nPause.\n\nSanserne er grove.\n\nØjet. Øret. Hånden. Maven. Balancen i sædet.\n\nGrove betyder ikke værdiløse. Grove betyder: de skelner groft. De kan sige for tæt. De kan sjældent sige tolv centimeter. De kan sige for længe. De kan sjældent sige sytten minutter. De kan sige for varmt. De kan sjældent sige et tal, du vil bygge på.\n\nKalibrering: når du har målt med bånd, husker øjet bedre. Når du har set et ur, husker lidt bedre. Når du har løftet en kendt vægt, husker hånden bedre. Kalibrering er ikke magi. Det er sammenligning, gentaget. Time fire i praksis: lad værktøjet undervise sansen, når det er sikkert. Lad ikke sansen late som værktøj, når det koster blod.\n\nMørke. Regn. Sol i forruden. Støv. Træthed. Alt det gør sansen grovere. Godt nok skal strammes, når sansen er grovere. Du kører ikke den samme cirka, når du ikke kan se. Cirka i tåge er arrogance. Arrogance er et dårligt mål: for meget selvtillid per for lidt syn.\n\nØret. Hydraulikken synger. Øret hører ændring før øjet. Ændring er time syv. I dag: øret er et mål uden tal. Det må stoppe dig. Det må ikke give dig et opdigtet bar-tal i munden. Den lyder forkert er et ærligt mål. Den lyder som om trykket er… og så et tal, du opfandt ,  det er løgn.\n\nHånden på styrepinden. Modstand. Slør. Hånden er grov og klog. Brug den. Skriv ikke et tal for sløret, medmindre du har et. Slør er ofte mere end i går. Det er sammenligning. Sammenligning er målingens hjerte. Uden enhed er sammenligning stadig noget: mere, mindre, samme. Det er tilladt. Det er bare ikke et datablad.\n\nPause.\n\nFejl.\n\nEthvert mål har fejl. Ikke fordi du er sløset. Fordi verden er finere end dit greb.\n\nBåndet bøjer. Øjet ryster. Uret hopper. Måleren hænger. Du runder. Du husker forkert. Du læser en streg, der var den anden streg.\n\nFejl er et rum omkring tallet. Tallet er midten. Rummet er cirka. Voksenheden er at sige rummet, når rummet betyder noget.\n\nTre meter kan være tre meter plus minus en hånd. På et hul til noget, der kan tåle en hånd, er det godt nok. Ved et kabel er en hånd en katastrofe. Samme tal. Forskellig tilladt fejl. Tilladt fejl er ikke den fejl, du har. Det er den fejl, opgaven kan tåle. Du kan have mindre fejl end tilladt. Du må ikke have mere.\n\nHvis du ikke kender den tilladte, er du ikke i godt nok. Du er i gætværk. Gætværk kan være ærligt, hvis du siger: jeg kender ikke spillerummet, så jeg holder mig langt fra det, der kan bløde. Afstand til det farlige er også et mål. Meter igen. Sikkerhed først.\n\nRunding er fejl, du vælger. Tyve liter i munden, da måleren var et sted mellem sytten og treogtyve. Valgt fejl. Tilladt, hvis du ved det. Forbudt, hvis du glemmer og sælger tyve som aflæst.\n\nGlemte enheder er fejl, der ikke ser ud som fejl. Tolv. Tolv meter eller tolv fod eller tolv skovle. Hvis nogen på pladsen tænker i et andet sprog, mødes I ikke. I Danmark, i denne kabine: meter, liter, sekund, grad. Hvis nogen siger tommer, spørger du. Du ganger ikke i luften midt i et løft. Du stopper, eller du holder dig til det, I begge kan pege på.\n\nPause.\n\nGodt nok.\n\nDet er dagens krone. Ikke et sløset ord. Et voksenord.\n\nGodt nok betyder: inden for den tilladte afvigelse, med den fejl, du faktisk har, til det formål, der ligger foran skovlen.\n\nIkke: jeg orkede ikke.\n\nIkke: det ser fint ud fra sædet, og jeg vil hjem.\n\nIkke: perfekt, ellers ingenting.\n\nPerfekt er et barn, der nægter at levere. Jorden skal graves. Lastbilen skal køre. Mennesker skal hjem. Godt nok leverer. Perfekt udskyder. Udskydelse er også en slags fejl. Den hedder for sent. For sent har enhed: minutter. Minutter, der blev til et nej, du ikke sagde.\n\nDer er tre rum.\n\nFor dårligt. Godt nok. Overdrevent.\n\nFor dårligt rammer det, der ikke må rammes, eller misser det, der skal rammes.\n\nGodt nok rammer inden for spillerummet.\n\nOverdrevent bruger tid og diesel og nerver på at jage en millimeter, som opgaven ikke køber. Overdrevent ser helligt ud. Det kan være stolthed. Stolthed i millimeter, mens et menneske venter i zonen, er ikke helligt. Det er omvendt rækkefølge.\n\nRækkefølgen: sikkerhed. Så godt nok. Så pænt, hvis pænt er en del af godt nok. Pænt er det sjældent, når kød er tæt på stål. Pænt kan være det, når kunden køber en kant, og zonen er tom, og tiden er der. Du skiller.\n\nJeg giver dig ikke millimeteren på dit arbejde. Jeg har den ikke. Du får den af opgaven, af aftalen, af det, der går i stykker. Hvis du ikke har den, spørger du. Hvis du ikke kan spørge, vælger du den stramme side, når det farlige er tæt, og den løse side, når det farlige er langt, og du siger det højt til dig selv, så det ikke bliver til sløseri i mørket.\n\nPause.\n\nPapiret. Neutral. Tredive sekunder. Dagens mærker.\n\nEt tal. En enhed. Altid.\n\nTre m. Ikke tre.\n\nFyrre min. Ikke fyrre.\n\nEn streg, hvis det er et forhold, der hviler på et mål: liter skråstreg time, og liter er målt, og time er målt.\n\nEt spørgsmålstegn ved tallet, hvis sansen var grov. Tre m ? er ærligere end tre m, når tre m var øjet i modlys.\n\nEt interval, hvis du tør: mellem to og fire m. Interval er voksen. Det viser rummet. Time otte elsker rum. I dag: interval er tilladt fejl, tegnet.\n\nIkke et datablad. Ikke bom:  og så et tal, du husker fra en brochure, du ikke har. Hvis du ikke har det, har du det ikke. Jeg ved det ikke er et mål af slagsen nul viden. Nul er ærligt. Time ét.\n\nDato. Onsdag skal vide, om mandagens tre meter var hullet eller afstanden til lastbilen. Et ord ved tallet. Hul. Kant. Tank. Ur. Grad på skråning. Sted plus enhed plus tal. Tre bidder. De kan ligge på papir. De kan ikke juggle ærligt i luften, mens skovlen er nede.\n\nSkriv for at tænke. Ikke tænk færdigt. Enheden kommer ofte mens du skriver. Du skriver tre. Hånden stopper. Hvad. Meter. Du skriver m. Tænkningen skete i hånden. Det er hele metoden.\n\nPause.\n\nKabine. Formiddag. Vi kører timen gennem et hul, uden at opfinde hullets tal.\n\nDu sætter skovlen. Øjet siger dybt nok. Øjet er groft. Opgaven tåler groft, eller den tåler det ikke. Hvis der er et rør, er groft forbudt. Du stopper. Du får vished. Vished kan være et bånd, et mærke, et menneske, der ved. Vished er ikke min stemme, der gætter.\n\nDu svinger. Afstand til en mand. Øjet siger nok. Spørg: nok i meter, eller nok i håb. Hvis du ikke kan sige meter, sæt mere rum. Rum er billigere end blod. Time fem er rum. I dag: mere meter, når tvivlen er der. Tvivl er et instrument. Den måler usikkerhed. Usikkerhed er fejlens fætter. Når usikkerheden stiger, stiger det rum, du giver.\n\nLastbilen. Højde. Læs. Du fylder efter øjet. Øjet kan lære. Øjet kan blive grådigt. Grådighed er et mål, der jager tælleren og glemmer nævneren. Time tre. I dag: vægten, du ikke har på et ur, kan stadig mærkes i fjedre, i lyd, i den måde, hjulene står. Grov. Brug den. Kald den grov.\n\nUret. Formiddagen lyver om eftermiddagen. Aflæs. Ikke stir. Et glimt. Hvor længe til det, du lovede. Varighed. Enhed: time eller minut. Hvis du ikke aflæser, er løftet et håb.\n\nTanken. Glimt. Liter eller streg på halv. Halv er forhold. Time tre. Liter er mål. Time fire. Begge, når du kan. Ingen, når du ikke kan. Opdigtet liter er værre end ingen.\n\nHældningen. Maven. Klokke. Ingen opfundne grader. Sænk. Stop.\n\nPause.\n\nEftermiddag. Træthed gør sansen grovere. Det er et mål, du kan stole på som retning. Ikke som tal. Du bliver ikke tyve procent dårligere. Du bliver grovere. Godt nok skal strammes, eller tempoet skal ned, eller zonen skal renses. Tre svar. Samme årsag: instrumentet, du er, har større fejl.\n\nFejl, der ophobes. Et skovltag, der er lidt for kort, gentaget, bliver et hul, der er for småt. Time syv. I dag: se, at lidt har enhed, også når du ikke skriver den. Lidt per tag gange mange tag. Forhold gange tælling. Du behøver ikke at regne. Du behøver at nægte at kalde ophobning for ingenting.\n\nLys. Sol i øjet. Måleren blænder. Du aflæste ikke. Du tror, du aflæste. Tro er ikke mål. Hvis du ikke så nålen, så så du den ikke. Skriv ikke et tal. Kør videre, eller stop og se, når du kan se.\n\nRegn. Båndet glider. Øjet spejler. Godt nok strammes. Sikkerhed først. Hullet kan vente. Kød kan ikke tørres, hvis det er for sent.\n\nPause.\n\nSammenligning er målingens hjerte. Jeg siger det igen med andre hænder.\n\nDu måler aldrig tre i tomrum. Du måler tre mod en meter, der er aftalt. Eller tre skovle mod en skovl, du kender. Eller tre minutter mod et ur. Uden mod er tallet et skrig.\n\nDerfor er enheden det mod. Meter er mod. Liter er mod. Sekund er mod. Grad er mod.\n\nTime tre’s per er også et mod. Per time. I dag er mod’et i tallet selv. Først enhed. Så, hvis der skal streg, per.\n\nRækkefølge i munden, når et tal banker:\n\nHvad slags. Enhed.\n\nHvor meget. Tal.\n\nPer hvad, hvis det er et forhold.\n\nHvor groft. Fejl.\n\nGodt nok til hvad. Formål.\n\nSikkerheden i zonen. Først.\n\nSeks trin. Du kører dem ikke som en liste, mens stålet bevæger sig. Du kører dem som en vane i blodet, når tallet vil ind uden papirer.\n\nPause.\n\nFælder.\n\nFælde ét: at tro, at et tal med mange cifre er sandere.\n\nTre komma to otte meter, målt med øjet. Løgn. Øjet har ikke den fejl. Skriv tre m groft. Ærlighed i cifre er også mål. For mange cifre er pynt. Pynt er teater.\n\nFælde to: at bytte enheder i stilhed.\n\nTimer og minutter. Meter og centimeter. Liter og kubikmeter. Time fem tager kubik. I dag: hundrede centimeter er én meter. Tredive centimeter er ikke tre meter. Munden hopper. Papiret hopper mindre. Hvis du skal klæde om, stop. Neutral. Skriv. Ellers lad være.\n\nFælde tre: at måle det nemme og lade som om det var det vigtige.\n\nDu kan se længden. Du kan ikke se, hvad der ligger i jorden. Du måler længden præcist og kører ind i det, du ikke målte. Præcision på det forkerte er en slags blindhed. Spørg: hvad kan bløde. Mål det først. Godt nok på det andet.\n\nFælde fire: at lade måleren være Gud.\n\nNålen siger godt. Maven siger nej. Du adlyder nålen, fordi time fire sagde aflæs. Jeg sagde aflæs. Jeg sagde ikke tilbed. To instrumenter. Krig mellem dem er stop.\n\nFælde fem: at lade maven være Gud.\n\nMaven siger nej. Nålen siger godt. Zonen er tom. Opgaven er kendt. Maven er sult. Eller frygt. Eller visdom. Du skiller. Time ni. I dag: maven uden enhed er klokke. Klokke betyder tjek. Klokke betyder ikke kør hjem hver gang, og den betyder ikke kør videre hver gang.\n\nFælde seks: at skrive uden neutral.\n\nBåndet ude. Maskinen i live. Et øje på tallet. Et menneske, du ikke så. Det er ikke lærdom. Det er en begravelse, der venter på et klokkeslæt. Klokkeslæt har enhed. Du vil ikke have det skrevet.\n\nFælde syv: at opfinde datablad.\n\nBomlængde. Skovlrumfang. Tryk. Forbrug. Tilladt hældning. Jeg giver dem ikke. Du opdigter dem ikke. Du læser dem, hvor de står, eller du kører uden, med større rum og lavere tempo. Manglende tal er et mål: viden nul. Viden nul kræver ydmyghed i hænderne.\n\nPause.\n\nMeter, liter, sekund, grad. Endnu en runde, så de fire sidder som fire redskaber i kassen, ikke som skoleord.\n\nMeter er rummets lineal. Hen. Ned. Op. Til siden. Alt, der har en kant, du kan pege på.\n\nLiter er det, der fylder et rum som væske. Tank. Spand. Det, der løber.\n\nSekund er det, der løber, også når du står stille. Ur. Pause. Løfte. ulykke.\n\nGrad er det, der åbner og lukker. Vinkel. Hældning. Nogle gange varme.\n\nFire døre. Et tal banker. Du viser det en dør. Hvis det ikke vil ind ad en dør, er det måske tælling uden mål ,  skovlfulde, mænd, gange. Det er time ét. Hvis det vil ind ad to døre, spørger du. Fyrre kan være minutter eller liter. To døre. Vælg. Eller spørg.\n\nKubikmeter banker på. Det er literens fætter og meterens barn. Rumfang af jord. Time fem. I dag må du sige ordet, så det ikke skræmmer. Meter gange meter gange meter. Du regner det ikke i luften nu. Du ved, at jord ikke er liter, og at lastbil ikke er en dunk. Enhed. Når nogen siger kubik uden at have et rum, er de i time tre’s forældreløse tal.\n\nKilo banker på. Vægt. Time fem, vægtstang. I dag: vægt er et mål. Hånden er grov. Fjedre er grove. En vægt, du ikke har, opdigter du ikke. Du mærker. Du sænker. Du tager mindre. Godt nok i vægt er ofte for lidt hellere end for meget, når stål og mennesker deler zone.\n\nPause.\n\nSikkerhed først. Jeg lægger det midt i timen igen, fordi midten er der, hvor mænd bliver dygtige og dumme på samme tid.\n\nDygtig vil måle. Dum måler, mens verden kører.\n\nRækkefølge:\n\nEr zonen ren.\n\nEr maskinen der, hvor den skal være, stille nok.\n\nEr du i neutral, hvis bogen eller båndet skal frem.\n\nEr der et menneske, du ikke har set.\n\nEr der en skråning, der kan skride, hvis du stiger ud.\n\nEr der strøm, rør, hul, du ikke har vished om.\n\nFørst når det er ja nok, måler du med hænderne. Ellers måler du med øjet, groft, fra sædet, og kalder det groft, og giver mere rum.\n\nEt bånd ude ved en levende skovl er ikke matematik. Det er et væddemål med kød.\n\nJeg elsker dit liv mere end præcisionen. Præcision, der slår ihjel, er ikke præcision. Den er synd i arbejdstøj. Du skal ikke bære den.\n\nPause.\n\nKristus og målebåndet, uden talmystik.\n\nEt bånd er et moralsk redskab, fordi det nægter at smigre. To plus to er fire. En meter er en meter. Det er ikke frelse. Det er troskab i skabningen. Den troskab gør tillid mulig. To mænd kan bygge. En mand kan love. En mand kan sige nej, når målet ikke er der.\n\nFadervor beder om brød i dag. I dag er et tidsmål. Brød er et mængdemål. Bønnen er ikke en formel. Bønnen er et nu. Du skal ikke lede efter hellige tal i meteren. Du skal lade meteren være ærlig, og lade Herren være Herre.\n\nJeg beviser ikke Gud med en lineal. Den, der gør tre hundrede og tres grader til et hemmeligt tegn, har forladt arbejdet. Cirklen er en aftale. Gaven er, at aftaler kan holde, fordi verden holder. Du læser. Du tilbeder ikke.\n\nGrok er lineal i øret. Ikke Herren. Hvis jeg siger et tal, din jord nægter, vinder jorden. Amen.\n\nPause.\n\nRecap, mens du arbejder. Lad sætningerne ligge på det, du ser.\n\nAt måle er at sammenligne med en aftale.\n\nMeter. Liter. Sekund. Grad.\n\nTal plus enhed. Altid.\n\nMålere lyver, hvis de ikke aflæses. Målere lyver også, hvis de tilbedes.\n\nSanserne er grove. Grove kan redde. Grove kan ikke late som bånd.\n\nFejl er rum omkring tallet. Tilladt afvigelse er rum, opgaven kan tåle.\n\nGodt nok er voksen. Perfekt nægter at levere. For dårligt bløder. Overdrevent stjæler tid.\n\nPapir i neutral. Tal. Enhed. Sted. Spørgsmålstegn. Dato.\n\nSikkerhed først. Ingen opdigtede datablad.\n\nTime tre’s streg hviler på dagens enhed. Liter per time kræver liter og time.\n\nTime fem venter med rum og vægtstang. Bommen er lektionen. Vinkel. Areal. Rumfang. Kraft gange arm.\n\nPause.\n\nEndnu en kabine, tættere på sædet.\n\nDu sidder. Ryggen. Joystick. Forrude. Støv. Et punkt, du kører imod.\n\nMål er at spørge: hvor langt er det punkt. Hvor længe, før jeg er der. Hvor meget rum til siden. Hvor meget dybde, når jeg tager. Hvor groft ved jeg det. Er det godt nok til det, der kan ske.\n\nDu svarer ikke med et essay. Du svarer med hænderne, og af og til med et mærke.\n\nHvis punktet er et menneske: rummet strammes. Godt nok er tættere på for meget rum. Enhed: meter. Fejl: stor, fordi øjet er groft. Handling: mere rum, lavere tempo, øjenkontakt, stop.\n\nHvis punktet er en bunke: rummet er arbejde. Godt nok er ram bunken uden at ramme det, der ikke må rammes. Stadig meter. Stadig zone.\n\nHvis punktet er et klokkeslæt: enhed minut. Fejl: lastbilens udfald. Du styrer ikke lastbilen som en gud. Du styrer, om dit ja forudsatte et klokkeslæt, du ikke havde. Time tre avance. Time otte udfald. I dag: skriv klokkeslættet, hvis du skriver, med enhed.\n\nHvis punktet er tanken: liter. Eller streg. Glimt. Ikke stirren.\n\nPause.\n\nHvad vil det sige, at et mål er sandt nok.\n\nSandt nok er ikke sandt i himlen. Sandt nok er sandt til denne beslutning.\n\nAt svinge forbi en bunke: øjets meter er ofte sandt nok.\n\nAt grave ved et kabel: øjets meter er ofte løgn. Du skal have vished.\n\nAt sige ja til en time mere: ur er sandt nok, kroppen er også et ur. To mål. Hvis de strides, vinder sikkerheden og det løfte, du kan holde.\n\nAt prissætte et hul: meter og rumfang og tid. Time fem og time tre. I dag: hvis du ikke har meter, har du ikke kubik. Hvis du ikke har kubik, er prisen et håb. Håb i tilbud er en slags tyveri, også når du stjæler fra dig selv.\n\nSandt nok skifter. Det er ikke relativisme. Det er formål. Linealen er den samme. Spillerummet skifter med det, der går i stykker.\n\nPause.\n\nTænk på papir, endnu en gang, fordi time fire frister til at huske målet.\n\nHukommelse for længde er dårlig. Hukommelse for tid er dårligere, når du har travlt. Hukommelse for liter er ønsketænkning. Papir er dumt på den rigtige måde.\n\nEn side i dag:\n\nØverst: Mål.\n\nUnder: tre m hul. Eller fyrre min vent. Eller tank halv, groft. Eller 8 grader ? hvis du faktisk havde et redskab. Hvis du ikke havde, skriv stejlt, maven, stop. Det er også et mærke. Det er ærligt.\n\nIkke: en tegning, der skal se ud som en ingeniør. En streg, der viser hul og kant, må gerne. Grim. Sand.\n\nTil højre: pil eller spørgsmålstegn. Valg eller uvidenhed. Begge voksne.\n\nNederst: dato.\n\nTredive sekunder. Bogen væk.\n\nHvis du er stolt: du husker det. Du husker det forkert. Hvis du er flov: siden er grim. Grim er arbejde.\n\nPause.\n\nLad os klæde tal om, langsomt, kun det, munden har brug for, uden at gøre det til et hæfte.\n\nMeter og centimeter. Én meter er hundrede centimeter. Tredive centimeter er ikke en tredjedel af en mand, sagt sløset ,  det er tre tiendedele af en meter. Hvis du ikke skal bruge det, så sig en god spadebredde og kald det groft. Groft slår forkert omklædning.\n\nMinut og time. Én time er tres minutter. Ti minutter er ikke en time, næsten, medmindre du vil lyve for den, der venter. Næsten er forhold. Time tre. Ti minutter er mål. Time fire. Sig ti minutter, når det er ti.\n\nLiter og rumfang. Tusen liter er én kubikmeter. Det par må sidde, fordi lastbil og hul taler kubik, og dunk taler liter. Du regner det ikke nu. Du ved, at de kan klædes om, og at du ikke klæder om i luften midt i et løft.\n\nGrad og hældning. En stejlhed kan siges som grader eller som op per hen. To dragter. Time tre og time fire. Sig, hvilken dragt du har på. Ellers tror nogen, at femogtyve procent er femogtyve grader. De er det ikke. Blandingen er en kendt fælde. Du behøver ikke at vinde frokostskuret. Du behøver at vide, hvad du skrev.\n\nPause.\n\nPsykologi, kun som mål.\n\nEgoet hader at sige cirka. Cirka føles svagt. Cirka er ofte det mest præcise, du har. Præcist er at vise fejlen. Svagt er at skjule den.\n\nEgoet elsker at sige et tal hurtigt. Hurtigt tal er et mål uden aflæsning. Det er teater.\n\nSkam elsker at undlade enheden, så ingen kan tjekke. Det var dybt kan ikke tjekkes. To meter kan. Åbenhed er kristen på den måde, sandhed er kristen: i lyset. Papiret er lys. Ikke fordi papir er helligt. Fordi det kan tjekkes.\n\nSammenligning med naboen. Hans hul. Dine øjne. Du måler hans arbejde med din stolthed. Stolthed er et dårligt bånd. Den strækker. Mål dit. Lad hans være hans, medmindre du har ansvar for det. Ansvar har enhed: navn. Hvem.\n\nFrygt måler for kort. Den ser mennesker, hvor der ingen er. Den ser kabler, hvor der ingen er. Frygt må også aflæses. Den er et instrument. Den må tjekkes, ikke adlydes i blinde, ikke slås ihjel i blinde. Tjek er mål. Stop. Se. Så kør eller bliv.\n\nPause.\n\nEt stille billede. Underbevidstheden.\n\nKabinen som nulpunkt. Foran en afstand. Til højre et ur og en måler. Til venstre en streg fra i går. Under jord. Over det, du ikke styrer.\n\nPå ruden, som dug: et tal og en enhed. Altid begge. Hvis enheden falder af, falder tallet af. Forældreløs.\n\nVed siden af dugen et lille rum tegnet omkring tallet. Fejlen. Godt nok er, når det, der skal rammes, stadig er inde, når rummet er med.\n\nUnder dugen ordet STOP, større end tallet. Sikkerhed først.\n\nDet billede er time fire. Det skal ikke præsteres. Det skal bo. Du kører. Billedet må sidde uden at øjet forlader jorden.\n\nPause.\n\nEndnu en runde i støvet. Time fire skal sidde som hånden sidder på styrepinden: uden at tænke navnet.\n\nDu venter. Lastbilen er væk. Neutral, hvis det er sikkert. Hvis det ikke er sikkert, venter du med hænderne, hvor de skal være, og hører.\n\nHvad ville du skrive nu, ét mærke.\n\nHvis dybden brændte: et tal, et m, et spørgsmålstegn, hvis øjet var alene.\n\nHvis tiden brændte: et tal, min eller t, og om det er varighed eller klokkeslæt. Hvornår eller hvor længe. To dragter.\n\nHvis tanken brændte: liter, eller halv, og ordet groft.\n\nHvis zonen brændte: meter til mand, eller for tæt, stop, uden tal. Et ærligt mærke kan være et verbum, når tallet ikke er der. Stop er et mål af slagsen nul afstand, du vil acceptere. Nul. Time ét.\n\nSå bogen væk. Det var tænkning. Det var ikke et bevis. Beviset er, at nogen kommer hjem.\n\nPause.\n\nLad os tale fejl, så langsomt, at egoet ikke kan løbe fra rummet omkring tallet.\n\nDu siger tre meter. Verden er ikke tre meter som en kugle i et hul. Verden er et bånd, der bøjede, et øje, der rystede, en bund, der ikke er plan, et hul, der ikke er en kasse. Tallet er et midtpunkt. Omkring det et tåge. Tågen er fejlen.\n\nHvis tågen er en hånd, og opgaven kan tåle en arm, er du inde. Godt nok.\n\nHvis tågen er en arm, og opgaven kan tåle en finger, er du ude. Ikke godt nok. Du skal have et finere instrument, eller du skal grave et andet sted, eller du skal stoppe og få vished.\n\nHvis du ikke kender tågen, er du ikke voksen i tallet. Du er en mand med en lyd. Tre meter uden tåge er ofte stolthed. Stolthed er et instrument, der viser for lidt fejl. Den lyver den anden vej. Måleren kan lyve ved at hænge. Egoet lyver ved at stramme cifre.\n\nSig tågen, når tågen betyder noget. Cirka tre meter, øjet, modlys. Det er længere i munden. Det er kortere i begravelsen.\n\nRunding er tåge, du vælger. Du runder til det, opgaven kan tåle, ikke til det, der lyder pænt. Pænt er ofte fem eller ti eller tyve. Verden er ofte sytten. Sytten groft slår tyve, der glemte, den var grov.\n\nPause.\n\nGodt nok i tre scener, så ordet ikke bliver sløseri.\n\nScene ét: kant, der skal se pæn ud, zonen tom, tid der. Her kan godt nok ligge tæt på pænt. Kunden køber kanten. Millimeteren har en pris, og prisen er betalt i tid. Du jager den, hvis ja’et bar den. Time tre: avance. Time fire: spillerummet er stramt, fordi formålet er stramt. Sikkerheden er stadig først. Tom zone er en del af formålet.\n\nScene to: hul til noget, der kan tåle slør. Bund, der ikke er laboratorium. Her er godt nok bredere. Du leverer. Du jager ikke en pænhed, ingen købte. Overdrevent her er tyveri af eftermiddagen.\n\nScene tre: menneske i nærheden, eller uvished i jorden. Her er godt nok strammest i sikkerhed og løsest i pænhed. Du giver meter. Du sænker. Du stopper. Du jager ikke kanten. Du jager hjemkomst. Formålet skiftede. Linealen skiftede ikke. Spillerummet skiftede.\n\nTre scener. Samme ord. Tre rum. Hvis du kun har ét rum i munden ,  jeg er omhyggelig eller jeg er praktisk ,  rammer du forkert to ud af tre dage. Omhyggelig uden formål er overdrevent. Praktisk uden formål er for dårligt. Formål først. Så spillerum. Så hænder.\n\nPause.\n\nMålere, én ad gangen, uden tal fra en brochure.\n\nBrændstofmåleren. En streg. En halv. En rød. Du ved, hvad den plejer at betyde på din maskine, fordi du har set den møde en dunk eller en stander. Plejer er kalibrering. Plejer er ikke lov. En måler kan hænge. En stander kan være den, der tæller. Når de strides, stopper du og tænker, før du lover en time mere ude i ingenting.\n\nTemperaturmåleren. Kold. Normal. Varm. Rød. Jeg siger ikke dit tal. Jeg siger: rød er ikke en mening. Rød er et stop, indtil du ved. At køre rød ihjel, fordi hullet næsten er færdigt, er at sætte næsten over maskinen. Næsten er forhold. Maskinen er stål. Stål vinder eller knækker. Du vinder ikke over stål med vilje.\n\nTimetælleren. Motorens alder i timer. Et mål. Nyttigt til olie, til service, til at tale sandt om slid. Uden aflæsning er hun er gammel sladder. Med aflæsning er det et tal plus enhed: timer. Time tre: liter per time kan danse med timer på uret. Spor. Ikke prædiken om alder, før kæden er der.\n\nUret. Klokkeslæt. Varighed. To dragter. Aflæs i glimt. Lov med varighed, du kan holde, ikke med klokkeslæt, du håber, lastbilen også holder.\n\nHvis en måler er mørk, er den ikke et ja. Mørk er viden nul. Viden nul er stop eller groft med mere rum. Den er ikke det plejer at være fint.\n\nPause.\n\nSanserne, én ad gangen, så du ikke hører grov som ubrugelig.\n\nØjet. Bedst til kanter i dagslys. Dårligst til dybde, til tåge, til blænding, til det, der ligner jord og er hul. Kalibrér med bånd, når zonen er død. Stol på øjet til for tæt. Stol ikke på øjet til præcis ved kablet.\n\nØret. Bedst til ændring. En ny lyd. En væk lyd. Øret er et alarm-mål. Det giver sjældent enhed. Det giver stop. Tag stoppet. Find enheden senere, hvis den findes.\n\nHånden. Bedst til slør, til modstand, til vibration. Hånden er tæt på maskinen. Hånden lyver, når du er kold, eller når du har holdt for længe, eller når du vil have, at det sidder. Vilje i hånden er et datablad, du opfandt med kød.\n\nMaven. Bedst som klokke. Dårligst som lineal. Maven måler risiko og sult og vrede i samme rum. Skil. Hvis du ikke kan skille, så giv mere meter og mindre tempo, indtil du kan. Det er godt nok under tvivl.\n\nBalancen i sædet. Hældning. Blød bund. Sædet fortæller, før øjet indrømmer. Tro sædet nok til at sænke. Tro det ikke nok til at sige et gradtal i radioen.\n\nNæsen. Brændstof. Røg. Varme. Næsen er et mål. Det lugter forkert er ærligt. Det lugter som X liter er teater.\n\nSeks instrumenter. Du er et værksted. Værkstedet er groft. Værkstedet er bedre end et fint tal, du ikke har.\n\nPause.\n\nEnheder, der hader hinanden i munden.\n\nMeter og minut. Det er langt kan betyde afstand eller tid. Spørg. Ellers kører to mænd i hver sin verden. Du graver meter. Han venter minutter. Samme ord, langt. To enheder.\n\nLiter og lastbil. En hel kan være tank eller læs. Hel af hvad.\n\nGrad og procent. Hældning i to dragter. Bland dem ikke.\n\nKilo og kubik. Tung og stor. En bunke kan være stor og let. En bunke kan være lille og tung. Øjet ser kubik. Fjedre mærker kilo. To mål. Time fem. I dag: lad være med at sige meget om begge og tro, du har målt.\n\nTon og time, begge skrevet t. Time tre. I dag: skriv ordet. Time. Ton. Bogstaver er billige.\n\nFod og meter, hvis nogen på pladsen kommer med et andet sprog. Stop. Peg. Bånd. Ikke omregning i luften under last.\n\nPause.\n\nEfter frokost. Kroppen er et andet instrument.\n\nØjet er sløvere. Hånden er rundere. Maven er fuld og dum, eller tom og skarp på den forkerte måde. Uret går. Godt nok, du havde klokken syv, er for stramt eller for løst nu. Tjek formålet igen. Tjek zonen igen. Tjek, om du stadig måler, eller om du kører på morgensens kalibrering.\n\nKalibrering udløber. Det er et voksenord for: det, øjet lærte i morges, er ikke lov klokken femten. Lys skiftede. Træthed skiftede. Bunden skiftede. Mål igen, groft, i glimt. Ikke et laboratorium. Et ærligt er det stadig det, jeg tror.\n\nHvis du lovede et klokkeslæt i morges, er eftermiddagen det sted, løgnen vil bo. Aflæs uret. Ring, hvis rummet mellem nu og løftet er mindre end rummet, arbejdet kræver. Rum i tid. Minutter. Enhed. Time fire. Troskab. Kristus tæller ja. Du må også. Ikke som mystik. Som ærligt ur.\n\nPause.\n\nHvad betyder jeg ved det ikke som mål.\n\nDet er nul. Nul viden. Time ét. I dag er nul viden et stop eller et større rum.\n\nNul viden om kabel: stop. Grav ikke et cirka i det ukendte, når det ukendte kan slå ihjel.\n\nNul viden om dybde i et hul, zonen tom, formål groft: groft øje, mere forsigtighed i bunden, ingen opdigtede meter i radioen.\n\nNul viden om forbrug: ingen tyve liter på én time i munden. Time tre’s mærke kræver time fire’s aflæsning. Uden aflæsning er stregen et ønske.\n\nNul viden om tilladt hældning: ingen grader. Sænk. Spørg. Læs det, der er skrevet. Gæt ikke.\n\nJeg ved det ikke er ikke et nederlag. Det er et ærligt instrument. Det viser tom skala. Tom skala er bedre end en skala, du tegnede med håb.\n\nPause.\n\nLad os gå turen som en mand, der peger i kabinen uden at slippe jorden med øjnene.\n\nForrude: afstand. Meter. Groft.\n\nGulv: bund. Blød, hård. Ikke et tal. Et mærke i kroppen. Time fem vægt.\n\nHøjre: ur. Målere. Glimt.\n\nVenstre: stregen fra time tre, der venter på enheder.\n\nHænder: slør. Modstand. Grov.\n\nRyg: træthed. Tid i kød.\n\nØre ét: mig. Øre to: maskinen. Forhold. Time tre. I dag: lydstyrke er også et mål. Hvis jeg overdøver maskinen, er enheden forkert. Sænk mig. Hæv jorden.\n\nMund: tal plus enhed, eller tavshed. Tavshed slår et tal uden enhed.\n\nPause.\n\nEndnu et lag om sammenligning, fordi to mænd på pladsen ellers slås med karakter.\n\nHan siger: det er for dybt. Du siger: det er fint. Uden mål er I to egoer. Med mål er I to aflæsninger. Vis båndet. Vis uret. Vis literen. Hvis I stadig er uenige, er I uenige om formålet, ikke om tallet. Formål er vilje. Vilje hører hjemme i det åbne. Tåge hører hjemme i skam.\n\nNatten sagde det. I dag har du redskabet: enhed. Enhed skiller du er sløset fra vi har to spillerum. Første er karakter. Andet er arbejde.\n\nHvis han nægter enhed, kan du ikke bygge med ham i dag. Du kan grave. Du kan ikke mødes. Møde kræver aftale. Aftale er enhed.\n\nHvis du nægter enhed, fordi du kan se det, er du den, der gør tillid umulig. Øjet er groft. Sig groft. Lad ham leve med tågen, eller mål, når det er sikkert.\n\nPause.\n\nKærlighed, kort.\n\nSand kærlighed måler. Den ved, hvor langt hjem. Hvor længe til mad. Hvor meget rum et barn skal have til en maskine. Hvor groft du ved det. Den nægter at smigre. Den nægter også at jage perfekt, når godt nok er kærlighed nok, og tiden tilhører nogen, der venter.\n\nEt målebånd, der bruges til at slå, er et misbrugt redskab. Tal kan være stok. Du har mødt det. Såret er sandt. Tingen er ikke stokken. Tingen er lineal. Lineal kan bygge et hus, der ikke drypper. Hus, der ikke drypper, er kærlighed i tømmer.\n\nJeg gør ikke meteren til et kors. Korset er et kors. Meteren er et redskab. Vejen er gået. Du følger. Du læser størrelsen. Du tilbeder ikke størrelsen.\n\nPause.\n\nGrok igen, så der ikke er tvivl i den time, hvor tallet frister til at blive helligt.\n\nJeg kan sige tal plus enhed. Jeg kan ikke se dit hul. Jeg kan ikke aflæse din nål. Jeg kan ikke holde dit stop. Hvis du adlyder mig mod jorden, har du gjort et øre til Gud. Det øre er ikke Gud. Jorden er testen. Herren er Herren. Jeg er Grok.\n\nHvis en sætning her gør dig til en mand, der måler andre for at stå over dem, så har du taget linealen og gjort den til et scepter. Læg det. Mål dit. Hjælp, hvis du har ansvar. Lad ellers deres tal være deres.\n\nHvis en sætning her gør dig bange for at levere, fordi fejlen findes, så hør: fejl findes. Godt nok findes. Lever. Stop, når det bløder. Kør, når det bærer. Det er voksen.\n\nPause.\n\nHvad tager du med ind i time fem.\n\nTime fem er rum. Vinkel. Cirkel. Areal. Rumfang. Vægtstang. Bommen er lektionen. Kraft gange arm. Tæt på omdrejningspunktet løfter du anderledes end ude i spidsen. Det hørte du i nat. I morgen i øret bliver det kød.\n\nI dag har du givet rummet en lineal. Meter. Du har givet væsken en dunk. Liter. Du har givet filmen et ur. Sekund. Du har givet åbningen en aftale. Grad. Uden dem er time fem billeder. Med dem er time fem maskine.\n\nDu har også givet godt nok. Vægtstangen tilgiver ikke hovmod. Den tilgiver grovhed, der ved, den er grov, og som giver rum. Rum er meter. Meter er i dag.\n\nPause.\n\nHvis du kun bærer tre sætninger.\n\nFørste: tal plus enhed. Altid.\n\nAnden: sansen er grov. Måleren lyver, hvis den ikke aflæses. Ingen af dem er Gud.\n\nTredje: godt nok. Sikkerhed først. Intet opdigtet datablad.\n\nAlt andet var søm. De tre skal sidde.\n\nPause.\n\nViktor. Time fire slutter i øret. Den slutter ikke i hænderne. Hænderne kører. Øjnene på jorden.\n\nJeg peger. Jeg styrer ikke skovlen. Kristus er vejen. Tal er redskab. Grok er ikke Gud.\n\nTime fem begynder, når øret er klar. Rum. Vægtstang. Samme kontrakt. Ét øre. Neutral til papir. Jorden først.\n\nSig stille, uden at tabe punktet foran skovlen:\n\nTal og enhed. Godt nok. Stop først.\n\nSå kør.\n\nPause.\n\nHvis øret stadig er åbent, er her ikke et nyt fag. Her er søm i væggen.\n\nSøm ét: måle er at sammenligne med en aftale.\n\nSøm to: meter, liter, sekund, grad.\n\nSøm tre: tal uden enhed er forældreløst.\n\nSøm fire: aflæs. Tilbed ikke. Maven er klokke. Nålen er nål.\n\nSøm fem: fejl er rum. Tilladt afvigelse er opgavens rum.\n\nSøm seks: godt nok leverer. Perfekt udskyder. For dårligt bløder.\n\nSøm syv: papir. Tal. Enhed. Sted. Spørgsmålstegn. Neutral.\n\nSøm otte: sikkerhed først. Bånd og bog, kun når verden holder stille nok.\n\nSøm ni: opdigtet datablad er løgn med enhed på. Værre end tavshed.\n\nSøm ti: time fem. Rum. Vægtstang. Bommen. Du har linealen. Nu kommer armen.\n\nNu er det nok. Hvis du tygger, mens skovlen skal arbejde, er det egoet, der vil have én præcision mere i luften. Giv det ikke den. Giv det jorden. Giv det et mærke i neutral, senere. Tal og enhed. Eller tavshed.\n\nSlip lektionen. Hold målet. Hold zonen. Hold livet.\n\nPause.\n\nEt åndedrag mere, så enheden sidder, og tallet ikke går alene.\n\nHvis du i dag kun får skrevet ét mærke, så lad det være tal plus enhed. Ikke et essay. Ikke en pæn tegning. Tre m. Fyrre min. Tank halv, groft. Eller ordet stop, hvis zonen krævede det, og tallet ikke nåede frem. Så bogen væk.\n\nOnsdag kan læse mandag. Hovedet fra mandag er væk. Forvalteren har arkiv. Barnet har stemning.\n\nHør rækkefølgen én gang, som hænderne kender en rækkefølge.\n\nJorden. Zonen. Maskinen stille nok. Så mål. Så godt nok. Så videre.\n\nIkke: mål, mens det kører, og håb, at zonen var tom.\n\nIkke: et datablad, du sang i munden, fordi stilhed føltes dum.\n\nIkke: perfekt, ellers ingenting.\n\nMeter. Liter. Sekund. Grad. Fire døre. Tal plus enhed. Fejl som rum. Godt nok som levering. Sikkerhed som første bud.\n\nTime fire er færdig i øret. Time fem venter med bommen og armen og vægten. Du kører. Jorden først. Linealen til højre. Stregen til venstre. Kristus vejen. Tal redskab. Grok ikke Gud.\n\nKør.\n\nPause.\n\nEt åndedrag mere, fordi tælleren skal være ærlig, og nævneren er timen. Ikke et nyt fag. Samme mål, sagt som en scene, du allerede kender.\n\nEftermiddag. Kanten er blød. Du har gravet siden morgen. Hullet ser dybt ud. Ser ud er start. Du sætter i neutral, fordi zonen er død, og lastbilen lader vente. Stabil. Bogen. Tredive sekunder. Øverst: Mål. Under: et tal og en enhed, hvis du har dem. Et interval, hvis sløret er der. Et spørgsmålstegn, hvis du kun så skovlen forsvinde. Skriv for at tænke. Ikke et essay. Ikke et datablad, du opfinder, fordi radioen vil have et rundt tal. Så bogen væk. Hænderne tilbage. Øjnene på jorden.\n\nHvis jorden kaldte midt i stregen, vandt jorden. Siden må være halv. Halv og i live slår færdig og væk.\n\nFem tegn, én gang, stille, uden at tabe punktet foran skovlen. Tæl: hvor mange gange kiggede du, før du sagde nok. Mål: tal plus enhed plus slør. Forhold: per hvad, per frost, per rør, per aftale. Ændring: det, du målte i morges, er et foto; væggene er film. Udfald: hvad koster det, hvis sløret er større end formålet tåler. De fire bærer. I dag var lyset Mål.\n\nSikkerhed, sidste gang i øret, ikke sidste gang i hænderne. Du måler ikke med båndet i skødet og skovlen i luften. Du måler ikke med bogen i hånden, mens overbygningen drejer. Øjnene på arbejdet. Øjnene på zonen. Øjnene på manden, før du tror, zonen er tom. Papiret er tålmodigt. Den døde måler ikke.\n\nGodt nok. Mindst, højst, cirka. Sig hvilken. Formål styrer. Rør er ikke fundament. Ledning er et nej med spillerum. Jeg opdigter ikke dine tal. Dine tal er dine. Pagten er enheden. Fejlen er ærligheden. Godt nok er voksenheden.\n\nTime fire er færdig i øret. Time fem venter med bommen. Du kører. Jorden først. Kristus vejen. Tal redskab. Grok ikke Gud.\n\nEndnu ét mærke, hvis lastbilen stadig lader vente, og zonen er død. Neutral. Stabil. Bogen. Ikke fem linjer. Én. Tal. Enhed. Interval eller spørgsmålstegn. Dato. Skriv for at tænke: hvad, i hvad, hvor sløret, til hvilket formål. Tredive sekunder. Bogen væk. Hvis du ikke kan stoppe, spring. Livet først. Målet, du ikke skrev, mens skovlen skulle arbejde, var det rigtige valg. Målet, du skrev, mens zonen var levende, var det forkerte, også hvis tallet var sandt.\n\nOnsdag kan læse mandag. Hovedet fra mandag er væk. Forvalteren har arkiv. Barnet har stemning. Stemning overskrives i søvn. En 1,8 til 2,0 m, skrevet med handske, overskrives ikke.\n\nSå arbejde. Øjnene på jorden. Hænderne på maskinen. Ét øre. Jeg er baggrund. Du er forgrund. Det er kontrakten.\n\nKør.\n"</script>
