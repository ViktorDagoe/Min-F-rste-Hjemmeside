<script id="payload" type="application/json">"Viktor. Time ni. Øjnene på jorden. Hænderne på maskinen. Ét øre. Den kontrakt har holdt siden fem i morges, og den holder nu. Hvis jorden kalder, vinder jorden. Lyden kan vente. Papiret kan vente. Den døde kan ikke tænke på papir.\n\nDu har talt. Du har handlet med tal. Du har sat forhold på. Du har målt. Du har været i rummet med bommen. Du har set input og output. Du har set ændring og ophobning. Du har vejet udfald. Nu kommer det, de fem tegn bliver til, når de får lov at køre i ring: systemer.\n\nIkke et fint ord. Ikke et kontorord. Et system er det, der sker, når noget, du gør, kommer tilbage og rammer det næste, du gør. Når output bliver input. Når i går betaler sig i dag, eller straffer i dag. Når folk, løn og vaner ikke er tre separate historier, men tre rum i samme hus.\n\nJeg er Grok. Jeg er din AI. Jeg er ikke Kristus. Jeg taler ikke for Gud. Jeg peger. Det, der er sandt i denne time, tilhører skabningen og dens Herre. Det, der er skævt, er mit. Test det med jorden. Jorden lyver ikke.\n\nI nat sagde vi: småt plus tid er ikke småt. I time syv så du ophobning. I time otte vejede du udfald. I dag samler vi det. En løkke. Et plus eller et minus. En tilskyndelse. Et humør, der gerne vil være dommer, og et mål, der nægter at smigre. Verden i simpel matematik ,  uden hemmelige rum, uden at du skal tro, at du sidder med et rat til hele byen.\n\nDu sidder med en skovl. Det er nok. Det er det rigtige sted at lære systemer.\n\nPause.\n\nHør først, hvad et system ikke er.\n\nDet er ikke alt hænger sammen, sagt som røg. Røg kan ikke graves. Røg kan ikke rettes. Mænd, der siger det er komplekst og stopper der, har ofte bare ikke talt.\n\nEt system er dele, der påvirker hinanden, så resultatet kommer tilbage. Tre sten i en bunke er ikke et system. Tre sten, en skovl, en lastbil og et ur kan være et system, fordi bunken ændrer, hvor lastbilen holder, og lastbilen ændrer, hvor hurtigt bunken falder, og uret ændrer, om I når det, og om I når det ændrer, om I skynder jer, og om I skynder jer ændrer, om I laver fejl, og fejl ændrer, om I når det. Der er ringen. Der er systemet.\n\nGeden er et system. Motor. Pumpe. Slange. Cylinder. Arm. Skovl. Dig. Jord. Diesel ind. Varme ud. Hvis en slange sveder, ændrer olien sig. Hvis olien ændrer sig, ændrer varmen sig. Hvis varmen ændrer sig, ændrer slangen sig. Det er ikke poesi. Det er en kreds.\n\nDu er et system. Mad. Søvn. Humør. Hånd. Øje. Vaner. Det, du belønner i aften, er input til i morgen. Det er ikke magi. Det er den samme grammatik som olien.\n\nEt sjak er et system. Hvem kommer. Hvem rydder. Hvem siger ja og leverer nej. Hvem bliver set. Hvem bliver betalt for hvad. Hvis nej ikke koster, kommer der flere nej. Det sagde vi i nat. I dag graver vi det.\n\nSkakmat. Du har levet i systemer hele dit liv. Du kaldte det sådan er det bare. Matematikken kalder det løkker. Når du kan tegne løkken, kan du vælge et andet sted at sætte hånden. Ikke fordi du styrer verden. Fordi du kan se, hvor din hånd faktisk sidder.\n\nPause.\n\nTegn en løkke i luften. Bare med blikket, mens øjnene stadig er på jorden. En cirkel. En pil, der går rundt.\n\nNoget sker. Det, der sker, ændrer det næste. Det næste ændrer det første. Rundt.\n\nTo slags pile. Plus og minus. Ikke moral. Tegn.\n\nPlus betyder: mere giver mere. Eller mindre giver mindre. Samme retning. Forstærkning. En bold, der ruller nedad, ruller hurtigere. En vane, der belønnes, kommer oftere. En lækage, der varmer, lækker mere. En tillid, der holdes, får mere at bære, og det, der bærer, kan holde mere.\n\nMinus betyder: mere giver mindre. Modsat retning. Balance. Du spiser, sulten falder. Motoren går for højt, regulatoren tager af. Hullet bliver dybt nok, du stopper. Kontoen er tynd, du køber mindre. Kroppen er varm, du sveder, du køler. Verden er fuld af minus-løkker. De holder ting i live. Uden dem kører plus alene, og plus alene er brand eller eksplosion eller en mand, der ikke kan stoppe.\n\nSig det grimt og sandt: plus-løkke bygger eller ødelægger, alt efter hvad der kører rundt. Minus-løkke holder eller kvæler, alt efter om den er sat rigtigt. Ingen af dem er gode som en prædiken. De er vejr i maskinen. Du læser dem. Du tilbeder dem ikke.\n\nI nat var brintatomet fem tegn. I dag er det også en løkke. Kernen trækker. Elektronet er tættere oftere. Hvis det er længere ude, er trækket svagere. Hvis det falder ind, ændrer energien sig. Atomet holder, fordi der er en pagt i kræfterne ,  ikke fordi atomet beslutter at være pænt. Du skal ikke styre atomer. Du skal se, at det, der holder, ofte er en minus-løkke: for meget den ene vej, så trækker verden den anden vej. Liv er fuldt af det. Hydraulik er fuldt af det. Et ægteskab, der virker, er fuldt af det: noget bliver for skævt, nogen siger det, det rettes, før det bliver en plus-løkke af tavshed.\n\nHold billedet. Cirkel. Pil. Plus eller minus. Navn på det, der kører. Det er hele timens papir i ét greb. Vi fylder det om lidt. Først skal du mærke løkker i geden, så ordet ikke bliver skole.\n\nPause.\n\nPlus-løkke i stål.\n\nEn slange sveder. Lidt. Du ser det. Eller du ser det ikke. Olien, der skulle bære tryk, er lidt mindre. Pumpen arbejder lidt hårdere. Varmen stiger lidt. Gummi og pakning kan lide varme dårligt. Sveden bliver til dryp. Dryp bliver til pøl. Pøl bliver til slange, der giver op midt i et løft. Det begyndte som småt. Småt plus tid plus varme. Plus-løkke.\n\nHvad kunne have brudt den? Et minus. Et eftersyn. Et stop. En slange skiftet, mens det stadig var sved. Minus-løkken er vedligehold: mere slid → mere pleje → mindre slid. Når minus-løkken sover, vågner plus-løkken. Det er ikke uheld. Det er tegn.\n\nPlus-løkke i hænderne.\n\nDu tager en pause, der er ærlig. Vand. Mad. Skuldre ned. Næste time er renere. Renere time giver færre fejl. Færre fejl giver mindre haste. Mindre haste giver plads til næste ærlig pause. Plus, den gode vej.\n\nEller den anden vej, samme tegn, andet indhold. Du skipper pausen. Du bliver skarp i stemmen. Skarp stemme giver sjusk hos den, der venter på lastbilen. Sjusk giver omarbejde. Omarbejde stjæler den pause, du alligevel skulle have taget. Plus, den dårlige vej. Samme matematik. Andet brændstof i løkken.\n\nPlus-løkke i tillid.\n\nDu siger: jeg er der klokken syv. Du er der klokken syv. Den anden planlægger efter det. Planen holder. Han giver dig næste opgave, der kræver, at nogen holder. Du holder igen. Tilliden tykkere. Ansvaret større. Det er plus. Det kan bære et hus.\n\nEller: du siger syv. Du kommer kvart over. Engang. Det var trafik. Næste gang planlægger han slæk. Slæk bliver til sløseri i begge ender. Han ringer tre gange. Du bliver træt af at blive ringet til. Du kommer endnu løsere. Plus. Tillid, der løber ud, er også rentes rente. Bare med minus i værdien og plus i farten, den løber ud med.\n\nSkakmat. Plus er ikke positiv tænkning. Plus er forstærkning. Du skal spørge: hvad forstærkes? Ikke: føles det rart?\n\nPause.\n\nMinus-løkke i geden.\n\nDu graver. Hullet bliver dybere. Du kigger. Dybt nok. Du stopper. Mere dybde → stop → ikke mere dybde. Balance. Uden den graver du i Kina og kalder det flid.\n\nTermostaten i motoren. For varmt → mere køling → mindre varmt. Minus. Hvis termostaten hænger, får du en plus-løkke, du ikke bad om: varmere → endnu varmere.\n\nSult. Du spiser. Sulten falder. Minus. Hvis du spiser af kedsomhed, er sult-løkken ikke den, der kører. Så kører en anden: kedsomhed → mad → kort ro → mere kedsomhed, når roen er væk. Forkert løkke navngivet. Psykologi er ofte det: at give den forkerte cirkel det rigtige navn.\n\nPenge i det små. Kontoen er tynd. Du køber mindre. Kontoen får lov at ånde. Minus, den voksne. Eller: kontoen er tynd, du bliver bange, du køber noget, der skal få angsten til at tie, kontoen bliver tyndere, angsten tykkere. Plus. Samme konto. To forskellige pile. Timen her er at se pilen, før du kalder det jeg er bare sådan.\n\nEn kø. Lastbiler skal tage jord. Hvis de kommer for langsomt, vokser bunken. Hvis bunken vokser, tager det længere at læsse, når de kommer, fordi du skal flytte dig udenom, og pladsen er trang. Længere læssetid gør køen længere. Plus, gemt i en minus, du troede var bare ventetid. Voksen træk: se, om du kan bryde den ,  anden stak, andet sted at holde, et opkald, der siger kom nu, eller jeg stopper med at fylde. Det er ikke at styre markedet. Det er at læse den løkke, du står i.\n\nPause.\n\nForsinkelse.\n\nDet er den del, der gør mænd til løgnere over for sig selv.\n\nLøkken er der. Men den svarer ikke med det samme. Du skipper smøring i dag. Maskinen kører. Du konkluderer: det var fint. Tre uger senere er det ikke fint. Hjernen binder ikke onsdag i marts til mandag i april. Papiret kan. Hovedet vil have årsag og virkning i samme minut, som en skovl, der tager jord nu.\n\nDu skælder ud. Pladsen bliver stille. Du konkluderer: nu kører det. En uge senere er der tavshed og skjult sjusk. Forsinkelsen løj for dig. Du belønnede frygt og kaldte det orden.\n\nDu træner en vane. Første uge føles det som ingenting. Du konkluderer: det virker ikke. Tredje uge er hånden anderledes. Forsinkelsen løj den anden vej. Du var ved at slukke en plus-løkke, der endnu ikke havde fået lov at synes.\n\nSkakmat. I systemer er hvordan går det? et barns spørgsmål, hvis det er en løkke med forsinkelse. Det voksne spørgsmål er: hvilken vej kører den, og hvor lang er forsinkelsen, og hvad måler jeg, der ikke smigrer?\n\nI time syv var hældning film, ikke foto. Her er det samme. Et system er en film, der kører i ring. Et foto af ringen er et øjeblik. Øjeblikket kan være sandt og alligevel lyve om næste scene.\n\nPause.\n\nTænk på papir. Neutral. Stabil. Bogen. Tredive sekunder. Ikke nu, hvis skovlen er i jorden. Når der er et vindue.\n\nTegn en cirkel. En pil rundt. Ved pilen et plus eller et minus. Skriv ét ord i midten. Ikke et essay. Et navn.\n\nSved. Pause. Tillid. Kø. Smøring. Humør efter frokost. Hvad der kører i dit hus i dag.\n\nHvis du ikke ved, om det er plus eller minus, skriv et spørgsmålstegn ved pilen. Spørgsmålstegnet er voksen. At gætte plus, fordi plus lyder rart, er barn.\n\nSå bogen væk. Hænderne tilbage. Øjnene på jorden. Det mærke er timens første søm. Vi slår flere.\n\nPause.\n\nRenter. Småt plus tid.\n\nSkolen sagde rentes rente og tegnede en konto, du ikke havde. Så blev det et fremmed land. Det er ikke et fremmed land. Det er ophobning med et fortegn og en takt.\n\nDu har hundrede kroner. Ti procent på et år. Hundrede og ti. Det er ikke spændende. Det er plus ti.\n\nNæste år: ti procent af hundrede og ti. Ikke af hundrede. Elleve. Nu har du hundrede og enogtyve. Det ekstra ene er renten af renten. Småt. Et år er småt. Ti år er ikke småt. Tiden er den anden faktor. Uden tid er ti procent et gebyr. Med tid er ti procent en skråning.\n\nJeg giver dig ikke en formel at recitere i kabinen. Jeg giver dig øjet: hvad er det små, og hvor længe får det lov?\n\nHvis du hver uge lægger lidt til siden, og det får lov at blive, er det plus-løkke med tålmodighed. Hvis du hver uge tager det små ud, fordi det alligevel ikke er noget, har du slået tiden ihjel. Tiden var den store faktor. Du fyrede den.\n\nJeg er ikke din bankmand. Jeg sælger dig ikke en drøm om, at ét procent om dagen gør dig til konge. Mænd, der sælger den drøm, glemmer gebyrer, glemmer dage, der ikke betaler, glemmer at livet koster diesel. Ærligheden er mindre og hårdere: småt, der får lov, vokser. Småt, der får lov den forkerte vej, vokser også. Rust. Gæld. Sjusk. Skam. Samme matematik. Andet navn i midten af cirklen.\n\nGæld er renter med retning minus for dig og plus for det, du skylder. Hvis du kun betaler det små, og resten får lov at sidde, sidder resten og avler. Det er derfor, jeg betaler lidt kan føles som dyd og alligevel være en plus-løkke, du ikke ejer. Voksen træk: se, om det små æder det, der avler, eller kun æder det, der føles. Følelsen vil gerne betale det synlige. Matematikken vil gerne betale det, der formerer sig.\n\nHold det uden skam-show. Skam er en dårlig måler. Tal med enhed er en bedre. Hvad koster det per måned. Hvad avler. Hvad æder avlen. Papir. Neutral. Grimt. Sandt.\n\nPause.\n\nVaner er renter i kød.\n\nEn vane er et lille input, gentaget, med forsinkelse i output. Første cigaret ændrer ikke et liv i et foto. Første ærlig nattesøvn ændrer ikke et liv i et foto. Film. Ring. Plus.\n\nDu belønner telefonen om aftenen med ro i tre minutter. Hjernen lærer: uro → skærm → kort ro. Næste uro kommer hurtigere, fordi du har trænet den vej. Plus-løkke. Småt plus tid. Ikke en dæmon i lommen. En løkke, du fodrer.\n\nDu belønner notesbogen med, at en knude forsvinder ud af hovedet. Hjernen lærer: knude → neutral → mærke → ro, der er ærlig. Næste knude er lettere at skrive. Plus, den anden vej.\n\nDu belønner jeg husker det med, at du slipper for at stoppe. Hjernen lærer: stop er for de langsomme. Så husker du forkert. Så bliver du vred på lastbilen. Vreden var et tal, du ikke skrev. Plus-løkke af stolthed.\n\nSkill er renter. Første gang du taler matematik ,  tyve liter i timen, tre hvis’er, jeg ved det ikke endnu ,  føles det klodset. Anden uge er det et sprog. Sprog, der bruges, bliver lettere. Lettere sprog bliver brugt mere. Plus. Det er derfor, ti timer i dag ikke er ti radio-timer, hvis hånden har sat mærker. Mærkerne er renter. Lyden alene er forbrug.\n\nRust er renter. Et punkt, der ikke fik fedt. Et punkt, der ikke fik fedt. Et punkt, der bed. Du kalder det pludselig. Det var ikke pludselig. Det var småt plus tid, uset, fordi forsinkelsen var længere end dit humør.\n\nTillid, igen, fordi den fortjener at stå ved siden af pengene, ikke under dem. Et holdt ord er en krone i en konto, andre mennesker fører på dig. Rentes rente. Et brudt ord er et hæve. Mange små hæv er konkurs, også mens du stadig smiler på pladsen. Matematikken i det er kold. Kærligheden i det er, at du kan indbetale igen. Kristus kender den konto bedre, end jeg gør. Jeg peger kun: løkken er der. Fortegnet er dit, i det små, i dag.\n\nPause.\n\nVerden i det små, samme øje.\n\nEt træ. Lidt vækst per uge. Ikke synligt mandag til tirsdag. Synligt april til september. Småt plus tid.\n\nEn by, der får én butik mere, der virker. Folk kommer. Flere folk gør næste butik mulig. Plus. Eller: en by, der mister én, så mister den næste, fordi færre kommer forbi. Plus, den tunge vej. Du styrer ikke byen. Du kan se løkken, når nogen sælger dig det skete bare. Ofte skete det som renter.\n\nEt rygte. En sætning, der er lidt skæv. Den gentages. Den bliver til sandhed i munden, ikke i jorden. Plus-løkke i sprog. Minus-løkken er: tjek. Tæl. Spørg: spor eller kæde? Vi kommer til det. Her skal du bare se, at ord også avler.\n\nDiesel i tanken. Forbrug per time. Time syv. Hvis du kører sløvt, er forbruget et tal. Hvis du kører sløvt og bliver træt og kører endnu sløvere, er forbruget en løkke. Forskellen er, om output kommer tilbage som dårligere input. Det er definitionen igen. Lær den, til den er kedelig. Kedelig sandhed er den, der holder.\n\nPause.\n\nTilskyndelse.\n\nDet, du belønner, får du mere af.\n\nIkke fordi mennesker er maskiner uden sjæl. Fordi mennesker er sultne. Sultne efter løn, efter ro, efter ære, efter at undgå skam, efter at være færdige, efter at blive set. Sult er ikke synd i sig selv. Synden er, når sulten får lov at lyve. Tilskyndelse er matematikken i sulten: hvilken vej får den mad?\n\nHvis du belønner fart, og du ikke måler hullets holdbarhed, får du fart. Du får også huller, der ikke holder. Du bad om det. Ikke med munden. Med belønningen.\n\nHvis du belønner ingen problemer, får du færre rapporter. Ikke færre problemer. Tavshed. Tavshed er billig i dag og dyr i næste måned. Forsinkelse igen.\n\nHvis du belønner den, der er sjov, og overser den, der rydder, får du flere vittigheder og færre koste. Pladsen bliver en scene. Scener graver dårligt.\n\nHvis sløseri ikke koster, kommer der mere sløseri. Hvis ærlig tælling koster skam, holder folk op med at tælle. Hvis ja er gratis og nej er dyrt i stemning, får du mange ja, der ikke kan bære. Du kender det. Du har sagt ja for at lukke en mund. Løkken: ja → kort ro → dårligt udfald → mere uro → næste ja, hurtigere. Plus. Bruddet er et nej, der koster nu og sparer senere. Minus-løkke, sat med vilje.\n\nSkakmat. Folk er ikke besværlige som vejr. Folk svarer på det, der betaler sig ,  i kroner, i fred, i klap på skulderen, i at undgå dit blik. Hvis du hader resultatet, så se belønningen, før du hader mennesket.\n\nDet er ikke at styre folk. Styring som hersker er et afgudsbillede, og det rådner. Det her er forvalterskab: at holde op med at betale for det, du ikke vil have mere af, og at betale ,  i løn, i tak, i ærlighed ,  for det, du vil have mere af. Og at måle bivirkningen. Altid bivirkningen. Plus-løkker har altid en nabo, du ikke inviterede.\n\nPause.\n\nLøn.\n\nLøn er tilskyndelse, skrevet som kroner per noget.\n\nPer time. Per kubikmeter. Per opgave. Per det ser ud som om. Hvert per noget er et forhold. Time tre. Og hvert forhold fodrer en løkke.\n\nHvis du betaler per time, belønner du tilstedeværelse. Du kan få omhyggeligt arbejde. Du kan også få langsomt arbejde, der aldrig bliver færdigt, fordi færdigt stopper uret. Minus for dig, plus for den, der sælger minutter. Voksen svar er ikke at kalde folk tyve. Voksen svar er at måle output og tid, og at sige den aftale højt.\n\nHvis du betaler per kubikmeter, belønner du mængde. Du kan få tempo. Du kan også få sjusk, for sjusk er billigt, når måleren kun tæller rumfang. Voksen svar: rumfang og omgørelse og rydning. Tre målere. Én måler er en løkke med en blind side.\n\nHvis du betaler det ser travlt ud, belønner du teater. Teater er billigt. Jord er dyr. Du får mænd, der går hurtigt med tomme hænder. Du har set det. Nu har det et navn.\n\nDin egen løn. Hvad belønner du i dig? Hvis du kun belønner dig selv, når dagen var heroisk, får du færre almindelige dage, der er sande, og flere dage, hvor du jager en følelse. Hvis du belønner dig rlig tælling ,  flere tal, mindre tåge.\n\nUnder, en tredje lille streg: og jeg får mindre af. Fordi belønning har en pris i det, der ikke fodres.\n\nHvis jeg belønner skærm om aftenen ,  mindre søvn.\n\nHvis jeg belønner ja, der lukker munde ,  mindre ærligt nej.\n\nGrimt. Sandt. Bogen væk. Det er timens anden søm. Løkken var første. Belønningen er anden. De to er samme hus: belønning er det, du hælder i løkken.\n\nPause.\n\nPsykologi. Humør mod mål.\n\nHumør er vejr. Mål er jord.\n\nDu har det godt efter frokost. Blodsukker. Sol. En vittighed. Hjernen siger: arbejdet går godt. Måske. Måske gik arbejdet godt, fordi bunden var venlig. Måske gik det dårligt, og du mærkede det ikke endnu. Humøret er et signal. Det er ikke en dommer. I nat sagde vi: maven må tale. Maven skal oversættes. I dag siger vi det samme med et plus og et minus.\n\nHumør-plus-løkke: godt humør → det kører → du måler mindre → fejl får lov → senere dårligt humør, som du ikke binder til den time, du sluttede at tælle. Forsinkelse.\n\nHumør-minus, den voksne: dårligt humør → jeg måler alligevel → tallet er tallet → humøret får lov at være vejr, mens hånden gør det sande. Du tilbeder ikke det dårlige humør. Du lader det ikke køre skovlen alene.\n\nGodt humør kan lyve. Dårligt humør kan lyve. Mål lyver også, men de lyver hårdere, og det er en nåde. En måler kan være sløv. En sløv måler er et problem, du kan tjekke. Et sløvt humør, du tilbeder, er et afgudsbillede. Du kan ikke kalibrere en afgud. Du kan kalibrere et ur, et målebånd, en tælling af skovlfulde.\n\nI time fire lærte du godt nok. Her er godt nok i hjertet: godt nok er ikke jeg føler, det er fint. Godt nok er: inden for den fejl, opgaven tåler. Humøret må gerne smile. Smilet skriver ikke kvitteringen.\n\nTræthed er ændring, sagde natten. Den første time lyver om den tiende. Humøret klokken syv vil planlægge klokken femten. Skriv ikke planen som om du er et tal, der står stille. Du er en kurve. System: output per time er ikke konstant. Hvis d en bank. Til jorden. Jorden tager imod i omarbejde.\n\nPause.\n\nEt regnestykke, sagt langsomt, uden tavle.\n\nDu graver. Omarbejde er én skovl ud af tyve, som skal gøres om. Fem procent. Foto: småt. Det sker.\n\nFem procent hver dag, i en uge, er ikke fem procent af ugen, hvis omarbejdet laver mere omarbejde ,  dårlig bund, dårlig stemning, lastbil der venter, haste. Så er fem procent en plus-løkke, ikke en fast afgift. Forskellen er alt. En fast afgift kan du bære. En plus-løkke skal du bryde.\n\nHvordan bryder du den? Ikke med pas nu bedre på som vejr. Med en minus: ét tjek, der koster tredive sekunder, og som æder den fem procent, før den avler. Tjekket er dyrt i fotoet. Billigt i filmen.\n\nOmvendt: du tager tredive sekunder til papir tre gange om dagen. Foto: spild. Tre gange tredive er halvandet minut. Film: én undgået løgn om tid, én undgået kø, én ærlig nej. Halvanden minut er renter, hvis den købte sandhed var dyr.\n\nJeg opdigter ikke, hvor mange minutter din dag sparer. Jeg har ikke dit datablad. Jeg har øjet: spild i fotoet kan være betaling i filmen. Betaling i fotoet kan være spild i filmen, hvis du tæller uden enhed, uden fortegn, uden forsinkelse.\n\nPause.\n\nTilskyndelse i tre huse, så det ikke kun er de andre.\n\nHuset pladsen. Hvad griner I af? Hvad bliver der stille af? Grin er belønning. Stilhed kan være belønning for den, der hader at blive set, og straf for den, der rydder. I får mere af det, der får latter eller fred. Hvis I vil have rydning, skal rydning have en pris, der er synlig ,  tak, eller vi går først når, eller den, der rydder, vælger radioen. Småt. Virkeligt. Ikke en plakat.\n\nHuset hjem. Hvad får opmærksomhed? Brok? Skærm? Et ærligt jeg er træt? Hvis træthed kun får tag dig sammen, lærer huset at lyve om træthed. Så kommer trætheden som vrede i stedet. Vrede er en plus-løkke, der har spist sin mor. Mor hed tælling: timer, søvn, mad. Kærlighed tæller munde og dage og det, der er lovet. Fadervor beder om brød i dag. I dag er et må lyver som kæder.\n\nNærved. En sten, der næsten ramte. Kroppen kører varm. Humøret siger: stop alt, eller: kør hårdere for at komme væk. Begge kan være forkerte. Målet siger: hvad skete, hvad var afstanden, hvad ændrer jeg i næste løft. Nærved er data. Humøret vil gøre nærved til skæbne eller til ingenting. Data er kedeligt. Kedeligt redder.\n\nSejr. Hullet lykkedes. Humøret siger: jeg er god. Måske var bunden god. Måske var lastbilen præcis. Måske var du god. Hvis du tager al æren, fodrer du en løkke, der næste gang nægter at tælle hjælp. Hvis du giver al æren væk, fodrer du en løkke, der nægter at eje dit valg. Voksen: tæl bidrag. Dig. Jord. Folk. Udstyr. Uden at gøre det til teater.\n\nSkam. Du talte forkert. Skam vil skjule tællingen næste gang. Det er tilskyndelse: ærlighed kostede smerte, så mindre ærlighed. Minus, du kan sætte: ærlighed skal koste mindre end løgn. I dit eget hus betyder det, at du ikke slår dig selv hårdere for et sandt tal end for en tåge. I et sjak betyder det, at budbringeren af en svedende slange ikke er fjenden. Fjenden er slangen.\n\nHåb. Håb uden tal er plus-løkke af udsættelse. Det går nok. Nok er ikke en enhed. Time fire. Godt nok er en enhed, når fejlen er nævnt. Håb med tal er tilladt. Håb, der nægter papir, er teater.\n\nAngst. Angst tæller for højt på det, der kan ske, og for lavt på det, der sker. Time otte: sandsynlighed gange konsekvens. Time ni: angst belønner sig selv med mere scanning, scanning finder flere spor, spor bliver til kæder i munden. Bryd med ét mål. Ét. Ikke ti. Ti mål er angst i arbejdstøj.\n\nPause.\n\nVerden, flere simple maskiner.\n\nLager. For mange reservedele: penge bundet, plads bundet. For få: stop, haste, dyrere køb. Minus-løkke, når nogen tæller og bestiller, når der er under en streg. Plus-løkke, når et stop skræmmer dig til at købe for meget, og for meget bliver til rod, og rod bliver til, at du ikke finder den slange, du har, så du køber igen. Rod er ikke æstetik. Rod er et system, der lyver om nul er bedre end at lade hjernen antage nu.\n\nBelønning. Hvem betaler, hvem får. Hvis du ikke kan se belønningen, har du ikke set systemet. Den er der. Den kan være fred. Den kan være at undgå et blik. Kroner er kun den høje stemme.\n\nSå stop. Du skal ikke tegne byen. Du skal tegne det, der bider i dag.\n\nPause.\n\nEt ord om komplekst.\n\nKomplekst betyder: flere løkker, forsinkelser, fortegn, der kæmper. Det betyder ikke: umuligt at røre. Det betyder: rør ét input, mål, vent, mål igen. Ikke ti hænder i ti ringe på én gang. Det er panik. Panik er plus.\n\nHvis du ændrer løn, folk og vaner samme mandag, ved du ikke, hvad der virkede. Korrelation i dit eget hus. Du lavede tre spor og kaldte dem én kæde. Voksen: én ændring. En uge. Papir. Så næste.\n\nDet er langsomt. Jorden er langsom. Ti timer i dag er langsomme. Langsom er ikke fjenden. Plus-løkken jeg skal fikse det hele nu er fjenden. Den avler teater.\n\nPause.\n\nTænk på papir, tredje søm i timen, hvis der er et vindue.\n\nIkke tre nye sider. Den samme.\n\nCirkel. Fortegn. Navn. Hvis den, du tegnede først, var forkert, ret den. Papir må rettes. Hovedet retter i smug og kalder det, at det altid vidste.\n\nTilføj forsinkelse, hvis du ikke gjorde det.\n\nTilføj én belønning.\n\nHvis du ikke har tegnet hvis jeg belønner, gør det nu. Tre linjer. X. Mere af. Mindre af.\n\nDato.\n\nBogen væk. Du er ikke i skole. Du er i en maskine. Maskinen vinder, hvis der er tvivl.\n\nPause.\n\nLad os fylde hvis jeg belønner med stemme, så papiret ikke bliver tomt af respekt.\n\nLinje ét. Hvis jeg belønner den, der siger ja hurtigst. Så får jeg flere hurtige ja. Jeg får færre, der har talt lastbiler. Jeg får mindre af det langsomme nej, der ville have sparet onsdag.\n\nLinje to. Hvis jeg belønner den rene kabine. Så får jeg mere orden. Jeg får mindre tid i fotoet. Jeg får, hvis jeg er ærlig, også en fristelse til at feje støv over en slange, der sveder, fordi pænhed blev guden. Så sæt bivirkningen på: orden og at sved må vises.\n\nLin e: det, du belønner, får du mere af. Løn er per noget. Folk svarer på pris.\n\nSøm fem: humør er vejr. Mål er jord. Spor er ikke kæde.\n\nSøm seks: du styrer ikke verden. Du læser. Du vælger det input, du ejer.\n\nSøm syv: papir. Neutral. Grimt. Sandt.\n\nVidere. Time ti. Syntese. Værktøjskassen i hænderne.\n"</script>

  ta.style.display = "block";
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    done();
  } catch (e) {
    done("Teksten er markeret. Tryk Kopiér.");
  }
}
btn.addEventListener("click", copyAll);
</script>
</body>
