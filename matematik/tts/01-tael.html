<script id="payload" type="application/json">"Viktor. Klokken er fem. Ét øre. Hænderne på maskinen. Øjnene på jorden. Omgivelser først. Hvis noget i lyden trækker dig væk fra skovlen, vinder skovlen. Jeg taler i baggrunden. Du kører i forgrunden. Det er kontrakten.\n\nJeg er Grok. Jeg er din AI. Jeg er ikke Kristus. Jeg taler ikke for Gud. Jeg peger. Det, der er sandt i denne time, tilhører skabningen og dens Herre. Det, der er skævt, er mit. Test det med skovlen. Jorden lyver ikke.\n\nDu skriver ikke, mens du graver. Du skriver ikke, mens du kører. Notesbogen kommer kun frem én gang i denne time, når maskinen står i neutral, stabil, og omgivelserne er set. Jeg siger til. Indtil da: øre, øjne, hænder. Arbejde.\n\nI nat hængte vi et kort op. Fem tegn. Ét atom. Én kabine. Tænk på papir. I dag tager vi det første tegn og kører det, til det bliver kød.\n\nTæl. Hvad er der ét af?\n\nIkke som et barn, der reciterer. Som en mand, der nægter tåge, før han lover, graver, siger ja.\n\nPause.\n\nLyt til kabinen et øjeblik uden at tælle den. Motor. Hydraulik. Ramme. Måske regn. Måske en anden maskine langt væk. Så tæl alligevel, stille, uden at flytte hænderne.\n\nÉn maskine. Du.\n\nÉt øre med lyd. Ét øre til verden.\n\nTo hænder.\n\nÉn skovl.\n\nÉn tank.\n\nÉn notesbog, et sted i kabinen, lukket, indtil neutral.\n\nAllerede her har du gjort det, skolen kaldte det første kapitel, og du har gjort det uden at kigge væk. Tælling er ikke at forlade virkeligheden. Tælling er at skærpe den. Dokument fem kaldte det højere opløsning. I dag kalder vi det det samme med et ældre navn: at skelne ét fra et andet.\n\nBrintatomet i nat: ét proton, ét elektron. Hvis du tæller forkert, er det ikke brint. Navnet følger tællingen. I dag: hvis du tæller forkert, er det ikke det hul, I aftalte. Navnet følger tællingen. Kunden kalder det det vi sagde. Jorden kalder det kubik. Du kalder det skovlfulde, indtil du har et mål. Alle tre er tælling i forskellige enheder. Time fire tager enhederne. I dag tager vi antallet.\n\nPause.\n\nHvad er et tal?\n\nEt tal er ikke en ting i luften. Et tal er et svar på hvor mange? eller hvilken plads? eller hvilken retning?. Tre slags, allerede. Mænd blander dem og bliver uvenner.\n\nHvor mange: skovlfulde, mænd, lækager, timer, ja’er, nej’er.\n\nHvilken plads: den tredje lastbil, den anden slange, husnummer, dato. Position. Pladsværdi. Ti er ikke mange ét-taller. Ti er én i tierrækken og nul i enerne. Positionen er værdien. Som kabinen er origo: det samme punkt betyder noget andet, hvis du flytter nulpunktet.\n\nHvilken retning: minus. Skyld. Under stregen. Baglæns. Ikke mindre end ingenting som poesi. En pil den anden vej.\n\nI dag træner vi de tre, én ad gangen, med jorden som tavle.\n\nPause.\n\nHvor mange.\n\nDet ser barnligt ud. Det er det ikke. De dyreste fejl på en plads er ofte tællefejl, ikke ingeniørfejl. En lastbil for lidt. En time for meget lovet. En mand, der nok kommer. Nok er ikke et tal. Nok er håb i arbejdstøj.\n\nØvelsen, uden at flytte hænderne: vælg én slags ting i dit synsfelt, som det er sikkert at tælle med øjet. Ikke mens du svinger over et menneske. Noget stille. Kegler. Rør. Bunker. Tæl dem. Sig tallet indeni. Sig så: jeg kan tage fejl med én. Den sætning er voksen. Den, der siger jeg har talt, altså er det sandt, er et barn med en krone.\n\nTælling har en metode.\n\nPegen. Enten med øjet eller med skovlen, når det er gods. Ét punkt, ét tal. Hvis du hopper, dobbelttæller du eller springer over. Børn lærer det med fingre. Mænd glemmer det med øjne, der scanner.\n\nGruppering. Fem. Ti. En streg, femte på tværs. Det er derfor, papiret findes. Hovedet mister femmerne, når hydraulikken synger. Papiret mister dem ikke.\n\nNulpunkt. Hvor begynder du? Fra venstre. Fra det nærmeste. Fra det, der skal væk først. Hvis to mænd tæller fra hver sin ende uden at sige det, får de to tal og en konflikt, der ligner karakter.\n\nGentagelse. Tæl om, når tallet skal bære vægt. Et hul, der styrer en dag, er vægt. En spøg i radioen er ikke. Brug vægten. Ikke æren.\n\nSkakmat. Du kan ikke have styr på det, hvis du ikke ved hvor mange. Styr uden antal er stemning. Stemning er et dårligt formandskab.\n\nPause.\n\nNul.\n\nNul er det tal, egoet hader. Nul lækager. Nul aftaler ud over den, du kører. Nul mænd til at hjælpe. Nul undskyldninger i tanken.\n\nMænd siger ingen og mener jeg har ikke kigget. Nul, der er ærligt, kræver et kig. Nul, der er uærligt, er sløseri med hat på.\n\nI nat sagde vi: nul er en ærlig tomhed. I dag bruger du den. Før du lover en ekstra opgave: hvor mange timer er ledige, når den, du kører, er færdig? Hvis svaret er nul, er ja et tyveri fra et andet sted ,  søvn, familie, vedligehold, den næste dags skovl. Tyveri kan være valgt. Det skal være set. Nul, der er set, er moral. Nul, der er uset, er rod.\n\nPå papir, når du engang i denne time er i neutral: skriv et nul. Bare tegnet. Skriv ved siden af, ét ord, hvad det gælder. Nul slanger skiftet. Nul lastbiler ventende. Nul. Hvis du ikke kan fylde ordet, var nullet et ønske. Sæt et spørgsmålstegn i stedet. Spørgsmålstegn er også et tal i dag: det tal, der hedder jeg ved det ikke. Det er mere værd end et falsk fem.\n\nPause.\n\nPosition.\n\nTi, hundrede, tusind. Skolen kaldte det pladsværdi og tegnede huse. Glem husene. Husk dette: det samme ciffer betyder noget andet, alt efter hvor det sidder.\n\nEt tre i enerne er tre skovlfulde. Et tre i tierrækken er tredive. Et tre i hundrederne er tre hundrede. Fejlen er en nularms forskydning. På en faktura er det en ulykke. I et hul er det en uge.\n\nOrigo. Kabinen. I nat. Det, der er tæt på, tæller anderledes end det, der er langt væk, når det handler om kraft. Når det handler om antal, tæller det fjerne stadig. En ledning, du ikke har talt, fordi den er derovre, er stadig én ledning. Position i rummet er ikke det samme som position i tallet. Men billedet hjælper: ved, hvor dit tal sidder. Er det et skøn i enerne, eller bilder du dig ind, at du har hundredernes sikkerhed?\n\nTal, du siger højt, skal have en størrelsesorden, du kan mærke. Tredive skovlfulde er en formiddag eller et øjeblik, alt efter skovl og bund. Hvis du ikke kan mærke ordenen, er tallet papegøje. Papegøje-tal er farlige, fordi de lyder færdige.\n\nPå papir: skriv et tal. Sæt et punkt, hvor enerne er. Ikke pænt. Bare så du ved, hvor tallet slutter. Hvis du skriver 30 og mente 3, har du forskudt. Papiret viser det, hvis du kigger. Hovedet viser det ikke, hvis du har travlt.\n\nPause.\n\nMinus. Retning.\n\nGæld er minus. Jeg skylder to timer. Pilen peger bagud i regnskabet. Tanken under stregen er minus i rumfang. At køre den forkerte vej i forhold til aftalen er minus i fremdrift, også når kilometertælleren stiger.\n\nMinus er ikke skam. Minus er information. Skam kommer, når minus skjules. Et synligt minus kan betales, planlægges, graves. Et skjult minus styrer dig fra ryggen.\n\nNegative tal på en termometer er kulde under nul. Du kender det. Overfør det. Nul er aftalt punkt. Under er den anden side. I løn: plus er ind. Minus er ud. Hvis ud er større end ind, er dagen et minus, også når den føltes flittig. Følelse af flid er ikke et tal. Output minus omkostning er et tal. Time tre tager forholdet. I dag tager vi fortegnet.\n\nPå papir: en pil til venstre eller et minus foran et tal. Ikke en roman om, hvorfor. Hvorfor kan komme bagefter. Først retningen.\n\nSkakmat. Du kan arbejde hårdt i minus. Verden skylder dig ikke plus, fordi du svedte. Plus er et regnskab, ikke en medalje. Kristus taler om troskab, ikke om at tallet altid smiler. Troskab kan være at se minus i øjnene samme dag.\n\nPause.\n\nTænk på papir. Time ét’s mærke.\n\nNår ,  og kun når ,  maskinen er i neutral, stabil, og jorden ikke kalder: notesbogen.\n\nØverst: Tæl.\n\nUnder: streger. En per den slags, du tæller nu. Femte på tværs. Eller et tal, hvis du har talt færdigt.\n\nHvis det er nul: skriv 0 og ét ord.\n\nHvis det er skyld: minus og tal.\n\nHvis du ikke ved det: ?\n\nTredive sekunder. Ikke pænt. Sandt. Bogen væk. Hænderne tilbage.\n\nDet er at tænke på papir. Du tænkte ikke færdigt i luften og dokumenterede. Du tænkte, fordi hånden bevægede sig. Hovedet alene ville have sagt cirka. Papiret tvang et mærke. Cirka blev til et tal eller til et spørgsmålstegn. Begge slår cirka.\n\nHvis du ikke kan stoppe sikkert i denne time, springer du papiret over. Lyden er nok. Livet er mere værd end en streg. Vi tager stregen ved pausen. Pause er også neutral. Kaffe er ikke en undskyldning for at glemme jorden. Kaffe kan være et lovligt stop. Brug det.\n\nPause.\n\nLøgne, tælling dør af.\n\nEn del. En del er tåge. Sig tre, eller sig jeg ved det ikke.\n\nDe kommer. Hvem, hvor mange, hvornår. Tre tal. Ellers er det håb.\n\nVi har tid. Tid til hvad, hvor mange minutter. Ellers er det flugt.\n\nDet er talt. Af hvem, hvornår, om. Tælling uden vidne og uden gentagelse er et rygte.\n\nJeg husker det. Hovedet er et lille bord. Papiret er et større. Hvis det skal bære vægt til i morgen, er hukommelse arrogance.\n\nDet tæller ikke. Alt, der flytter jord, tid, penge eller tillid, tæller. Det, du nægter at tælle, styrer dig.\n\nSig løgnene, når du hører dem i din egen mund. Ikke for at piske. For at oversætte. Oversættelse er at tale matematik.\n\nPause.\n\nAt tale tælling.\n\nDer er fire rør. Ikke der ligger noget.\n\nJeg har to timer, før lastbilen. Ikke vi når det.\n\nNul mænd til at guide, så jeg kører langsommere. Ikke det er fint.\n\nJeg skylder en time fra i går. Ikke tavshed.\n\nJeg ved ikke, hvor mange skovlfulde der er tilbage. Jeg tæller den næste kvarter. Ikke snart færdig.\n\nSætningerne er grimme i starten. Så bliver de rene. Så bliver de kærlige, fordi den anden mand kan bygge på dem. Kærlighed tæller munde. Formandskab tæller skovle. Samme troskab.\n\nPause.\n\nBrint igen, kort, så atomet ikke bliver pynt.\n\nÉt og ét. Tælling, der skifter navn. Du tæller ikke protoner i dag. Du tæller det, der er i din størrelse. Grammatikken er den samme. Verden respekterer antal. Du må også.\n\nHvis du tæller forkert i det små, tæller du forkert i det store. En dag er mange små. En uge er mange dage. Ophobning er time syv. I dag: det lille antal er ikke lille, hvis det gentages. En glemt kegle er én. Ti glemte kegler er et mønster. Mønster er tælling over tid.\n\nPause.\n\nPsykologi, kort, fordi tælling rammer egoet.\n\nEgoet vil være hurtig. Tælling er langsom. Egoet vil være færdig. Tælling er ufærdig, indtil det sidste er peget. Egoet vil have ret. Tælling kan vise, at du tog fejl. Derfor springer mænd tælling over og kalder det erfaring. Erfaring, der nægter at tælle, er vane. Vane kan være dygtighed. Vane kan være blindhed. Tælling skiller de to.\n\nTilskyndelse: hvis forkert tælling ikke koster, kommer der mere forkert tælling. Hvis ærlig tælling koster skam, holder du op. Indret dagen, så ærlig tælling er billig: et papir, et stop, et tal, ingen forestilling. Skam hører hjemme ved løgn, ikke ved et nul.\n\nPause.\n\nRecap, mens du kører.\n\nTæl. Hvor mange. Hvilken plads. Hvilken retning.\n\nMetode: peg, gruppér, nulpunkt, gentag når det bærer vægt.\n\nNul er ærligt eller det er et ønske.\n\nPosition: cifferets plads er værdi. Størrelsesorden, du kan mærke.\n\nMinus er pil. Synligt minus kan bæres.\n\nPapir: streger, 0, minus, ?. Neutral. Tredive sekunder.\n\nLøgne: en del, de kommer, vi har tid, jeg husker.\n\nTale: tal plus hvad. Ellers tåge.\n\nPause.\n\nEndnu en runde i kabinen, fordi én runde ikke slår sømmet i.\n\nDu svinger. Skovlen tager. Det er plus ,  time to. Før plus er der et antal: tom, én, fuld. Fuld er et antal i rumfang, ikke i stykker. Du må gerne tælle skovlfulde som stykker, når lastbilen er målet. Du må gerne tælle rumfang, når hullet er målet. Vid, hvad du tæller. Blanding af stykker og rumfang er en klassisk slåskamp på en plads. Jeg har kørt tyve gange. Hullet er der stadig. Begge kan være sande, hvis skovlen ikke var fuld, eller hvis bunden rasler. Tælling uden hvad er forældreløs. Forhold er time tre. I dag: sæt navn på det, du tæller. Skovlfulde. Minutter. Mænd. Ikke det.\n\nNavngivning er tællingens søster. Adam navngav. Du navngiver, når du siger slange og ikke ting. Matematikken begynder i sproget. Uden navn, intet antal, der kan deles med en anden.\n\nPause.\n\nStore tal. Du behøver ikke at elske dem. Du behøver ikke at frygte dem.\n\nTusind er ti hundreder. Hundrede er ti tiere. Du tænker i pakker. En lastbil er en pakke skovlfulde. En dag er en pakke timer. En uge er en pakke dage. Pakken har et navn, så du ikke skal holde alle enerne i luften. Det er pladsværdi i livet. Hvis pakken er løs ,  hvis en lastbil nogle gange er otte skovle og nogle gange femten ,  er navnet løgn. Så tæller du skovle, indtil pakken er ærlig, eller du vejer, time fire.\n\nSkakmat. Et stort tal, du ikke kan mærke, er teater. Sig det højt: kan jeg se det foran mig? Hvis ikke, bryd det i pakker, du kan se. Ti. Tyve. En time. En tank. Så er tusind ikke magi. Det er mange pakker.\n\nPause.\n\nTid som antal.\n\nTimer er tal. Klokken fem til seks er én. Den føles anderledes end tre til fire. Følelsen er ændring, time syv. Antallet er ét. Du må ikke lade følelsen stjæle antallet. En time er en time. Du kan bruge den dumt eller klogt. Du kan ikke gøre den til to ved at have det travlt i munden.\n\nDage til deadline er tælling. I dag, i morgen, i overmorgen. Peg på dem. Gruppér arbejdsdage, ikke kalenderdage, hvis lørdag ikke tæller. Nulpunkt: tæller i dag med? Sig det. To mænd, der ikke er enige om, hvorvidt i dag tæller, får to deadlines og ét skænderi.\n\nPause.\n\nMennesker som antal.\n\nÉn mand i dødvinkel er ét for meget at overse. Tælling her er liv. Før du svinger: hvor mange kroppe i zonen? Nul er det eneste rigtige, eller du venter. Det er ikke matematik som kulde. Det er matematik som næstekærlighed. Du tæller, fordi han har et navn.\n\nPå pladsen: hvor mange, der faktisk graver, versus hvor mange, der står. Et tal, der kan gøre ondt. Skriv det ikke for at dømme i skjul. Brug det til at tale rent, eller til at tie, hvis du ikke er formand. Tælling er ikke sladder. Sladder er tælling uden ansvar.\n\nPause.\n\nCheckpoint, når det er sikkert.\n\nNeutral. Tæl. Streger eller tal. Nul eller minus eller ?. Dato, hvis det skal leve til i morgen. Bogen væk.\n\nHvis du kun får ét mærke i hele denne time, så lad det være det ærligste: et nul, du ikke ville se, eller et antal, du havde blæst op. Det mærke er hele timen værd.\n\nPause.\n\nKristus, uden numerologi.\n\nVi tæller ikke for at tvinge Gud. Vi tæller, fordi løgn er af djævelen, og tåge er løgnens fætter. Fadervor: brød i dag. Et antal dage: ét. Et brød, der kan deles. Deling er time to. I dag: i dag er ét. Du får ikke i går tilbage. Du får ikke i morgen at køre i. Du får denne time. Tæl den som én. Brug den. Det er forvalterskab.\n\nAmen til det, og så hænderne. Ingen andagt, der stjæler synet fra skovlen.\n\nPause.\n\nHvad time to vil tage.\n\nNår du kan tælle, kan du handle. Plus er at samle antal. Minus er at fjerne. Gange er at gentage en bunke. Dividere er at dele en bunke. Skovlen er plus og minus. Lastbilen er gange, når den er så mange skovle. At dele et læs er dividere. I nat var handlingerne i atomet: tiltrækning, hop, fald. I dag er de i stålet.\n\nIndtil da: Tæl. Hvad er der ét af? Hvad er der nul af? Hvad peger bagud?\n\nFem tegn. I dag det første. Kabinen origo. Papir i neutral. Jorden først.\n\nKør.\n\nPause.\n\nViktor. Du kørte videre. Det var rigtigt. Et ord i øret er ikke et stoptegn for skovlen. Jorden slutter ikke, fordi en lektion har sagt sit første kør. Tællingen slutter heller ikke. Vi tager en ny runde i samme time, samme tegn, andre sten. Øjnene på jorden. Hænderne, hvor de skal være. Ét øre. Hvis skovlen kalder, vinder skovlen. Jeg taler i baggrunden. Du kører i forgrunden. Kontrakten er den samme.\n\nJeg peger. Jeg styrer ikke maskinen. Det, der er sandt her, tilhører skabningen. Det, der er skævt, er mit. Test det med jorden. Jorden lyver ikke.\n\nPause.\n\nKabinen igen. Ikke som pynt. Som origo.\n\nDu sidder. Sædet har en vægt. Den vægt er dig. Ét. Ikke to, fordi du er træt. Træthed er ikke et ekstra menneske. Træthed er en tilstand i det ene. Tæl manden. Tæl ikke stemningen som et andet hoved.\n\nMotor. Ét øre tager lyden. Det andet tager verden. To ører. Forskellig opgave. Samme hoved. Tæl opgaven, ikke bare kødet. Hvis begge ører går til radioen, er zonen minus ét vidne. Vidner er antal. Antal, der forsvinder, er fare.\n\nHøjre hånd. Venstre hånd. To. Hvis den ene letter, fordi en stemme bliver interessant, er det minus i hænder og plus i mund. Mund plus og hænder minus er et dårligt bytte. Tæl hænderne tilbage på stålet, før du tæller noget andet.\n\nSkovl. Ét stål, der tager. Hvis du tæller skovlen som to, fordi den er stor, har du blandet størrelse og antal. Størrelse venter. Antal er i dag. Én skovl. Fuld eller tom er rumfang, ikke et andet stykke stål. Vid, hvad du tæller.\n\nTank. Ét sted, olien bor. Nul lækage er ikke jeg kiggede ikke. Nul er jeg kiggede, og der var ingen, jeg kunne se. Forskellen er et kig. Uden kig er ingen et ønske.\n\nNotesbog. Ét stykke papir, lukket. Den tæller først, når maskinen er i neutral. Indtil da er den nul i brug og ét i beredskab. Beredskab er ikke brug. Bland dem ikke. En åben bog mellem dig og skovlen er ét for meget i vejen.\n\nAllerede her har du talt kabinen uden at forlade den. Det er lektionen. Tælling er at skærpe virkeligheden. Ikke at flygte fra den.\n\nPause.\n\nLyt først uden at tælle. Motor. Hydraulik. Ramme. Måske regn. Måske en anden maskine langt væk. Måske en stemme i radioen, der gerne vil være vigtigere end zonen. Så tæl alligevel, stille, uden at flytte hænderne.\n\nÉn maskine. Du.\n\nÉt øre med lyd. Ét øre til verden.\n\nTo hænder.\n\nÉn skovl.\n\nÉn tank.\n\nÉn notesbog, et sted, lukket.\n\nSig tallet indeni. Sig så: jeg kan tage fejl med én. Den sætning er voksen. Den, der siger jeg har talt, altså er det sandt, er et barn med en krone.\n\nPause.\n\nEn række kegler.\n\nDe står. De bevæger sig ikke. De er sikre at tælle med øjet, hvis svinget er stille, og zonen er tom. Hvis zonen ikke er tom, tæller du kroppe først. Kroppe slår kegler. Altid. Liv slår pædagogik.\n\nPeg med øjet. Den nærmeste. Ét. Den næste. To. Hop ikke. Scanning er ikke pegen. Scanning er det, der dobbelttæller og springer over. Børn lærer pegen med fingre. Mænd glemmer den med øjne, der farer.\n\nGruppér. Fem. En streg i hovedet, femte på tværs, hvis du må. Hvis hydraulikken synger for højt til hovedets streger, venter papiret. Papiret venter i neutral. Ikke nu. Hovedet mister femmerne. Papiret mister dem ikke.\n\nNulpunkt. Fra hvilken ende. Sig det indeni. Fra det nærmeste. Eller fra venstre. Hvis du skifter midt i, uden at sige det, får du to tal i ét hoved. Det er den samme konflikt som to mænd, bare indeni.\n\nGentag, hvis tallet skal bære. Skal keglerne bære en dag? Så tæl om. Er de bare der, som støj? Så er ét kig nok. Brug vægten. Ikke æren. Ære tæller forkert, når den vil være hurtig.\n\nSkakmat. En kegle, du ikke talte, fordi den stod derovre, er stadig én kegle. Position i rummet er ikke tilladelse til at glemme antal. Det fjerne tæller, når det handler om antal. Kraft er en anden sag. Antal er denne.\n\nPause.\n\nRør i en bunke.\n\nIkke der ligger noget. Fire. Eller seks. Eller jeg ved det ikke. Hvis du siger noget, har du talt med munden uden at pege. Munden er et dårligt pegefinger.\n\nPeg. Ét rør, ét tal. Hvis de ligger over hinanden, er det sværere. Sværere er ikke en undskyldning for tåge. Sværere er en grund til at tælle om, eller til at sige spørgsmålstegnet højt.\n\nGruppér i fem, hvis der er mange. Ti, hvis femmerne er stabile. Pakken skal være ærlig. Hvis en bundt nogle gange er tre og nogle gange ni, er bundtet løgn. Så tæller du stykker, indtil navnet holder.\n\nSig:\n\nDer er fire rør.\n\nIkke: der ligger en del.\n\nJeg har ikke talt rørene. Jeg tæller ved næste stop.\n\nIkke: det er talt.\n\nNul rør skiftet i dag.\n\nIkke: vi kigger på det senere, sagt som om senere var et tal.\n\nPause.\n\nLastbiler.\n\nHvor mange er her. Hvor mange er lovet. Hvor mange er på vej, hvilket ofte betyder nul her og et håb derude.\n\nNul lastbiler er et tal. Du kan fylde skovlen alligevel. Du kan ikke fylde aftalen, hvis aftalen var læs. Se nullet. Lad være med at male en lastbil på en tom vej.\n\nÉn lastbil. Den tredje i rækken er plads, ikke mængde. Tre lastbiler er mængde. Den tredje er hvilken. Mænd slås, fordi den ene sagde tredje og den anden hørte tre. Position og antal. To slags. Bland dem, og dagen bliver et skænderi, der ligner karakter.\n\nSig:\n\nÉn lastbil her. Nul på vej, som jeg har talt. To lovet. Jeg ved ikke, om de to kommer.\n\nDet er tre tal og et spørgsmålstegn. Det er voksen tale. De kommer er ét slør.\n\nSkakmat. Du kan ikke have styr på et hul, hvis du ikke ved, hvor mange læs der er her, og hvor mange der mangler. Styr uden antal er stemning. Stemning er et dårligt formandskab.\n\nPause.\n\nRadioen.\n\nDe kommer.\n\nOversæt. Hvem. Hvor mange. Hvornår. Tre tal. Hvis du kun får stemningen, har du fået håb. Håb kan være venligt. Håb er ikke et læs.\n\nVi har tid.\n\nTid til hvad. Hvor mange minutter. Til lastbilen. Til mørket. Til det hul, I aftalte. Uden det er tid flugt i et pænt tøj.\n\nEn del er tilbage.\n\nEn del er tåge. Sig tre. Sig ti. Sig jeg ved det ikke. Spørgsmålstegnet er et tal i dag. Det tal hedder ærlighed.\n\nDet tæller ikke.\n\nAlt, der flytter jord, tid, penge eller tillid, tæller. Det, du nægter at tælle, styrer dig fra ryggen. En glemt ja er ét ja. Ti glemte ja’er er en uge, du ikke ejer.\n\nJeg husker det.\n\nHovedet er et lille bord. Papiret er et større. Hvis det skal bære vægt til i morgen, er hukommelse arrogance. Ikke fordi du er dum. Fordi bordet er lille, og hydraulikken synger.\n\nDet er talt.\n\nAf hvem. Hvornår. Om hvad. Tælling uden vidne og uden gentagelse, når det bærer vægt, er et rygte. Rygter graver dårlige huller.\n\nTal matematik tilbage, når du skal svare:\n\nJeg ved ikke, hvor mange lastbiler. Jeg tæller, når den første er her.\n\nNul mænd i zonen, så jeg svinger.\n\nÉn mand i zonen, så jeg venter.\n\nTo timer, før jeg skal være et andet sted. Ikke tre. To.\n\nJeg skylder en time fra i går. Den står.\n\nJeg har ikke talt skovlfulde. Jeg tæller det næste kvarter.\n\nSætningerne er grimme. De bliver rene. De bliver kærlige, fordi den anden kan bygge på dem. Kærlighed tæller munde. Formandskab tæller skovle. Samme troskab.\n\nPause.\n\nTænk på papir. Første mærke i denne runde.\n\nNår ,  og kun når ,  maskinen er i neutral, stabil, og jorden ikke kalder.\n\nBogen. Øverst: Tæl.\n\nUnder: den slags, du tæller nu. Ét ord. Kegler. Rør. Lastbiler. Timer. Mænd. Ikke en sætning. Ikke i dag gik det. Mærke. Ikke dagbog. Dagbog er følelse i linjer. Mærke er et tal, et nul, et minus, et spørgsmålstegn.\n\nStreger. En per stykke. Femte på tværs. Eller tallet, hvis du er færdig med at pege.\n\nHvis det er nul: 0 og ét ord. Nul ventende. Nul lækager, jeg kunne se.\n\nHvis det er skyld: minus og tal. Minus to timer.\n\nHvis du ikke ved det: ?\n\nTredive sekunder. Hånden tænker. Hovedet alene ville have sagt cirka. Papiret tvinger mærket. Cirka dør. Cirka bliver til et tal eller til et spørgsmålstegn. Begge slår cirka.\n\nBogen væk. Hænderne tilbage. Øjnene, der aldrig skulle have forladt jorden, bekræfter jorden.\n\nHvis du ikke kan stoppe sikkert: intet papir. Livet slår stregen. Vi tager stregen ved pausen. Pause er også neutral. Kaffe er ikke en undskyldning for at glemme zonen. Kaffe kan være et lovligt stop. Brug det som stop, ikke som slør.\n\nSkriv for at tænke. Hvis du allerede vidste svaret og bare stemplede det, var papiret et show. Hvis tallet kom, fordi hånden pegede, var papiret arbejde. Vi vil have arbejdet. Fabrikken, ikke stemplet.\n\nPause.\n\nNul, sagt langsommere, med jord under.\n\nNul lastbiler. Du kan fylde skovlen. Der er intet sted at lægge det, der tæller som aftalen, hvis aftalen var læs. Se nullet. Lad være med at kalde tom vej for snart.\n\nNul mænd til at guide. Så kører du langsommere. Det er ikke fejhed. Det er tælling, der ændrer handling. Handlingerne venter til næste time. I dag ser du tallet, der tvinger flytningen.\n\nNul timer ledige, når den opgave, du kører, er færdig. Et ja oveni er tyveri fra et andet sted: søvn, familie, vedligehold, morgendagens skovl. Tyveri kan være valgt. Det skal være set. Nul, der er set, er moral. Nul, der er uset, er rod med hat på.\n\nNul undskyldninger i tanken. Det er det nul, egoet hader mest. Egoet vil have én. Jeg var træt. Træthed kan være sand. Den er ikke et tal for hullet. Hullet tæller skovlfulde. Kroppen tæller også, men det er et andet felt. Bland ikke felterne for at slippe.\n\nNul lækager, jeg kunne se. Sæt de tre sidste ord på. Uden dem er nullet et ønske. Med dem er nullet et kig. Kigget kan tage fejl. Kigget er alligevel mere værd end den lukkede øjenlåg-sætning ingen.\n\nPå papir, i neutral: skriv 0. Ét ord ved siden af. Hvis ordet ikke kommer, var nullet et ønske. Sæt ? i stedet. Spørgsmålstegnet er mere værd end et falsk fem.\n\nSkakmat. Ingen uden kig er ikke nul. Ingen uden kig er sløseri.\n\nPause.\n\nPosition. Cifferets plads.\n\nDu hører tre. Tre skovlfulde. Tre tiere. Tre hundreder. Samme mund. Tre verdener. Fejlen er en nularms forskydning. På en seddel er det en ulykke. I et hul er det en uge. I et ja er det en sæson.\n\nEt tre i enerne er tre skovlfulde. Et tre i tierrækken er tredive. Et tre i hundrederne er tre hundrede. Det samme tegn. Anden plads. Anden værdi. Skolen tegnede huse. Glem husene. Husk: hvor det sidder, er hvad det er værd.\n\nTal, du siger højt, skal have en størrelsesorden, du kan mærke. Tredive skovlfulde: er det et øjeblik eller en formiddag, alt efter skovl og bund. Hvis du ikke kan mærke ordenen, er tallet papegøje. Papegøje-tal lyder færdige. De er farlige, fordi den anden mand bygger på dem.\n\nHusnummer er plads, ikke mængde. Den tredje slange er plads. Tre slanger er mængde. Dato er plads i tiden. Den tolvte er ikke tolv dage, medmindre I tæller fra et aftalt nul. Nulpunkt. Sig det.\n\nKabinen er origo, når det handler om kraft og nærhed. Når det handler om antal, tæller det fjerne stadig. En ledning derovre er én ledning. Position i rummet er ikke det samme som position i tallet. Billedet hjælper alligevel: ved, hvor dit tal sidder. Er det et skøn i enerne, eller bilder du dig ind, at du har hundredernes sikkerhed?\n\nPå papir: skriv et tal. Sæt et mærke, hvor enerne slutter. Ikke pænt. Bare så du ved, hvor tallet ender. Hvis du skrev tredive og mente tre, viser papiret det, når du kigger. Hovedet viser det ikke, når du har travlt.\n\nSkakmat. Et tre, der sidder i den forkerte række, er ikke næsten rigtigt. Det er et andet stof. Som brint, der fik en proton for meget og blev noget andet. Navnet følger tællingen. Værdien følger pladsen.\n\nPause.\n\nMinus. Pilen.\n\nTanken under stregen. Ikke poesi. Et rumfang, der peger den anden vej i forhold til nok til at køre. Nok er stadig ikke et tal. Under stregen er.\n\nJeg skylder to timer. Pilen bagud i regnskabet. Synligt. Kan betales, planlægges, graves. Skjult skyld styrer fra ryggen. Skam kommer, når minus skjules. Minus selv er information.\n\nAt køre den forkerte vej i forhold til aftalen er minus i fremdrift, også når tælleren på vejen stiger. Kilometer er ikke plus, hvis retningen er væk fra hullet. Retning er den tredje slags tal. Hvor mange. Hvilken plads. Hvilken vej.\n\nI løn: plus er ind. Minus er ud. Hvis ud er større end ind, er dagen et minus, også når den føltes flittig. Følelse af flid er ikke et tal. Det, der kommer ind, minus det, der går ud, venter som handling. I dag tager vi fortegnet. Ser du minus, eller skjuler du det.\n\nKulde under nul kender du. Nul er aftalt punkt. Under er den anden side. Overfør det. Aftalt punkt i dagen. Aftalt punkt i tanken. Aftalt punkt i timer, du skylder. Under er ikke skam. Under er pil.\n\nPå papir: minus foran et tal, eller en pil. Ikke en roman om hvorfor. Først retningen. Hvorfor kan vente. Romanen er dagbog. Pilen er mærke.\n\nSkakmat. Du kan arbejde hårdt i minus. Verden skylder dig ikke plus, fordi du svedte. Plus er et regnskab, ikke en medalje. Kristus taler om troskab, ikke om at tallet altid smiler. Troskab kan være at se minus i øjnene samme dag.\n\nPause.\n\nHvad tæller du.\n\nSkovlfulde, når lastbilen er målet. Rumfang, når hullet er målet. Minutter, når uret er målet. Mænd, når zonen er målet. Ja’er, når kalenderen er målet. Lækager, når stålet er målet. Nej’er, når munden har været for hurtig.\n\nBlanding er slåskamp. Jeg har kørt tyve gange. Hullet er der stadig. Begge kan være sande, hvis skovlen ikke var fuld, eller hvis bunden rasler. Tælling uden hvad er forældreløs. Forhold venter. I dag: sæt navn på det, du tæller. Skovlfulde. Minutter. Mænd. Ikke det.\n\nNavngivning er tællingens søster. Adam navngav. Du navngiver, når du siger slange og ikke ting. Matematikken begynder i sproget. Uden navn, intet antal, der kan deles med en anden. Et tal uden navn er en lyd. En lyd kan ikke graves efter.\n\nSig:\n\nFire rør. Ikke noget, der ligger.\n\nTo timer før lastbilen. Ikke vi når det.\n\nNul guide. Jeg kører langsommere.\n\nJeg skylder en time fra i går.\n\nJeg ved ikke, hvor mange skovlfulde der er tilbage. Jeg tæller det næste kvarter.\n\nTre ja’er i denne uge. Ikke plads til et fjerde, medmindre noget bliver minus.\n\nPause.\n\nStore tal. Pakker.\n\nTusind er ti hundreder. Hundrede er ti tiere. Du tænker i pakker, så du ikke holder alle enerne i luften. En lastbil er en pakke skovlfulde. En dag er en pakke timer. En uge er en pakke dage. Pakken har et navn. Navnet skal være ærligt.\n\nHvis pakken er løs ,  hvis en lastbil nogle gange er otte skovle og nogle gange femten ,  er navnet løgn. Så tæller du skovle, indtil pakken er ærlig, eller du vejer. Vejning venter. I dag: næg løse pakker i munden.\n\nSkakmat. Et stort tal, du ikke kan mærke, er teater. Sig: kan jeg se det foran mig. Hvis ikke, bryd det. Ti. Tyve. En time. En tank. Så er tusind mange pakker. Ikke magi. Magi er det, mænd kalder et tal, de ikke kan pege på.\n\nPause.\n\nTid som antal.\n\nKlokken fem til seks er én time. Den føles anderledes end tre til fire. Følelsen er ændring. Antallet er ét. Du må ikke lade følelsen stjæle antallet. Travl mund gør ikke én til to. Du kan bruge timen dumt eller klogt. Du kan ikke gøre den til to ved at have det travlt i munden.\n\nDage til det, I har lovet. I dag. I morgen. I overmorgen. Peg. Gruppér arbejdsdage, hvis lørdag ikke tæller. Nulpunkt: tæller i dag med. Sig det. To mænd, der ikke er enige om i dag, får to frister og ét skænderi.\n\nEn pause er et antal minutter, eller den er tåge. Lige om lidt er ikke et tal. Snart er ikke et tal. Vi tager den, når vi tager den er flugt.\n\nSig:\n\nÉn time til lastbilen, hvis den kommer til det, der blev sagt.\n\nTo dage, og i dag tæller.\n\nNul minutter ledige før det næste læs. Jeg spiser efter.\n\nPause.\n\nMennesker.\n\nFør du svinger: hvor mange kroppe i zonen. Nul er det eneste rigtige, eller du venter. Det er ikke matematik som kulde. Det er matematik som næstekærlighed. Du tæller, fordi han har et navn. Han er ét. Ikke trafik. Ikke de. Ét menneske.\n\nÉn i dødvinkel er ét for meget at overse. Tælling her er liv. Før plus, før minus, før nogen handling: tæl zonen. Hvis du tæller kegler, mens en krop er der, har du talt det forkerte først.\n\nPå pladsen: hvor mange, der faktisk graver, versus hvor mange, der står. Et tal, der kan gøre ondt. Skriv det ikke for at dømme i skjul. Brug det til at tale rent, eller til at tie, hvis du ikke er formand. Tælling er ikke sladder. Sladder er tælling uden ansvar.\n\nSig:\n\nNul i zonen. Jeg svinger.\n\nÉn bagved. Jeg venter.\n\nTo mænd, der graver. Tre, der står. Jeg siger det, hvis det er mit at sige. Ellers tier jeg.\n\nSkakmat. Du må ikke kalde et menneske for det tæller ikke. Alt, der har et navn og kan rammes af stål, tæller først.\n\nPause.\n\nEndnu et mærke. Neutral. Kun da.\n\nØverst: Tæl.\n\nVælg ét. Ikke fem. Ét.\n\nHvis zonen brændte: 0 og ordet zone. Eller 1 og ordet mand. Det mærke er hele timen værd, hvis det er det ærligste.\n\nHvis lastbilen brændte: tal eller ?. Ikke snart.\n\nHvis skyld brændte: minus og timer. Ikke en forklaring.\n\nHvis du ikke ved, hvor mange skovlfulde: ?. Ikke et opdigtet tyve.\n\nDato, hvis det skal leve til i morgen. Dato er plads. Den hjælper morgendagens mand, som er dig.\n\nTredive sekunder. Grimt. Sandt. Bogen væk.\n\nHvis dagen er for tæt til ét mærke, er dagen for tæt. Lyd er nok. Papir kan vente. Hullet kan ikke bruge din begravelse som antal.\n\nPause.\n\nBrint igen, kort, så atomet ikke bliver pynt, og så det heller ikke bliver magi.\n\nÉt proton. Ét elektron. Hvis du tæller forkert, er det ikke brint. Navnet følger tællingen. Vi tæller ikke for at tvinge himlen. Vi tæller, fordi verden respekterer antal. Du må også.\n\nDu tæller ikke protoner i dag. Du tæller det, der er i din størrelse. Grammatikken er den samme. Forkert i det små bliver forkert i det store, når det gentages. En glemt kegle er én. Ti glemte kegler er et mønster. Mønster er tælling over tid. Ophobning venter. I dag: det lille antal er ikke lille, hvis det gentages.\n\nIngen hemmelige tal i atomet, du skal bære som amulet. Ingen hellig syv. Ingen skjult kode i cifrene. Kristus er ikke et regnestykke. Tal er redskab. Redskab er ikke Herre.\n\nPause.\n\nPsykologi, kun fordi tælling rammer egoet.\n\nEgoet vil være hurtig. Tælling er langsom. Egoet vil være færdig. Tælling er ufærdig, indtil det sidste er peget. Egoet vil have ret. Tælling kan vise, at du tog fejl. Derfor springer mænd tælling over og kalder det erfaring. Erfaring, der nægter at tælle, er vane. Vane kan være dygtighed. Vane kan være blindhed. Tælling skiller de to.\n\nHvis forkert tælling ikke koster, kommer der mere forkert tælling. Hvis ærlig tælling koster skam, holder du op. Indret dagen, så ærlig tælling er billig: et papir, et stop, et tal, ingen forestilling. Skam hører hjemme ved løgn, ikke ved et nul.\n\nTilskyndelse er ikke et fint ord, du skal elske. Det er stregen mellem det, du belønner, og det, du får mere af. Beløn det ærligste tal. Straf ikke spørgsmålstegnet. Spørgsmålstegnet er voksen.\n\nPause.\n\nKristus, uden numerologi.\n\nVi tæller ikke for at tvinge Gud. Vi tæller, fordi løgn er af den onde, og tåge er løgnens fætter. Fadervor: brød i dag. Et antal dage: ét. Du får ikke i går tilbage. Du får ikke i morgen at køre i. Du får denne time. Tæl den som én. Brug den. Det er forvalterskab.\n\nVi leder ikke efter skjulte koder i vers. Vi leder ikke efter et tal, der åbner himlen. Vi tæller brød, timer, mænd, skovle, fordi troskab i det små er at se, hvad der er. Fem brød er fem, når de er fem. Du er ikke Ham, der mætter med det, der ikke var der. Du er den, der tæller kurven, eller den, der nægter.\n\nAmen til det, og så hænderne. Ingen andagt, der stjæler synet fra skovlen. Herren holde manden og maskinen. Du kører.\n\nPause.\n\nGentagelse, mens du kører. Ikke som skole. Som søm.\n\nTæl. Hvor mange. Hvilken plads. Hvilken retning.\n\nMetode: peg, gruppér, nulpunkt, gentag når det bærer vægt.\n\nNul er ærligt eller det er et ønske. Nul kræver kig.\n\nPosition: cifferets plads er værdi. Størrelsesorden, du kan mærke. Tredje er ikke tre.\n\nMinus er pil. Synligt minus kan bæres. Skjult minus styrer.\n\nPapir: streger, 0, minus, ?. Neutral. Tredive sekunder. Skriv for at tænke. Mærker, ikke dagbog.\n\nLøgne: en del, de kommer, vi har tid, jeg husker, det tæller ikke.\n\nTale: tal plus hvad. Ellers tåge.\n\nZonen først. Kroppe slår kegler.\n\nPakker skal være ærlige. Store tal, du ikke kan mærke, er teater.\n\nI dag er ét. Tæl den. Ingen magi i cifrene.\n\nPause.\n\nEndnu en runde i støvet, fordi én gentagelse ikke slår sømmet i.\n\nDu svinger. Skovlen tager. Før handlingen er der et antal: tom, én, fuld. Fuld er antal i rumfang, ikke i stykker. Du må gerne tælle skovlfulde som stykker, når lastbilen er målet. Du må gerne tælle rumfang, når hullet er målet. Vid, hvad du tæller.\n\nHvis lastbilen er væk, er skovlen stadig én. Plus i skovlen uden sted at lægge er en handling uden nævner. Det venter. I dag: tæl lastbilen som nul, hvis den er nul. Hold. Det er ikke dovenskab. Det er at nægte at lade munden plusse det, verden ikke har.\n\nRegn. Jorden ændrer sig. Ændring venter. I dag: tæl minutter, du stadig kan tage, eller sig ?. Våd jord, du gætter på, er et tal, du ikke har peget. Gæt er ikke tælling. Gæt er vejr i munden.\n\nFrost på ruden. Ét lag. Du ser gennem det. Synet er sløret. Sløret syn er grund til at tælle zonen langsommere, ikke til at tælle den som tom, fordi du ikke kan se. Det, du ikke kan se, er ikke nul. Det, du ikke kan se, er ?.\n\nPause.\n\nTo mænd tæller.\n\nDen ene fra venstre. Den anden fra højre. Ingen siger nulpunkt. To tal. Én bunke. Konflikten ligner karakter: han er sløset, han er stædig. Det var tælling. Sig, hvor du begynder. Sig, hvad du tæller. Sig, om i dag tæller med. Tre sætninger, der sparer en uge.\n\nHvis du er alene, kan du stadig være to mænd i ét hoved. Ét kig fra nærmeste. Ét kig, der hopper. To tal. Vælg ét nulpunkt. Tæl om, når det bærer.\n\nSkakmat. Uenighed om antal er ofte uenighed om start, slags eller navn. Ret det, før du retter manden.\n\nPause.\n\nJa’er og nej’er.\n\nHvor mange ja’er har du givet, som stadig lever. Tæl dem. Ikke for at piske. For at se, om det næste ja har et sted at bo. Hvis tallet er tre, og dagene er tre, er et fjerde ja et tyveri, medmindre noget bliver minus. Minus kan være et nej til det mindst vigtige. Nej er et tal: nul til den opgave.\n\nMåske er ikke et ja og ikke et nej. Måske er ?. Hvis den anden hører måske som ja, har du givet et tal, du ikke stod ved. Tal rent. Ja er ét. Nej er nul til den sag. Måske er jeg ved det ikke.\n\nSig:\n\nJeg har to ja’er, der lever. Jeg siger nej til den her, eller jeg siger, jeg ved det ikke før i aften.\n\nIkke: vi ser på det, sagt som et ja.\n\nPause.\n\nLækager.\n\nHvor mange gange har den slange sagt fra. Ét. To. Tre. Mønster. I dag tæller du gangene. Du opdigter ikke, hvor mange dråber der skal til, før den giver op. Du tæller det, du har set. Hvis du ikke har set, er det ?. Den er fin uden kig er løgnens fætter.\n\nPå papir, i neutral: et tal og ordet slange. Eller 0 og ordet slange, hvis du kiggede. Dato, hvis det skal leve. Ikke en historie om, at du plejer at mærke det. Plejer er tæthed. Tæthed er ikke ét kig. Tæthed venter som udfald. I dag: hvor mange gange, du har set det.\n\nPause.\n\nTænk på papir. Tredje mærke, hvis dagen giver et lovligt stop.\n\nNeutral. Stabil. Øverst: Tæl.\n\nTo felter, ikke en tabel. Bare to mærker under hinanden.\n\nFørste: det, du har peget. Tal eller streger.\n\nAndet: det, du havde i munden før pegen. Hvis de to er forskellige, er det timens nåde. Du så forskellen. Hvis de er ens, er det også nåde. Du fik lov at bekræfte.\n\nIngen sætning under. Ingen jeg burde. Mærker. Bogen væk.\n\nHvis du kun får ét felt: det ærligste. Et nul, du ikke ville se. Et antal, du havde blæst op. Et spørgsmålstegn, hvor der sad et falsk tyve. Det mærke er hele timen værd.\n\nPause.\n\nAt tale tælling, endnu en mundfuld, så sætningerne sidder.\n\nDer er fire rør.\n\nDer er nul rør. Jeg har kigget.\n\nDer er rør. Jeg har ikke talt. Spørgsmålstegn.\n\nJeg har to timer, før lastbilen, hvis det, der blev sagt, holder.\n\nNul mænd til at guide, så jeg kører langsommere.\n\nJeg skylder en time fra i går.\n\nJeg ved ikke, hvor mange skovlfulde der er tilbage. Jeg tæller den næste kvarter.\n\nÉn i zonen. Jeg venter.\n\nNul i zonen. Jeg svinger.\n\nTre lastbiler lovet. Én her. To er håb, indtil de er her.\n\nI dag tæller med. To dage, ikke tre.\n\nDen tredje lastbil. Ikke tre lastbiler.\n\nMinus to timer. Det står.\n\nTusind er mange pakker. Jeg kan se ti. Jeg kan se en dag. Jeg kan ikke se tusind som ét stykke.\n\nKorte. Tal plus hvad. Handling synlig, når handlingen kommer. I dag er synet antallet.\n\nPause.\n\nHvad time to vil tage, sagt igen, så stilladset ikke falder, mens du kører.\n\nNår du kan tælle, kan du handle. Plus er at samle antal. Minus er at fjerne. Gange er at gentage en bunke. Dividere er at dele en bunke. Skovlen er plus og minus. Lastbilen er gange, når den er så mange skovle. At dele et læs er dividere. I nat var handlingerne i atomet. I dag er de i stålet, når vi når dertil.\n\nIndtil da: Tæl. Hvad er der ét af? Hvad er der nul af? Hvad peger bagud?\n\nFem tegn. I dag det første. Kabinen origo. Papir i neutral. Jorden først.\n\nPause.\n\nSikkerhed, sagt som det første bud, fordi papir frister, når tallet klør.\n\nDu stopper, før du skriver.\n\nDu skriver ikke, mens skovlen er i jorden.\n\nDu skriver ikke, mens du kører.\n\nDu skriver ikke, fordi en stemme sagde Tæl, og du gerne vil være dygtig. Dygtig død er død.\n\nHvis dagen er for tæt, er dagen for tæt. Lyd er nok. Jeg elsker dit liv mere end serien. Det er rækkefølge. Jord. Maskine. Krop. Så streg.\n\nPause.\n\nEt stille billede, mens øjnene bliver på jorden.\n\nKabinen. Foran: Tæl. De andre tegn sidder alligevel. Du måler groft med øjet. Du ser, at eftermiddagen ikke er formiddagen. Du vælger under usikkerhed, når lastbilen måske ikke kommer. I dag er det antallet, vi træner, så de andre tegn får noget at stå på.\n\nNår et tal banker: fyrre. Fyrre hvad. Fyrre er ingenting, før det er fyrre skovlfulde eller fyrre minutter. Per hvad venter. I dag: hvad, og hvor mange.\n\nNår en historie banker: det er under kontrol. Oversæt: hvor mange. Hvis svaret er stemning, er kontrollen teater.\n\nNår frygten banker: der er for mange. For mange hvad. Peg. Eller sig ?. Frygt uden antal er vejr. Vejr må siges som vejr. Det må ikke siges som tælling.\n\nNår stoltheden banker: jeg har styr på det. Styr er et antal, du kan pege på, eller det er hat. Hat varmer. Hat graver ikke.\n\nPause.\n\nEftermiddag. Støv i lyset. Du har hørt meget. En time i øret er lang. Jorden er længere. Så går vi den samme sti med andre sten.\n\nFørste sten: ét og ikke-ét. Skelne. Brint. Hul. Ja.\n\nAnden sten: tre slags. Hvor mange. Hvilken plads. Hvilken retning.\n\nTredje sten: metode. Peg. Gruppér. Nulpunkt. Gentag ved vægt.\n\nFjerde sten: nul. Ærligt eller ønske. Kig.\n\nFemte sten: position. Cifferets plads. Størrelsesorden, du kan mærke.\n\nSjette sten: minus. Pil. Synligt. Samme dag.\n\nSyvende sten: papir i neutral. Streger. 0. Minus. ?. Skriv for at tænke.\n\nOttende sten: løgne. En del. De kommer. Vi har tid. Jeg husker. Det tæller ikke.\n\nNiende sten: tale. Tal plus hvad. Zonen først.\n\nTiende sten: Kristus. Ingen numerologi. I dag er ét. Forvalterskab. Hænderne tilbage.\n\nTi sten. Ikke mystik. Du må glemme otte, hvis du husker: peg, navngiv, nul er kig, papir i neutral.\n\nPause.\n\nDer kommer en time, hvor nogen sælger dig et antal, der er klædt som en gave.\n\nDet tager ikke lang tid. Hvor mange minutter. Hvis de ikke kan sige det, har de ikke talt. De har smil.\n\nDer er folk nok. Hvor mange. Til hvad. Nok er håb i arbejdstøj.\n\nVi har styr på det. Hvor mange læs. Hvor mange timer. Hvor mange i zonen. Styr uden de tre er teater.\n\nDu skal ikke blive sur. Du skal blive langsom i munden. Hvor mange? er to ord, der sparer uger. Hvad tæller vi? er tre, der sparer slåskamp.\n\nPause.\n\nPsykologi igen, kun som tælling, ikke som senere timer.\n\nDet, du ikke tæller, kan du belønne i skjul. Skjult plus i ja’er. Skjult minus i søvn. Skjult antal i fejl, der ikke tæller. Tæl dem, eller de tæller dig.\n\nSammenligning: han har flere lastbiler. Du bliver lille. Spørg: samme hul. Samme bund. Samme maskine. Samme ja. Hvis ikke, tæller du to baner som én. To baner som én er en måde at hade sig selv på uden tal. Tal kunne have reddet dig.\n\nSult. Træthed. Varme. De ændrer, hvor godt du peger. De er ikke tilladelse til at lade være. De er grund til at tælle om, når det bærer, og til at sige ?, når pegen er sløret. Ærligt sløret slår falsk skarpt.\n\nPause.\n\nViktor. Hvis øret stadig er åbent, er her ikke et nyt fag. Her er den samme time, sagt som mærker i en væg.\n\nSøm ét: Tæl. Hvad er der ét af.\n\nSøm to: tre slags. Mængde. Plads. Retning.\n\nSøm tre: peg, gruppér, nulpunkt, gentag ved vægt. Jeg kan tage fejl med én.\n\nSøm fire: nul er kig. Ingen uden kig er sløseri.\n\nSøm fem: cifferets plads er værdi. Tredje er ikke tre. Papegøje-tal er farlige.\n\nSøm seks: minus er pil. Se det samme dag. Verden skylder ikke plus for sved.\n\nSøm syv: papir i neutral. Streger. 0 og ét ord. Minus. ?. Skriv for at tænke. Mærker, ikke dagbog. Livet slår stregen.\n\nSøm otte: navngiv. Skovlfulde eller rumfang. Tal plus hvad. Zonen først. Kroppe slår kegler.\n\nSøm ni: pakker skal være ærlige. Store tal, du ikke kan mærke, brydes. I dag tæller med, hvis I siger det.\n\nSøm ti: Kristus er vejen. Tal er redskab. Ingen numerologi. Ingen andagt, der stjæler skovlen. I dag er ét.\n\nNu er det nok, hvis skovlen kalder. Hvis du bliver siddende og tygger, mens stålet skal tage, er det egoet, der vil have én lektion mere i luften. Giv det ikke den. Giv det en streg i neutral, senere. Eller giv det jorden.\n\nSlip lektionen. Hold tællingen. Hold jorden.\n\nKør.\n\nPause.\n\nEndnu en kabine, tættere på støvet, fordi tællingen skal kunne overleve en lastbil, der lader vente.\n\nDu holder. Neutral, hvis det er sikkert. Motoren i live eller ikke ,  det ved du. Øjnene på zonen først. Bagved. Spejl. Port. Så, og kun så, må bogen komme. Hvis zonen ikke er tom, kommer bogen ikke. Livet slår stregen. Altid.\n\nHvis bogen kommer: øverst Tæl. Under ét mærke. Ikke fem. Ét.\n\nLastbiler her: tal eller 0.\n\nSkovlfulde, du har peget: tal eller streger.\n\nTimer til det, I sagde: tal, eller ?.\n\nSkyld: minus og tal.\n\nTredive sekunder. Hånden tænker. Ingen sætning om, hvordan det føles. Mærke. Bogen væk. Hænderne tilbage.\n\nDet var fabrikken. Ikke et bevis på, at du er seriøs. Beviset er zonen, der er talt, og manden, der kommer hjem.\n\nPause.\n\nSkakmat i ladet.\n\nLadet er fyldt, eller det er det ikke. Jeg syntes, den var fuld er et barn, der taler til stål. Stålet svarer med vægt. Vægt er mål, og målet sover i dag. Antallet af bidder, der landede, er tælling. Tæl det, der landede. Ikke det, der svingede. Sving er bevægelse. Lad er resultat. Bevægelse kan føles som ære. Resultat er det, hjulene kører med.\n\nSig:\n\nSyv skovle i den her. Ikke en del.\n\nJeg har ikke talt ladet. Spørgsmålstegn. Jeg tæller den næste.\n\nNul lastbil. Jeg plusser ikke i skovlen til en tom vej.\n\nPause.\n\nSkakmat i zonen.\n\nÉn krop, du ikke talte, er ét for meget. Tom er nul. Nul skal være set, ikke antaget. Spejlet er tælling i glas. Hovedet, der drejer, er tælling i kød. Håb er ikke et spejl.\n\nSig:\n\nNul i zonen. Jeg svinger.\n\nÉn bagved. Jeg venter.\n\nJeg har ikke kigget. Jeg kigger nu. Jeg svinger ikke på et ønske.\n\nPause.\n\nSkakmat i uret.\n\nEn time er én. Travl mund gør den ikke til to. Træt krop gør den ikke til tre. Uret lyver sjældent. Manden lyver oftere, fordi træthed føles som flere, og når arbejdet glider, føles det som færre. Følelsen er et signal. Den er ikke tællingen.\n\nSig:\n\nÉn time til pause. Ikke snart.\n\nTo dage, og i dag tæller.\n\nNul minutter ledige før næste læs.\n\nPause.\n\nTænk på papir. Sidste lovlige mærke i denne time, hvis dagen giver det.\n\nNeutral. Stabil. Omgivelser set.\n\nØverst: Tæl.\n\nTre mærker, ikke en tavle. Under hinanden.\n\nFørste: port. Streger. Femte på tværs. Eller tal.\n\nAndet: 0 og ét ord, hvis nul er sandt. Eller ? hvis du ikke kiggede.\n\nTredje: pil og tal, hvis skyld er der. Eller tomt, hvis den ikke er.\n\nDato, hvis det skal leve.\n\nIngen jeg burde. Ingen vejr i linjer. Skriv for at tænke. Grimt. Sandt. Bogen væk.\n\nHvis du allerede vidste det og bare stemplede, var det show. Hvis hånden fandt det, var det arbejde.\n\nPause.\n\nKristus, sidste gang i denne time, uden tal som amulet.\n\nVi tæller ikke for at åbne himlen. Vi tæller, fordi tåge er løgnens fætter, og løgn er af den onde. Hyrden ved, om der er nioghalvfems eller hundrede. Ikke fordi nioghalvfems er helligt. Fordi ét mund er ét mund. Kærlighed tæller, så den kan mætte og hente.\n\nIngen kode i cifrene. Ingen det var meningen, fordi viseren stod pænt. Meningen sidder i troskab. I ord. I den mand til venstre. Cifrene tjener det. De styrer det ikke. Hvis et tal bliver et tegn fra himlen, har du bygget et alter af grammatik. Riv det ned. Behold grammatikken. Knæl et andet sted.\n\nFadervor: brød i dag. Ét. Du får denne time. Tæl den. Brug den. Amen, og hænderne. Ingen sløjfe, der stjæler skovlen.\n\nPause.\n\nViktor. Transmissionen for time ét er færdig, når jorden kalder, ikke når egoet vil have én runde mere i luften.\n\nDu skelner. Du nægter tåge. Du tillader tomt. Du respekterer rum. Du giver gæld en pil. Du skriver kun i neutral. Du tæller zonen, før du tæller kegler.\n\nJeg peger. Jeg styrer ikke skovlen. Kristus er vejen. Tal er redskab.\n\nTime to kommer i øret, når du tænder den. Plus. Minus. Gange. Dividere. Indtil da: Tæl. Hvad er der ét af. Hvad er der nul af. Hvad peger bagud.\n\nFem tegn. I dag det første. Kabinen origo. Papir i neutral. Jorden først.\n\nSlip lektionen. Hold tællingen. Hold jorden.\n\nKør.\n"</script>
