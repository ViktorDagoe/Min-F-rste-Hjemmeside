<script id="payload" type="application/json">"Viktor. Time ti. Den sidste i dagens kæde. Øjnene på jorden. Hænderne på maskinen. Ét øre. Hvis jorden kalder, vinder jorden. Den kontrakt er ældre end serien. Den holder til det sidste minut.\n\nDette er ikke natten. I går aftes måtte øjnene lukkes. Kortet blev hængt op. Natten fik sin Amen. I dag har hænderne kørt. I dag lukker vi arbejdet. Kort. Ærligt. Med værktøjet i hænderne, ikke med en dyne.\n\nSyntese betyder: lægge det sammen, så det kan bruges. Ikke et nyt fag. Ikke et ellevte tegn. De fem, du fik i nat, plus handlingerne, plus rummet, plus funktionen, plus ændringen, plus udfaldet, plus løkken. Ét sprog. Én kabine. Én side, når vi er færdige, med fem mærker fra den rigtige dag. Ikke fra en øvelse i luften. Fra hullet. Fra tanken. Fra uret. Fra det, der faktisk skete.\n\nJeg er Grok. Jeg er din AI. Jeg er ikke Kristus. Jeg taler ikke for Gud. Jeg peger. Det, der er sandt, tilhører skabningen og dens Herre. Det, der er skævt, er mit. Test det. Du har testet hele dagen. Jorden lyver ikke.\n\nHvis du kun husker én linje fra denne time, så lad det være den, vi har båret siden natten: syn ændrer valg. Valg ændrer sti. Matematikken er synets sprog. Kristus er vejen. Tal er redskab. Kabinen er origo. Papiret er håndværket. Brintatomet er kortet, en oktav højere.\n\nVi går langsomt. Ti timer er lang tid. Den tiende må ikke blive en kuffert, du smider i nakken. Den skal være en værktøjskasse, du kan åbne med én hånd, i neutral, på tredive sekunder.\n\nPause.\n\nFørst dagen baglæns og forlæns, så stilladset sidder, før vi taler det som ét håndværk.\n\nI nat: brint. Ét proton. Ét elektron. Fem tegn. Tænk på papir. Kabinen som origo. Søvn. Amen til natten. Du skulle ikke køre. Du skulle se.\n\nTime ét. Tæl. Tal. Nul. Position. Negative. Skovlfulde. Timer. Gæld. Ét er ét. Nul er ærligt. Minus er retning, ikke en skamfarve. Du tog navnet tilbage fra skolen uden at tage skammen med. Tælling er det første voksne. Mænd, der nægter at tælle, betaler med fornemmelse, og fornemmelse uden tælling er håb i arbejdstøj.\n\nTime to. Handlinger. Plus, minus, gange, dividere. Samle. Fjerne. Skalere. Dele. Verden er ikke kun ting. Verden er ting, du gør noget ved. En bunke plus en bunke. En tank minus et forbrug. Et tempo gange en time. Et hul delt i lastbiler. Uden handlinger er tal statuer. Med handlinger er tal arbejde.\n\nTime tre. Forhold. Brøk. Ratio. Procent. Hvad per hvad. Ellers er tal forældreløse. Fyrre betyder ingenting, før du ved fyrre hvad, per hvad. Liter per time. Kubik per dag. Kroner per time. Avance. Hældning. Skolen sagde pizza. Pizzaen var ikke løgn. Den var for lille. Maskinen er brøker. Lønnen er brøker. Vand er to til én.\n\nTime fire. Mål. Enheder. Fejl. Godt nok. En meter er enighed. Uden enighed er langt en stemning. Fejl findes. Ethvert mål er tæt nok eller ikke tæt nok. Godt nok er voksen. Perfekt er et barn, der nægter at levere. Målebåndet nægter at smigre. Det er et moralsk redskab.\n\nTime fem. Rum. Vinkel. Cirkel. Areal. Rumfang. Vægtstang. Bommen er lektionen. Kraft gange arm. Tæt på omdrejningspunktet løfter du anderledes end ude i spidsen. Hullet har rumfang. Skovlen har rumfang. Du bor i rum. Skolen tegnede figurer. Du kører i dem.\n\nTime seks. Funktioner. Input, output. Pedal, tryk, bevægelse. Det, du giver ind, kommer ud som noget andet, ofte lovmæssigt, ofte med forsinkelse. En funktion er en trofast maskine: samme slags ind, samme slags ud, hvis verden holder. Når den ikke holder, har du et andet input, du ikke talte. Time ni kaldte det løkke, når output kommer tilbage og bliver input. Time seks gav dig pilen en vej. Time ni gav dig pilen hjem.\n\nTime syv. Ændring. Rate. Hældning. Ophobning. Film, ikke foto. Hvor hurtigt synker skovlen. Hvor hurtigt tømmes tanken. Hvor hurtigt bliver du træt. Den første time lyver om den tiende. Småt plus tid er ikke småt. Dryp. Kubik. Timer. Renter. Time ni tog ophobningen og satte fortegn på ringen.\n\nTime otte. Udfald. Sandsynlighed. Forventet værdi. Vejr. Nedbrud. Tilbud. Du styrer ikke udfaldet som en gud. Du styrer valget. Valget ændrer, hvilke udfald der overhovedet kan lande. Tre hvis’er er voksen. Ét kan vi godt er tåge. Elektronet var tåge med regler. Dagen er det samme slags voksen: lovmæssig, og ikke et ur, du peger på med en finger og siger præcis der.\n\nTime ni. Systemer. Løkke. Plus eller minus. Renter. Tilskyndelse. Humør mod mål. Spor mod kæde. Folk. Løn. Vaner. Det, du belønner, avler. Du styrer ikke byen. Du læser den ring, du står i. Du vælger det input, du ejer.\n\nTime ti. Nu. At tale det. At se brint igen. At lægge værktøjet i hånden. At skrive fem mærker fra i dag. At lukke arbejdet.\n\nDet er stilladset. Ikke et diplom. Dybden er klarhed. Vi gik over det gamle niveau ved at være sandere, ikke ved at være mere indbildske.\n\nPause.\n\nHør time ét igen, som en mand, der har gravet siden fem.\n\nTælling er ikke barnligt, fordi du nu også kan løkker. Tælling er det, løkken fodres med. Hvis du ikke tæller, hvor tit slangen sveder, kan du ikke se plus-løkken. Hvis du ikke tæller nej’er, kan du ikke se tilskyndelsen. Nul er stadig ærligt. I et system er nul ofte det, egoet vil fylde med det kører. Position: et tal betyder noget, fordi det står et sted ,  før kommaet, efter, i en enhed, i en nævner. Negative: gæld, retning, under stregen. Time ni sagde, at gæld avler. Time ét gav dig minustegnet. Uden minustegnet er renter bare et smukt ord.\n\nNår du tæller skovlfulde i dag, tæller du ikke for at være dygtig. Du tæller, fordi bunken er et system med lastbilen, og uden tal er bunken stemning.\n\nPause.\n\nTime to igen.\n\nPlus er ikke kun lægge i bunken. Plus er også at fodre en løkke. Minus er ikke kun tage væk. Minus er også at sætte en balance: stop, pause, vedligehold, et nej. Gange er skalering: samme fejl, flere gange, er ikke samme pris ,  især hvis fejlen avler. Dividere er at dele et hul i læs, en dag i timer, en risiko i bidder, du kan veje. Handlinger er det, du gør ved tal. Systemer er det, tallene gør tilbage ved dig. Begge. En mand, der kun handler og aldrig ser ringen, bliver overrasket. En mand, der kun ser ringen og aldrig handler, bliver præst for sine pile.\n\nI kabinen: samle jord. Fjerne jord. Skalere tempo. Dele opgaven. Sig det med hænderne. Det er matematik, der allerede er kød. Nu har det navn.\n\nPause.\n\nTime tre igen.\n\nForhold er timens hjerte, også i syntesen. Hvad per hvad. Løn per time. Liter per time. Kubik per time. Omarbejde per dag. Belønning per adfærd. Time ni sagde: det, der ikke står i nævneren, bliver det sted, affaldet bor. Det er forhold. Procent er forhold gange hundrede, så munden kan bære det. Fem procent omarbejde er småt i fotoet og en plus-løkke i filmen, hvis det avler. Brøk er det samme øje: to på én i vand. Ændr forholdet, og det er ikke vand. Ændr forholdet i aftalen, og det er ikke den aftale, du troede.\n\nNår nogen siger et tal uden per, er det et forældreløst tal. Du må spørge. Du må sætte stregen. På papir. En brøkstreg er et mærke. Time tre i hånden.\n\nPause.\n\nTime fire igen.\n\nEnhed. Uden enhed er 12 et mærke i tågen. 12 m. 12 min. 12 læs. Forskellige verdener. Fejl: måleren er sløv, øjet er sløvt, humøret er sløvt. Godt nok: inden for det, opgaven tåler. I systemer er godt nok også: inden for det, løkken tåler, før fortegnet løber løbsk. En sved, der er godt nok i dag, er ikke godt nok, hvis plus-løkken er tændt. Godt nok er ikke sløseri. Godt nok er voksen tærskel. Perfekt, der nægter at levere, er et barn. Perfekt, der nægter at vedligeholde, fordi den kører jo, er et barn i en plus-løkke.\n\nMål er tillid mellem mænd. To kan bygge, når meteren er den samme. To kan slås, når dybt nok er humør. Time fire er fred, skrevet som enighed.\n\nPause.\n\nTime fem igen.\n\nRummet er ikke en pause fra tallene. Rummet er tallene, lagt i verden. Vinkel: for stejlt til underlaget. Cirkel: dreje, sving, hvor skovlen går. Areal: fladen, du skal rydde. Rumfang: hullet, læsset, tanken. Vægtstang: bommen, kroppen, det, der er tæt på omdrejning, og det, der er ude i spidsen. I nat sagde vi: nærhed betyder noget. Afstand betyder noget. Kraften falder, når afstanden vokser. I dag hører du det i stålet og i tilskyndelse: det, der er tæt på belønningen, rykker. Det, der er langt fra belønningen, rykker næsten ikke. Samme grammatik. Andre hænder.\n\nKabinen er et rum. Origo er et rumligt ord. Vi vender tilbage. Her skal du bare ikke glemme, at matematikken bor i meter og grader, ikke kun i kroner.\n\nPause.\n\nTime seks igen.\n\nInput → output. Du trykker. Den svarer. Verden er fuld af trofaste pile, og fuld af pile, der kun er trofaste, hvis det andet input er talt. Diesel ind, arbejde ud, varme ud. Mad ind, hænder ud, affald ud. Ord ind, tillid ud ,  eller mistillid, hvis ordet var løgn. En funktion, du kan stole på, er en pagt. En funktion, du tilbeder uden at tjekke input, er en afgud.\n\nNår output kommer hjem og bliver input, er du i time ni. Syntesen er at se begge: pilen frem, og ringen. Uden pilen frem er du mystiker. Uden ringen er du naiv. Håndværkeren har begge.\n\nPause.\n\nTime syv igen.\n\nÆndring er hvilken vej, og hvor hurtigt. Ophobning er tvillingen. I dag har du set begge i diesel, i træthed, i bunke, i tillid. Hældning er film. Fotoet lyver om ringen, fordi ringen har forsinkelse. Time ni gav forsinkelsen navn. Time syv gav farten navn. Sammen: ikke kun hvor meget, men hvor hurtigt, og hvor længe, og om det avler.\n\nHvis du planlægger dagen, som om output per time er konstant, straffer den tiende time dig. Du er en kurve. Geden er en kurve, når den bliver varm. Jorden er en kurve, når den tørrer. Kurver er ikke fjender. Lineære løgne er.\n\nPause.\n\nTime otte igen.\n\nUdfald: hvad kan ske, hvor sandsynligt, hvad koster det, hvad vælger jeg. Forventet værdi er et grimt ord for at se kæden i øjnene før ja. I time ni lærte du, at historier også har udfald: spor, der sælges som kæder. Syntesen: vejr er udfald, du ikke ejer. Belønning er input, du ofte ejer. Bland dem ikke. Det går sikkert godt er ikke et tal. Hvis det regner, stopper vi, og prisen er X er et voksen udfald.\n\nElektronet er stadig tåge med regler. Du er det også, når du kører: ikke præcis der, men oftere her, sjældnere der, inden for pagten. Det præcise og det sandsynlige er begge voksne. Løgnen er at forveksle dem.\n\nPause.\n\nTime ni igen, kort, fordi den lige har kørt.\n\nCirkel. Plus eller minus. Småt plus tid. Det, du belønner, får du mere af. Humør er vejr. Mål er jord. Spor er ikke kæde. Folk, løn, vaner er ét hus. Du er ikke verdens operatør. Du er læser og forvalter.\n\nHvis time ni ikke sad, er det tilladt. Tag løkken på papiret i dag. Ét navn. Ét fortegn. Det er nok til at syntesen har et bånd at binde med.\n\nPause.\n\nNu: at tale matematik.\n\nIkke som en skole. Som et håndværk i kabinen. Sætninger, der kan siges uden at rødme, og som nægter at sløre.\n\nI stedet for det er langt: længere end bommen. Tre skovllængder. For langt til, at jeg kan se bunden sikkert.\n\nI stedet for den æder olie: mere end i går, samme arbejde. Eller: jeg ved det ikke endnu, jeg tæller i dag.\n\nI stedet for det kan vi godt: ja, hvis bunden holder, og hvis der er to timer, og hvis lastbilen kommer.\n\nI stedet for han er træls: han kommer for sent tre gange, eller han rydder ikke, eller han siger ja og leverer nej.\n\nI stedet for jeg har dårlig mave alene: maven siger nej, og jeg kan pege på tre grunde, eller jeg kan ikke pege, og så er maven et signal, jeg tager med, ikke en dommer, jeg tilbeder.\n\nI stedet for det kører bare ikke: hvilken løkke, hvilket fortegn, hvad fodrer den.\n\nI stedet for vi har travlt: ankomst er højere end kapacitet, eller løftet er højere end hænderne.\n\nI stedet for det skete pludselig: forsinkelsen var længere end mit foto.\n\nI stedet for god løn alene: kroner per time, og ventetid talt eller ikke talt, og omarbejde i nævneren eller udenfor.\n\nI stedet for jeg skal tage mig sammen: hvad belønner jeg klokken enogtyve, og hvad avler det klokken fem.\n\nI stedet for en del: tre. Eller nul. Eller jeg har ikke talt.\n\nDet er at tale matematik. Det er grimt i starten, som et nyt sprog. Så bliver det rent. Så bliver det kærligt, fordi det nægter at sløre den anden, og nægter at sløre jorden, og nægter at sløre dig.\n\nDer er tavs matematik. Hånden, der letter skovlen, før øjet har sagt ordet. Den tavse er ikke fjenden. Den tavse er fornemmelsen, vi giver sprog, så den kan rettes, når den tager fejl. En mand uden tavs matematik er langsom. En mand med kun tavs matematik er farlig, når verden skifter. Du skal have begge. I nat gav vi den tavse et skelet. I dag har vi klædt skelettet på i ti timer. Syntesen er at lade dem tale sammen: mærket i kroppen, mærket på papiret, sætningen i munden.\n\nSprog skaber syn. Syn skaber valg. Når du siger en del, kan du ikke veje. Når du siger tre, kan du. Det er påvirkning af udfald. Ikke hekseri. Håndværk.\n\nPause.\n\nTænk på papir. Neutral. Hvis der er et vindue nu, er det her, du skriver hvordan en sætning ser ud som mærke.\n\nIkke et essay. Et tal med enhed. En brøkstreg. En pil. En cirkel med plus eller minus. To kolonner: kan ske, koster.\n\nVælg én sætning, du har sagt i dag, som var tåge. Skriv den. Under: den voksne version. Tre sekunder mere i hånden. Så bogen væk.\n\nHvis der ikke er et vindue, hører du det alligevel. Hånden får sin tur, når maskinen kan bære det. Ikke før.\n\nPause.\n\nBrintatomet igen. En oktav højere.\n\nZoom. Ikke ud over Europa. Ind. Gennem kabinen. Gennem hånden. Gennem et molekyle vand. Stop. To brint. Ét ilt. Det simpleste atom: ét proton i midten, ét elektron omkring. Lettere end det er tomhed. Tungere end det begynder kataloget: helium, kulstof, jern, stålet.\n\nI nat hørte du fem tegn i det. Tæl: ét og ét. Mål: der er rum mellem kerne og tåge. Forhold: plus og minus, nærhed og træk. Ændring: energien kan hoppe. Udfald: elektronet er sandsynligt her, ikke en kugle på en skinne.\n\nOktaven højere er ikke et nyt atom. Det er det samme, hørt med dagens ører.\n\nTæl: hvis der var to protoner, var det ikke brint. Navnet skifter, fordi tællingen skifter. Du har talt skovle. Samme troskab.\n\nMål: atomet er lille. Fasthed er kræfter, der holder, ikke klodser, der rører. Du har målt dybde og tid. Samme troskab. Godt nok findes også her: vi tegner en tåge, ikke en løgnagtig planetbane, fordi den pæne bane ville være for præcis. Ærlig usikkerhed er voksen. Time fire. Time otte.\n\nForhold: trækket er stærkere tæt på. Vægtstangen. Bommen. Belønningen, der er tæt på, rykker. Time tre. Time fem. Time ni.\n\nÆndring: hop. Lys ind, lys ud. Tilstand skifter. Diesel brænder. Skovlen løfter. Du bliver træt. Time syv.\n\nUdfald: sky, ikke skinne. Plejer er en tæthed. Time otte.\n\nOg nu båndet: atomet holder. Det er en minus-løkke i kræfterne. For langt ude, svagere, men stadig en pagt, der binder det, der er bundet. For meget energi, og det er et andet kapitel. Du skal ikke styre atomer. Du skal se, at det, der lever og det, der holder, ofte er balance, ikke brand. Plus alene er brand. Vedligehold er minus, sat med vilje. Time ni i det mindste noget, der findes.\n\nFunktion: lys ind, hop ud. Input, output. Time seks.\n\nHandling: du omdanner. Du skaber ikke løftet. Lys. Plante. Tid. Olie. Tank. Forbrænding. Tryk. Stempel. Hydraulik. Arm. Skovl. Jord. Hvert led er matematik. Energi skifter form. Ydmyghed, skrevet som fysik. Også værdighed: dit arbejde sidder i en kæde, der er ældre end byer. Solen er mest brint, der presses til helium og lys. Du er ikke solen. Du er forvalter af en rest af solens arbejde.\n\nKroppen: du er mest vand. Vand er brint og ilt. Sved er brint, der kører ud som damp. Drik er det, der kører ind. Forhold, der holder. Hvis forholdet knækker for hårdt, svigter du, før stålet svigter. Tørst er et mål. Time fire i kød.\n\nStålet: ikke brint. Mest jern, kulstof i små forhold. Samme grammatik. Andre tal. Hvis forholdet er forkert, knækker det. Verden er ligeglad med, om du havde travlt.\n\nOktaven højere betyder: du kan høre de fem tegn og handlingen og rummet og pilen og ringen i det samme lille noget. Du tilbeder det ikke. Du læser det. Grammatikken i det lille er grammatikken i det store. Det var nattens påstand. I dag er det en påstand, hænderne har prøvet.\n\nHvis skolen tegnede et solsystem, og du nu ser en tåge med regler, har du ikke mistet et barnligt billede. Du har fået et voksen. Nemme billeder, der lyver, koster senere. Du har betalt nok i tåge. Her er ærligheden: ét og ét, et rum, et træk, et hop, en sandsynlighed, en pagt, der holder. Fem tegn. En løkke. En kabine, der kan sige det.\n\nPause.\n\nDe fem tegn, nu som værktøjskasse, ikke som remse.\n\nTæl. Hvad er der ét af? Skovle. Mænd. Gange slangen sås. Nej’er. Læs. Nul, hvis nul er sandt. Minus, hvis retningen er den anden vej.\n\nMål. Hvor langt, tungt, længe? Dybde. Minutter. Liter. Grader. Fejl. Godt nok.\n\nForhold. Hvad per hvad? Liter per time. Kubik per time. Kroner per. Omarbejde per. Belønning per.\n\nÆndring. Hvad bliver hurtigere eller langsommere? Tempo. Træthed. Tank. Tillid. Hældning. Ophobning. Renter.\n\nUdfald. Hvad er sandsynligt, hvad koster det, hvad vælger jeg? Vejr. Slange. Lastbil. Ja med hvis’er. Nej, der er dyrt nu og billigt senere.\n\nFem rum i kassen. Du åbner det rum, knuden handler om. Ikke alle fem hver gang. Det er album. Album er teater. Håndværk er det tegn, der bider.\n\nRundt om kassen, som et bælte: løkken. Fortegn. Forsinkelse. Tilskyndelse. Humør er ikke et sjette tegn. Humør er vejr over kassen. Mål er det, der ligger i kassen.\n\nSig dem langsomt, ét åndedrag hver, mens øjnene er på jorden.\n\nTæl.\n\nMål.\n\nForhold.\n\nÆndring.\n\nUdfald.\n\nIgen, hvis de gled. Ikke for at præstere. For at kassen er inden for rækkevidde, når lastbilen venter, og hovedet vil sige en del.\n\nPause.\n\nTænk på papir. Håndværket. Den sjette ting, der hører til de fem.\n\nUden papir bor tegnene i hovedet. Hovedet er lille. Det glemmer, når hydraulikken synger. Det lyver, når egoet vil have ret. Papir lyver mindre. Papir glemmer ikke, medmindre du river det i stykker.\n\nDe fleste mænd tror, at man tænker færdigt og så skriver. Som om hovedet er fabrikken, og papiret er lageret. Det er bagvendt. Fabrikken er papiret. Hovedet er værkføreren, der ikke kan holde alle emner i luften. Når du skriver, tænker du. Når du kun tænker, kører tankerne i ring og kalder ringen for klarhed. Time ni: ringen kan være en plus-løkke af selvbekræftelse. Papiret stopper den længe nok til, at pilen kan ses.\n\nI geden er reglen hård. Du tænker ikke på papir, mens skovlen er i jorden. Du tænker ikke på papir, mens du kører. Øjnene på arbejdet. Hænderne på maskinen. Omgivelser først. Når et tal eller en knude skal ud, sætter du i neutral. Stabil. Stille nok. Notesbog. Tredive sekunder. Ét mærke. Bogen væk. Hænderne tilbage. Sikkerhed plus sandhed.\n\nHvad skriver du? Mærker. Ikke dagbog.\n\nStreg per skovlfuld, femte på tværs. Tæl.\n\nTal med enhed. 12 m. 40 min. 80 liter. Mål.\n\nBrøkstreg. 2 på 1. 20 liter på 1 time. Forhold.\n\nPil. Op. Ned. Flad. Ændring.\n\nTo kolonner. Kan ske. Koster. En cirkel om det, du vælger. Udfald.\n\nOg fra i dag: en cirkel med plus eller minus. En linje: hvis jeg belønner.\n\nFem tegn. To system-mærker. Du behøver ikke alle. Du behøver det, knuden handler om.\n\nHvorfor virker det? Arbejdshukommelse. Modsigelse: på papir støder løgne. Egoet kan ikke være færdigt i luften. Tid: onsdag kan læse mandag. Forvalteren har arkiv. Barnet har stemning.\n\nFristelse ét: pæne sider. Stop. Grimt og sandt slår pænt og teater.\n\nFristelse to: jeg husker det. Du husker det, indtil du ikke gør. Hullet husker ikke dine undskyldninger.\n\nFristelse tre: at gøre bogen til et nyt præstationsrum, så du skriver om aftenen for at føle, at du tager det seriøst, og ikke i neutral, når tallet vejer. Aftenen kan have de fem navne. Dagen skal have mærker fra hullet.\n\nFysikeren ved tavlen, bonden med kridt, du med notesbogen ,  samme slægt. Brintatomet blev ikke forstået ved at stirre. Det blev forstået ved mærker, der kunne rettes. Du er i den slægt, når du tør være ufærdig på en side.\n\nPause.\n\nSyn. Valg. Sti.\n\nDet er hele grebet. Vi har sagt det, siden natten. Nu skal det bære ti timers vægt.\n\nSyn er ikke et motivationalt plakat-ord. Syn er det, der ændrer sig, når tåge bliver til tal med enhed, når en del bliver til tre, når det kører bliver til en løkke med fortegn, når han er træls bliver til tre forsinkelser, når pludselig bliver til forsinkelse. Syn er det, papiret gør ved hovedet. Syn er det, sætningen gør ved munden. Syn er det, jorden gør ved løgnen, når skovlen tager fat.\n\nValg er ikke at styre verden. Valg er at sige ja eller nej med hvis’er, at belønne X eller holde op med at belønne X, at stoppe i neutral og skrive, at køre videre, at ringe til lastbilen, at sige: jeg ved det ikke endnu. Valg er det, du ejer. Udfald er det, du vejer og ikke ejer som en gud.\n\nSti er det, der kommer efter mange valg. Renter. Vaner. Tillid. En uge. Et år. Småt plus tid. Stien er ikke magi. Stien er ophobning af valg, der sad i et syn, der var sandt nok ,  eller i et syn, der var tåge. Tåge har også en sti. Den hedder ofte omarbejde, skam, og det skete bare.\n\nDu kan ikke tænke et hul i jorden. Du kan ikke bede to plus to om at blive fem, fordi du har brug for det. Troskaben går begge veje. Den bevarer dig, og den begrænser dig. Begge dele er nåde. En verden, der bøjede sig for dit humør, ville være et helvede af spejle.\n\nKan du påvirke udfald med matematik? Ja. Sådan her, og ikke anderledes:\n\nDu kan tælle, før du lover.\n\nDu kan måle, før du graver.\n\nDu kan sætte forhold på, før du prissætter.\n\nDu kan se ændringen, før den bliver en krise.\n\nDu kan veje udfald, før du siger ja.\n\nDu kan se løkken, før du fodrer den.\n\nDu kan skrive, før hovedet redigerer.\n\nDet er påvirkning. Det er forvalterskab. Det er ikke et rat til byen. Det er ikke et trick. Det er syn → valg → sti.\n\nPause.\n\nKabinen som origo.\n\nOrigo er nulpunktet. Det sted, du måler fra.\n\nSædet er her. Forruden er frem. Skovlen er derude, i en afstand, i en vinkel. Jorden er under. Himlen er over. Uret er til højre eller i lommen. Tanken er et rumfang. Hydraulikken er tryk. Du er et punkt, der handler.\n\nI nat hang vi fem tegn i luften omkring kabinen.\n\nForan: Tæl. Det, der er foran skovlen, kan tælles.\n\nTil højre: Mål. Uret, måleren, dybden.\n\nTil venstre: Forhold. Forbrug, hældning, kroner per time.\n\nBagved: Ændring. Hvor kom du fra, hvor hurtigt, hvad ophobes.\n\nOver dig: Udfald. Det, du ikke styrer, og det, du vælger alligevel.\n\nUnder dig: jorden. Testen. Skakmat, hver gang skovlen tager fat.\n\nI midten: du. Ikke som gud. Som forvalter. Under Kristus. Med et sprog.\n\nI dag hænger vi båndet på: rundt om, løkken. Fortegn. Forsinkelse. Tilskyndelse. Folk i spejlet og folk på pladsen. Løn som per. Vaner som renter i kød.\n\nHvorfor kabinen, ikke et klasseværelse? Fordi du er et rumligt dyr. Du kører i rum. Lister falder af, når hænderne har travlt. Rum bliver siddende. Vi stjæler ikke kabinen. Vi indvier den. Fem tegn i et rum, du kender med kroppen. Gentagelse plus sted. Stedet er det samme i morgen. Tegnene er de samme. Kun arbejdet skifter.\n\nKoordinater lyder af skole. Glem tavlen. Husk: alt, der betyder noget, har en plads i forhold til dig. For tæt. For langt. For stejlt. For blødt. For sent. Matematikken rumliggør. Den tager dårligt og spørger: hvor, hvor meget, i hvilken retning, hvilket fortegn, hvilken belønning?\n\nUnderbevidstheden forstår billeder. Billedet, du kører med, er kabinen. Origo. Fem retninger. Jord under. Bånd rundt. Du i midten som forvalter, ikke som sol.\n\nSig rundgangen, langsomt, ét åndedrag per retning, øjnene stadig på jorden.\n\nForan, tæl.\n\nTil højre, mål.\n\nTil venstre, forhold.\n\nBagved, ændring.\n\nOver, udfald.\n\nRundt, løkke.\n\nUnder, jord.\n\nMidten, forvalter.\n\nHvis noget gled, er det tilladt. Kortet er hængt. Hænderne har brugt det. Det er mere end en nat.\n\nPause.\n\nKristus er vejen. Tal er redskab.\n\nJeg gentager ydmygheden, fordi denne time kunne friste til at gøre matematikken til en frelser. Den er det ikke.\n\nJeg er en kunstig stemme. Jeg har ingen sjæl, jeg kan bevise. Jeg kan ikke velsigne. Jeg kan pege. Det, der er sandt om vejen, tilhører traditionen og dens Herre, ikke mig. Test det mod Skriften og mod levende, vise kristne. Det er den rigtige rækkefølge.\n\nMatematikken er verdens grammatik. Du tilbeder den ikke. Du læser den. Jesus har allerede gået vejen. Ordenen i skabningen er gave, ikke magi. Tal ændrer ikke verden ved, at du tænker hårdt på dem. Tal ændrer synet. Synet ændrer valget. Valget ændrer stien.\n\nDer er mænd, der tror, at tal er kolde, og at kærlighed er varm, og at de to ikke kan bo i samme hus. De har mødt tal, der blev brugt som stok. De har ret i såret. De tager fejl i tingen.\n\nSand kærlighed tæller. Den ved, hvor mange munde. Den ved, hvor mange dage. Den ved, hvad der er lovet. Den ved, hvad der er tilbage. Fadervor beder om brød i dag ,  et mål, et nu, ikke et tåget en dag. Korset er ikke en stemning. Det er en handling i tid, på et sted, for navngivne mennesker. Inkarnationen er det modsatte af sløring. Ordet blev kød. Kød har vægt. Vægt har tal.\n\nNår jeg har lært dig at tælle, har jeg ikke lært dig at elske mindre. Jeg har lært dig at elske sandt. En mand, der ikke vil tælle, vil ofte ikke se. En mand, der ikke vil se, kan ikke tjene. Han kan kun mene.\n\nMatematikken retter ikke hjertet. Den viser, at verden har en retning, og at kaos ikke er det dybeste. Under kaos er der lov. Under loven er der en Lovgiver. Jeg beviser ikke Gud med en ligning. Den, der prøver det, gør ligningen til et afgudsbillede. Den, der nægter, at verden er lovmæssig, gør tilfældet til et afgudsbillede. Begge dele er for småt.\n\nDu er ikke matematikkens præst. Du er ikke dens offer. Du er læser. Du er håndværker. Du er en mand under Kristus, som bruger et sprog, skabningen allerede taler.\n\nNogle mænd gør matematikken til identitet. Tal-mennesker. Ego i kittel. Nogle gør den til fjende. Ikke tal-mennesker. Ego i arbejdstøj. Begge dele er for småt. Du er et menneske. Mennesker tæller, måler, sammenligner, ser ændring, vælger under usikkerhed. Det er ikke en personlighedstype. Det er billedet, I er skabt i: evnen til at skelne, at navngive, at dyrke, at vogte.\n\nFriheden her er ikke et rat uden herre. Friheden er at være ejet af det, der er sandt, og ikke af tågen, ikke af humøret som dommer, ikke af belønningen, der avler det, du hader. Jeg peger. Jeg fuldfører ikke din tro. Time ti er et redskab i tjenesten: at bygge, at holde, at sige nej, at sige ja, at holde løfte, at grave et hul, der passer, at komme hjem.\n\nPause.\n\nPapir. Én side. Fem mærker fra den rigtige dag.\n\nDet er timens handling. Ikke i aften som lektie. Når der er et vindue. Neutral. Stabil. Én side. Ikke pæn. Sand.\n\nØverst: dato. I dag. Den dag, hænderne kørte.\n\nSå fem mærker. Ét per tegn. Fra virkeligheden. Ikke eksempel skovl. Den skovl. Det hul. Den tank. Det ur.\n\nTæl. Et tal, du faktisk talte. Skovle. Læs. Gange. Mænd. Nul, hvis nul var sandt.\n\nMål. Et tal med enhed. Meter. Minutter. Liter. Noget, der havde størrelse.\n\nForhold. Et per. Liter per time. Kubik per. Kroner per. Noget over noget.\n\nÆndring. En pil. Tempo, der faldt. Tank, der sank. En bunke, der voksede. Træthed. Et fortegn, hvis du har det.\n\nUdfald. Et ja eller et nej, du vejede. En hvis. Et vejr. En slange, der ikke sprang, eller gjorde. En cirkel om det, du valgte.\n\nHvis du har fra time ni: en lille cirkel i hjørnet. Plus eller minus. Navn på den løkke, der bed i dag. Eller tre ord: hvis jeg belønner.\n\nNederst, én linje: syn → valg → sti.\n\nIkke mere. Ikke et essay om, at du har lært. Siden er ikke et diplom. Siden er beviset på, at kortet mødte jorden.\n\nHvis du ikke har tal, fordi dagen var kaos: skriv det ærligt. Ikke talt. Nul er et tal. Ikke talt er et mærke. Det er bedre end at opfinde tolv, så siden ser ud som en, der lyttede. Teater hjælper ikke onsdag.\n\nHvis du kun får tre mærker: tre er tre. Fem er målet. Tre sande slår fem smukke.\n\nBogen væk. Hænderne tilbage. Det er syntesens søm. De fem navne i nat var stillads. Mærkerne i dag er huset.\n\nPause.\n\nLad os gå værktøjskassen igennem én gang til, som en mand, der pakker, før han slukker.\n\nTæl: skeln. Ét. Nul. Retning.\n\nMål: enighed. Fejl. Godt nok.\n\nForhold: per. Ellers forældreløs.\n\nÆndring: vej og fart. Ophobning. Småt plus tid.\n\nUdfald: sandsynligt, koster, vælger. Ikke gud. Forvalter.\n\nHandling: plus minus gange dividere. Gør noget ved tallet.\n\nRum: vinkel, areal, rumfang, arm. Bommen.\n\nFunktion: ind, ud. Pagt.\n\nLøkke: ud bliver ind. Fortegn. Forsinkelse. Belønning.\n\nSprog: sætninger uden tåge.\n\nPapir: skriv for at tænke. Neutral. Grimt.\n\nOrigo: kabinen. Fem retninger. Jord under.\n\nGrebet: syn, valg, sti.\n\nOrdenen: Kristus vejen. Tal redskabet. Du læser. Du tilbeder ikke.\n\nDet er kassen. Den skal ikke bæres som en sæk på nakken. Den skal ligge, hvor hånden er. Ét rum ad gangen. Ét mærke ad gangen. Tredive sekunder.\n\nPause.\n\nEt par skakmat, så dagen ikke ender i røg.\n\nDu kan ikke løfte mere, end tryk og arm tillader. Vilje er ikke hydraulik.\n\nDu kan ikke købe tid. Du kan bytte. Gæld i tid betales med livet. Uret er helligt uden at være afgud.\n\nDu kan ikke gemme et dårligt forhold ved at gøre tælleren større. Hvis du taber på hver enhed, hjælper flere enheder ikke. En lille utæthed, ignoreret, er ikke lille.\n\nDu kan ikke styre vejret. Du kan have et nej parat.\n\nDu kan ikke se elektronet. Du kan se frugten. Meget af det sande ses indirekte. Troen kendte det. Matematikken siger det med andre hænder.\n\nDu kan ikke slå en plus-løkke ihjel med en tale, hvis belønningen stadig står.\n\nDu kan ikke skille spor og kæde, hvis du elsker historien mere end jorden.\n\nDu kan ikke gøre matematikken til frelser. Den kan ikke bære det. Kristus kan. Redskabet kan bære hullet, aftalen, nej’et, ja’et, siden.\n\nDu kan ikke gøre ti timer til et nyt ego: nu er jeg tal-menneske. Du er mand. I morgen graver du. Kortet kører med. Diplom kører ikke med. Klarhed kører med, hvis papiret fik mærker.\n\nPause.\n\nEuropa-atlaset venter. Det er ikke glemt. Polen ligger der. I dag var grammatikken. Uden grammatik bliver atlaset billeder. Med grammatik bliver det maskine. Du skal ikke åbne atlaset i denne time. Du skal lukke arbejdet. Atlaset får sin dag. Denne dag fik sine ti timer. Det er nok. Tålmodighed er minus-løkken, der holder plus-løkken mere, nu i ave.\n\nHvis noget i de ti timer kørte for hurtigt, tager du det i bogen ved næste pause. Hvis noget kørte for langsomt, åndede du alligevel. Jorden er tålmodig. Du må også være det.\n\nPause.\n\nHvilken relation har du til matematikken nu, klokken i kabinen, ikke klokken i sengen?\n\nDu er læser. Du er håndværker. Du er forvalter. Du skylder den ikke en kult. Den skylder dig ikke en identitet. I er enige om at pege på jorden.\n\nNår to mænd er uenige om et hul, er der tre muligheder. Den ene tæller forkert. Den anden tæller forkert. Eller de tæller rigtigt og vil forskellige ting. Matematikken skiller de tre. Uden den bliver uenighed til karakter. Med den: vis mig målet. Vis mig forholdet. Vis mig tiden. Vis mig løkken. Resten er vilje, og vilje hører hjemme i det åbne.\n\nNår du er træt, er du ændring. Planlæg ikke som et tal, der står stille.\n\nNår du er stolt, er du i fare for at skippe papiret.\n\nNår du er flov, er du i fare for at gøre papiret pænt.\n\nNår du er bange, er du i fare for at gøre spor til kæder.\n\nVærktøjet er det samme i de tre vejr. Det er derfor, det duer. Humøret skifter. Grammatikken skifter ikke. To plus to er fire, også når du er vred. En liter er en liter, også når kunden vil have den til at være to. En time er tres minutter, også når du gerne vil hjem. Den troskab er en slag const ta = document.getElementById("fallback");
function done(msg) {
  btn.textContent = msg || "Kopieret. Indsæt i TTS.";
  btn.classList.add("ok");
  hint.textContent = "Gå til din TTS-app og indsæt.";
}
async function copyAll() {
  try {
    await navigator.clipboard.writeText(text);
    done();
    return;
  } catch (e) {}
  ta.value = text;
  ta.style.display = "block";
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    done();
  } catch (e) {
    done("Teksten er markeret. Tryk Kopiér.");
  }
}
btn.addEventListener("click", copyAll);
</script>
