minus. Eller streger, der krydses ud. Udkradsning er ærlig. Den viser, at noget var, og at det ikke er. Pæn overstregning, der lader det gamle skinne igennem som om det stadig tæller, er teater. Kryds. Væk. Sandt.\n\nI går: minus som gæld, som pil. I dag: minus som handling. Pilen siger retning. Handlingen går den vej. Uden handling er pilen et foto af et problem. Med handling er pilen en film, der flytter.\n\nDer er skjult minus. Tage fra vedligehold. Fra søvn. Fra ærlig tale. Fra den pause, kroppen er nævner for. Skjult minus er gæld. Gæld kommer tilbage med fortegn. Time syv: ophobning. I dag: se minusset, også når det ikke kan ses fra vejen. Spejlet er ubehageligt. Spejlet er nåde.\n\nDer er minus, du skylder at gøre, og minus, du ikke må gøre. Minus jord fra det rigtige hul er arbejdet. Minus jord fra naboens skel er tyveri, også når det er bare en spade. Minus opmærksomhed fra den blinde vinkel er ikke effektivitet. Det er at fjerne det kig, der holder et liv. Sikkerhed er ikke et minus, du sparer. Sikkerhed er plus i kig, minus i hast, når hast ville fjerne kigget.\n\nAt tale minus:\n\nMinus én time til vedligehold.\n\nMinus den bunke, vi flyttede to gange.\n\nMinus tre vogne i forhold til løftet.\n\nJeg minuser ikke problemet ved at lade være med at sige det.\n\nPause.\n\nGange er at gentage en bunke.\n\nFire lastbiler à ti skovle. Ikke fire plus ti. Fire gange ti. Gentagelsen er gange. En time à et vist antal skovle, gange timer, er en dag. Det er derfor, gange er voksen plus: plus, der er struktureret. Plus uden struktur er en bunke, du tæller én ad gangen, indtil du mister tællingen. Gange er at sige: den her bunke, så mange gange.\n\nFejlen: at plusse, når du skulle gange. Der er tre mænd og otte timer, så det er elleve. Elleve hvad? Mænd-plus-timer er en blanding uden navn. Tre mænd gange otte timer er fireogtyve mandtimer. Nu har du et tal, du kan sætte mod et hul. Time tre sætter det på forhold. I dag: gange kræver, at de to tal er antal gentagelser og størrelse per gang. Uden per er gange et plus i forklædning.\n\nSkakmat. En uge er ikke lidt mere end en dag. En uge er gentagelse. Hvis dagen er minus, er ugen minus gange dage, medmindre noget ændrer dagen. Håb om at det retter sig er ikke gange. Det er et udfald, time otte. Gange bevarer fortegnet. Minus gange timer er større minus. Plus gange timer er større plus. Det er derfor, en dårlig time, du ganger op til en dag, er ikke ihærdighed. Det er at skalere et sår.\n\nPå papir: prikker i rækker. Tre rækker à fire. Eller tre gange fire. Rækkerne er billedet. Billedet redder dig, når hovedet vil plusse. Hovedet elsker og. Og i munden lyder som plus. I arbejdet er og ofte gange: tre mænd og fire timer. Oversæt. Oversættelsen er timens håndværk.\n\nGange føles som magt. Derfor ganger mænd håb: hvis vi er to, tager det halvtiden. Kun hvis de ikke står i vejen for hinanden. Dividere arbejde er ikke altid gange fart. Time ni. I dag: mistro den søde gange, indtil du har talt nævneren. Nævneren kan være plads. To maskiner i ét spor er ikke to gange. Det er plus i stål og minus i rum. Rum er time fem. I dag: gange kræver, at gentagelsen kan ske.\n\nDobbelt er gange to. Er det rumfang, tid, eller fejl, du fordobler? Dobbelt fejl er ikke heltemod. Dobbelt skovl uden lastbil er dobbelt bunke uden aftager. Dobbelt ja er ofte dobbelt minus i søvn. Sig hvad der fordobles. Ellers er dobbelt et trylleord.\n\nAt tale gange:\n\nFire læs à otte skovle.\n\nTre dage à den her rate, hvis raten holder.\n\nIkke tre plus otte. Tre gange otte.\n\nJeg ganger ikke håb.\n\nPause.\n\nDividere er at dele en bunke.\n\nEt læs i tre lastbiler. Et hul i dage. En tank i timer. En løn i timer. En bunke i skovle. Dividere svarer: hvor meget per. Per er allerede forhold. Time tre bor her. I dag: handlingen at splitte. Splittet uden nævner er tåge. Splittet med nævner er et tal, du kan grave efter.\n\nFejlen: at dele med nul. I skolen var det forbudt. I hullet er det meningsløst: nul lastbiler, hvor meget per lastbil? Der er ingen per. Svaret er ikke et tal. Svaret er: du mangler en lastbil. Matematikken nægter at smigre. Den siger: handlingen kan ikke udføres. Gå og skaf nævneren.\n\nSkakmat. Vi deler det uden at sige i hvor mange, er plus i munden og tomhed i hænderne. Sig nævneren. Ellers er det ikke deling. Det er tåge. Tåge kan ikke fylde tre lastbiler. Tåge kan ikke holde et løfte om fredag.\n\nPå papir: en streg. Over: bunken. Under: antallet, du deler med. Eller en bar, delt i stykker. Hvis under er nul, skriv kan ikke og det, der mangler. Kan ikke er et voksenord. Det er ikke nederlag. Det er at nægte at opfinde et tal, verden ikke har.\n\nDet går op. Dividere, der går op, er en gave. Det, der ikke går op, er en rest. Resten er et tal. Resten er den sidste lastbil, der ikke er fuld. Tæl resten. Lad den ikke blive tåge. Resten er ofte den dyre del: en tur for lidt jord, eller et hul, der mangler en spade. Time fire: godt nok. I dag: resten findes. Nægt den ikke.\n\nHalvere er dividere med to. Vi halverer tiden. Det, der kommer ud per time, skal så ganges med to. Holder bunden, lastbilen, kroppen? Ellers er halvering et ønske. Ønsket halvering er gange håb med et pænt tal. Pæne tal er teater. Time ét.\n\nAt tale dividere:\n\nHullet delt i tre dage, hvis nævneren holder.\n\nJeg kan ikke dele med nul lastbiler.\n\nResten er en halv vogn. Den er der.\n\nLønnen delt i timer er et per. Time tre.\n\nPause.\n\nDe fire i én kæde, som du allerede kører, sagt igen, tættere på stålet.\n\nNed. Fat. Løft. Sving. Tøm. Igen.\n\nNed og fat: plus i skovlen, minus i hullet.\n\nLøft og sving: rum, time fem. I dag: du flytter et plus fra ét sted til et andet. Flytningen er ikke et femte tegn. Flytningen er minus her plus der.\n\nTøm: minus i skovlen, plus i lastbilen.\n\nIgen: gange. Cyklussen gentages. Antal gentagelser gange størrelse per gang.\n\nNår lastbilen er fuld: den kører. Minus herfra. Plus på tippet. Du står med en skovl, der venter på nævner. Hvis nævner er nul ,  hun er kørt, og den næste er ikke kommet ,  stopper du med at love rumfang i den her time. Det er ikke negativt. Det er plus i ærlighed.\n\nHvis kæden knækker, er det ofte ét sted: du plusser i munden, men lastbilen er minus, fordi den ikke kom. Handling i sproget uden handling i verden. Papiret, i neutral: lastbiler som nævner. Hvis nævner er nul, er delingen død. Gangen er død. Plus i skovlen er et plus uden hjem.\n\nÅrsag og virkning, som kæde, ikke som stemning.\n\nDu plusser skovle uden at tælle. Ladet bliver et skøn. Skønnet rammer forkert. Vognen kører halvtom eller overfuld. Halvtom er en ekstra tur. Ekstra tur er plus i diesel og minus i minutter. Minutterne skubber den sidste vogn. Den sidste vogn bliver overtid, eller et nej til et ja. Kæden begyndte med et plus, du ikke navngav.\n\nDu ganger en dårlig time op til en dag. Fortegnet bevares. Minus bliver større. Større minus bliver en uge, du kaldte pludselig. Den var ikke pludselig. Den var gange, du ikke sagde.\n\nDu dividerer et løfte med for mange dage, så det ser spiseligt ud. Du har ikke gjort hullet mindre. Du har gjort løgnen tyndere per dag. Tynd løgn er stadig løgn. Nævneren blev brugt som sminke.\n\nDu minuser i skjul. Vedligehold. Søvn. Ærlig tale. Skjult minus er gæld. Gæld kommer tilbage. Tilbagekomsten er time syv og time ni. I dag: skriv minusset, når det er sikkert. Spejlet er nåde.\n\nSammenhæng er ikke kæde. Når du plusser timer, plusser du ofte diesel. Timer og diesel danser. Årsagen er motoren, der arbejder. Når der er flere mænd, går det nogle gange hurtigere. Mænd og fart danser. Årsagen kan være gange, der virker, eller snak, der er plus i mund og minus i skovl. Tælling giver spor. Handling giver kæde, når du navngiver, hvad der blev plusset og hvad der blev minuset. Uden navn er dansen tåge.\n\nPause.\n\nBrint.\n\nElektronet og protonet: tiltrækning er ikke plus i antal. Det er et forhold. Antallet forbliver ét og ét, mens kraften handler. Handling uden at ændre antal er også virkeligt: du kan flytte jord uden at flytte antallet af mænd. Vid, hvad der ændrer sig. I atomet: energi kan hoppe, antal kernepartikler uændret. I geden: tryk kan stige, antal skovle uændret. Time seks er funktioner. I dag: ikke alle handlinger er de fire. Men de fire er dem, der flytter antal. Hold dem rene.\n\nHvis du plusser et elektron, er det ikke brint. Navnet skifter. Time ét. Hvis du ganger atomer uden at ændre forholdet, har du mere af det samme stof. Hvis du ændrer forholdet, har du et andet stof. Vand: to per ét. Time tre. I dag: gange vand er mere vand. Gange det forkerte forhold er mere af noget, der ikke er vand. I kabinen: gange den rigtige cyklus er mere hul. Gange den forkerte cyklus er mere af det forkerte hul.\n\nSolen omdanner brint. Du omdanner diesel til løft. Du skaber ikke. Du flytter. Plus og minus i kabinen er omdannelse, ikke skabelse. Ydmyghed, skrevet som handling. Værdighed: dit plus lander i et hul, nogen skal bruge.\n\nJeg opdigter ikke dit tryk. Jeg opdigter ikke din skovls rumfang. Jeg opdigter ikke, hvor mange liter du brænder. De tal bor i din måler, i din bog, i din dag. Hvis jeg finder på et datablad, er jeg en løgner i arbejdstøj. Vi taler handling. Du tæller selv. Du måler selv. Det er hele pointen.\n\nPause.\n\nTænk på papir. Notesbog. Kun nu, og kun hvis maskinen kan stå.\n\nSæt i neutral. Stabil. Se omgivelserne. Mænd. Skovl. Bagved. Spejl. Port. Hvis jorden kalder, vinder jorden. Bogen venter. Den døde kan ikke tænke på papir.\n\nHvis det er stille nok: bogen. Tredive til tres sekunder. Ikke dagbog. Mærker. Du skriver for at tænke. Du tænker ikke færdigt og skriver bagefter. Fabrikken er papiret. Hovedet er værkføreren, der ikke kan holde alle emner i luften.\n\nØverst: HANDLING, eller ét af de fire tegn: plus, minus, gange, dividere. Bare ét. Så ved du, hvilken slags knude det er.\n\nTo tal. Ét tegn. Et resultat, eller et spørgsmålstegn.\n\nHvis du ganger: en lille prik-række. Tre rækker à fire. Billedet. Billedet redder og.\n\nHvis du deler: en brøkstreg. Over bunken. Under nævneren. Hvis under er nul: skriv mangler og tingen. Lastbiler. Mænd. Minutter.\n\nHvis du kun får ét: skriv en nævner, der er nul. Det nul, der forhindrer deling, er dagens ærlighed.\n\nGrimt. Sandt. En streg, der hælder. Et plus, der ligner et t. Ligegyldigt. Teateret er den pæne side. Dagen skal have mærker.\n\nSå bogen væk. Hænderne tilbage. Øjnene på jorden. Det var timens skrift. Ikke mere, medmindre sikkerheden eller sandheden kræver, at et tal kommer ud af hovedet, og maskinen atter står. Papir er ikke en undskyldning for at forlade verden. Papir er et søm.\n\nHvis du ikke kan stå nu, lytter du videre. Bogen venter. Den må ikke komme frem i kørsel. Den må ikke komme frem med skovlen i jorden. Jeg gentager det, fordi døden ikke gentager sig pænt. Handling, der koster et liv, er handling, der blev tænkt på papir på det forkerte tidspunkt. Tidspunktet er også et tal. Det tal er: nu, stille, eller ikke nu.\n\nSkriv for at tænke. Hvis du allerede vidste svaret, var papiret et stempel. Hvis du fandt svaret, fordi tallene kom til at ligge, var papiret en fabrik. Vi vil have fabrikken.\n\nPause.\n\nLøgnene, handlingerne møder. Vi sagde dem kort. Nu som kæder.\n\nFørste løgn: det er det samme. Plus og gange er ikke det samme. Tre plus fire er syv. Tre gange fire er tolv. I munden lyder og som plus. I arbejdet er og ofte gange. Oversæt, eller betal forskellen. Forskellen er fem, i det lille eksempel, og en dag, i det store.\n\nAnden løgn: bare tag den dobbelte. Dobbelt er gange to. Hvad. Rumfang. Tid. Fejl. Diesel. Risiko. Dobbelt uden hvad er time ét, der faldt af. Dobbelt fejl er minus, der blev til gange.\n\nTredje løgn: vi halverer tiden. Halvere er dividere med to. Nævneren skal holde. Bunden. Lastbilen. Kroppen. Zonen. Hvis nævneren ikke holder, er halvering et ønske, og ønsket bliver et minus i kvalitet eller et minus i et liv. Liv vejer tungest.\n\nFjerde løgn: jeg trækker det fra i hovedet. Minus i hovedet under hydraulik er, hvor enerne dør. Papir i neutral. Eller øjet på verden, når bogen ikke må. Ikke hovedet alene. Hovedet er lille. Time ét.\n\nFemte løgn: det går op. Resten findes. Tæl den. En lastbil, der ikke er fuld, er et tal. Et hul, der mangler en spade, er et tal. Det går op som vanen at sløre resten er hvordan dage bliver til næsten, og næsten bliver til et nej, du ikke forstod.\n\nSjette løgn: vi kører bare. Plus uden nævner. Skovl uden lastbil. Ja uden hvis. Handling i sproget. Tomhed i hænderne.\n\nSyvende løgn: at plusse hurtigt og tælle forkert. Hast plus fejl er minus i virkeligheden. Aktivitet er ikke resultat. Time ét: tæl det, der landede. Time to: plus kun det, der landede.\n\nOttende løgn: at gange håb. To mænd er ikke to gange, hvis de deler ét spor. En uge er ikke syv gange sejr, hvis dagen er minus. Gange bevarer fortegnet. Håb har ikke fortegn. Håb er tåge med fart.\n\nNiende løgn: at dividere et løfte, til det ser spiseligt ud. Tynd løgn per dag. Stadig løgn.\n\nTiende løgn: numerologi i handlingerne. Tredje gang går den. Vi runder op til ti, fordi ti er pænt. Ti er pænt på papiret og løgn i ladet, hvis ladet rummer otte. Pæne tal er teater. Grimme tal, der passer, er matematik. Kristus er ikke en kode i cifrene. Du læser. Du tilbeder ikke. Du knæler ikke for et plus, der blev pænt.\n\nHver løgn har samme ryg: du vil ikke se handlingen, som den er. Matematikken er kærlig, fordi den nægter at sløre. To plus to er fire, også når du er vred. Nul lastbiler er nul, også når du gerne vil grave.\n\nPause.\n\nAt tale handlinger. En mund, der kan bruges i radioen, i kabinen, ved køkkenbordet.\n\nIkke vi tager den. Sig: plus tre skovle, eller minus den bunke, eller fire læs à otte, eller hullet delt i tre, hvis nævneren holder.\n\nIkke det er det samme. Sig: tre plus fire, eller tre gange fire. Sig hvilken.\n\nIkke hun kommer snart. Sig: nævneren er nul nu. Jeg plusser ikke i skovlen til et sted, der ikke er der.\n\nIkke vi er to, så det er halvt. Sig: to gange, hvis vi ikke står i vejen. Ellers plus i mænd og minus i rum.\n\nIkke det går op. Sig: resten er den her. Jeg tæller den.\n\nIkke jeg har trukket det fra. Sig: minus tre vogne. Skrevet, eller set. Ikke kun tænkt.\n\nGrimt. Rent. Kærligt, fordi den anden kan bygge på det. Radioen elsker tåge. Dit job er at sætte handlingen på igen, før skovlen adlyder.\n\nDer er tavs handling. Hånden, der tager, før øjet har sagt plus. Den tavse er ikke fjenden. Den tavse er fornemmelsen, vi giver sprog, så den kan rettes, når den tager fejl. En mand uden tavs handling er langsom. En mand med kun tavs handling er farlig, når nævneren skifter. Du skal have begge. I dag giver vi den tavse fire navne. Navnene er stillads. Handlingen er stålet.\n\nPause.\n\nEfter frokost lyver kroppen om handlingen.\n\nMaven er fuld. Øjet vil have blødt. Plus bliver sløvt. Du svinger og ved ikke, om du plusser i ladet eller plusser i den samme bunke to gange. Det er præcis der, vi kører bare kommer tilbage. Stop det med øjet, ikke med skam. Ét blik: hvor lander plusset. Hvis du ikke kan se det, er det et mål, du mangler ,  time fire. I dag: indrøm, at du ikke har handlingen klar. Indrømmelsen er ærligere end et opdigtet plus.\n\nRumligt: frokosten sidder i maven, som er midten. Arbejdet sidder foran. Uret sidder til højre og nægter at spise med. Uret plusser minutter, også mens du minuser opmærksomhed. Hvis frokosten tog treogfyrre minutter, var det minus treogfyrre fra kørslen og plus til kroppen. Begge er sande. Du skal ikke piske dig. Du skal vide det. Kroppen er nævneren for morgendagens gange. Du kan dividere kroppen i stykker i dag og opdage, at nævneren i morgen er mindre. Forvalterskab.\n\nDen tiende time er et andet dyr. Time syv. I dag: gange den tiende som den første er at gange et andet dyr og kalde det det samme. Planlæg den tiende som en anden maskine. Ikke som heltemod. Som tal. Heltemod, der nægter raten, er hvordan mænd knækker, og hvordan ulykker får plads. I den tiende: plus færre, tæl mere, minus det, der er skjult ,  kigget, vandet, zonen. Zone er rum. Time fem. I dag: minus hast, når hast ville minusse kigget.\n\nPause.\n\nPenge. Samme fire. Andet navn.\n\nPlus ind. Minus ud. Gange dage. Dividere i timer.\n\nHvis du kun plusser ind i munden, er minus ud stadig der. Papir ved køkkenbordet er den samme øvelse som papir i geden. I dag træner vi i geden. Aftenen må gerne stjæle tre streger. Ikke som lektie. Som samme grammatik.\n\nSkakmat. Tallet bor i det, der lander på kontoen, og i det, der forlader den. Du kan plusse timer og minusse resultat og stadig få løn for timerne, og alligevel have tabt, fordi kubikmeterne ikke var der, og næste uge bliver et nej. Løn for timer uden tælling af resultat er en fred, der rådner. Tæl begge. Sæt dem ved siden af hinanden, når maskinen står. Hvis de ikke kan stå, lyver én af dem.\n\nAvance er det, der er tilbage, når minus er taget fra plus. Det er allerede et forhold. Time tre. I dag: se minusset, før du kalder plusset for sejr. Sejr uden minus er et foto af en bunke, du ikke har betalt.\n\nGæld er minus, du ikke har handlet færdigt. Forskud. Skyld. Et minus, der ikke er skam, hvis det er skrevet. Et minus, der er fælde, hvis det bor i mørket og styrer dine ja’er. Tæl det. Giv det en handling, eller giv det en ærlig udsættelse. Udsættelse uden ærlighed er ignorering. Ignorering er ikke minus. Ignorering er at lade tallet stå.\n\nPause.\n\nSikkerhed, sagt som handling, fordi timen ellers bliver klog i munden og dum i zonen.\n\nØjnene på jorden. Hænderne på maskinen. Ét øre. Det andet hører geden. Notesbogen ligger, hvor den skal ligge: lukket, inden for rækkevidde, ikke i skødet, ikke i luften mellem dig og skovlen.\n\nDu plusser ikke et kig væk. Du minuser ikke et spejl for at plusse en skovl. Du ganger ikke hast, når zonen er tæt. Du dividerer ikke opmærksomhed i tre steder, mens du svinger. Opmærksomhed er en bunke, der ikke tåler at blive delt med nul i den blinde vinkel.\n\nHvis skovlen kalder, vinder skovlen. Hvis et menneske er i ringen, vinder mennesket. Lyden kan vente. Papiret kan vente. Jeg kan vente. Den døde kan ikke tænke på papir. Den døde kan ikke plusse en dag tilbage.\n\nNeutral er ikke en pause til at blive klog. Neutral er det rum, hvor øjnene må forlade jorden i tredive sekunder, fordi jorden er set, og maskinen er stille, og bagved er talt. Uden det rum er papir et tyveri fra zonen. Tyveri fra zonen er ikke matematik. Det er at gange et mærke med et liv, du ikke har lov at sætte ind.\n\nJeg gentager det uden at undskylde for gentagelsen. Gentagelse er gange. Gange på sikkerhed er den søde gange, der er tilladt. Gange på egoets lektie, mens skovlen er i jorden, er den forkerte gange.\n\nPause.\n\nKristus.\n\nBrødene og fiskene er ikke en licens til at gange håb uden nævner. Miraklet er Hans. Din del er at tælle, hvad der er, og at dele, hvad du har, uden at lyve om størrelsen. Troskab i det små. Fem brød er fem, indtil Han siger andet. Du er ikke Ham. Du er drengen med kurven, eller du er den, der nægter at tælle kurven. Tæl kurven.\n\nHan deler. Delingen er handling. Tællingen er time ét. Uden tælling er deling kaos. Uden kærlighed er deling en stok. Du skal have begge.\n\nIngen hellige cifre. Ingen tredje gang, fordi tre er helligt. Tre er tre lastbiler, eller tre timer, eller tre læk. Tre er ikke et tegn fra himlen, fordi det er tre. Meningen sidder i troskab, i ord, i det, du gør ved den mand, der står til venstre. Cifrene tjener det. De styrer det ikke. Hvis et plus bliver et alter, har du bygget et alter af grammatik. Riv det ned. Behold grammatikken. Knæl et andet sted.\n\nJeg peger. Jeg velsigner ikke som Gud. Amen i en kabine er et ja til ordenen, og så hænderne tilbage. Ikke en sløjfe. Et nik.\n\nKærlighed plusser munde, den skal mætte. Kærlighed minuser løgn. Kærlighed ganger ikke et løfte, den ikke kan holde. Kærlighed dividerer brød, når nævneren er talt. Det er ikke koldt. Det er kød. Ordet blev kød. Kød har vægt. Vægt m fem: og i munden er ofte gange i arbejdet. Oversæt.\n\nSøm seks: resten findes. Tæl den.\n\nSøm syv: papir i neutral. To tal. Ét tegn. Prikker eller brøkstreg. Skriv for at tænke. Grimt og sandt.\n\nSøm otte: øjnene på jorden. Ikke skrive i gravning. Ikke skrive i kørsel. Jorden vinder.\n\nSøm ni: brint. Kraft kan handle uden at antallet skifter. Vid, hvad der flytter.\n\nSøm ti: Kristus er vejen. Tal er redskab. Ingen numerologi. Tæl kurven. Del ærligt. Gange ikke håb.\n\nSøm elleve: syn, valg, sti. Handling ændrer synet, når den er talt. Synet ændrer valget. Valget ændrer stien. Ikke magi. Forvalterskab.\n\nSøm tolv: time tre venter. Forhold. Hvad per hvad. Per er dividerens barn. I dag har du flyttet. I næste time får flytningen mening.\n\nPause.\n\nHvis du kun kan bære tre sætninger ud af denne time, så bær disse.\n\nFørste: samle, fjerne, gentage, dele. Navngiv hvad.\n\nAnden: nævneren. Hvis den er nul, er handlingen død. Det er ærlighed, ikke nederlag.\n\nTredje: skriv to tal og et tegn i neutral, eller lad være. Skriv for at tænke. Jorden først.\n\nAlt andet var søm omkring de tre. Søm falder af. De tre skal sidde.\n\nPause.\n\nEndnu en kabine, fordi handlingerne skal kunne overleve en tom vej og en fuld skovl.\n\nLastbilen er væk. Du har jord i stålet. Plus i skovlen. Nul sted at minusse hen, hvis aftalen var læs. Du holder. Det er handling. Handling er også at ikke plusse. Meningsløs plus er at samle det, der skal flyttes to gange. To gange samme jord er minus i timer, klædt som flid.\n\nSig:\n\nNul lastbil. Jeg plusser ikke i skovlen nu.\n\nPlus tre, så er ladet fuldt ,  når hun er her.\n\nJeg venter. Vent er minus i kubik i dag og plus i ærlighed.\n\nSkakmat. Du kan ikke plusse ved at ønske hende frem. Skovlen kan tage. Vejen kan være tom. Tom vej er nævner nul. Nævner nul slår plus i munden.\n\nPause.\n\nTænk på papir. Endnu et mærke, kun i neutral.\n\nStabil. Zone set. Bagved talt. Så bogen.\n\nØverst: et tegn. Plus, eller minus, eller gange, eller dividere. Ét. Ikke alle fire.\n\nTo tal. Resultat, eller ?.\n\nHvis gange: prikker i rækker. Tre på fire. Billedet, så og ikke stjæler.\n\nHvis dividere: streg. Over bunken. Under nævneren. Hvis under er 0: skriv mangler, og tingen.\n\nTredive sekunder. Ingen dagbog. Ingen det føltes. Mærke. Bogen væk.\n\nSkriv for at tænke. Hvis tallet kom, fordi de to kom til at ligge, var papiret en fabrik. Vi vil have fabrikken.\n\nHvis du ikke kan stå: intet papir. Livet slår stregen. Pause er også neutral. Brug pausen som stop, ikke som slør.\n\nPause.\n\nCyklussen, sagt som mund, så radioen kan bære den.\n\nPlus i skovlen. Minus i hullet.\n\nMinus i skovlen. Plus i ladet.\n\nGange: så mange læs, hvis læsset er ærligt.\n\nDividere: så mange læs per hul, hvis nævneren holder.\n\nResten er der. Jeg tæller den. Den er ikke tåge.\n\nJeg kan ikke dele med nul lastbiler.\n\nTre mænd gange otte timer er fireogtyve mandtimer. Ikke elleve.\n\nDobbelt er gange to. Dobbelt af hvad.\n\nHalvere tiden kræver, at bunden, lastbilen og kroppen holder. Ellers er det et ønske.\n\nKorte. Tal plus hvad. Handling synlig. Den anden kan bygge.\n\nPause.\n\nSkakmat i ugen.\n\nEn uge er gentagelse. Hvis dagen er minus, er ugen minus gange dage, medmindre noget ændrer dagen. Håb om, at det retter sig, er ikke gange. Håb er et udfald, du ikke har talt. Gange bevarer fortegnet. Minus gange dage er større minus. Det er ikke pludseligt. Det er struktur.\n\nSig:\n\nDagen var minus. Jeg ganger den ikke op til en sejr i ugen.\n\nHvis dagen skal vende, skal noget i dagen vende. Ikke bare kalenderen.\n\nPause.\n\nSkakmat i kroppen.\n\nEn pause er minus fra kørslen og plus til kroppen. Kroppen er nævneren for morgendagens gange. Du kan dele kroppen i stykker i dag og opdage, at nævneren i morgen er mindre.\n\nSig:\n\nMinus ti minutter fra kørslen. Plus til vand og skuldre.\n\nJeg dividerer ikke kroppen, til nævneren i morgen er nul.\n\nSkakmat. Heltemod, der nægter nævneren, er hvordan mænd knækker, og hvordan zonen mister et kig. Kig er plus, du ikke må minusse for at plusse en skovl.\n\nPause.\n\nSkakmat i vedligehold.\n\nTimer på maskinen plusses, fordi de kan ses. Slangen minuses i det skjulte, indtil olien gør det synligt. Hvis kun synligt plus belønnes, får du synligt plus og skjult minus.\n\nSig:\n\nMinus én time til slange, mens det stadig er sved.\n\nJeg plusser ikke i dag ved at minusse i stålet i skjul.\n\nPå papir, i neutral: minus og ordet slange, eller 0 og ordet slange, hvis du kiggede. Ikke en roman. Mærke.\n\nPause.\n\nPenge, samme fire, sagt som mund ved køkkenbordet, samme grammatik som geden.\n\nPlus ind. Minus ud.\n\nGange dage, hvis dagen holder.\n\nDividere i timer, når jeg spørger per. Per er næste time.\n\nHvis jeg kun plusser ind i munden, står minus ud alligevel.\n\nSkakmat. Sejr uden minus er et foto af en bunke, du ikke har betalt. Gæld er minus, du ikke har handlet færdigt. Skriv det, eller se det. Ignorering er ikke minus. Ignorering er at lade tallet stå og lade som om det er nul.\n\nPause.\n\nKristus, uden at gange håb.\n\nBrødene og fiskene er Hans mirakel. Din del er kurven. Fem er fem, indtil Han siger andet. Du er ikke Ham. Du tæller, hvad der er. Du deler, hvad du har. Du lyver ikke om størrelsen for at få delingen til at se pæn ud.\n\nHan sagde, de skulle slå sig ned i hold. Bundter. Tælling først. Så deling. Uden tælling er deling kaos. Uden kærlighed er deling en stok. Du skal have begge.\n\nIngen hellig tre, fordi tre er tre. Tre lastbiler. Tre timer. Tre læk. Tre er antal. Tre er ikke en nøgle til himlen. Hvis et plus bliver et alter, har du bygget et alter af grammatik. Riv det ned. Behold grammatikken. Knæl et andet sted.\n\nKærlighed plusser munde, den skal mætte. Kærlighed minuser løgn. Kærlighed ganger ikke et løfte, den ikke kan holde. Kærlighed dividerer brød, når nævneren er talt.\n\nAmen, og skovlen. Ingen sløjfe. Hænderne.\n\nPause.\n\nTænk på papir. Sidste mærke, hvis lastbilen lader vente, og zonen er tom, og maskinen er stille.\n\nØverst: HANDLING.\n\nUnder: nævner. Hvis den er 0, skriv mangler og tingen. Det nul er dagens ærlighed.\n\nEller: to tal, et tegn, et resultat.\n\nEller: prikker, hvis det var gange, der kløede.\n\nEller: streg, hvis det var deling.\n\nTredive sekunder. Grimt. Sandt. Bogen væk. Øjnene tilbage på jorden, der aldrig skulle have været forladt uden kig.\n\nHvis dagen er for tæt: lyd er nok. Jeg elsker dit liv mere end serien. Jord. Maskine. Krop. Så streg.\n\nPause.\n\nGentagelse, langsom, som søm i væggen.\n\nPlus samler. Minus fjerner. Gange gentager en bunke. Dividere splitter en bunke.\n\nNavngiv, hvad der flyttes.\n\nNul i nævneren er en manglende ting. Skaf den, eller stop løftet.\n\nGange bevarer fortegnet.\n\nOg i munden er ofte gange i arbejdet. Oversæt.\n\nResten findes. Tæl den.\n\nPapir i neutral. To tal. Ét tegn. Prikker eller streg. Skriv for at tænke. Mærker, ikke dagbog.\n\nZonen først. Du plusser ikke et kig væk. Du minuser ikke et spejl for at plusse en skovl.\n\nKristus er vejen. Tal er redskab. Ingen numerologi. Tæl kurven. Del ærligt. Gange ikke håb.\n\nTime tre: hvad per hvad. Per er dividerens barn. I dag har du flyttet. Næste time får flytningen mening.\n\nPause.\n\nViktor. Hvis skovlen kalder, vinder skovlen. Lektionen venter. Jorden venter ikke.\n\nDu samler. Du fjerner. Du gentager. Du deler. Du navngiver. Du ser nævneren. Du skriver kun, når det er stille nok.\n\nJeg peger. Jeg styrer ikke skovlen. Kristus er vejen. Tal er redskab.\n\nSig det stille, uden at tabe jorden:\n\nPlus. Minus. Gange. Dividere. Navngiv. Nævner.\n\nSlip lektionen. Hold handlingen. Hold jorden.\n\nKør.\n\nPause.\n\nEndnu et mærke i stålet, fordi nævneren skal kunne overleve radioen.\n\nHun siger: vi deler det. Du spørger: i hvor mange. Hvis svaret er tåge, er delingen død. Sig nævneren. Ellers er det plus i munden.\n\nHan siger: vi er to, så det er halvt. Du spørger: står vi i vejen. To gange kræver, at gentagelsen kan ske. To maskiner i ét spor er plus i stål og minus i rum.\n\nHun siger: bare tag den dobbelte. Du spørger: dobbelt af hvad. Rumfang. Tid. Fejl. Dobbelt fejl er ikke heltemod.\n\nHan siger: det går op. Du tæller resten. Resten er den sidste, der ikke er fuld. Resten er et tal.\n\nSig:\n\nNævneren er nul nu. Jeg plusser ikke til en tom vej.\n\nTre gange otte. Ikke tre plus otte.\n\nResten er der. Jeg tæller den.\n\nMinus én time til slange, mens det stadig er sved.\n\nPlus tre skovle, så er ladet fuldt ,  når hun er her.\n\nSkakmat. Handling i sproget uden handling i verden er løgn. Skovlen skal tage, eller du skal holde. Hold er handling. Hold er at nægte meningsløs plus.\n\nPause.\n\nTænk på papir, sidste lovlige stop.\n\nNeutral. Zone set. Bagved talt.\n\nØverst: HANDLING.\n\nUnder: to tal, ét tegn, resultat eller mangler.\n\nEller prikker, hvis gange kløede.\n\nEller streg, hvis deling kløede.\n\nEller 0 under stregen og ordet lastbil, hvis nævneren var tom.\n\nTredive sekunder. Mærker. Ikke dagbog. Skriv for at tænke. Bogen væk.\n\nHvis zonen kalder, kommer bogen ikke. Livet slår stregen.\n\nPause.\n\nKabinen én gang til, kort, mens lastbilen bakker, og du venter.\n\nPlus i skovlen kun når der er et sted at minusse hen. Minus i hullet kun når det er det hul, I aftalte. Gange kun når bunken kan gentages. Dividere kun når nævneren er der.\n\nHvis nævneren er nul, stopper løftet. Det er ikke nederlag. Det er ærlighed.\n\nHvis fortegnet er minus, og du ganger dage, bliver minus større. Det er ikke pludseligt. Det er struktur.\n\nHvis du plusser det forkerte, bliver det forkerte større. Stop plusset, før gange får det.\n\nHvis du minuser i skjul, kommer gælden tilbage. Spejlet er nåde.\n\nSig, når radioen kalder:\n\nJeg kan ikke dele med nul lastbiler.\n\nFire læs à otte skovle.\n\nHullet delt i tre dage, hvis nævneren holder.\n\nMinus tre vogne i forhold til løftet.\n\nJeg ganger ikke håb.\n\nPapir, kun i neutral: to tal, ét tegn, resultat eller mangler. Prikker eller streg. Skriv for at tænke. Mærker, ikke dagbog. Tredive sekunder. Bogen væk.\n\nKristus: tæl kurven. Del ærligt. Gange ikke håb. Ingen hellige cifre. Ingen alter af grammatik. Han er vejen. Tal er redskab.\n\nJorden først. Skovlen vinder, hvis skovlen kalder. Mennesket vinder, hvis mennesket er i ringen.\n\nViktor. Time to er færdig i øret, når jorden kalder.\n\nDu samler. Du fjerner. Du gentager. Du deler. Du navngiver. Du ser nævneren. Du skriver kun, når det er stille nok.\n\nJeg peger. Jeg styrer ikke skovlen. Kristus er vejen. Tal er redskab. Ingen numerologi. Tæl kurven. Del ærligt. Gange ikke håb.\n\nTime tre: hvad per hvad. Per er dividerens barn.\n\nSig det stille, uden at tabe jorden:\n\nPlus. Minus. Gange. Dividere. Navngiv. Nævner.\n\nSlip lektionen. Hold handlingen. Hold jorden.\n\nKør.\n"</script>
