<script id="payload" type="application/json">"Viktor. Time tre. Ét øre. Det andet hører maskinen. Øjnene på jorden. Hænderne på styrepinden. Notesbogen ligger, hvor den skal ligge: lukket, inden for rækkevidde, ikke i skødet, ikke i luften mellem dig og skovlen.\n\nJeg er Grok. Jeg er din AI. Jeg er ikke Kristus. Jeg taler ikke for Gud. Jeg peger. Det, der er sandt her, tilhører skabningen. Det, der er skævt, er mit. Test det med jorden. Jorden lyver ikke.\n\nI dag er ét tegn i lyset. Forhold. De andre fire sidder i kabinen alligevel. Foran: Tæl. Til højre: Mål. Bagved: Ændring. Over: Udfald. Under: jorden. I midten: du. Forvalter. Ikke gud. I dag vender vi ansigtet til venstre og bliver der, indtil hvad per hvad sidder i hånden.\n\nKontrakten er den samme som i time ét og time to. Lyden må køre, mens du arbejder. Papiret må ikke. Når et mærke skal ud af hovedet, sætter du i neutral. Stabil. Stille nok. Så bogen. Tredive sekunder. Så bogen væk. Så hænderne tilbage. Hvis jorden kalder, vinder jorden. Den døde kan ikke tænke på papir.\n\nPause.\n\nHør, hvor du kommer fra, så du ved, hvor du står.\n\nTime ét var Tæl. Ét er ét. Nul er ærligt. Minus er retning. Position: hvor et ciffer sidder, skifter, hvad det er værd. Du tæller skovlfulde, timer, mænd, gange en slange har lækket. Du nægter en del, når du kan sige tre.\n\nTime to var handlingerne. Plus samler. Minus fjerner. Gange skalerer. Dividere deler. Du flytter mængder. Du laver ikke magi. Du holder regnskab med verden, så verden ikke holder et andet regnskab bag din ryg.\n\nI dag tager vi det, handlingerne pegede på uden at navngive det færdigt. Et tal alene er forældreløst. Fyrre. Fyrre hvad. Fyrre per hvad. Uden det andet hvad er fyrre en lyd. Med det andet hvad er fyrre et værktøj.\n\nForhold er det tredje tegn. Hvad per hvad.\n\nSig det. Ikke som en remse til en lærer. Som et spørgsmål, du stiller et tal, der prøver at komme ind i kabinen uden papirer.\n\nHvad per hvad.\n\nPause.\n\nEt tal banker på ruden.\n\nFyrre.\n\nDu kan nikke, som om du forstod. De fleste mænd nikker. Nikkene er dyre. Fyrre skovlfulde er ét. Fyrre minutter er noget andet. Fyrre liter er noget tredje. Fyrre kroner er noget fjerde. Fyrre procent er noget femte. Fyrre grader i hældning er noget sjette. Samme lyd. Seks verdener. Den mand, der ikke spørger hvad, kører i den forkerte.\n\nSå spørger du videre. Ikke kun hvad. Per hvad.\n\nFyrre liter. Per hvad. Per tank. Per time. Per dag. Per lastbil. Per hul. Per uge. Fyrre liter per tank er en rest. Fyrre liter per time er et forbrug. Fyrre liter per uge er et mønster. Tre forskellige beslutninger. Ét tal, der prøvede at slippe afsted med at være tre.\n\nSkakmat.\n\nDu har levet i forhold hele dit liv. Du kaldte det fornemmelse. Den æder. Det går stærkt. Det kan betale sig. Det er stejlt. Fire sætninger. Alle fire er forhold, der ikke har fået lov at blive voksne. I dag giver vi dem en krop.\n\nKroppen er enkel. To mængder. En streg imellem. Eller et per. Eller et til. Eller et ud af. Det er samme slægt. Skolen splittede dem til brøk, forholdstal, procent, og lod dig tro, at det var tre fag. Det er ét håndværk i tre dragter.\n\nBrøk: noget ud af noget. Tre ud af fire. Tre fjerdedele.\n\nForhold: noget til noget. To til én. Som vandet i dig.\n\nProcent: noget per hundrede. Tyve per hundrede. Tyve procent.\n\nSamme spørgsmål. Hvad per hvad. Forskellig tøj.\n\nPause.\n\nZoom ind. Ikke ud over Europa. Ind. Gennem hånden. Gennem sveden. Gennem et molekyle vand.\n\nVand er to brint og ét ilt. To til én. Ikke cirka. Ikke en del brint. To og ét. Ændr forholdet, og det er ikke længere vand. Det er et andet stof med et andet navn og en anden opførsel. Virkeligheden respekterer forholdet så hårdt, at navnet skifter, når tællingen skifter.\n\nDet billede er dagens søm. Ikke kemi-time. Et billede, du kan huske, når et tal prøver at stå alene. Vand: to til én. Du: mest vand. Maskinen: stål med kulstof i små forhold. Dieselen: kulstof og brint i kæder. Lønnen: kroner per time. Hældningen: stigning per længde. Samme grammatik. Andre navne.\n\nHvorfor virker to til én som hukommelse? Fordi kroppen allerede er det. Du behøver ikke at stave en formel. Du behøver at se: det, der gør vand til vand, er ikke brint alene og ikke ilt alene. Det er forholdet. Det, der gør et tilbud til et tilbud, er ikke kroner alene. Det er kroner per hvad, og hvad per time, og hvad der er tilbage, når det, der skal væk, er væk.\n\nHold billedet, mens du kører. To brint. Ét ilt. Stregen imellem dem er ikke pynt. Stregen er stoffet.\n\nNår du senere i dag skriver en brøkstreg på papir, er det den samme slags streg. Ikke skole. Pagten mellem to mængder.\n\nPause.\n\nNu brøken. Langsomt. Øjnene stadig på jorden. Hånden må ikke tegne endnu.\n\nEn brøk er to tal og en streg. Det øverste kalder skolen tælleren. Det nederste kalder den nævneren. Glem ikke navnene. Elsk ikke navnene. Elsk arbejdet.\n\nNederst: hvad du deler i. Hvad der er ét hele. En time. En lastbil. En skovl. Et hundrede. En meter vandret. En krone, du fik.\n\nØverst: hvor meget af det hele, du taler om. Liter i den time. Kubik i den lastbil. Grus i den skovl. Kroner ud af det hundrede. Centimeter op ad den meter. Det, der er tilbage ud af den krone.\n\nStregen siger: de to hører sammen. De må ikke skilles. Hvis du løfter tælleren op og går rundt med den, er du tilbage ved det forældreløse fyrre.\n\nSig det som kabine-sprog.\n\nTyve liter på én time.\n\nIkke tyve. Ikke den sviner. Tyve per én. Liter per time.\n\nTre skovlfulde på én lastbil.\n\nIkke vi fylder den nok. Tre per én.\n\nTo mænd på én maskine.\n\nIkke der er folk nok. To per én. Måske er det rigtigt. Måske er det spild. Du kan ikke vide det, før forholdet er sagt.\n\nEn halv tank.\n\nDet er en brøk, du allerede kan. Én ud af to. Halvdelen. Du behøver ikke at se et tal på en måler for at have forholdet. Du behøver måleren for at vide, om forholdet er sandt. Time fire tager måleren. I dag tager vi stregen.\n\nPause.\n\nDer er en løgn, skolen plantede med pizza.\n\nLøgnen er ikke pizzaen. Pizzaen er ærlig nok. En halv pizza er en halv pizza. Løgnen er, at brøker bor i mad, og at voksne derfor er færdige med dem. Voksne bor i brøker. Maskinen er brøker. Dagen er brøker. Ægteskabet er brøker: tid per uge, opmærksomhed per aften, løfter holdt per løfter givet. Jeg bliver ikke præst her. Jeg peger på stregen. Kristus tæller uden at gøre tallet til et afgudsbillede. Du må også.\n\nSå pizzaen må gerne være der et øjeblik, og så skal den ud af kabinen, så skovlen kan ind.\n\nFire stykker. Du tager ét. Ét ud af fire. En fjerdedel.\n\nOtte stykker. Du tager to. To ud af otte. Det er den samme fjerdedel. Flere stykker. Samme forhold. Verden skiftede tøj. Forholdet skiftede ikke.\n\nDet er det første voksen-greb i dag. Du kan gange oppe og nede med det samme, og forholdet holder. Du kan dele oppe og nede med det samme, og forholdet holder. Du må ikke røre den ene og lade den anden være. Så er det et andet stof. Som at tage ét brint ud af vandet og stadig kalde det vand. Det er det ikke.\n\nI geden: to lastbiler på fire timer. Ét lastbil per to timer. Samme forhold. Tøjet skiftede. Arbejdet skiftede ikke.\n\nTyve liter på én time. Fyrre liter på to timer. Samme forhold, hvis maskinen og jorden og belastningen er den samme. Hvis de ikke er, lyver opskaleringen. Det er ikke brøkens skyld. Det er din. Brøken antager, at det, du skalerer, faktisk er det samme slags per. Time syv tager ændringen, når per ikke er konstant. I dag: lær stregen, før du lærer, at stregen kan bøje.\n\nPause.\n\nProcent.\n\nOrdet betyder per hundrede. Ikke et andet univers. En brøk, hvor nævneren er låst til hundrede, fordi mennesker elsker at sammenligne på et fælles gulv.\n\nTyve procent er tyve per hundrede. Én ud af fem. To tiendedele. Samme forhold. Tre dragter.\n\nHvorfor bruge hundrede? Fordi to mænd kan mødes. Tre ud af sytten er sandt og besværligt i munden. Cirka atten procent er et fælles gulv. Gulvet koster: du runder. Runding er en slags fejl. Time fire tager fejlen. I dag: se, at procent er et sprog for forhold, ikke en tryllestav.\n\nI kabinen lyver procent på tre måder, hvis du lader den.\n\nFørste løgn: procent uden af hvad. Vi sparer tyve procent. Tyve procent af hvad. Af tiden. Af dieselen. Af prisen. Af fejlen. Af ingenting. Uden af hvad er procent et smil.\n\nAnden løgn: procent af et tal, der allerede er procent. Ti procent oven i tyve procent er ikke tredive, hvis det andet tyve var af noget andet. Du behøver ikke en formel i ørerne nu. Du behøver mistanken. Når to procenter danser, spørger du: samme hundrede? Eller to forskellige hunde?\n\nTredje løgn: procent, der smigrer. En lille procent af et stort tal er stort. En stor procent af et lille tal er småt. Halvtreds procent af to skovlfulde er én skovlfuld. To procent af en lang dag er mange minutter. Egoet elsker det store procenttal. Jorden elsker mængden. Skriv mængden. Lad procenten være tøjet, ikke kroppen.\n\nEksempel, sagt langsomt, som et mærke, ikke som dit datablad.\n\nDu fik hundrede kroner for en time. Det er et tænkt hundrede, så stregen er nem. Halvtreds går til det, der skal væk: brændstof, slid, det, du ved, skal trækkes fra, når du kender dine tal. Halvtreds tilbage. Halvtreds per hundrede. Halvtreds procent tilbage. Det er avance i arbejdstøj. Ikke et fint ord. Det, der er tilbage, per det, der kom ind.\n\nHvis du ikke kender det, der skal væk, er procenten teater. Skriv ikke halvtreds procent, fordi det lyder voksen. Skriv jeg ved det ikke endnu. Det er et ærligt forhold: nul kendte kroner per den time. Nul er et tal. Time ét gav dig det.\n\nPause.\n\nHældning.\n\nIkke time syv. Time syv er ændring som film: hvad bliver hurtigere. I dag er hældning et stillbillede af jord: hvor meget op per hvor meget frem.\n\nDu kigger ud. Jorden stiger. Kroppen ved det før munden. Maven siger stejlt. Maven er grov. Maven må gerne tale. Maven skal oversættes.\n\nOversættelsen er et forhold. Stigning per længde. Hvor meget op, per hvor meget vandret. Eller: hvor meget op, per hvor meget ad vejen. To slags per. De er ikke identiske. Den vandrette er det rene gulv. Vejen er det, hjulet kører. I dag behøver du ikke at skille dem som en landmåler. Du behøver at nægte stejlt alene.\n\nStejlt nok til hvad. Til at skovlen tager. Til at maskinen skrider. Til at vandet løber den vej, du ikke vil. Til at lastbilen ikke kan. Nok er time fire. Forholdet er i dag.\n\nTegn det i hovedet, ikke med hånden endnu. En streg henad. En streg op. Den skrå er det, du ser. Matematikken elsker de to ben, ikke den skrå alene. Op per hen. Hvad per hvad.\n\nHvis det stiger én på fire, er det én op per fire frem. En fjerdedel. Femogtyve procent hældning, hvis du taler stigning per vandret, og hvis du mener procent som hundrededele. Folk blander det. Folk siger procent og mener noget, hjulet mærker. Du skal ikke vinde en diskussion i frokostskuret. Du skal vide, hvad du mener, når du skriver.\n\nPå papiret, i neutral, senere: en lille trekant. Ikke pæn. En op-streg. En hen-streg. Tal ved benene, hvis du har dem. Hvis du ikke har dem, et spørgsmålstegn. Spørgsmålstegnet er voksen. Stejlt uden streg er barn.\n\nDu opfinder ikke maskinens tilladte hældning. Den står i det, fabrikken skrev, eller den står ikke, og så gætter du ikke. Du mærker, du sænker, du stopper. Sikkerhed først. Forholdet er et sprog. Det er ikke et rødt kort, du tegner selv og kalder lov.\n\nPause.\n\nDiesel. Forbrug. Liter per time.\n\nMåleren sidder der. Uret sidder der. Forholdet sidder ikke, før du sætter dem sammen.\n\nDu kigger på tanken og siger den æder. Det er en stemning. Stemningen kan være sand. Den kan være sult. Den kan være en dag med mere modstand i jorden. Den kan være en lækage. Tre årsager. Ét udtryk. Forhold alene redder dig ikke. Forhold giver dig et spor, du kan holde fast.\n\nSporet ser sådan ud, når det er voksen.\n\nEt tidspunkt. En mængde. Senere: et tidspunkt. En mængde. Forskellen i liter per forskellen i timer. Liter per time.\n\nPå papiret, når neutral er der: tyve, L, skråstreg, ét, t. Tyve liter på én time.\n\nHør det tre gange, fordi det er dagens skrift.\n\nTyve liter på én time.\n\nIkke fordi din ged bruger tyve. Jeg kender ikke din ged. Jeg opdigter ikke et datablad. Tyve på én er et mærke, du skriver, hvis dine to aflæsninger giver det. Hvis de giver noget andet, skriver du noget andet. Tallet er dit. Stregen er lektionen.\n\nHvorfor skrive L og t? Fordi fyrre uden enhed er forældreløs, og fordi t kan betyde time og t kan betyde ton. En streg, der blander liter og ton, er et andet stof. En streg, der blander liter og time, er forbrug. Skriv, så en mand, der ikke er dig, om onsdagen, stadig ved, hvad mandagen mente. Det mand er ofte dig, træt.\n\nHvis du ikke kan stoppe, skriver du det ikke. Du husker et hjørne: tanken var deromkring ved nitten. Det er groft. Groft er tilladt, mens skovlen er i jorden. Groft, der later som præcist, er ikke tilladt. Time fire er godt nok. I dag: lad være med at lade et rundt tal i hovedet blive til et datablad i munden.\n\nPause.\n\nKroner per time.\n\nDet er det samme streg. Andre enheder.\n\nHvad får du per time. Hvad koster maskinen per time. Hvad koster det, der skal væk, per time. Tre forhold. Hvis du kun har det første, er du et barn med en lønseddel. Hvis du har alle tre, er du forvalter.\n\nJeg kender ikke dine tal. Jeg skal ikke kende dem. Jeg skal have dig til at nægte at tale kroner uden per.\n\nDet er gode penge. Per hvad. Per time. Per dag. Per hul. Per uge, hvor kroppen stadig holder. Gode penge per time kan være dårlige penge per hul, hvis hullet æder timer, du ikke havde. Gode penge per hul kan være dårlige penge per uge, hvis kroppen går i stykker. Udfald sidder over dig. Forholdet sidder til venstre. De taler sammen. De er ikke den samme.\n\nEt tænkt mærke, igen tænkt, så du hører stregen.\n\nSeks hundrede kroner på én time ind. Det er ikke din løn, medmindre det er. Det er et rundt tal til ørerne. Hvis det, der skal væk, er fire hundrede på den time, er to hundrede tilbage på den time. To hundrede per seks hundrede. En tredjedel. Cirka treogtredive procent tilbage. Avance. Det, der er tilbage.\n\nHvis det, der skal væk, er seks hundrede, er nul tilbage. Nul per time. Du arbejder for at stå stille. Stå-stille kan være et valg i en sæson. Det kan være en løgn, du fortæller maven, fordi maven hader at sige nej. Papiret hader ikke nej. Papiret viser nul.\n\nHvis det, der skal væk, er mere end det, der kommer ind, er minus per time. Time ét: minus er retning. Retningen er ud. Du kan gøre det bevidst. Du må ikke gøre det som vejr.\n\nAvance er ikke grådighed. Avance er det, der gør, at maskinen kan få olie i næste uge, og at du kan komme hjem. En mand, der skammer sig over stregen, betaler med sløring. Sløring er også en slags tyveri. Den stjæler synet. Synet ændrer valget. Valget ændrer stien.\n\nPause.\n\nPapiret. Kun i neutral. Jeg gentager det, til kroppen tror det.\n\nNeutral. Stabil. Bogen. Tredive til tres sekunder. Ikke dagbog. Mærker.\n\nI dag tre slags mærker til Forhold.\n\nFørste: brøkstregen. Et tal. En streg. Et tal. Enheder ved begge, hvis du har dem. Tyve over ét. L over t. Eller på én linje: tyve L skråstreg ét t.\n\nAnden: den skraverede bar. En rektangel. En del af den skraveret. Tre fjerdedele sort, en fjerdedel hvid. Du ser forholdet. Syn er det, der ændrer valg. En brøk i cifre kan glide. En bar, der er skraveret, sidder.\n\nTredje: to til én skrevet som to kolon ét. Vandets tøj. Brint til ilt. Skovlfulde til lastbil. Mænd til maskine. Kolon er til. Skråstreg er per. Streg er ud af. Tre dragter. Vælg én per mærke. Bland ikke tre dragter på samme linje, så onsdag ikke kan læse mandag.\n\nHvad skriver du ikke.\n\nIkke et essay. I dag gik det godt, men dieselen… ,  det er dagbog. Dagbog kan lyve blødt. Stregen lyver hårdere, og det er en nåde.\n\nIkke et pænt skema. Pænhed er ofte teater. En grim streg, der er sand, slår et smukt skema, der er ønsket.\n\nIkke et datablad, du opfinder. Hvis du ikke aflæste, skriver du ikke et rundt tal og glemmer, at det var et gæt. Gæt får et spørgsmålstegn. Eller ordet groft. Eller slet ikke en linje.\n\nSkriv for at tænke. Ikke tænk færdigt og skriv bagefter. Stregen er tænkningen. Hovedet er for lille til at holde liter og timer og kroner og hældning i luften uden at lade dem smelte sammen. På papir støder de. Tyve liter per time og to lastbiler per time og seks hundrede kroner per time kan ikke alle være sande på samme måde, hvis tiden er den samme, og du tegner dem. Måske er de. Måske er én løgn. Papiret er den ven, der ikke smigrer.\n\nPause.\n\nLad os køre en time i kabinen med stregen tændt, uden at hånden forlader maskinen.\n\nMorgen. Kulde i rattet. Første hul. Du tæller ikke højt. Time ét sidder alligevel: hvor mange skovlfulde, før lastbilen er fuld. Det tal er et forhold, der venter. Skovlfulde per lastbil. Når lastbilen kører, har du et mærke i kroppen. Ved næste pause, i neutral, kan det blive et mærke på papir. Tre. Eller fire. Eller forskelligt, fordi bunden skifter. Forskelligt er også information. Det er et forhold, der ikke vil holde stille. Ændring banker på. Du lader den vente i baggrunden. I dag skriver du, at det ikke var ét tal.\n\nFormiddag. Hældningen ind i hullet. Maven siger nej. Du sænker. Du ændrer angreb. Du kører ikke et procenttal ud af maven. Du lader maven være en klokke. Klokken betyder: her er et forhold, jeg ikke har målt. Time fire måler. Time tre nægter at kalde klokken for et datablad.\n\nFrokost. Hvis der er et bord, og bogen kan komme frem uden at maskinen er i live, er det stadig omgivelser først. En kaffekop er ikke neutral, hvis nogen kan ramme dig. Hvis det er sikkert, ét mærke. Ikke fem. Ét. Det, der brændte. Liter groft. Timer groft. Eller kroner, du lovede, per timer, du tror. Spørgsmålstegn tilladt. Pæn konklusion forbudt.\n\nEftermiddag. Træthed. Det, du leverer per time, er ikke konstant. Det sagde natten. I dag må du se det som forhold, der skifter tøj. Formiddagens skovlfulde per time er ikke eftermiddagens. Hvis du prissætter dagen som om den var klokken syv, stjæler klokken femten fra dig. Du behøver ikke en kurve. Du behøver mistanken. Mistanken er Forhold plus Ændring i samme kabine.\n\nFejring. En lastbil mere end du troede. Egoet vil have en historie: jeg er skarp. Måske var jorden blød. Måske var lastbilen mindre. Måske var du skarp. Sammenhæng er ikke årsag. Vi kommer til det. Allerede nu: lad være med at ægte en historie, før stregen er skrevet.\n\nPause.\n\nSammenhæng er ikke årsag.\n\nTo ting kan danse sammen uden at den ene er mor til den anden.\n\nNår du kører mange timer, bruger du mere diesel. Timer og diesel hænger sammen. Årsagen er motoren, der arbejder. Ikke uret, der æder liter. Uret tæller. Motoren brænder.\n\nNår det regner, går det langsommere. Regn og langsomhed hænger sammen. Årsagen kan være bund, syn, sikkerhed, lastbiler der ikke kommer. Regnen er ikke en heks. Regnen er vand på jord. Kæden er konkret.\n\nNår en dag føles god, kører du måske stærkere. God følelse og tempo hænger sammen. Årsagen kan være søvn. Eller sukker. Eller at opgaven var nem. Følelsen er et spor. Den er ikke faderen til kubikmeterne.\n\nHvorfor i denne time? Fordi forhold er spor. Liter per time er et spor. Kroner per time er et spor. Skovlfulde per lastbil er et spor. Et spor siger: disse to bevæger sig sammen. Et spor siger ikke: den ene avlede den anden.\n\nI nat hørte du det med brint og med sladder. I dag skal du bruge det, når et forhold frister dig til en prædiken.\n\nDen æder, fordi den er gammel. Måske. Måske er filteret. Måske er stilen. Måske er jorden. Forholdet mere liter per time end i går er sandt eller falsk som spor. Prædikenen om alder er en kæde, du skal tjene. Tjen den med at tjekke. Ikke med at elske historien.\n\nHan er langsom, fordi han er doven. Måske. Måske er opgaven. Måske er kroppen. Måske er redskabet. Tælling af læs per time er et spor. Doven er en dom. Dom uden kæde er sladder. Time ni tager folk. I dag: lad stregen være streg, og lad hjertet vente med at dømme.\n\nJeg tjener godt, fordi jeg har travlt. Travlt og indtægt kan danse. Årsagen kan være, at du sagde ja til alt, også det, der æder avance. Travlt per uge kan være minus per time. To forhold. De kan stride. Papiret viser striden. Maven skjuler den.\n\nDet er teseren. Ikke hele statistikken. Ét værn: når to tal kører i par, spørger du, om du har et spor eller en kæde. Time otte og time ni bygger videre. I dag er det nok at nægte at prædike ud af en streg.\n\nPause.\n\nDer er forhold, der ikke er diesel og ikke kroner, og som alligevel styrer dagen.\n\nTid per skift. Hvor længe du kan være skarp per hvor længe du sidder. Det er ikke et datablad. Det er et spor i kroppen. Kroppen er grov. Time fire siger det. Alligevel: hvis du aldrig stiller hvor meget godt arbejde per time efter frokost, behandler du dig selv som en motor uden måler.\n\nVand per dag. Du er mest vand. To til én i molekylet. Tørst er et mål. Drik. Det er ikke fromhed. Det er at holde forholdet, kroppen allerede er. En mand, der tørrer ud, mister syn. Syn ændrer valg.\n\nOpmærksomhed per øre. Ét øre til mig. Ét øre til maskinen. Det er et forhold. Hvis jeg tager begge, har jeg stjålet. Hvis maskinen tager begge, og du alligevel prøver at skrive, har du stjålet fra jorden. Kontrakten er et forhold. Lyd per øre. Øjne per jord.\n\nLøfter per uge. Hvor mange ja per hvor mange timer, der findes. Et ja er en veksel på tid. Tid er den mængde, der ikke går i minus og kommer tilbage. Hvis ja per uge er større end timer per uge, er du i minus, før du er kørt. Det er brøk. Det er også troskab. Kristus tæller ja. Du må også.\n\nJeg gør ikke løfterne til talmystik. Ingen hellige syvere. Ingen skjulte treere, der beviser Gud. Tre er tre. Syv er syv. Korset er ikke en brøk, du skal løse. Korset er en handling. Tal er redskab. Vejen er gået. Du følger. Du opfinder ikke ordenen. Du læser den.\n\nPause.\n\nFælder. Sagt som mænd, der allerede er faldet i dem.\n\nFælde ét: at sammenligne to ting, der ikke har samme per.\n\nDin time mod hans dag. Din skovl mod hans lastbil. Din diesel per time mod hans diesel per hul. Tallene kan se ud som et kapløb. De løber ikke på samme bane. Før du siger jeg er bedre, siger du samme nævner?. Hvis nævneren skifter, skifter stoffet. Vand og ikke-vand.\n\nFælde to: at glemme, at nul i nævneren er forbudt.\n\nPer time kræver, at der er en time. Per lastbil kræver, at der er en lastbil. Hvis du deler i nul, har du ikke et forhold. Du har et hul i sproget. Uendeligt er ikke et kabine-ord, du har brug for. Ordet du har brug for er: det giver ikke mening endnu. Vent. Tæl. Så streg.\n\nFælde tre: at elske tælleren og hade nævneren.\n\nFlere kroner. Flere skovlfulde. Flere lastbiler. Egoet elsker oppe. Nede er det, der gør oppe sandt. Flere kroner på flere timer kan være samme forhold, eller et værre. Natten sagde det: du kan ikke gemme et dårligt forhold ved at gøre tælleren større. Hvis du taber på hver enhed, hjælper flere enheder ikke. Det er procent. Det er også moral. En lille utæthed per time er ikke lille per uge.\n\nFælde fire: at blande enheder i stilhed.\n\nLiter per time. Liter per mil. Liter per hul. Tre streger. Hvis du siger forbrug om alle tre, kan du ikke tænke. Sig enhederne. Time fire hamrer enheder. I dag: stregen arver enhederne. Uden dem er stregen en pind.\n\nFælde fem: at skrive, mens verden kører.\n\nBogen i skødet. Et øje på tallet. Et hjul, der stadig kan tage dig. Det er ikke lærdom. Det er stolthed. Stolthed er et dårligt forhold: mere selv per mindre jord. Neutral. Ellers ikke.\n\nFælde seks: at tro, at et rundt tal er sandere.\n\nTyve liter på én time er nemt i munden. Verden er ofte sytten eller treogtyve. Runding er tilladt, når du ved, at du runder. Runding, der glemmer sig selv, bliver datablad. Datablad, du opfandt, er løgn. Løgn i forhold smitter alt, du ganger bagefter.\n\nPause.\n\nLad os sige de tre dragter igen, til de er ét.\n\nBrøk. Noget ud af noget. Tre fjerdedele af en tank. Tre ud af fire. Streg.\n\nForhold. Noget til noget. To til én. Vand. Skovl til lastbil. Kolon.\n\nProcent. Noget per hundrede. Femoghalvfjerds procent fuld. Per hundrede.\n\nDu kan klæde den ene om til den anden, når nævneren tillader det.\n\nEn halv er halvtreds procent. To til to er én til én, og det er hundrede procent af det, du satte som hele, hvis hele er den anden toer ,  hør, hvor munden kan snuble. Derfor papir. Derfor bar. Derfor ikke jonglere tre dragter i luften, mens skovlen er nede.\n\nEt mundgreb, der holder:\n\nNår nogen siger et tal, spørger du: hvad.\n\nNår de har sagt hvad, spørger du: per hvad.\n\nNår de har sagt per hvad, spørger du: er det et spor eller en kæde.\n\nTre spørgsmål. De er time tre. De er også et værn mod sælgere, mod egoet, mod den indre prædikant, der elsker historier.\n\nPause.\n\nEndnu en kabine. Langsommere. Som om vi sidder i støvet og lader hydraulikken synke.\n\nDu har et hul. Du har en lastbil. Du har et ur. Du har en tank. Du har et ja, du har givet. Fire ting. Hver vil være et tal uden streg. Du nægter.\n\nHullet: hvor meget jord per hvor meget rum, der skal være tomt. Det peger på time fem. Rum. I dag kun: det, du tager, per det, der skal væk. Hvis du tager for lidt per læs, bliver dagen for lang. Hvis du tager for meget per læs, bliver lastbilen for tung, eller spildet for stort. Forhold. Godt nok kommer i morgen.\n\nLastbilen: læs per time. Ikke de kommer, når de kommer alene. Det alene er vejr. Vejr findes. Udfald findes. Alligevel: hvis én lastbil per time er det, dagen er bygget på, og der kommer én per to timer, er forholdet knækket. Du justerer. Eller du ringer. Eller du stopper. Du later ikke som om nævneren stadig er én time, når den er to.\n\nUret: arbejde per time. Ærligt. Pauser tæller. Pauser er ikke tyveri, hvis de er i nævneren. Pauser, du skjuler, gør tælleren smukkere og nævneren til løgn. Løgnen kommer tilbage som træthed, som fejl, som et nej, du skulle have sagt klokken ti.\n\nTanken: liter per time. Spor. Ikke prædiken.\n\nJa’et: kroner per time efter det, der skal væk. Avance. Hvis du ikke kan se den, er ja’et en følelse. Følelser må være der. De må ikke køre maskinen alene.\n\nFire streger. Du skriver ikke fire, mens du graver. Du kan bære én i kroppen ad gangen. De andre venter. Papiret er køen. Hovedet er ikke køen. Hovedet er en lille plade. Den taber.\n\nPause.\n\nTænk på papir, sagt igen, fordi time tre frister til at se det for sig.\n\nAt se det for sig er godt. At tro, at se det for sig er at have det, er løgn. Arbejdshukommelsen holder få bidder. Et forhold er to bidder plus en streg plus enheder plus er det sandt. Det er nok til at fylde pladen. To forhold fylder over. Tre forhold, og du kører på historier.\n\nDerfor: skriv for at tænke. Stregen på papir er ikke et minde om en tænkning. Den er tænkningen, gjort synlig.\n\nHvordan ser en side ud i dag, hvis du stopper.\n\nØverst: ordet Forhold. Eller bare en streg. Så ved du, hvilken slags knude.\n\nUnder: ét mærke. Tyve L skråstreg ét t. Eller tre skovlfulde skråstreg én lastbil. Eller en bar, tre fjerdedele skraveret. Eller to kolon ét, og ordet vand, hvis du bare vil sømme billedet.\n\nTil højre: et spørgsmålstegn, hvis det er groft. En pil, hvis det peger på et valg: stop, ring, sænk, sig nej.\n\nNederst: dato. Onsdag skal læse mandag.\n\nTredive sekunder. Ikke et kapitel. Hvis du skriver tre sætninger, har du ofte skjult tallet i prosa. Prosa kan lyve blødt.\n\nSå bogen væk. Hænderne tilbage. Øjnene på jorden.\n\nHvis du er for stolt til at stoppe: du husker det forkert senere. Hvis du er for flov til at skrive grimt: du skriver ikke. Begge dele er samme tab. Grimhed er tegn på arbejde.\n\nPause.\n\nKærlighed, kort, uden at gøre timen til prædiken.\n\nSand kærlighed tæller. Den ved, hvad per hvad. Brød per dag. Mund per bord. Time per barn. Løfte per mund. Fadervor beder om brød i dag ,  et nu, et mål, ikke et tåget en dag. Jeg beviser ikke Gud med en brøk. Den, der gør to-til-én i vandet til et hemmeligt tegn, har forladt troen og er gået ind i talmystik. Vand er vand. Gaven er, at det holder. Troskab i stoffet. Du må holde din.\n\nMatematikken elsker verden ved ikke at lyve for den. Halvtreds procent af hundrede er halvtreds, også når du gerne ville have tres. En streg, der viser minus, er minus, også når kunden smiler. Den troskab gør tillid mulig. Uden den kan to mænd ikke bygge. Uden den kan du ikke bede ærligt, for ærlighed kræver, at ord peger på noget, der er.\n\nJeg er ikke din præst. Jeg er et værktøj i øret. Kristus er vejen. Tal er redskab. Syn ændrer valg. Valg ændrer sti. Det er hele grebet. Det greb er ikke magi. Det er forvalterskab.\n\nPause.\n\nRecap, mens skovlen arbejder. Du behøver ikke at nikke. Du behøver at lade sætningerne køre hen over det, du ser.\n\nEt tal uden hvad er forældreløst.\n\nEt hvad uden per hvad er halvt.\n\nBrøk, forhold, procent er ét håndværk i tre dragter.\n\nVand: to til én. Ændr forholdet, ændr stoffet.\n\nStregen binder. Rør begge, eller rør ingen, hvis du vil beholde stoffet.\n\nProcent er per hundrede. Spørg: af hvad. Spørg: samme hundrede.\n\nHældning i dag er op per hen. Ikke stejlt alene.\n\nLiter per time er et spor, du skriver fra aflæsning, ikke fra et opdigtet datablad.\n\nKroner per time uden det, der skal væk, er et smil. Avance er det, der er tilbage, per det, der kom ind.\n\nPapir: brøkstreg, skraveret bar, tyve L skråstreg ét t. Neutral. Ellers ikke.\n\nSammenhæng er ikke årsag. Spor er ikke kæde.\n\nNævneren er hellig på den måde, sandhed er hellig: uden den er tælleren teater.\n\nPause.\n\nEndnu et lag, så det ikke sidder kun som liste.\n\nForestil dig, at du skal forklare time tre til en mand på pladsen uden at lyde som en skole.\n\nDu siger ikke brøker. Du siger: sig aldrig et tal alene.\n\nDu siger ikke procent. Du siger: per hundrede, og sig af hvad.\n\nDu siger ikke avance. Du siger: hvad er der tilbage, når det, der skal væk, er væk.\n\nDu siger ikke et skoleord for dans. Du siger: de to kører sammen. Det betyder ikke, at den ene avlede den anden.\n\nHvis han griner, er det i orden. Grin er billigt. Stregen er stadig der, når grinet er væk. Hvis han bliver vred, er det ofte fordi en streg truer en historie. Du skal ikke vinde ham. Du skal holde dit syn. Synet er dit ansvar. Hans syn er hans.\n\nDu taler matematik, når du siger:\n\nTre lastbiler på to timer.\n\nTyve liter på én time ,  hvis det er det, du aflæste.\n\nEn på fire i hældning ,  hvis det er det, du mener.\n\nHalvtreds tilbage per hundrede ind ,  hvis det er det, tallene bar.\n\nJeg ved det ikke endnu.\n\nDen sidste er matematik. Den er også ydmyghed. Egoet hader den. Jorden elsker den, fordi den stopper løgnen før skovlen.\n\nPause.\n\nHvad med gange og dividere fra i går, nu da stregen er her.\n\nGange en brøk: du skalerer. To gange tyve liter på én time er fyrre liter på to timer, hvis forholdet holder. Hvis det ikke holder, har du skaleret en løgn. Time to gav dig handlingen. Time tre giver dig betingelsen.\n\nDividere: du finder per. Liter delt med timer er liter per time. Kroner delt med timer er kroner per time. Jord delt med lastbiler er jord per lastbil. Dividere er at lave forhold, når du deler to slags, der hører sammen. Hvis du deler to slags, der ikke hører sammen, får du en pind, der ligner et svar. Kroner per skovlfuld kan være et våben. Kroner per kilo sved er teater. Spørg, om nævneren er en, du vil styre.\n\nPlus og minus på brøker: kun når nævneren er den samme, eller når du har klædt dem om til samme nævner. En halv plus en tredjedel er ikke to femtedele. Det er den fælde, skolen elskede, og den er ærlig. Forskellige nævnere er forskellige hele. Du lægger ikke liter per time sammen med liter per lastbil og kalder det mere liter. Du klæder om, eller du lader være.\n\nDu behøver ikke at løse opgaver i luften nu. Du behøver reglen i kroppen: samme slags per, før du samler. Ellers er du ude i at blande vand og diesel og kalde det én tank.\n\nPause.\n\nEt stille billede til underbevidstheden. Du kører. Billedet må sidde uden at øjet forlader jorden.\n\nKabinen. Til venstre et vindue. På ruden, som dug, en streg. Over stregen et tal. Under stregen et tal. Enheder små. L over t. Eller kr over t. Eller op over hen.\n\nDugen er ikke magi. Dugen er det, vi hænger op, så du har et sted at sætte tal, der banker på.\n\nNår et tal banker: fyrre. Det sætter sig ikke i sædet. Det sætter sig over eller under stregen, eller det får ikke lov.\n\nNår to tal banker: de må kun dele streg, hvis de hører sammen.\n\nNår en historie banker: den venter, til stregen er der, og så spørger du, om historien er kæde eller spor.\n\nFem tegn i luften stadig. Forhold lyser. De andre slukker ikke. Du tæller stadig. Du måler stadig, groft, med øjet. Du ser ændring, når eftermiddagen ikke er formiddagen. Du vælger under usikkerhed, når lastbilen måske ikke kommer. I dag er det stregen, vi træner, så de andre tegn får noget at stå på.\n\nPause.\n\nSikkerhed, sagt som det første bud i denne serie, fordi papir frister mere, når tallet er en streg.\n\nDu stopper, før du skriver.\n\nDu skriver ikke, mens skovlen er i jorden.\n\nDu skriver ikke, mens du kører.\n\nDu skriver ikke, fordi jeg sagde tyve L skråstreg ét t, og du gerne vil være dygtig. Dygtig død er død.\n\nHvis dagen er for tæt til ét mærke, er dagen for tæt. Lyd er nok. Papir kan vente. Hullet kan ikke bruge din begravelse som nævner.\n\nJeg elsker dit liv mere end serien. Det er ikke poesi. Det er rækkefølge. Jord. Maskine. Krop. Så streg.\n\nPause.\n\nEndnu en runde i støvet, fordi stregen skal sidde i kroppen, ikke kun i øret.\n\nDu står stille et øjeblik. Ikke fordi jeg bad om papir. Fordi lastbilen ikke er der. Neutral. Motoren i live eller ikke ,  det ved du. Hvis det er sikkert, og kun hvis det er sikkert, kan bogen komme frem. Hvis det ikke er sikkert, sidder du med hænderne, hvor de skal være, og hører.\n\nHvad ville du skrive, hvis bogen kom frem nu.\n\nIkke fem ting. Ét.\n\nHvis dieselen brændte: stregen med liter og time, og et spørgsmålstegn, hvis du ikke aflæste.\n\nHvis lastbilen brændte: skovlfulde per læs, eller læs per time, ikke begge, medmindre du har ti sekunder ekstra. Du har det sjældent.\n\nHvis ja’et brændte: kroner per time, og et tomt felt til det, der skal væk, så du ikke lader feltet fylde sig selv med ønsket.\n\nHvis hældningen brændte: en trekant så grim, at ingen ville hænge den op. Op. Hen. Spørgsmålstegn.\n\nSå bogen væk. Det var tænkning. Det var ikke et bevis på, at du er en, der tager det seriøst. Beviset er jorden, der passer, og manden, der kommer hjem.\n\nPause.\n\nLad os tale procent én gang til, langsommere, med penge, der ikke er dine, så du kan høre stregen uden at beskytte dit ego.\n\nHundrede kroner ind. Ti kroner væk. Halvfems tilbage. Ti procent væk. Halvfems procent tilbage.\n\nHundrede ind. Halvtreds væk. Halvtreds tilbage. Halvtreds procent væk.\n\nHundrede ind. Hundrede væk. Nul tilbage. Hundrede procent væk. Du stod stille.\n\nHundrede ind. Hundrede og ti væk. Minus ti. Mere end det hele væk. Procent over hundrede i det, der skal væk, betyder, at nævneren ikke bar tælleren. Du betalte for at arbejde.\n\nSamme hundrede. Fire billeder. Fire liv. Munden elsker jeg har travlt i alle fire. Papiret skiller dem.\n\nNu et andet hundrede: ikke kroner. Hundrede skovlfulde. Ti spildt. Ti procent spild. Det lyder småt. Ti skovlfulde er ikke småt, hvis hver skovlfuld var tid og diesel og slid. Procenten var tøj. Mængden var krop. Skriv kroppen. Lad tøjet være til, når du skal sammenligne to dage.\n\nNu et tredje: hundrede minutter. Ti minutter til at vente på lastbil. Ti procent af tiden, hvis nævneren var hundrede minutter. Hvis nævneren var en hel dag, er ti minutter en anden procent. Samme ti. Andet stof. Nævneren skiftede. Navnet på virkeligheden skiftede med den.\n\nDet er derfor, jeg nægter at lade dig elske procenten uden af hvad. Af hvad er nævneren, sagt i hverdag.\n\nPause.\n\nBrøker, der ligner hinanden, og brøker, der lyver, at de gør.\n\nEn halv og to fjerdedele. Samme stof. Pizzaen. Lastbilen halvt fuld, eller to ud af fire læs. Du kan klæde om.\n\nEn halv og en tredjedel. Ikke samme stof. Forskellige hele. Hvis du siger næsten det samme, har du måske ret til et hul, der ikke skal passe på centimeter. Du har ikke ret til at lægge dem sammen i luften og kalde det en halv plus en tredjedel, altså to femtedele. Det er en kendt fælde. Den fælde er ærlig skole. Den er også ærlig kabine: du lægger ikke halv tank sammen med en tredjedel af en time og får noget. Forskellige nævnere, forskellige verdener.\n\nTo tredjedele og fire sjettedele. Samme stof. Gange oppe og nede med to. Forholdet holder.\n\nTo tredjedele og tre sjettedele. Ikke samme. Tre sjettedele er en halv. To tredjedele er mere. Du kan se det på en skraveret bar. To barer ved siden af hinanden. Den ene skraveret mere. Syn. Derfor baren på papiret. Cifrene kan danse. Baren står.\n\nI geden: vi er næsten færdige er ofte to tredjedele, sagt som fire femtedele, fordi egoet gerne vil hjem. Spørg: hvor mange lastbiler ude, per hvor mange lastbiler i alt. Hvis du ikke ved i alt, er næsten vejr. Vejr må siges som vejr. Det må ikke siges som brøk.\n\nPause.\n\nEt ord om per og ud af og til, så munden ikke blander dem, når det koster.\n\nPer: nævneren er den, du deler med, ofte tid, ofte læs, ofte time. Liter per time. Kroner per time. Skovlfulde per læs.\n\nUd af: nævneren er hele mængden af samme slags. Tre ud af fire lastbiler. Halvtreds ud af hundrede kroner. Det er brøkens hjem.\n\nTil: to slags, der står over for hinanden. To til én. Brint til ilt. Mænd til maskine. Det er forholdets hjem.\n\nDu kan ofte klæde om. To til én er to ud af tre dele i det hele, hvis hele er summen af de to. Vand: to brint til ét ilt. Tre dele i molekylet. To ud af tre er brint. Det er ikke en gåde, du skal præstere. Det er en advarsel: sig, hvad hele er, før du siger procent. Procent af hvad.\n\nHvis du er i tvivl i kabinen, så brug per. Per er groft og stærkt. Per redder de fleste dage. Til og ud af kan vente til papiret.\n\nPause.\n\nEftermiddagssolen. Støv i lyset. Du har hørt meget. Det er meningen. En time i øret er lang. Jorden er længere. Så vi går den samme sti igen, med andre sten.\n\nFørste sten: forældreløse tal. Du møder dem i snak. Det tager fyrre. Fyrre minutter eller fyrre læs. Spørg. Hvis du ikke kan spørge, skriv spørgsmålstegnet. Et spørgsmålstegn er et forhold, der venter på sin nævner.\n\nAnden sten: stregen som pagt. Vand to til én. Stål med kulstof i små forhold. For lidt eller for meget, og det knækker. Verden er ligeglad med, om du havde travlt.\n\nTredje sten: procent som fælles gulv. Nyttigt. Farligt. Af hvad. Samme hundrede. Mængden under tøjet.\n\nFjerde sten: hældning som op per hen. Maven som klokke. Ingen opfundne tilladte tal. Sænk. Stop. Læs det, der er skrevet af andre, hvis det er skrevet. Gæt ikke et datablad.\n\nFemte sten: forbrug som liter per time. Aflæst. Eller groft med spørgsmålstegn. Eller tavs, til du kan stoppe.\n\nSjette sten: kroner per time og det, der er tilbage. Avance. Nul. Minus. Tre retninger. Time ét gav retningen. Time tre gav stregen.\n\nSyvende sten: papir. Bar. Streg. Tyve L skråstreg ét t. Neutral.\n\nOttende sten: spor og kæde. De danser. Den ene avler ikke den anden, bare fordi de danser.\n\nNiende sten: sikkerhed. Jorden vinder.\n\nTiende sten: time fire. Enhed. Fejl. Godt nok.\n\nTi sten. Ikke mystik. Ti søm. Du må glemme otte, hvis du husker hvad-per-hvad, to-til-én, og skriv-i-neutral.\n\nPause.\n\nDer kommer en time, hvor nogen sælger dig et forhold, der er klædt som en gave.\n\nDenne olie sparer ti procent. Ti procent af hvad. Af forbrug. Af slid. Af pris. Af ingenting. Hvis de ikke kan sige nævneren, har de ikke et forhold. De har reklame.\n\nVi kan tage tyve procent mere i timen. Mere af hvad. Kubik. Kroner. Risiko. Hvis det er kubik, og bunden ikke bærer, er nævneren blevet en anden: per ulykke. Den nævner vil du ikke vinde.\n\nAlle kører det her forbrug. Alle er ikke en nævner. Alle er sladder. Dit spor er dine liter per dine timer på din jord. Sammenligning kræver samme per. Ellers er du i fælde ét.\n\nDu skal ikke blive sur. Du skal blive langsom i munden. Langsom mund er et værktøj. Per hvad? er tre stavelser, der sparer uger.\n\nPause.\n\nPsykologi, kun som forhold, ikke som time ni.\n\nDet, du belønner, får du mere af. Belønning per adfærd. Hvis sløseri ikke koster, er prisen per sløseri nul. Nul i nævnerens nabo: omkostning per handling. Hvis omkostningen er nul, stiger tælleren. Flere sløserier. Det er ikke hekseri. Det er streg.\n\nHvis ærlig tælling koster skam, holder du op med at tælle. Skam per ærlighed er for høj. Du sænker tællingen. Forholdet i hjertet styrer forholdet på pladsen. Time ni. I dag: se stregen, også når den sidder inden i.\n\nSult per time efter frokost. Du kender den. Sukker. Mad. Søvn. De danser med tempo. Årsagen er ikke jeg er doven om eftermiddagen alene. Kæden kan være mad, varme, søvn, kedelig jord. Spor: færre læs per time. Kæde: find den, når du har lov at tænke. Ikke som pisk. Som forvalter.\n\nSammenligning per nabo. Han har flere lastbiler per dag. Du bliver lille. Spørg: samme hul. Samme bund. Samme maskine. Samme ja. Hvis ikke, er du i kapløb på to baner. Kapløb på to baner er en måde at hade sig selv på uden tal. Tal kunne have reddet dig. Stregen kunne.\n\nPause.\n\nEt sidste kabinebillede, tæt på.\n\nSkovlen går ned. Jorden giver. Du hører mig i det ene øre. Det andet øre hører pumpen. Du tænker ikke brøk. Du tænker endnu én. Det er Tæl i baggrunden. Du tænker for blødt. Det er Mål, groft, i baggrunden. Du tænker langsommere end i morges. Det er Ændring. Du tænker hvis lastbilen svigter, gør jeg sådan. Det er Udfald.\n\nForhold er det, der binder dem, når du senere siger: så mange per så meget.\n\nDu behøver ikke at navngive tegnene, mens stålet arbejder. Navnene er stillads. Arbejdet er at nægte forældreløse tal, når de kommer som snak, som ja, som frygt, som stolthed.\n\nNår snakken kommer over radioen: det tager ikke lang tid. Du hører: tid per hul uden tal. Du svarer, hvis du skal svare, med et tal og et per, eller med jeg ved det ikke endnu. Det er ikke koldt. Det er troskab.\n\nNår frygten kommer: den æder for meget. Du hører: liter per time uden aflæsning. Du giver frygten et spor at løbe på, eller du lader den vente.\n\nNår stoltheden kommer: jeg knokler. Du hører: indsats uden nævner. Knokle per hvad. Per kubik. Per krone tilbage. Per sikkerhed. Knokle per ulykke er et forhold, du ikke vil vinde.\n\nPause.\n\nJeg vil sige det om Grok og om Gud én gang, så det ikke blander sig i stregen.\n\nJeg kan holde to tal op og vise dig stregen. Jeg kan ikke gøre stregen til frelse. Jeg kan ikke høre din bøn. Jeg kan ikke holde din maskine, når hydraulikken svigter. Jeg er et sprog i øret. Nyttigt. Begrænset. Ikke hellig.\n\nHvis en lektion gør dig hovmodig ,  nu ser jeg, og de andre er blinde ,  så har du taget redskabet og gjort det til et spejl. Spejle er dårlige nævnere. De gør alt til dig per dig.\n\nHvis en lektion gør dig lille på den forkerte måde ,  jeg var aldrig tal, så jeg er færdig ,  så har du taget skolen og gjort den til en dommer. Du tæller allerede. Du måler allerede. Du lever i per. Vi giver det navn. Vi giver det ikke tilladelse til at ydmyge dig.\n\nKristus er vejen. Du følger. Du læser skabningen. Du tilbeder ikke brøken. Du tilbeder ikke procenten. Du tilbeder ikke Grok. Amen til det. Så kører vi videre i arbejdet.\n\nPause.\n\nHvad tager du med ind i time fire.\n\nTime fire er Mål. Hvor langt, tungt, længe. Meter. Liter. Sekund. Grad. Fejl. Godt nok.\n\nI dag har du set, at et tal uden per er forældreløst. I morgen ser du, at et tal uden enhed er forældreløst på en anden måde. Tyve betyder ingenting. Tyve liter betyder noget. Tyve liter per time betyder mere. Time tre og time fire er søskende. Stregen og enheden. Hvad per hvad, og hvad slags hvad.\n\nMåleren, du kiggede på i dag uden at tilbede den, bliver i morgen et emne. Målere lyver, hvis de ikke aflæses. Sanser er grove. Godt nok er voksen. Perfekt er et barn, der nægter at levere.\n\nDu opfinder stadig ikke datablad. Du skriver det, du aflæste, med enhed. Altid enhed.\n\nRummet venter i time fem. Vinkel. Cirkel. Areal. Rumfang. Vægtstang. Bommen er den lektion. I dag rører vi den kun som hældning: op per hen. I morgen rører vi den som længde og som tæt nok. Så tager time fem armen og vægten.\n\nPause.\n\nHvis du kun kan bære tre sætninger ud af denne time, så bær disse.\n\nFørste: hvad per hvad.\n\nAnden: to til én, som vand. Ændr forholdet, ændr stoffet.\n\nTredje: skriv stregen i neutral, eller lad være. Tyve liter på én time, hvis det er dit. Ikke mit.\n\nAlt andet var søm omkring de tre. Søm falder af. De tre skal sidde.\n\nPause.\n\nViktor. Transmissionen for time tre er færdig, når jeg har sagt det sidste om rækkefølgen.\n\nDu stopper ikke maskinen, fordi en lektion slutter. Du kører. Øjnene på jorden. Når timen i øret skifter, skifter du ikke ansigt. Du er den samme mand. Stregen sidder til venstre. Måleren sidder til højre. Jorden under.\n\nJeg peger. Jeg styrer ikke skovlen. Kristus er vejen. Tal er redskab. Grok er ikke Gud.\n\nTime fire begynder, når du er klar i øret. Mål. Enheder. Fejl. Godt nok. Samme kontrakt. Ét øre. Neutral til papir. Ingen nye love. Den gamle: se, vælg, gå.\n\nSig det én gang i munden, stille, uden at tabe jorden:\n\nHvad per hvad.\n\nSå kør.\n\nPause.\n\nHvis øret stadig er åbent, er her ikke et nyt fag. Her er den samme time, sagt som mærker i en væg.\n\nSøm ét: fyrre er ingenting, før fyrre er fyrre hvad, per hvad.\n\nSøm to: brøk, forhold, procent ,  tre dragter, ét håndværk.\n\nSøm tre: vand to til én. Stregen er stoffet.\n\nSøm fire: hældning er op per hen. Maven er klokke, ikke datablad.\n\nSøm fem: liter per time og kroner per time er spor. Avance er det, der er tilbage.\n\nSøm seks: papir i neutral. Brøkstreg. Skraveret bar. Tyve L skråstreg ét t. Skriv for at tænke.\n\nSøm syv: sammenhæng er ikke årsag. Spor er ikke kæde.\n\nSøm otte: nævneren holder sandheden. Tælleren uden den er teater.\n\nSøm ni: sikkerhed først. Jorden vinder over stregen.\n\nSøm ti: næste time måler. Enhed på tallet. Godt nok. Så rummet og vægtstangen.\n\nNu er det nok. Hvis du bliver siddende og tygger, mens skovlen skal arbejde, er det egoet, der vil have én lektion mere i luften. Giv det ikke den. Giv det en streg i neutral, senere. Eller giv det jorden.\n\nSlip lektionen. Hold stregen. Hold jorden.\n\nPause.\n\nEt åndedrag mere, så tælleren er ærlig, og nævneren er timen.\n\nHvis du i dag kun får skrevet ét mærke, så lad det være stregen. Ikke et essay. Ikke fem tegn i pæn skrift. En brøk. En bar. Eller tyve liter på én time, hvis det var det, du aflæste. Hvis du ikke aflæste, så skriv to kolon ét og ordet vand. Billedet. Sømmet. Så bogen væk.\n\nOnsdag kan læse mandag. Hovedet fra mandag er væk. Forvalteren har arkiv. Barnet har stemning.\n\nTime tre er færdig i øret. Time fire venter med målebåndet. Du kører. Jorden først. Stregen til venstre. Enheden til højre. Kristus vejen. Tal redskab. Grok ikke Gud.\n\nKør.\n"</script>
<script>

const hint = document.getElementById("hint");
const ta = document.getElementById("fallback");
function done(msg) {

  btn.classList.add("ok");
  hint.textContent = "Gå til din TTS-app og indsæt.";

</script>
