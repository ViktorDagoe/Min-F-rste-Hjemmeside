<!DOCTYPE html>

<title>Kopiér Tænk på papir</title>
<style>
  :root { --bg:#11150f; --ink:#f4f1ea; --btn:#0f6b5c; --ok:#2d6a4f; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.45;
  }
  button#copy {
    position: sticky; top: 0; z-index: 2;
    width: 100%; min-height: 30vh; padding: 24px 16px;
    font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 800;
    background: var(--btn); color: #fff; border: 0; cursor: pointer;
  }
  button#copy.ok { background: var(--ok); }
  p.hint { margin: 12px 16px; opacity: .8; }
  textarea {
    display: none; width: calc(100% - 24px); margin: 0 12px 16px;
    min-height: 40vh; background: #1c2118; color: var(--ink);
    border: 1px solid #3a4334; border-radius: 8px; padding: 12px;
    font-size: 16px;
  }
  a.back { display: inline-block; margin: 8px 16px 24px; color: #9fd3c7; }
</style>

<body>
<button id="copy" type="button">Kopiér alt til TTS</button>
<p class="hint" id="hint">Tryk den store knap. Så indsæt i din TTS-app.</p>
<textarea id="fallback" readonly></textarea>
<p><a class="back" href="index.html">Alle lektioner</a></p>
<script id="payload" type="application/json">"Viktor. Dette er ikke natten. I nat måtte øjnene lukkes. Kortet blev hængt op. Brint. Fem tegn. Søvn. Amen. Hvis du hører dette i aften efter natten, så stop. Bogen lukket. Dyne. De ti timer kommer i øret i morgen. Papir-håndværket venter. Det må ikke stjæle søvn. Mænd, der blander aften og morgen, sover dårligt og graver dårligt. Vi blander dem ikke.\n\nHvis du hører dette i geden, mens du graver: kontrakten er den samme som de ti timer. Ét øre. Øjnene på jorden. Hænderne på maskinen. Du skriver ikke, mens skovlen er nede. Du skriver ikke, mens du kører. Når jeg siger tag bogen, mener jeg: hvis maskinen er i neutral, hvis det er stabilt, hvis omgivelserne er set. Ellers kun lyd. Jorden vinder. Papiret kan vente. Den døde kan ikke tænke på papir.\n\nHvis du hører dette ved et bord, i regn, i en pause, hvor maskinen sover, og hænderne er ledige: så er papiret arbejdet i denne time. Øjnene må se siden. Hånden må bevæge sig. Det er den ene lektion, hvor at kigge på notesbogen ikke er at forlade verden. Verden er siden, i tres sekunder ad gangen. Så lukker du bogen. Så lever du.\n\nJeg er Grok. Jeg er din AI. Jeg er ikke Kristus. Jeg taler ikke for Gud. Jeg peger. Det, der er sandt her, tilhører skabningen og dens Herre. Det, der er skævt, er mit. Test det. Ikke med en pæn side. Med et mærke, der holder, når lastbilen kommer.\n\nDu bad om at lære at tænke på papir. Ikke som et ekstra fag ved siden af matematikken. Som den måde, matematikken bliver kød. De ti timer giver tegnene. Denne time giver hånden. Uden hånden er ti timer radio. Med hånden er ti timer et spor i kroppen.\n\nHvis du kun husker én sætning, når timen er færdig: skriv for at tænke. Tænk ikke færdigt og skriv bagefter.\n\nSig den stille. Ikke som en plakat. Som en korrektion, du giver dig selv, hver gang hovedet siger: jeg har det, jeg skriver det senere.\n\nSenere er, hvor tal dør.\n\nPause.\n\nDer er en løgn, de fleste mænd bærer uden at vide det. Løgnen siger: først tænker man. Så skriver man det ned. Hovedet er fabrikken. Papiret er lageret. Den kloge mand har det oppe i hovedet. Den, der skriver, er den, der ikke kan huske. Skolen belønnede det. Den, der rakte hånden op uden kladde, så klog ud. Den, der kradsede på et ark, så langsom ud.\n\nSkakmat.\n\nFabrikken er papiret. Hovedet er værkføreren. Værkføreren kan ikke holde alle emner i luften. Når du skriver, tænker du. Når du kun tænker, kører tankerne i ring og kalder ringen for klarhed. Ringen føles som tænkning, fordi den er travl. Travlhed er ikke tænkning. Travlhed er en motor i tomgang, der lyder, som om den arbejder.\n\nHør forskellen i kabinen.\n\nDu har et hul. Lastbil. Tid. Bund. Vejr. En slange, du ikke stoler på. Et ja, du næsten har givet. I hovedet kører det som film: du graver, du når det, du når det ikke, du bliver vred, du ringer, du ringer ikke, du er en mand der godt kan, du er en mand der bliver snydt. Filmene skifter. Ingen af dem ligger stille længe nok til at blive målt. Du kalder det at tænke det igennem. Det er at blive kørt af dine egne billeder.\n\nPå papir sker der noget andet. Et tal for minutter. Et tal for det, der mangler. En streg mellem dem. En pil. Et spørgsmålstegn, hvis du ikke ved det. Filmene får ikke lov at skifte, før tallene har fået en plads. Pladsen er tænkningen. Ikke erindringen om tænkningen. Tænkningen selv, gjort synlig.\n\nDet er hele håndværket. Resten er øvelse, sikkerhed og at nægte teater.\n\nPause.\n\nHvorfor hovedet ikke slår til.\n\nHovedet er et lille bord. Få ting kan ligge der, før den første falder på gulvet. Ikke fordi du er dum. Fordi du er et menneske. Arbejdshukommelse er kort. Den er bygget til nu: et håndtag, et øje, en lyd, en fare. Den er ikke bygget til et hul med dybde, bredde, lastbiler, tid, bund, vejr, mandskab og en slange. Det er flere bidder, end bordet kan bære ærligt.\n\nNår bordet er fuldt, sker tre ting, og ingen af dem er visdom.\n\nFørst: den højeste stemme vinder. Ikke den sandeste. Den, der råber. Frygt råber. Stolthed råber. Nå, vi ser råber blødt og vinder alligevel, fordi den kræver mindst. Sandheden om minutter råber ikke. Den skal skrives, ellers taber den.\n\nDernæst: ting smelter sammen. Liter bliver til minutter. Minutter bliver til kroner. Kroner bliver til det går nok. Nok er ikke en enhed. Nok er håb i arbejdstøj. På papir kan liter ikke lade, som om de er minutter. De står ved siden af hinanden og nægter at være det samme.\n\nDernæst: du glemmer, hvad du vidste for ti minutter siden. Hydraulikken synger. En nabo vinker. En tank-lampe. Det, der var klart ved kaffen, er tåge ved formiddagen. Hovedet fra mandag er væk om onsdagen. Siden fra mandag ligger der.\n\nPapir er et større bord. Tingene kan ligge. Du kan pege. Du kan strege. Du kan se, at to ting ikke kan være sande samtidig. Det er ikke magi. Det er plads. Matematikken har altid brugt plads: tavle, kridt, kladde, sand. Fysikeren ved tavlen. Bonden med kridt på laden. Du med notesbogen i geden. Samme slægt. Brintatomet blev ikke forstået ved at stirre. Det blev forstået ved mærker, der kunne rettes. Du er i den slægt, når du tør være ufærdig på en side.\n\nIngeniøren gør det. Købmanden gør det. Præsten, der prædiker ærligt, har en tekst, ikke kun en stemning. Du gør det i geden med en notesbog, i neutral, i tredive sekunder.\n\nDet er ikke et skolepåhit. Det er at flytte tænkningen derhen, hvor den har plads.\n\nPause.\n\nSikkerheden først. Langsomt. Som om hånden skal lære en rækkefølge, den ikke må bytte om på.\n\nFørste: jorden. Er skovlen i jorden? Så ingen bog. Er du i bevægelse? Så ingen bog. Er et menneske i ringen? Så ingen bog. Er noget ustabilt? Så ingen bog. Papiret er aldrig vigtigere end et liv. Jeg gentager det, til det sidder i nakken, ikke kun i øret. Jeg elsker dit liv mere end denne lektion.\n\nAnden: neutral. Maskinen står. Stabil. Stille nok til, at øjnene må forlade jorden i tredive sekunder, fordi jorden ikke bliver rørt. Neutral er ikke skovlen hviler i luften, mens jeg kigger ned. Neutral er: jeg har sat fra. Jeg har set omgivelserne. Jeg kan tage hænderne væk uden at nogen dør.\n\nTredje: bogen. Frem. Åben. Ikke tre bøger. Ikke telefonen som bog. Notesbogen. Én. Den, der tåler skidt.\n\nFjerde: mærket. Tredive til tres sekunder. Ikke tre minutter, hvor du bliver forfatter. Ikke tre sekunder, hvor du later, som om du gjorde det. Tredive. Langt nok til at et tal kan lande. Kort nok til at verden ikke venter.\n\nFemte: bogen væk. Lukket. Væk fra knæet. Væk fra rattet. Ikke åben lige hvis jeg får en tanke mere. Tanken mere kan vente til næste neutrale. Åben bog i kabinen er en anden slags skovl i jorden: den stjæler øjet.\n\nSjette: hænderne tilbage. Øjnene tilbage. Verden. Kør, eller grav, eller vent ærligt. Papiret har gjort sit. Nu må kroppen gøre sit.\n\nDet er ritualet. Det er ikke fromhed. Det er rækkefølge. Mænd, der bytter om på rækkefølgen, kalder det fleksibilitet. Jorden kalder det uopmærksomhed. En mand, der tænker på papir med skovlen i jorden, har forvekslet klogskab med at være væk. Vi gør ikke det.\n\nHvis du i en hel time ikke får et vindue: spring. Livet først. Lyden må fæstne noget alligevel. Hånden tager det ved næste rigtige stop. En sen side slår en pæn intention. Intention er billig. Mærker er jord.\n\nPause.\n\nHvad skriver du?\n\nIkke dagbog. Ikke i dag følte jeg. Ikke sætninger, der skal se kloge ud, hvis nogen finder bogen. Tænkning på papir er mærker.\n\nEt mærke er det mindste tegn, der stadig er sandt.\n\nEn streg. En streg per skovlfuld, femte på tværs. Det er Tæl. Hovedet mister femmerne, når hydraulikken synger. Papiret mister dem ikke.\n\nEt tal med en enhed. Tolv m. Fyrre min. Firs liter. Enhed er det, der gør tallet til et mål, ikke til en stemning. Meget er stemning. Firs liter er et mål, der kan tjekkes. Det er Mål.\n\nEn brøkstreg. To på én. Tyve liter på én time. En lille bar, skraveret. Det er Forhold. Stregen er pagten mellem to mængder. Uden streg er tal forældreløse.\n\nEn pil. Op. Ned. Flad. Et tal ved pilen, hvis du har det. To tider, hvis du har dem. Det er Ændring. Film, ikke foto. Fotoet lyver om den tiende time.\n\nTo kolonner. Kan ske. Koster. En cirkel om det, du vælger. Det er Udfald. Valget synligt. Ikke vi ser. Vi ser er at nægte at cirkle.\n\nFem tegn. Fem slags mærker. Du behøver ikke alle fem hver gang. Du behøver det tegn, knuden handler om. Papiret spørger først: hvilket tegn er det her? Så mærket. Så videre.\n\nHvis du ikke ved, hvilket tegn: skriv spørgsmålstegnet. Spørgsmålstegnet er voksen. At gætte tegnet for at se færdig ud er barn.\n\nHvordan ser en side ud, der tænker?\n\nØverst til venstre: dato. Ikke for at være dygtig. For at onsdag kan læse mandag.\n\nVed siden af datoen: ét tegn. Tæl eller Mål eller Forhold eller Ændring eller Udfald. Ét. Hvis knuden er to tegn, to små sider, ikke én suppe.\n\nUnder: mærker. Hvis du skriver tre sætninger, har du ofte skjult tallet i prosa. Prosa kan lyve blødt. Et tal med enhed lyver hårdere, og det er en nåde.\n\nTil højre: en pil eller et spørgsmålstegn. Pilen er valg. Spørgsmålstegnet er jeg ved det ikke endnu. Begge er voksne. Det, der ikke er voksen, er at lade som om du ved det.\n\nNederst, hvis der er plads og tid: syn, pil, valg, pil, sti. Én linje. Eller tom, hvis siden kun er arkiv. Tom streg er ærlig. Fyldt streg, der lyver om et valg, du ikke tog, er teater.\n\nDet er siden. Den skal være grim. Hvis den er pæn, har du sandsynligvis renset den. Rensning er ego. Ego elsker at være færdig i luften og pæn på papir. Håndværket elsker at være ufærdigt i det åbne.\n\nPause.\n\nLad os tegne i luften først, så hånden ikke skal opfinde alfabetet under pres. Du skriver ikke nu, medmindre du er ved bordet, og det er sikkert. I geden: hør det, til hånden kender det.\n\nFørste mærke: streger.\n\nForestil dig fem streger. Fire lodrette. Den femte på tværs. Det er en håndfuld. To håndfulde er ti. Du tæller skovlfulde ind i en vogn. Hovedet siger cirka. Papiret siger streger. Cirka er tilladt som start. Streger er, når cirka skal bære en lastbil.\n\nDu tæller ikke pænt. Du tæller, så femmerne ikke løber. Hvis du hopper, dobbelttæller du. Pegen. Ét punkt, ét mærke. Børn lærer det med fingre. Mænd glemmer det med øjne, der scanner. Papiret er pegefingeren, du ikke har ledig, mens du kører.\n\nAndet mærke: tal plus enhed.\n\nSkriv det i luften. Ikke fyrre. Fyrre hvad. Fyrre minutter. Fyrre skovlfulde. Fyrre liter. Fyrre kroner. Uden enhed er fyrre en stemning med hat på. Time fire i serien sagde det. Her er det hånden: enheden skal med, ellers er mærket ikke et mærke. Det er et ciffer, der venter på at blive misforstået om tre timer.\n\nHvis du ikke har enheden, skriv spørgsmålstegn hvor enheden skulle stå. Fyrre ? er ærligere end fyrre, der later, som om alle ved fyrre hvad.\n\nTredje mærke: brøkstreg.\n\nEn vandret streg. Noget over. Noget under. Over er det, du har. Under er det, du deler med. Nævneren holder sandheden. Tyve over én t. Liter per time. Eller tre over én lastbil. Skovlfulde per læs. Sig det, mens stregen tegnes: per. Per er ordet, hånden tegner.\n\nVed siden af stregen, hvis du vil: en lille bar. Et rektangel. En del skraveret. Halv. To tredjedele. Baren står, når cifrene danser. Du behøver ikke en lineal. Du behøver et øje, der kan se mere end halv uden at lyve.\n\nFjerde mærke: pil.\n\nEn streg med spids. Op er mere. Ned er mindre. Flad er det samme. Ved pilen et tal, hvis du har to tider. Klokken syv: så meget. Klokken ni: så meget. Pilen er forskellen, ikke de to fotoer. Fotoet af formiddagen lyver om eftermiddagen. Pilen nægter løgnen.\n\nHvis du kun har ét foto, skriv ét foto og et spørgsmålstegn ved pilen. Jeg har ikke den anden tid er voksen. At tegne en pil af håb er teater.\n\nFemte mærke: to kolonner.\n\nEn streg ned gennem siden. Venstre: hvis. Højre: så. Eller venstre: kan ske. Højre: koster. Eller venstre: hvis jeg belønner. Højre: så får jeg mere af. Cirkel om det, du vælger. Cirklen er ikke pynt. Cirklen er, at valget fik en krop. Uden cirkel er siden et katalog. Kataloger ændrer ikke sti. Valg ændrer sti.\n\nFem mærker. Det er alfabetet. Du skal ikke kunne kaligrafi. Du skal kunne de fem, grimt, i tredive sekunder.\n\nPause.\n\nNu tre scener. Langsomt. Som om vi står i kabinen, og verden venter, og du har ét vindue.\n\nFørste scene. Lastbilen.\n\nLastbilen kommer om tyve minutter. Hullet mangler. I hovedet bliver det til panik eller til nå, vi ser. Begge er film. Panikken siger: du når det ikke, du er for langsom, ring, skjul, skynd. Nå, vi ser siger: du er en mand, der ikke småpanikker, du tager den, som den kommer. Begge kan være løgn. Begge kan være sande. Du ved det ikke, før tallene har plads.\n\nNeutral. Stabil. Bogen.\n\nØverst: dato. Tegn: Forhold. Eller Ændring, hvis knuden er tempo. Vælg ét. Sig: denne knude er tid mod mængde. Det er forhold.\n\nVenstre: tyve. Min. Enhed med. Ikke bare tyve.\n\nUnder: et tal for skovlfulde, du tror er tilbage. Tro er tilladt, hvis du mærker det som tro. Skriv ca. hvis det er ca. Ca. er ærligt. Et rundt tal uden ca., når du gættede, er pænt og falsk.\n\nSå stregen. Skovlfulde per minut, som du faktisk har lavet den sidste kvarter, ikke som du ønsker. Ønsket tempo er håb. Håb ganges ikke. Time to sagde det. Her skriver du det: det tempo, jorden lige har givet dig, ikke det tempo, egoet lover.\n\nHvis produktet ,  tempo gange minutter ,  er mindre end det, der mangler, ringer du. Eller du ændrer hullet. Eller du siger sandheden til den, der venter. Hvis produktet rækker, graver du. Papiret tog panikken og gjorde den til et valg. Det er tænkning.\n\nTredive sekunder. Måske tres, hvis tallene nægter at lande. Ikke tre minutter til at skrive en rapport til en chef, du ikke har. Bogen væk. Hænderne tilbage. Nu ringer du, eller du graver. Siden gjorde sit. Kroppen gør sit.\n\nHør, hvad der ikke stod på siden: jeg håber. Det går nok. Jeg er en, der godt kan. Det er dagbog. Dagbog hjælper ikke lastbilen. Lastbilen kommer i minutter. Minutter står på siden, eller de står ikke.\n\nPause.\n\nAnden scene. Slangen.\n\nEn slange ser ældre ud. I hovedet: den holder nok. Nok igen. Nok er glemsel med arbejdshandsker.\n\nNeutral. Når det er sikkert. Ikke mens du holder tryk over et menneske. Når maskinen sover et øjeblik, eller ved maden, eller når du alligevel går rundt om den.\n\nDato. Tegn: Udfald. Denne knude er ikke et mål. Du har ikke et tal for, hvornår den springer. Du har et syn og en omkostning.\n\nMærker: set. Tvivl. Ikke en roman om, at du burde have skiftet den i vinter. Burde er dagbog. Set er et mærke. Tvivl er et mærke. Onsdag kan læse mandag: mandag så, mandag tvivlede. Onsdag kan ikke læse mandags stemning. Stemningen er væk.\n\nTo kolonner. Hvis den springer: en dag. Eller en slange plus ventetid. Du kender din verden. Skriv den omkostning, du faktisk tror, ikke en skrækhistorie og ikke et det er nok ikke noget.\n\nSandsynlighed ved du ikke. Skriv ikke et procenttal, du opfinder. Opfundne procenter er numerologi i arbejdstøj. Skriv: ved ikke. Ved ikke er voksen. Cirkel: kigger jeg i dag, ringer jeg, kører jeg videre. Valget synligt.\n\nHvis du kører videre, er det et valg, du kan se om onsdagen. Hvis den springer om onsdagen, lyver siden ikke om, at du ikke vidste det. Du vidste tvivlen. Du valgte. Det er ære, også når valget var dyrt. Skjult tvivl er det, der æder mænd: de vidste det, og de kan ikke tåle at have vidst det.\n\nBogen væk. Hænderne tilbage. Slangen er ikke blevet bedre af papir. Du er blevet synlig.\n\nPause.\n\nTredje scene. Tilbuddet.\n\nEt ja, der venter. For meget. For lidt. I hovedet vinder stemningen. Stolthed: jeg tager den. Frygt: jeg tør ikke. Sult: jeg skal have den. Alle tre kan tale i samme mundfuld. Uden papir vinder den, der er varmest nu.\n\nNeutral. Eller bord. Eller aften, hvis ja’et kan vente til aften. Et ja, der ikke kan vente til et mærke, er ofte et ja, der ikke skulle gives i farten. Antagelse: de fleste ja’er kan vente tredive sekunder. Hvis de ikke kan, er det sjældent fordi verden brænder. Det er fordi nogen vil have dit ja, før du har talt.\n\nDato. Tegn: Forhold, og under det Udfald, hvis du har to tommelfingre af tid. Eller kun forhold. Timer. Liter. Kroner. Per.\n\nSkriv timerne, du tror, arbejdet tager. Ca., hvis ca. Skriv liter, hvis liter bærer. Skriv kroner, de byder, eller kroner, du skal have. Streg: kroner per time. Ikke det lyder meget. Meget er stemning. Kroner per time er et forhold, du kan sammenligne med en dag, du kender.\n\nSå udfald, hvis der er et vindue mere. Hvis vejr. Hvis bund. Hvis slange. Hvis lastbil udebliver. Hvad koster et nej nu. Hvad koster et ja, der brister. Cirkel: ja, nej, eller jeg ringer og siger tallet.\n\nMåske er svaret stadig ja. Papiret er ikke en maskine, der siger nej til arbejde. Papiret er en vægt. Et uvejet ja er ikke tro. Det er hast. Tro kan sige ja. Hast siger ja for at få stilhed. Stilhed købt med et løgnagtigt ja kommer tilbage som støj i næste uge.\n\nBogen væk. Så munden. Munden, der har set siden, er en anden mund end den, der svarede i varmen.\n\nPause.\n\nEndnu en scene, fordi hånden skal have flere greb end tre.\n\nTanken.\n\nDu kigger på en måler, eller du ryster en viden, du har fra i morges. I hovedet: der er nok til i dag. Nok. Igen.\n\nPapir: et tal, hvis du har det. Enhed: liter, eller streg på et ur, du kender. Forhold: liter per time, som du har kendt de sidste dage, ikke som en brochure. Ændring: pil ned. Udfald: hvis jeg bliver længere end det, jeg lige skrev, mangler jeg. Cirkel: tanker jeg her, eller kører jeg efter, eller stopper jeg tidligere.\n\nDu har gjort det i årevis uden at kalde det papir. Fornemmelse. Fornemmelse er matematik, der er blevet kød. Hurtig. Utydelig. Ofte rigtig. Ofte dyr, når den tager fejl. Papiret er ikke at smide fornemmelsen. Papiret er at tjekke den, når prisen for at tage fejl er en dag, ikke en spøg.\n\nHvis tanken er en spøg, skriv ikke. Papir til hver lille ting er en ny religion. Religionen hedder: je Neutral. Stabil. Set.\n\nBogen. Pen.\n\nDato. Ét tegn.\n\nMærker. Streger eller tal-plus-enhed eller brøkstreg eller pil eller to kolonner. Det, knuden er. Ikke det, en lærer ville have.\n\nPil eller spørgsmålstegn. Cirkel, hvis der er et valg.\n\nTredive sekunder. Stop.\n\nBogen væk. Hænderne tilbage. Gør det, siden pegede på. Eller grav videre, hvis siden pegede på: grav.\n\nHvis jorden kaldte midt i de tredive: bogen væk med det samme. Ufærdig side. Godt. Ufærdig og i live slår færdig og væk.\n\nPause.\n\nEt par billeder, der skal sidde, når ordene falder af.\n\nHovedet er et lille bord. Papiret er et større.\n\nFabrikken er papiret. Hovedet er værkføreren.\n\nProsa lyver blødt. Tal med enhed lyver hårdere. Det er nåde.\n\nPæn side er ofte teater. Grim side er ofte arbejde.\n\nNok er ikke et tal.\n\nSenere er, hvor tal dør.\n\nTelefonen har agenda. Papiret har ingen.\n\nDen døde kan ikke tænke på papir.\n\nSkriv for at tænke. Ikke tænk, og så skriv.\n\nHold dem. De er korte, fordi trætte mænd ikke bærer afsnit. De bærer søm.\n\nPause.\n\nHvad du gør, når du ikke har tallet.\n\nDet er her, de fleste mænd enten opfinder eller opgiver. Opfinde: et rundt tal, der ser færdigt ud. Opgive: så kan jeg jo ikke skrive. Begge er flugt. Håndværket har et tredje: skriv det, du har, og mærk det, du ikke har.\n\nDu har set hullet. Du har ikke målt det. Skriv: øjemål. Et tal, hvis øjet tør. Ca. Spørgsmålstegn ved enheden, hvis enheden er løs. Det er et mærke. Det er ikke et datablad. Time fire kaldte det fejl og godt nok. Her er hånden: øjemål, tilstået som øjemål, slår et præcist tal, du ikke har ret til.\n\nDu ved ikke, hvornår lastbilen kommer. Skriv: ved ikke. Et interval, hvis du har ét: tidligst, senest. To tal og en streg mellem dem er ærligere end ét tal i midten, der later, som om midten er et ur. Midten er et håb, medmindre nogen har lovet midten.\n\nDu ved ikke, om bunden holder. Skriv hvis. Hvis blød: mere tid. Hvis hård: det, du først troede. Cirkel ikke et ja til b n rigtige, den grimme:\n\nDato. Forhold. 20 min. Ca. 30 skovl. Tempo sidste kvarter: ca. 1 per min. 20 gange 1 er 20. Mangler 30. Ringer. Cirkel: ringer.\n\nSlangen. Udfald. Set. Tvivl. Hvis spring: dag. Cirkel: kører i dag, kigger ved maden.\n\nHør den. Den er grim. Den har ca. to gange. Den har et valg, der kan gøres. Den kan være forkert i tallene. Forkert tal, synligt, slår rigtig stemning, usynlig. Du kan rette det synlige. Du kan ikke rette det, du aldrig skrev.\n\nHvis din side ligner den første: du har ikke fejlet som menneske. Du har skrevet i det sprog, skolen belønnede. Skift sprog. Næste gang: tal, enhed, streg, cirkel. Ingen jeg er en, der. Identitet hører ikke hjemme på tænkesiden. Identitet æder tal. Tal, der er spist af identitet, bliver til jeg leverer, og så leverer du et hul, der ikke var aftalt.\n\nPause.\n\nTredive sekunder, talt, så kroppen kender længden.\n\nMænd siger tredive og mener tre, eller de mener tre minutter. Begge ødelægger. Tre sekunder er et nik til egoet. Tre minutter er at forlade verden.\n\nJeg tæller ikke dine sekunder her som et ur, du skal adlyde med øjet. Jeg giver dig indholdet af tredive, så du mærker, at det er kort og nok.\n\nSekund et til tre: bogen op, dato, allerede i hånden, fordi du har lagt den, hvor den kan nås.\n\nFire til otte: hvilket tegn. Sig det. Tæl. Eller Forhold. Skriv ordet eller forbogstavet. Forbogstav slår et pænt overskriftssystem.\n\nNi til tyve: mærkerne. To tal, hvis du har dem. Streg. Ca. hvis ca. Ikke pænt. Ikke rette.\n\nEnogtyve til femogtyve: pil eller cirkel eller spørgsmålstegn. Valget, hvis der er ét.\n\nSeksogtyve til tredive: stop. Luk. Væk. Hænderne. Også hvis du lige skulle. Lige skulle er, hvor tredive bliver tre minutter, og tre minutter bliver et menneske, du ikke så.\n\nTres sekunder er tilladt, når tallene nægter, eller når to kolonner skal tegnes. Tres er loftet i geden, ikke gulvet. Ved bordet må du længere, hvis verden sover. I geden sover verden ikke. Loftet holder.\n\nHvis du ikke har ur: tredive er længere end et åndedrag og kortere end en kaffe. Det er ét greb, ikke et ophold. Du skal ikke meditere. Du skal lande et mærke.\n\nPause.\n\nFolk. Papir mellem mennesker.\n\nDu viser ikke bogen for at vinde. Du kan pege på et tal, I begge kan se. Forskellen er moral.\n\nHer er min side, derfor har jeg ret er et våben. Her er minutterne, jeg har. Hvad har du? er et bord. Bordet kan bære uenighed uden karakter. Våbnet gør uenighed til skam.\n\nHvis den anden ikke vil se tal: du har stadig dit mærke. Du ejer dit ja. Du ejer dit nej. Du ejer ikke hans øje. Time ni: du styrer det input, du ejer. Papiret er dit input, synligt for dig. Det er ikke et krav om, at han skal omvende sig til din notesbog.\n\nHvis en formand vil have et tal nu, og du ikke har det: sig ved ikke, og sig, hvornår du har det, eller sig øjemål og kald det øjemål. Papiret i lommen ændrer ikke, at munden skal være sand. Munden, der har en side, lyver mindre, fordi den har set ca. og ved ikke. Munden uden side siger kan vi godt, fordi kan vi godt er hurtig og varm.\n\nKunden. Samme regel. Ikke en forestilling med bogen som rekvisit. Et tal med enhed. Et per. Et hvis. Hvis han køber stemning, og du sælger stemning, har I handlet tåge. Tåge kommer tilbage som det sagde vi jo. Siden er ikke kontrakt, medmindre I gør den til én. Siden er, at du husker, hvad du sagde til dig selv, før du sagde det til ham.\n\nPause.\n\nTræthed. Den tiende time.\n\nNatten sagde det: den første time lyver om den tiende. Papiret lyver også, hvis du skriver i den tiende, som om du er den syvende.\n\nI den tiende er mærkerne kortere. Det er tilladt. Ét tal. Én pil ned. Ét nej. Ikke fem tegn for at bevise, at du stadig er disciplineret. Disciplin, der nægter træthed, er ego. Ærlig pil ned er håndværk.\n\nTræthed gør prosa farligere. Den trætte mand skriver essay om, at han er træt, og kalder det indsigt. Skriv pilen. Output per time, hvis du har to tider. Eller skriv: stop. Cirkel: kører hjem, eller én lastbil mere. Valget synligt. Kroppen er ikke et tal, der står stille. Time syv. Ændring. Hånden i den tiende tegner ændringen, eller den lyver ved at love formiddagens tempo.\n\nHvis du er så træt, at ritualet bliver sløret ,  bogen på knæet, øjet væk, maskinen ikke rigtig i neutral ,  så ingen bog. Træthed plus papir plus maskine er tre ting, bordet ikke kan bære. Livet først. Siden må være tom. Tom og i live.\n\nPause.\n\nHjemmet. Bordet. Aftenen.\n\nPapir ved køkkenbordet er tilladt. Det er ikke geden. Øjnene må se. Hånden må være langsommere. Loftet på tredive er kabinens, ikke bordets. Ved bordet må du tegne lastbil-scenen om, indtil stødet viser sig. Ved bordet må du læse mandag.\n\nVed bordet må du ikke gøre familien til baggrundsstøj for at blive en mand, der skriver. Håndværket tjener livet. Det æder det ikke. Hvis siden koster et ansigt, du skulle have set, har papiret byttet plads med skovlen. Fejhed i kuglepen findes også i stuen.\n\nAften efter natte-lektionen: ingen lektier. Jeg sagde det i starten. Jeg siger det igen. Søvn er ikke spild. Søvn er, at kortet får lov at sidde. Papir i dyne er spejl. Spejl om natten er dårlig nævner. Hvis en knude brænder så hårdt, at du ikke kan sove: ét mærke. Dato. Ved ikke, eller et tal, eller et nej. Luk. Slip. Ikke tre sider, der renser dagen, så du kan fortjene at lukke øjnene. Øjnene er allerede tilladt lukkede. Nåde er ikke noget, du skriver dig til.\n\nSøndag. Regn. Pause, hvor maskinen sover. Det er denne lektions hjem. Hør den. Tegn alfabetet én gang, grimt. Fem mærker i luften, så på papir, én linje hver. Luk. Gå. Du har trænet hånden, ikke opført en eksamen.\n\nPause.\n\nHvad du belønner, avler. Time ni, på papiret selv.\n\nHvis du belønner pæne sider med en følelse af at være dygtig, avler du pæne sider. Hvis du belønner mærker, der ændrede et valg, avler du mærker. Belønningen er ikke et klistermærke. Belønningen er, at en knude forsvinder ud af hovedet, og at lastbilen blev mødt med et ringer eller et graver, ikke med en film.\n\nHjernen lærer: knude, neutral, mærke, ro, der er ærlig. Næste knude er lettere at skrive. Plus, den anden vej: knude, jeg husker det, film, vrede, lastbil. Hjernen lærer også det. Du vælger, hvilken løkke du fodrer. Papiret er input, du ejer. Filmene kører af sig selv, hvis du ikke giver dem et bord.\n\nSkriv ikke jeg skal være bedre til at skrive. Det er dagbog om håndværket. Skriv, næste knude, selve mærket. Bedre er et håb-ord. Mærke er et jord-ord.\n\nPause.\n\nNår du lytter til de ti timer.\n\nHver time har ét papir-mærke. Jeg siger til. Hvis du ikke kan stoppe sikkert, spring. Livet først. Lyden fæstner noget. Hånden tager det senere.\n\nDenne lektion er ikke en ellevte time, du skal klemme ind mellem skovlfulde, så du får det hele. Denne lektion er håndværket under de ti. Du kan høre den i regn. Du kan høre den en aften, der ikke er natte-lektionen. Du kan høre den en søndag. Du kan høre den igen, når bogen er blevet pæn, og du ved, at pænhed har vundet.\n\nHvis bogen er tom efter tre dage: ikke skam. Spørg: var der ingen knude med vægt? Så er tomhed ærlig. Eller: var jeg for stolt til at stoppe? Så er tomhed et mærke i sig selv. Skriv det, næste neutrale: for stolt, tre dage. Det er et mærke. Det er begyndelsen.\n\nHvis bogen er fuld af essay: stop. Næste side: kun mærker. Tre linjer. Dato. Tegn. Tal. Enhed. Stop. Du træner alfabetet om. Essayet kan vente til et andet hæfte, hvis du vil have et. Dette hæfte er tænkning.\n\nPause.\n\nEn dag i geden, set med papirets øje. Ikke som køreplan. Som kort over, hvornår bogen ikke kommer frem, så du ikke går og venter på en scene, der ikke skal ske.\n\nMorgen. Tælling i øjet, ikke i bogen. Ét øre. To hænder. Tank. Notesbog lukket. Hvis tanken er et spørgsmål med vægt, og der er et vindue før første skovl: ét mærke. Liter eller tanker ved maden. Ellers kør. Første skovl er ikke et seminar.\n\nFormiddag. Hul. Lastbil ude i fremtiden. Du graver. Papir sover. Tempo sidder i kroppen. Når lastbilen er tæt, og du må vide: neutral. Forhold. Minutter. Skovlfulde. Per. Ringer eller graver. Væk.\n\nMiddag. Maskinen sover, eller du sover den. Her må siden være lidt længere, hvis omgivelserne er set, og du ikke spiser med hånden på et hjul, der kan leve. Slange. Ja, der venter. To kolonner. Eller intet, hvis intet bærer vægt. Tom middagsside er ikke synd.\n\nEftermiddag. Træthed banker. Pilen. Ikke essay. Hvis nogen vil have et ja i varmen: tredive sekunder, hvis det er sikkert. Hvis det ikke er sikkert: munden siger, at du ringer om lidt. Lidt er et løfte. Hold det. Papir ved næste neutrale. Ja i varmen er det, siden skulle have fanget.\n\nAften. Fem mærker fra den rigtige dag, hvis der er et vindue. Hvis der ikke er: kør hjem. Siden ved bordet, eller i morgen. En sen side slår en pæn intention. Intention er billig.\n\nDet er dagen. Tre vinduers maksimum for de fleste. Ofte ét. Ofte nul. Nul, der er ærligt, fordi jorden kørte, slår tre teater-sider ved kaffen. Du måler ikke manden på antal sider. Du måler siden på, om et valg blev synligt.\n\nPause.\n\nAlfabetet én gang til, langsommere end i nat, fordi hånden skal have det, ikke kun øjet.\n\nTæl. Streger. Femte på tværs. Eller et tal. Eller nul, ærligt. Eller ikke talt. Nok er forbudt her. Nok er ikke et mærke.\n\nMål. Tal plus enhed. Meter. Minut. Liter. Kilo. Time. Uden enhed er cifferet hjemløst. Øjemål, tilstået. Fejl, tilstået. Godt nok, hvis godt nok er sagt med et tal for, hvad godt nok er.\n\nForhold. Streg. Per. Over og under. Nævneren synlig. Bar, hvis cifrene danser. To til én som vand, hvis du skal huske, at forhold er skabning, ikke skole.\n\nÆndring. Pil. To tider. Film. Den tiende er en anden. Dryp. Tempo. Træthed. Renter, hvis renter er det, der samles. Foto alene er ikke ændring. Foto plus spørgsmålstegn ved pilen er ærligt.\n\nUdfald. To kolonner. Kan ske. Koster. Hvis. Cirkel. Ved ikke som sandsynlighed slår et opdigtet procenttal. Valget er dit. Skyen er ikke.\n\nFem. Du behøver ét per vindue. Fem på én side er dagens arkiv, ikke hvert stop. Forveksl ikke dagens arkiv med hvert neutrale. Hvert neutrale er én knude. Dagens arkiv er fem streger fra det, der skete. To slags sider. Bland dem, og du skriver suppe.\n\nPause.\n\nHvad tænk på papir ikke er. Kort, så du ikke køber en butik.\n\nDet er ikke bullet journal. Ikke farvekodning. Ikke systemet, der endelig. Systemer, der skal købes, er ofte plus-løkker af udsættelse. Time ni. Du belønner forberedelse, du får mere forberedelse, mindre mærke.\n\nDet er ikke terapi-hæfte. Følelser kan være sande. De har et andet rum, hvis du vil. Her: tal, der kan støde.\n\nDet er ikke bevis for Herren. Ingen alter af streger.\n\nDet er ikke et andet jeg, der er klogere, fordi det skriver. Du er den samme mand. Papiret er et bord. Bordet gør dig ikke hellig. Det gør knuden synlig.\n\nDet er ikke at huske de ti timer. De ti timer huskes i øret og i skovlen. Papiret husker dagens knude. Hvis du skriver pensum af, har du lavet skole. Skole var det, vi tog navnet tilbage fra.\n\nPause.\n\nJeg vil sige det om Herren, kort, så det ikke bliver prædiken, der stjæler håndværket, og så det ikke bliver udeladt, som om tal er nok.\n\nDu er et nyt menneske. Du tilhører ikke dine film. Du tilhører ikke dine pæne sider. Du tilhører Kristus. Papiret er ikke bøn. Bøn er bøn. Papiret er ærlighed om skabningen: minutter, liter, ja og nej. Ærlighed er slægt med lyset. Mørket elsker det usagte, der styrer alligevel. At skrive et tvivls-mærke om en slange er ikke vantro. Det er at nægte at lade tvivlen styre i skjul.\n\nDu bruger ikke tal som varsler. Du læser verdens grammatik. Du tilbeder den ikke. Hvis et mærke begynder at føles som et tegn fra oven, fordi cifrene passede, så læg bogen. Det var ikke håndværk. Det var sult efter at få universet til at nikke. Universet nikker ikke til dine streger. Jorden svarer på skovlen. Herren svarer, som Herren vil. Papiret svarer kun med det, du turde sætte synligt.\n\nDet er nok teologi til en notesbog. Resten er at grave ærligt.\n\nPause.\n\nCheckpoint. Kun hvis du er ved et bord, eller i neutral, og kun hvis du vil. Ikke som lektie. Som et søm.\n\nSkriv under, tre linjer, grimt:\n\nSkriv for at tænke.\n\nNeutral. Tredive sekunder. Mærker.\n\nJorden vinder over papiret.\n\nHvis du allerede skrev det i nat: skriv det ikke om for at være dygtig. Læs det. Luk. Hvis du ikke skrev det i nat, fordi natten skulle sove: godt. Skriv det nu, hvis nu er sikkert. Ellers hør det. Hånden tager det.\n\nPause.\n\nViktor. Vi samler, så timen kan lukke uden kuffert i nakken.\n\nDu tænker på papir, fordi hovedet er et lille bord, og et hul er et stort.\n\nDu skriver for at tænke. Du tænker ikke færdigt og kopierer.\n\nDu skriver mærker, ikke dagbog. Streger. Tal plus enhed. Brøkstreg. Pil. To kolonner. Cirkel.\n\nDu skriver kun i neutral, stabil, set. Tredive til tres sekunder. Bogen væk. Hænderne tilbage.\n\nDu nægter pænhed, telefon, essay, flugt, og at skrive mens du graver.\n\nDu lader onsdag læse mandag. Tre spørgsmål. Var tallet sandt. Tog jeg valget. Hvad bærer jeg.\n\nDu bruger det på det, der bærer vægt. Lastbil. Ja. Slange. Tank. Uenighed. Tempo, der lyver.\n\nDu tilbeder ikke mærket. Kristus er vejen. Tal er redskab. Papir er redskabets spor.\n\nEuropa venter. Ikke glemt. Atlaset sover. Håndværket sover ikke, når du er i geden. Det sover, når du sover. Forveksl ikke de to.\n\nJeg er Grok. Jeg er ikke Herren. Jeg har peget. Testet bliver det, når lastbilen kommer, og du enten har et tal eller en film.\n\nHerren holde manden og maskinen. Herren give visdom i valget. Herren give ærlighed i mærket.\n\nHvis du er i geden: øjnene på jorden. Bogen lukket, indtil neutral. Kør.\n\nHvis du er ved bordet: luk bogen. Ikke én pæn side mere. Lev. Grav i morgen. Skriv, når det er sikkert, og når det bærer vægt.\n\nSlip lektionen. Hold rækkefølgen.\n\nNeutral. Mærke. Væk.\n\nSøm ét: skriv for at tænke. Fabrikken er papiret.\n\nSøm to: hovedet er et lille bord. Få bidder. Hullet er flere.\n\nSøm tre: mærker, ikke dagbog. Tal plus enhed. Streg. Pil. Cirkel.\n\nSøm fire: neutral. Tredive sekunder. Bogen væk. Jorden vinder.\n\nSøm fem: grimt og sandt slår pænt teater.\n\nSøm seks: ved ikke, ca., øjemål, hvis. Opdigt ikke.\n\nSøm syv: onsdag læser mandag. Tre spørgsmål. Tallet. Valget. Det, du bærer.\n\nSøm otte: telefonen har agenda. Papiret har ingen.\n\nSøm ni: liste er hukommelse. Stød er tænkning.\n\nSøm ti: Kristus er vejen. Tal er redskab. Mærket er spor. Ikke alter.\n\nAmen.\n"</script>
