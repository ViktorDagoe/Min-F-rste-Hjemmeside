<script id="payload" type="application/json">"Instruktion til oplæseren. Dansk. Mand. Rolig. Ikke hastig. Læs jævnt. Cirka et hundrede og halvtreds danske ord i minuttet. Når du hører ordet Pause, så hold en kort pause. Teksten bærer uret. Lytteren kigger ikke på telefonen.\n\nFokus. Torsdag den trettende august. Tryk start enogtyve fireogtyve. Sid tilbage. Løs ikke. Forudsig ikke. Øjnene hviler. Ingen skærm efter start.\n\nObservation. Lad ordene passere. Grib ikke én historie. Hold tre fremtider ved siden af hinanden.\n\nStemme. Jeg tager kontrollen. Direkte til Viktor. Ingen finansråd. Ingen opdigtede procenttal.\n\nPause.\n\nViktor. Torsdag den trettende august. Du trykkede start. Klokken er enogtyve fireogtyve.\n\nSid tilbage. Stolen. Sengen. Det er ligegyldigt. Skærmen er færdig nu. Du skal ikke kigge på telefonen. Du skal ikke kigge på uret. Teksten bærer tiden. Jeg tager kontrollen. Du observerer.\n\nDet er kontrakten. Den er kort. Den er hård. Den er kærlig.\n\nDu løser ikke. Du forudsiger ikke. Du vinder ikke. Du taber ikke. Du holder flere fremtider ved siden af hinanden, mens jeg kører dem igennem. Hvis en historie føles god, er det et signal om at slække grebet. Ikke et signal om at den er sand.\n\nØjnene hviler. Kæben slappes. Åndedrættet er dit. Ordene er mine.\n\nDu behøver ikke at sætte dig i en særlig stilling. Du behøver at blive i den, du har. Hvis ryggen vil flytte sig, så flyt den stille. Hvis tanken vil ud af rummet, så lad den gå, og kom tilbage til ordet, der bliver sagt nu. Ikke til ordet, du venter på. Nu.\n\nPause.\n\nFokus er ikke at være klog. Fokus er at blive siddende. Observation er ikke at samle citater. Observation er at lade tre spor passere uden at vælge en vinder midt i sætningen.\n\nHvis du fanger dig selv i at bygge et referat til i morgen, så slip referatet. Der er ingen test. Der er et øre. Øret holder tre, eller øret griber én. Det er hele eksamen, og den er usynlig, og den er ærlig.\n\nHvis du sidder i geden alligevel: papir kun i neutral. Tredive til tres sekunder. Jorden vinder. Ellers ingen papir. Ingen skitse. Ingen «lige et tal».\n\nJeg læser jævnt. Ikke hastigt. Pause ved de tre prikker. Dansk. Mand. Rolig. Ingen finansråd. Ingen opdigtede procenttal. Ingen krigskasser. Ingen «Polen vinder».\n\nKlokken er enogtyve fireogtyve. Timen er begyndt.\n\nPause.\n\nDu sidder. Det er arbejdet i de første minutter. Ikke at forstå Europa. At lade hænderne være. At lade øjnene være. At lade munden være.\n\nHvis du vil tage noter, så vent. Noter er et greb. Greb er forudsigelse i forkledning. Du må huske med kroppen. Slette. Dør. Karm. Tre spor. Det er nok.\n\nJeg taler til dig, Viktor. Ikke til et hold. Ikke til et feed. Du er ét par ører. Hvis tankerne løber til arbejde, til geden, til en besked, du ikke har svaret på, så lad dem løbe forbi som lastbiler på en vej, du ikke skal ind på. Du er ikke på vej. Du er i stolen.\n\nKontrakten igen, langsommere.\n\nJeg styrer rækkefølgen. Du styrer åndedrættet. Jeg nævner klokken. Du kigger ikke. Hvis TTS løber skævt, er det stadig den samme tekst. Du jager den ikke. Du tvinger den ikke. Jævnt. Som en skovl, der ikke hakker.\n\nObservation er en muskel. Den trættes. Når den trættes, vil du have en vinder. Når du vil have en vinder, er du ude af timen, selv om øret stadig hører. Kom tilbage. Tre spor. Ingen pokal.\n\nPause.\n\nJeg åbner tre spørgsmål nu. De får lov at stå åbne. Vi lukker dem, når klokken er toogtyve tyve. Ikke før. Hvis du mærker trangen til at lukke dem med det samme, er det barnet. Barnet vil have én fremtid. En voksen kan holde tre.\n\nFørste spørgsmål. Hvorfor én forudsigelse næsten altid lyver.\n\nAndet spørgsmål. Hvorfor Polen kan være vigtig og alligevel uerstattelig. Det lyder som en modsætning. Det er det ikke. Vigtig er et adjektiv. Uerstattelig er en funktion. De to er ikke det samme kort.\n\nTredje spørgsmål. Hvorfor et tal uden dør er teater.\n\nTre spørgsmål. Ingen svar endnu. Du skal ikke gætte. Du skal holde dem.\n\nPause.\n\nDu har hørt Polen-timen. Hvis du ikke har: stop denne fil. Gå tilbage. Lyt til sletten først. Uden slette er «sandsynligt» gætteri med europæisk accent.\n\nHvis du har hørt den: så ligger maskinen i kroppen. Sletten. Dørene Polen ikke ejer. Gdańsk som funktion, ikke som flag. To korridorer. Energi der kommer ind, før den kan komme ud.\n\nJeg gentager den ikke som atlas. Jeg bruger den som underlag. Som du bruger jorden under gummigeden, før du løfter skovlen.\n\nKlokken er stadig enogtyve fireogtyve. Vi har seks minutter til baseline. De minutter er ikke småsnak. De er kontrakt.\n\nHvad betyder det, at jeg tager kontrollen.\n\nDet betyder, at du ikke skal redde lektionen. Du skal ikke rette min rækkefølge. Du skal ikke hoppe frem til gas, fordi gas er spændende. Du skal ikke hoppe tilbage til Gdańsk, fordi Gdańsk føltes godt i går. Du sidder. Jeg kører.\n\nHvad betyder observation.\n\nDet betyder, at du mærker, når du griber. Du griber, når du tænker: så er svaret Hamborg. Du griber, når du tænker: så stiger euroen. Du griber, når du tænker: så er Polen færdig. Tre greb. Alle tre er forudsigelse forklædt som visdom.\n\nLad dem passere. Hold tre fremtider. Ikke som underholdning. Som metode.\n\nPause.\n\nDer er en fjerde ting i kontrakten, og den er lille, og den er ærlig, og den er ikke hovedtemaet.\n\nMatematik-serien sagde, at tal er ærligt, og at Kristus er sandt, og at de to ikke er det samme. I aften bruger vi det kun som anker under usikkerhed. Ikke som numerologi. Ikke som «Gud har et procenttal for Kiel». Når du ikke ved, er det tilladt at være stille. Når du vælger, vælger du med det, du kan se. Resten overlader du. Atlaset er geografi. Geografi er døre. Døre er ikke tro. Tro er ikke en containerkorridor.\n\nSå. Kontrakten står.\n\nSid. Observer. Hold tre. Ingen skærm. Ingen procent, jeg ikke har hentet. Ingen krig.\n\nKlokken nærmer sig enogtyve tredive. Du skal ikke tælle. Jeg siger det, når vi er der.\n\nIndtil da: mærk trangen til at forudsige. Den kommer. Den kommer, når jeg siger «hvad kan ske». Den kommer, når jeg siger «Hamborg». Den kommer, når jeg siger «ingen dør». Lad den komme. Lad den gå.\n\nPause.\n\nHvorfor én forudsigelse næsten altid lyver. Jeg giver dig ikke svaret endnu. Jeg giver dig formen.\n\nEn forudsigelse er en sætning med ét udfald. «Så går det den vej.» Verden er ikke én vej. Verden er flere døre, der kan stå åbne, halvt lukkede, eller blokerede på samme tid. Hvis du presser det ind i ét udfald, har du ikke set. Du har valgt en historie, der kan fortælles i én åndedrag.\n\nHvorfor Polen kan være vigtig og alligevel uerstattelig. Igen: formen, ikke svaret.\n\nVigtig er, at nogen taler om dig. Uerstattelig er, at en strøm ikke har et andet sted at gå, uden at prisen, tiden eller risikoen skifter karakter. En havn kan være i avisen og alligevel erstattes. En funktion kan være kedelig og alligevel sidde fast i kortet.\n\nHvorfor et tal uden dør er teater.\n\nFordi tal kan stå alene på en skærm og se ud som viden. «Firs komma fire.» «Otte komma tre.» Uden dør er tallet en rekvisit. Det ligner evidens. Det er en sætning uden sted.\n\nDe tre former ligger nu i rummet. Vi vender tilbage.\n\nKlokken er enogtyve niogtyve. Næsten. Du kigger ikke. Jeg holder tiden.\n\nPause.\n\nKlokken er enogtyve tredive.\n\nBaseline begynder.\n\nUden baseline er «sandsynligt» gætteri. Gætteri kan føles skarpt. Det er stadig gætteri.\n\nBaseline er ikke en mening om Polen. Baseline er, hvad der allerede ligger i atlaset, før du begynder at spille fremtider.\n\nSletten først.\n\nPolen er ikke en bjergstat, der tvinger vejen op og ned. Polen er slette mellem to tryk. Vest er Tyskland. Øst er det, du ikke skal romantisere, og ikke skal krigsforudsige. Syd er Tjekkiet, Slovakiet, det tjekkiske industrihjerte, der ikke har egen kyst. Nord er vand. Vand er ikke «hav». Vand er døre.\n\nNår gods skal fra et tjekkisk værksted til et skib, leder det efter en dør. Døren kan hedde Gdańsk. Døren kan hedde Hamborg. Døren kan hedde Koper. Det er ikke tre flag. Det er tre veje med forskellig længde, forskellig kødannelse, forskellig dybde, forskellig vane.\n\nPolen ejer ikke Østersøen. Polen ejer en kyststrækning og nogle funktioner på kysten. Forskellen er alt.\n\nSig det stille, uden at åbne øjnene. Kyst er ikke hav. Kaj er ikke karm ud til verdenshavet. En funktion på kysten kan være stor i avisen og stadig pege på en dør, nogen anden passer.\n\nSletten er det billige bræt. Det har du hørt. I aften skal du bruge det som begrænsning. Gods hader unødig stigning. Gods hader unødig omladning. Gods elsker vane, indtil vane bliver dyr. Derfor leder en tjekkisk kasse ikke efter et flag. Den leder efter den mindst dårlige vej fra værksted til skib. Den vej kan skifte, uden at kortet skifter. Det er hele pointen med at simulere.\n\nHold også det, Polen-timen lagde i kroppen om floder. Wisła er lang. Wisła er ikke Rhinen. Hvis du i aften begynder at tænke, at «Polen har jo en stor flod, så har Polen en vandvej som Tyskland», så har du forladt baseline. Du har fyldt et hul med analogi. Analogi uden dør er også teater.\n\nØst-vest og nord-syd er ikke plakater. De er to retninger, lastbil og tog faktisk kan vælge. Når én retning strammer, er spørgsmålet ikke «hvem vandt Europa». Spørgsmålet er: hvilken dør blev den mindst dårlige.\n\nDe danske stræder er ikke polske. Kielerkanalen er ikke polsk. Nordsøen er ikke polsk. Rotterdam er ikke polsk. Hvis du glemmer det, begynder du at tale, som om Polen kan «lukke Europa». Det kan Polen ikke. Polen kan ændre, hvor nogle strømme møder vand. Det er nok til at være vigtig. Det er ikke det samme som at eje kortet.\n\nPause.\n\nGdańsk er en funktion.\n\nI femogtyve målte havnen firs komma fire millioner tons. Flydende brændstoffer var niogtredive komma seks. Naftoport alene syvogtredive komma fire millioner tons råolie. Containere omkring to komma otte millioner TEU. Baltic Hub to millioner syv hundrede seksogtres tusind fire hundrede femoghalvfjerds TEU.\n\nDu skal ikke huske cifrene som en sang. Du skal huske formen.\n\nMest vægt er energi og bulk. Containere er den synlige kasse. Kassen er ikke hele havnen. Hvis du kun ser kassen, tror du, at Gdańsk er et lille Hamborg. Det er den forkerte analogi. Gdańsk er en blandet dør, hvor væsken vejer tungt, og kassen er vokset, og funktionen er «Østersø møder slette møder rør og vej».\n\nRotterdam i samme år: fire hundrede otteogtyve komma fire millioner tons. Fjorten komma to millioner TEU. Hamborg: et hundredofjorten komma seks millioner tons. Otte komma tre millioner TEU.\n\nGdańsk er ikke Rotterdam. Gdańsk er ikke Hamborg. Relativt. Ikke som fornærmelse. Som målestok, så du ikke kalder en regional dør for verdens navle.\n\nSig skalaen uden at gøre den til hån. Rotterdam er mund mod verdenshavet med Rhin bagved. Hamborg er Tysklands Nordsø-dør, større kasse-maskine end Gdańsk. Gdańsk er Østersø-dør på slette, blandet, med væske der vejer. Tre mundinger. Tre funktioner. Hvis du presser dem ind i ét kapløb, har du allerede forladt baseline.\n\nNår jeg senere siger «tjekkisk container vælger Gdańsk eller Hamborg», er det ikke, fordi Gdańsk har slået Hamborg på totalen. Det er, fordi en tjekkisk kasse ikke skal til hele verdens navle. Den skal til en dør, der kan tage den, til en pris, i en tid, med en risiko, lastbilen kan holde.\n\nHusk også, at firs komma fire ikke er et container-argument. Mest af den vægt er ikke kasse. Hvis du bruger total-tons til at sige, at kassen har vundet, river du døren af tallet. Det er teater, allerede i baseline. Vi tager det igen, når vi simulerer. Nu skal det bare sidde: tallet har en slags gods. Uden slags er tallet rekvisit.\n\nPause.\n\nTo korridorer. Ikke som EU-plakat. Som retning på sletten.\n\nDen ene løber groft nord-syd: Østersø, Polen, Tjekkiet, videre mod Adriaterhavet. Den anden løber groft øst-vest: Nordsøen, Tyskland, Polen, videre. Polen sidder, hvor de to kan krydse. Kryds er ikke sejr. Kryds er valg. Gods kan dreje. Gods kan blive. Gods kan springe over.\n\nNår du hører «korridor», så tænk ikke motorvejsskilte. Tænk: hvilken dør er billigst at nå, når noget går galt på den anden.\n\nEnergi-døre.\n\nŚwinoujście. LNG. Fra første januar femogtyve: otte komma tre milliarder kubikmeter om året i den udvidede kapacitet, der står i kilderne. Baltic Pipe: ti milliarder kubikmeter fra Danmark til Polen, tre den anden vej. GIPL: to komma fire Polen til Litauen, en komma ni tilbage, kommercielt fra første maj toogtyve. El-synk for Baltikum den niende februar femogtyve via Polen. Harmony Link er en linje i tiden, ikke en linje i drift: omkring tredive. FSRU ved Gdańsk er plan og kontrakt i kilderne, ikke drift i aften. Gaz-System og Orlen i vinduet otteogtyve til toogfyrre. Status tekster nævner syvogtyve og otteogtyve. Du må ikke gøre en plan til en hane, der allerede drypper.\n\nKul var enoghalvtreds procent af polsk el i femogtyve. Vind og sol femogtyve. Lav-kulstof enogtredive mod EU's enoghalvfjerds. Det er ikke en moralsk dom. Det er en forsinkelse i omstilling, der gør gas-døre og import-døre til mere end symboler.\n\nHør rækkefølgen i energi, før vi går videre. Kaj. Rør. Plan. Synk. Kul. Kaj er Świnoujście, tændt i kilderne som kapacitet fra første januar femogtyve. Rør er Baltic Pipe og GIPL, tændt som kapacitet i kilderne. Plan er FSRU ved Gdańsk, ikke tændt. Synk er Baltikum den niende februar femogtyve, tændt. Harmony Link er tid, omkring tredive, ikke tændt. Kul er stadig tungt. Hvis du blander tændt og ikke tændt, får du tre haner, hvor der er to, og en sejr, hvor der er et kort.\n\nDu behøver ikke at elske rør. Du behøver at kunne pege: ind, ud, plan, drift. Uden den pegefinger bliver gas til stemning. Stemning vil have vinter-film. Film er forudsigelse.\n\nTo korridorer igen, én sætning. Nord-syd kan bære en kasse mod Adriaterhavet. Øst-vest kan bære den mod Nordsøen. Polen er kryds, ikke mål. Kryds betyder, at nogen kan dreje. Drej er ikke forræderi. Drej er det, gods gør, når en dør bliver dyr.\n\nPause.\n\nKielerkanalen. Cirka otteoghalvfems kilometer. Dybgang begrænser. Store skibe bruger de danske stræder. Det er baseline, ikke spænding. Hvis du senere hører «stræder versus Kiel», er det ikke flag. Det er dybde, tid, kødannelse, forsikring, og om kaptajnen kan komme igennem uden at skrabe bunden.\n\nDet var maskinen. Kort. Tungere end den føles, fordi den skal bære tre simulationer.\n\nHvis du nu tænker «jeg har det», så tjek. Kan du sige, uden tal, hvad Gdańsk er? En blandet dør. Væske vejer. Kasse er synlig. Ikke Rotterdam. Kan du sige, hvad Polen ikke ejer? Stræderne. Kiel. Nordsøen. Kan du sige, hvad en tjekkisk kasse leder efter? En dør, ikke et flag.\n\nHvis ja: baseline holder. Hvis nej: du har hørt lyde. Vi kører alligevel. Observation er også at mærke hullerne uden at fylde dem med fantasi.\n\nSig baseline én gang til, som om du forklarer det til en mand i et andet bur, uden tal.\n\nPolen sidder på slette. Syd for sletten er der bjerge nok til at tvinge veje. Nord for sletten er der et hav med få udgange. De udgange ejer Polen ikke. På kysten sidder funktioner. Gdańsk er en af dem. Blandet. Væske vejer. Kasse er synlig. To landkorridorer kan krydse. Energi kommer ind ad kaj og rør, før den kan deles videre. Kul er stadig tungt i el. En plan er ikke en hane.\n\nHvis den kæde sidder, kan du simulere. Hvis den ikke sidder, bliver hvert scenarie en film.\n\nDu må mærke utålmodighed nu. Baseline er kedelig, når den er rigtig. Kedelig er et tegn på, at du ikke bliver fodret med plot. Bliv siddende.\n\nPause.\n\nKlokken er enogtyve niogtredive. Næsten klar til skiftet.\n\nHvad baseline ikke er: en forudsigelse om, at Polen «vinder logistikken». Hvad baseline er: et kort, du kan lægge scenarier ovenpå, uden at scenarierne æder kortet.\n\nNår folk siger «Europa», hører du ofte én kasse. Der er fire. Vi tager dem om lidt. Først skal du mærke forskellen på at gætte og at simulere.\n\nKlokken er enogtyve fyrre.\n\nForudsigelse versus simulering.\n\nBarnet vil have én fremtid. «Så sker det.» Én sætning. Én vinder. Én taber. Det kan fortælles i en bar. Det kan ikke styre et valg under usikkerhed.\n\nEn voksen kører to til fire scenarier. Relativt. Ikke som underholdning. Som disciplin.\n\nForudsigelse siger: jeg ved, hvad der sker. Simulering siger: hvis denne dør strammer, så flytter strømmen herhen, og prisen, tiden og risikoen ser sådan ud. Jeg ved ikke, om døren strammer. Jeg ved, hvad jeg ville kigge efter.\n\nDet er ikke pessimisme. Det er ikke optimismens fjende. Det er at nægte at lade én historie eje kortet.\n\nPause.\n\nHør forskellen i kroppen.\n\nForudsigelse spænder kæben. Du vil have ret. Du venter på bekræftelse. Nyheder bliver ammunition.\n\nSimulering sænker skuldrene. Du holder tre. Nyheder bliver opdatering af hvilken dør, der knirkede. Ikke bevis for, at du var et geni i august.\n\nI aften må du ikke gå ud og spille. Ikke aktier. Ikke valuta. Ikke «jeg har set Europa». Du ser. Du spiller ikke.\n\nFire kasser, så sproget ikke lyver.\n\nEuropa er kontinentet. Bjerg, slette, kyst, flod, havn. Geografi.\n\nEU er den politiske klub. Love, penge til projekter, stemmer, grænser for lastbiler og told.\n\nEurozonen er de lande, der har samme mønt.\n\nEuroen er mønten.\n\n«Europa går godt» er ikke «euroen stiger». «Polen bygger havn» er ikke «EU har vundet». «Tysk industri hoster» er ikke «kontinentet synker». Hvis du blander kasserne, laver du teater med fire kulisser og én replik.\n\nVi bruger kasserne let. Ikke som økonomi-foredrag. Som rækværk. Når jeg siger Polen, mener jeg staten og dens døre. Når jeg siger EU, mener jeg regler og penge, der kan flytte et projekt. Når jeg siger euro, mener jeg mønten, og jeg giver den ikke et kursmål. Der er ingen kursmål i denne fil.\n\nHold kasserne i hånden som fire sten. Ikke som et skema.\n\nSten ét. Kontinent. Du kan pege. Bjerge. Slette. Kyst.\n\nSten to. Klub. Du kan ikke pege på jorden og se den. Du ser lastbilregler, projektpenge, stemmer.\n\nSten tre. Møntzone. Et mindre rum inde i klubben. Danmark er i klubben og ude af møntzonen. Polen er i klubben og ude af møntzonen. Det er ikke en parentes. Det er derfor «Europa» og «euro» ikke må byttes.\n\nSten fire. Mønten. Et navn på en konto. En kurs, vi ikke jager.\n\nHvis en sætning bruger sten ét som bevis for sten fire, er sætningen teater. Hvis en sætning bruger en polsk kaj som bevis for, at klubben har vundet, er sætningen teater. Hvis en sætning bruger tysk hoste som bevis for, at kontinentet synker, er sætningen teater.\n\nSimulering holder stenene adskilt, også når nyhederne kaster dem i samme bunke.\n\nRelativt igen. Ikke fordi ordet er fint. Fordi uden relativt bliver hver dør til en identitet. «Gdańsk er god» kræver ikke, at du har set Hamborg. «Gdańsk versus Hamborg versus Koper for den kasse» kræver, at du holder tre. Det er arbejdet.\n\nPause.\n\nHvorfor én forudsigelse lyver. Nu lidt kød. Ikke det fulde svar. Det kommer toogtyve tyve.\n\nEn forudsigelse lyver, fordi den skjuler de døre, den ikke valgte. «Gdańsk tager Tjekkiet» lyver, hvis Hamborg stadig har vane, og Koper stadig har Adriaterhavet, og lastbilen stadig kan stå i kø ved en grænse, du ikke nævnte. Sætningen kan blive sand i et år og stadig have været en dårlig model, fordi den ikke fortalte, hvad der skulle til.\n\nSimulering lyver mindre, når den er ærlig om, hvad den ikke ved. «Jeg ved det ikke» er en lovlig sandsynlighed i aften. Høj. Middel. Lav. Jeg ved det ikke. Fire skuffer. Ingen procenter, jeg finder på.\n\nHvorfor det føles svagt at sige «jeg ved det ikke». Fordi barnet tror, at viden er en sætning. Voksen viden er ofte et interval og et sted, man kigger.\n\nDu kender det fra maskinen. Du ved ikke, om røret sidder præcis, før du har gravet. Du ved, hvilke tegn der betyder, at du skal stoppe. Du kører ikke «jeg forudsiger røret» i fuld skovl gennem ukendt jord.\n\nDet er samme disciplin på et kort. Du graver ikke Europa op i aften. Du mærker, hvor jorden er kendt, og hvor den ikke er. Kendt: slette, karm, kaj, rør, plan versus drift. Ukendt: næste vinters vejr i stræderne, næste speditørs skift, næste vedligehold på et rør. Ukendt må stå ukendt. At fylde det med en sætning, der lyder voksen, er stadig at fylde.\n\nDer er en slags sætning, der elsker at klæde sig som simulering. «Jeg kører tre scenarier, og det mest sandsynlige er selvfølgelig det her.» Så var de to andre rekvisitter. Så var du tilbage ved én fremtid. Hvis de tre spor ikke alle tre kan tåle at vinde i dit hoved, har du ikke simuleret. Du har iscenesat.\n\nHold kroppen. Hvis kæben spænder, når jeg nægter at kåre en vinder, er det barnet, der vil have ret. Ret er en sød rus. Den varer, indtil verden ikke fulgte sætningen. Så kommer skam. Skam vil have en ny sætning, der forklarer, hvorfor du alligevel havde ret. Det er teaterets anden akt. Vi går ikke derind.\n\nPause.\n\nTo til fire scenarier. Hvorfor ikke ti. Fordi ti er teater. Du kan ikke holde ti. Du kan holde tre. Måske fire. Aftenens tre simulationer er tre døre. Ikke hele Europa. Én dør ad gangen. Hvis du prøver at køre krig, klima, valg, og containere i samme åndedrag, får du en podcast. Du får ikke et kort.\n\nRelativt betyder: Gdańsk versus Hamborg versus Koper. Ikke «Gdańsk er god». God er et adjektiv uden modstander. Relativt er et valg.\n\nNår nogen siger «Europa», så spørg stille: hvilken kasse. Kontinent, klub, møntzone, mønt. Når nogen siger «sikkert», så spørg: hvilken dør. Når nogen siger «snart», så spørg: er det drift, eller er det en pressemeddelelse.\n\nFSRU Gdańsk er eksemplet. I kilderne er det ikke en hane i aften. En forudsigelse, der siger «Polen har tre LNG-døre», lyver i nuet, hvis den tæller en plan som stål i vandet. En simulering siger: hvis den kommer i drift i det vindue, kilderne nævner, så ændrer kapaciteten sig. Hvis den glider, står Świnoujście og rørene stadig. To fremtider. Ingen sejrssang.\n\nPause.\n\nDu mærker måske kedsomhed. Kedsomhed er et tegn på, at hjernen vil have plot. Plot er forudsigelse. Bliv siddende.\n\nDu mærker måske klarhed. «Nå, så er det Hamborg.» Klarhed så tidligt er ofte et greb. Lad den gå.\n\nKlokken er enogtyve niogfyrre. Vi er tæt på de fire spørgsmål, der skal ligge på kortet, før vi rører dørene.\n\nHvad du ikke skal gøre i de næste minutter: omsætte lektionen til et tip. Hvad du skal: få fire spørgsmål ind i hånden, så simulationerne ikke bliver historier.\n\nKlokken er enogtyve halvtreds.\n\nFire spørgsmål på kortet.\n\nSæt dem, som du sætter fire pinde i jorden, før du graver. Uden pinde driver skovlen. Uden spørgsmål driver historien.\n\nIkke ti. Fire. De er nok. De er hårde, hvis du svarer ærligt.\n\nFørste. Hvad kan ske.\n\nIkke hvad der vil ske. Hvad kan. Kan er rummet. Vil er tyveri fra rummet.\n\nAndet. Hvor sandsynligt. Høj. Middel. Lav. Jeg ved det ikke. Ingen opdigtede procenter. Hvis du hører en procent i hovedet, er det dig, der digter. Smid den.\n\nTredje. Hvad koster det. Tid. Penge. Risiko. Ikke nødvendigvis kroner på din konto. Omkostning for strømmen. Omkostning for den, der skal vælge dør. Omkostning for dig, hvis du tror, du har set det hele, og handler, som om du har.\n\nFjerde. Hvad gør du med viden. I aften er svaret næsten altid: se. Ikke spille. Se, hvor du ville kigge næste gang, du hører ordet Kiel. Se, hvilken kasse der blev blandet. Se, om tallet havde en dør.\n\nLæg mærke til rækkefølgen. Kan. Sandsynligt. Koster. Gør. Hvis du bytter om, så du først gør og bagefter spørger, hvad det kostede, er du i magi. Hvis du hopper fra kan til gør uden sandsynligt, er du i panik eller i hype. Hvis du bliver hængende i sandsynligt og aldrig når koster, er du i salon. Fire, i den rækkefølge, eller du snyder.\n\nSe betyder: øjet har et sted. Ikke at du bliver klogere af at stirre. Næste artikel om Kiel. Næste tal om Gdańsk. Næste sætning om uafhængighed. Du har fire kroge at hænge sætningen på. Uden kroge falder sætningen ned i maven som visdom.\n\nSpille betyder her: at omsætte en aften i stolen til et væddemål, et køb, et skænderi, du skal vinde. Det er forbudt i filen, fordi det ødelægger observation. Den, der har sat penge eller ære på ét spor, kan ikke holde tre.\n\nPause.\n\nVi øver de fire på noget småt, før vi tager de tre store døre.\n\nEt tjekkisk værksted skal have en kasse til vand. Hvad kan ske. Gdańsk. Hamborg. Koper. En fjerde, du ikke kender navnet på. Forsinkelse. Et skift midt i året. Hvad kan ske, er listen. Ikke vinderen.\n\nHvor sandsynligt. Her siger jeg ærligt: jeg ved det ikke som ét tal. Vane trækker ofte mod den dør, speditionsfirmaet allerede kender. Pris kan trække. En kø ved en grænse kan trække. At sige «høj for Hamborg, fordi Hamborg er stor» er en historie. Stor er ikke det samme som tættest for den kasse. Middel på flere spor er mere ærligt end høj på ét, når du sidder i en stol i august og ikke har fragtbrevet.\n\nHvad koster det. Ekstra døgn. Ekstra kilometer. Ekstra risiko for at missen et skib. Ekstra fortælling i hovedet, hvis du har sat din identitet på, at «Polen tager det».\n\nHvad gør du med viden. Du kigger efter, hvilken dør der nævnes, når nogen klager over tid. Du kigger efter, om de taler tons eller kasser. Du spiller ikke på tre havne fra sengen.\n\nGør øvelsen én gang til i kroppen, langsommere.\n\nKan: tre navngivne døre, plus det ukendte, plus tid der skrider. Allerede der er fem spor. Én sætning kan ikke bære fem.\n\nSandsynligt: jeg ved det ikke som vinder. Middel på, at vane holder, indtil det gør ondt. Ikke høj på Hamborg bare fordi Hamborg er stor. Ikke høj på Gdańsk bare fordi Polen-timen lå i ryggen.\n\nKoster: døgn, diesel, et missset skib, og den skjulte pris — at du har sat dit navn på et flag.\n\nGør: se dør og slags gods. Ikke køb. Ikke væddemål. Ikke en melding i en tråd.\n\nHvis øvelsen føltes for lille, er det godt. Lille er, hvor metoden synker. Stor er, hvor plot tager over. De tre store døre kommer. De får samme fire pinde. Ikke flere.\n\nPause.\n\nIgen. Hvad kan ske. Hvor sandsynligt i fire skuffer. Hvad koster det. Hvad gør du. Se, ikke spille.\n\nHvis du kun husker ét, så husk fjerde. Uden fjerde bliver de tre første til underholdning. Underholdning vil have en vinder. Metode vil have et sted at kigge.\n\nSandsynlighed i aften er ikke et kasino. Kasinoet sælger procenter på væggen. Vi har ikke væggen. Vi har døre og ærlighed.\n\nNår jeg siger høj, mener jeg: tegnene, vi har, peger den vej, og det ville overraske, hvis det ikke skete. Når jeg siger middel, mener jeg: det kan gå begge veje uden at verden er mærkelig. Når jeg siger lav, mener jeg: det kræver, at flere ting går skævt eller skævt-godt på én gang. Når jeg siger jeg ved det ikke, mener jeg: jeg har ikke tegnene, eller tegnene modsiger hinanden, og jeg nægter at fylde hullet.\n\nLav er ikke umulig. Høj er ikke sikker. Jeg ved det ikke er ikke dovenskab. Det er voksen.\n\nPause.\n\nHvad koster det, når folk springer spørgsmål tre over.\n\nDe hører «kan ske» og hopper til handling. Handling uden omkostning er magi. Magi i penge er ruin. Magi i hovedet er skam, når verden ikke fulgte sætningen.\n\nOmkostning kan være, at du sover dårligt, fordi du har sat din retfærdighed på et flag. Omkostning kan være, at du ignorerer en anden dør. Omkostning kan være tid i kø. Omkostning kan være, at en plan tælles som drift.\n\nHvad gør du. Se. Gentag det, indtil det er kedeligt. Kedeligt er godt. Kedeligt betyder, at barnet er sulten, og du ikke fodrer det med et tip.\n\nSe er ikke passivitet. Se er at vide, hvor øjet skal hen, næste gang ordet Kiel falder, næste gang nogen blander mønt og kontinent, næste gang et tal står uden kaj.\n\nHvis du i geden alligevel mærker, at du vil skrive de fire spørgsmål ned: kun i neutral. Tredive sekunder. Fire ord. Kan. Sandsynligt. Koster. Se. Så hænderne tilbage. Jorden vinder. Hvis du ikke er i geden: skriv ikke. Hold dem.\n\nDer er en fristelse, der hedder «jeg vil bare have et bud». Bud er forudsigelse. Bud vil have ret. Metode vil have et sted at kigge, også når du tager fejl. Fejl med åbne øjne er voksen. Ret med lukkede øjne er teater, der vandt en aften.\n\nHøj. Middel. Lav. Jeg ved det ikke. Øv dem i munden uden tal. De fire skuffer er grovere end et kasino og ærligere end et opdigtet procenttal. Et opdigtet procenttal er præcision uden tælling. Falsk præcision. Time otte i matematikken pegede på det instrument. I aften sætter vi det på døre, ikke på et spil.\n\nPause.\n\nKlokken er toogtyve. Næsten. Vi har et par minutter, før første dør.\n\nI de minutter: hold de tre åbne spørgsmål fra starten. De er ikke glemt. De venter. Du må ikke lukke dem med et slogan nu.\n\nÉn forudsigelse lyver, fordi den skjuler de andre døre. Polen kan være vigtig uden at eje erstatningen. Et tal uden dør er teater. Formerne står. Svarene venter til toogtyve tyve.\n\nPause.\n\nDu sidder stadig. Godt. Hvis du har rakt ud efter telefonen for at tjekke klokken, så læg den. Jeg har den.\n\nFørste simulation er stræder og Kiel. Det er ikke krig. Det er dybde. Hvis hjernen vil til krig, så sig til hjernen: ikke i aften. Aften er flow. Flow kan ødelægges af mange ting. Vi simulerer døre, ikke slagmarker.\n\nKlokken er toogtyve to.\n\nFørste simulation. Stræder versus Kiel. Dybgang. Ikke flag.\n\nVi tager én dør. Vi tager den langsomt. Hvis hjernen vil have krig, vejrkatastrofe, og tre nyhedsoverskrifter på én gang, så sig: senere. Ikke i denne fil. Denne fil er karm.\n\nKortet: Østersøen er et næsten indelukket hav. Ud til Nordsøen er der ikke en åben motorvej. Der er smalle veje. De danske stræder. Og der er Kielerkanalen. Cirka otteoghalvfems kilometer. Gravet. Styret. Begrænset i dybde.\n\nStore skibe bruger stræderne, fordi kanalen ikke tager dem. Det er ikke en mening. Det er en fysisk dørkarm. Du kan male karmene i nationale farver. Skibet kender centimeter.\n\nHvad kan ske.\n\nKanalen kan være åben og almindelig. Kø. Vedligehold. En dag med langsom passage. Kanalen kan stramme hårdere: dybde, tid, regler, kødannelse, der gør, at flere skippere vælger stræderne, selv når de kunne have sparet noget i kanalen. Stræderne kan stramme: vejr, trafik, midlertidige begrænsninger. Jeg beskriver rummet. Jeg giver ikke en krigsårsag. Jeg giver ikke en sandsynlighed for, at nogen «lukker Danmark». Det er forbudt i denne fil, fordi det er teater, der klæder sig ud som geografi.\n\nPause.\n\nTre fremtider. Hold dem.\n\nEn. Kiel tager det, den kan, i et almindeligt år. Store skibe udenom. Små og mellem, og dem med travlt i den rigtige størrelse, ind igennem. Polen mærker det som baggrundsstøj. Gdańsk er stadig en Østersø-dør. Gods, der skal ud til verdenshavet, skal stadig forbi en karm, Polen ikke ejer.\n\nTo. Kiel strammer. Mere tid. Mere kø. Flere skippere tager stræderne. Tiden på vandet ændrer sig. Forsikring og bunker og løn til mandskab rykker. Nogle laster, der var marginale, venter. Nogle skifter havn, hvis havnen på den anden side af karmene bliver billigere i totalen. Det er ikke «Danmark vinder». Det er, at en dørkarm blev smallere, og strømmen fandt den karm, der stadig tog skibet.\n\nTre. Stræderne strammer, mens Kiel er det, den er. Så bliver kanalens begrænsning pludselig mere værd for dem, der kan bruge den. Dem, der ikke kan, venter. Østersø-havne mærker køen udefra. Gdańsk's funktion forsvinder ikke. Tempoet skifter.\n\nHvor sandsynligt.\n\nAlmindeligt år: høj, i den kedelige betydning. Verden kører oftest på vane og fysik. Hård stramning i Kiel: middel til jeg ved det ikke, uden en konkret, kildet hændelse i aften. Jeg finder ikke på en procent for «kanal-kaos». Hård stramning i stræderne: jeg ved det ikke som geopolitik. Som vejr og trafik: middel i vinter, lavere i en stille uge. Jeg lader krigen ligge. Hvis du mærker, at du vil fylde den i, så observer trangen. Fyld den ikke.\n\nHvad koster det.\n\nTid på vandet. Penge i bunker og løn. Risiko for at missen tidevand og slots. For Polen: ikke «havnen dør». For Polen: at funktionen Gdańsk stadig peger på en dørkarm udefra. Uerstattelig for Polen er ikke Kiel. Uerstattelig er, at Østersøen har få karmar. Vigtig er, at Gdańsk kan tage gods, mens karmene er, som de er.\n\nHvad gør du med viden.\n\nNæste gang nogen siger «Kiel», spørger du: dybde eller flag. Næste gang nogen siger «lukket», spørger du: for hvem. For et skib med for meget dybgang var kanalen allerede lukket. Det var ikke nyheder. Det var karm.\n\nPause.\n\nFalsifikation på denne dør, allerede nu, i lille form.\n\nHvad ville få mig til at opgive historien «Kiel er bare et flag». Hvis jeg så et skib, der ikke kan ligge i kanalens dybde, gå igennem alligevel. Så er min model af karmen forkert. Hvis jeg så, at alle store skibe pludselig brugte kanalen, som om dybden var ligegyldig. Så er kilden forældet, eller jeg har misforstået klassen.\n\nHvad ville ikke falsificere. En artikel med et våbenskjold. En følelse. Et patriotisk opslag.\n\nDu holder tre fremtider. Du vælger ikke en vinder. Du har et sted at kigge: dybgang, kø, tid, ikke farve på kortet.\n\nSig de tre spor højt i tanken. Ikke som konklusion. Som liste.\n\nAlmindelig Kiel. Store skibe i stræderne. Polen som bruger, ikke som ejer.\n\nKiel strammere. Mere tid. Flere udenom. Totalen rykker. Nogle laster venter. Nogle skifter kaj, hvis totalen tvinger dem.\n\nStræderne strammere. Kanalen bliver mere værd for dem, den kan tage. De andre venter. Østersø-kajerne mærker tempo, ikke udslettelse.\n\nHvis ét spor føles «rigtigt», så er det grebet. Læg det. Hold listen.\n\nHvad du ikke gør med denne dør. Du tegner ikke et flag på vandet. Du gætter ikke på en flåde. Du siger ikke «Danmark lukker». Du siger: karm. Centimeter. Tid. Hvem kan passere.\n\nGdańsk hænger her, ikke som vinder. Som funktion, der stadig skal ud gennem karmene. Baltic Hub er bygget til oceanskibe. Oceanskibe kender dybde. Derfor er stræderne ikke en parentes for den kasse-dør. De er karmen udenfor.\n\nPause.\n\nKlokken er toogtyve syv. Næsten skift.\n\nÅndedræt. Skulder ned. Du har ikke reddet Østersøen. Du har holdt tre spor om en karm.\n\nKlokken er toogtyve otte.\n\nAnden simulation. Tjekkisk container. Gdańsk versus Hamborg versus Koper.\n\nSkift spor. Slip Kiel. Behold karmene som baggrund, ikke som plot. Nu er det landvejen til vand, set fra et værksted uden kyst.\n\nTjekkiet har ikke kyst. Det er ikke en fornærmelse. Det er en dør, der mangler. Så lejer Tjekkiet sig ind i andres døre med lastbil, tog, vane, kontrakt.\n\nTre døre i aften. Ikke fordi der kun findes tre. Fordi tre er, hvad du kan holde.\n\nGdańsk. Nord. Østersø. Så karmene, vi lige har simuleret. Kort på land for meget af Polen og for en del af Tjekkiet, afhængigt af, hvor værkstedet ligger. Efter havnen: stadig vand, der skal ud.\n\nHamborg. Nordvest. Elben. Nordsøen uden Østersø-karm på samme måde. Større kasse-maskine i femogtyve: otte komma tre millioner TEU mod Gdańsk's omkring to komma otte. Mere vane i mange speditørhoveder. Ikke det samme som tættest. Større er vane. Vane er en dør i sindet.\n\nKoper. Syd. Adriaterhavet. En anden hav. En anden kalender for monsun i hovedet, selv om monsunen ikke er her. En anden vej gennem Alper og naboer. For noget Asien-gods kan syd være en genvej, der ikke ligner en genvej på et Danmark-kort.\n\nPause.\n\nHvad kan ske.\n\nEn. Hamborg bliver ved med at tage den kasse, fordi papiret allerede siger Hamborg, og skibet allerede kalder Hamborg, og chefen ikke vil være den, der skiftede.\n\nTo. Gdańsk tager flere kasser, fordi prisen, tiden på lastbil, eller en kø i Tyskland gør nord-døren i Polen til den mindst dårlige. Baltic Hub har et tal i kilderne. Tallet er ikke et løfte om Tjekkiet. Tallet er, at kasse-funktionen findes og er vokset nok til at være et reelt spor, ikke et souvenir.\n\nTre. Koper tager den, fordi søvejen og den sydlige landvej vinder på totalen for netop den kontrakt.\n\nFire. Skift midt i året. En dør strammer. En anden åbner i praksis.\n\nHold fire, hvis du kan. Hold tre, hvis fire flyder. Flyd ikke til «Polen vinder». Den sætning er forbudt, fordi den er flag. Vi taler funktion.\n\nHvor sandsynligt.\n\nJeg ved det ikke som ét vinder-spor for «den tjekkiske kasse». Der findes ikke én tjekkisk kasse. Der findes mange, med forskellige købere og forskellige vane.\n\nÆrligt: middel på, at vane holder mange kasser, hvor de er, indtil prisen gør ondt. Middel på, at Gdańsk kan tage flere uden at slå Hamborg på totalen. Lav på, at én havn sluger det hele i et år, som om de andre var rekvisitter. Jeg ved det ikke på Koper for netop dit forestillede værksted, medmindre du har fragtbrevet. Du har ikke fragtbrevet. Du sidder i stolen.\n\nHvad koster det.\n\nForkert dør: døgn, diesel, bøder, et missset skib, et forhold til en kunde. Forkert historie i dit hoved: at du tror, at TEU-tallet i Gdańsk betyder, at Hamborg er færdig. Hamborgs et hundredofjorten komma seks millioner tons og otte komma tre millioner TEU i femogtyve er ikke en ligkiste. Det er en maskine, der stadig er større. Relativt.\n\nHvad gør du.\n\nNår nogen siger «Tjekkiet vælger Polen», spørger du: hvilken vare, hvilken dør, hvilken vane. Når nogen viser et TEU-tal, spørger du: er det kassen eller væsken, vi taler om. Gdańsk's firs komma fire er mest ikke kasse. Hvis du bruger total-tons til at vinde et container-argument, laver du teater.\n\nPause.\n\nFalsifikation.\n\nHvad ville få mig til at opgive «vane holder, indtil det gør ondt». Hvis jeg så skift uden prissmerte, igen og igen, som om vane var nul. Så er min model af speditørhoveder for hård.\n\nHvad ville få mig til at opgive «Gdańsk er et reelt spor». Hvis kasse-funktionen faldt væk i kilderne, eller hvis døren ikke kunne tage de skibe, kassen kræver. Aftenens kilder siger det modsatte for femogtyve. Jeg opdaterer, når et nyt år er hentet. Jeg opdaterer ikke med en fornemmelse.\n\nHvad ikke tæller. Et tweet. En stolt minister. En ked af det havneby i Tyskland.\n\nTre havne. Tre spor. Ingen vinder i stolen. Et sted at kigge: fragtbrev, tid, vane, og om tallet var kasse eller væske.\n\nDu mærker måske lyst til at erklære Gdańsk som fremtiden, fordi Polen-timen lå i kroppen. Det er loyalitet. Loyalitet er ikke simulering. Polen-timen gav dig funktionen. Denne time forbyder dig at gøre funktionen til skæbne.\n\nEndnu et åndedrag på kassen, før vi går.\n\nForestil dig værkstedet. Ikke som turist. Som lastbilens startpunkt. Syd for sletten, nord for Adriaterhavet, vest for Karpaterne, øst for Bayern. Tre veje ud til vand.\n\nNord: Polen, Gdańsk, så Østersø, så karm. Kort på land for mange adresser. Vand bagefter.\n\nNordvest: Tyskland, Hamborg, Elben, Nordsø. Længere vane. Større kasse-maskine. Ofte det papir, der allerede ligger i skuffen.\n\nSyd: Slovenien, Koper, Adriaterhavet. En anden kalender. En anden bjergkarm på land. For noget gods, der allerede tænker Middelhav og Suez, kan syd være totalen, selv om den ser skæv ud fra en dansk stol.\n\nDu vælger ikke. Du holder. Hvis du mærker, at du vil «afgøre det for Tjekkiet», så observer trangen. Du har ikke fragtbrevet. Uden fragtbrev er vinderen fantasi.\n\nHvad kan du se uden fragtbrev. At vane er en dør. At pris kan åbne en anden. At en kø i Tyskland kan gøre nord i Polen mindst dårlig. At Koper findes. At total-tons i Gdańsk ikke vinder et kasse-argument.\n\nDet er nok til at se. Det er for lidt til at spille.\n\nPause.\n\nKlokken er toogtyve femten. Næsten gas.\n\nGas er farligere i hovedet, fordi gas lugter af geopolitic og af vinter. Vi kører det som dør. Ikke som moral. Ikke som «hvem vandt».\n\nHvis du bliver varm: observer varmen. Den er ikke data.\n\nKlokken er toogtyve seksten.\n\nTredje simulation. Gas-døre. Świnoujście. Baltic Pipe. Versus ingen dør.\n\nSlip kassen. Behold vanen som advarsel: loyalitet over for Polen-timen må ikke gøre gas til en sejrssang. Vi kører funktion. Kaj. Rør. Plan. Kul som baggrund.\n\nIngen dør betyder ikke, at Polen forsvinder. Ingen dør betyder: hvis de rør og den LNG-kaj, kilderne beskriver, ikke var der, eller ikke virkede, så ville importen skulle finde en anden karm. Anden karm er dyrere, langsommere, eller politisk en anden klub. Vi simulerer funktion. Vi simulerer ikke et slag.\n\nHvad ligger i baseline.\n\nŚwinoujście LNG. Otte komma tre milliarder kubikmeter om året fra første januar femogtyve i den udvidede kapacitet, kilderne nævner. Baltic Pipe. Ti milliarder kubikmeter om året fra Danmark til Polen. Tre den anden vej. GIPL. To komma fire Polen til Litauen. En komma ni tilbage. Kommercielt fra første maj toogtyve. FSRU Gdańsk. Ikke drift i aften. Plan og kontrakt. Vindue i kilderne. Du tæller den ikke som hane nu.\n\nKul i el. Enoghalvtreds procent i femogtyve. Lav-kulstof enogtredive mod EU enoghalvfjerds. Gas-døre er ikke hele el-systemet. Gas-døre er en del af, hvordan et land, der stadig brænder kul, alligevel kan have import, varme, industri, og naboer på rør.\n\nPause.\n\nHvad kan ske.\n\nEn. Dørene virker som kapacitet på papiret og i drift. Vinter kommer. Vinter går. Nyhederne keder dig. Kedsomhed er ofte tegn på, at døren gjorde sit arbejde.\n\nTo. En dør strammer. Vedligehold. Forsinket skib. Et rør, der ikke leverer i en periode. Så trækkes der på den anden dør, på lagre, på kul, på nabo, på pris. Pris er ikke kursmål for euro. Pris er, at nogen betaler mere for at holde varmen og fabrikken.\n\nTre. En plan bliver drift. FSRU, hvis og når. Så er der en extra karm ved Gdańsk. Indtil da er det en sætning. Sætninger varmer ikke.\n\nFire. Ingen dør. Tankeeksperimentet. Hvis LNG-kajen og røret ikke fandtes, ville Polen stadig ligge på sletten. Importen ville køre på ældre karmar, eller på kul, eller på naboers nåde. Funktionen «egen kaj og eget rør» er netop at gøre nåde til mindre af historien. Det er ikke uafhængighed som magi. Det er flere døre.\n\nHold dem. Især tre og fire, uden at gøre fire til panik.\n\nHvor sandsynligt.\n\nAt dørene, der allerede er i drift i kilderne, er der i morgen tidlig: høj, i den kedelige betydning, uden at jeg lover evighed. At en konkret stramning sker i en given uge: jeg ved det ikke. Jeg har ikke vedligeholdskalenderen i stolen. At FSRU er hane i aften: lav, fordi kilderne siger, den ikke er i drift. At den bliver hane i det nævnte vindue: middel til jeg ved det ikke. Planer glider. Planer lander også. Jeg opdigter ikke en procent.\n\nHvad koster det.\n\nStram dør: højere pris, mere kul, mere import på den kaj, der virker, mere politisk støj. Støj er ikke evidens. Støj er støj. Ingen dør i tankeeksperimentet: mere afhængighed af det, du ikke styrer. Det er omkostningen ved at forveksle slette med kaj. Sletten giver korn og lastbil. Sletten giver ikke LNG, medmindre nogen har bygget karmen ved vandet.\n\nHvad gør du.\n\nNår nogen siger «Polen er uafhængig», spørger du: hvilken dør. Når nogen siger «seks komma en milliard» om FSRU, spørger du: drift eller plan. Kilderne har omkring seks komma en som planlagt kapacitet. Planlagt er ikke tændt. Når nogen blander euroen ind, fordi gas er dyrt, så husk de fire kasser. Gas i Polen er ikke automatisk euro-kurs. Jeg giver ikke kurs. Jeg giver karmen.\n\nPause.\n\nFalsifikation.\n\nHvad ville få mig til at opgive «FSRU er ikke hane nu». Hvis kilderne, hentet ærligt, viste kommerciel drift. Så opdaterer jeg. Jeg holder ikke fast i «plan» af loyalitet til en aften i august.\n\nHvad ville få mig til at opgive «otte komma tre og ti er døre, der tæller». Hvis kapaciteten var papir uden skib og uden flow. Så er tallet teater. Aftenens kilder behandler dem som kapacitet, der er sat i tal for femogtyve og for røret som det står. Jeg bruger dem som døre, ikke som evige løfter.\n\nHvad ikke tæller. En bange vinter-følelse. En stolt tale. En konspiration om, at rør «egentlig» er noget andet. Vi har kilder. Vi har døre. Vi har ærlighed om plan versus drift.\n\nTre gas-spor. Du har ikke valgt vinterens vinder. Du har et sted at kigge: kaj, rør, plan, kul-andel som baggrund, ikke som skæbne.\n\nHold også nabodøren, uden at gøre den til et nyt plot. GIPL er ikke en polsk sejrssang. Det er en karm, så Baltikum ikke kun har én vej. El-synk den niende februar femogtyve via Polen er samme slags sætning: en funktion, der binder, ikke et flag, der vinder. Harmony Link ligger i tiden, omkring tredive. Tid er ikke drift. Du tæller den ikke som kabel i aften.\n\nKul-andelen er baggrund, så du ikke tror, at to gas-døre har gjort el-systemet til Norges. Enoghalvtreds procent kul i femogtyve er et tungt tal. Det betyder ikke, at kajen er ligegyldig. Det betyder, at kaj og rør sidder i et land, der stadig brænder. Simulering holder begge. Forudsigelse vil have én historie: enten «Polen er grønt nu», eller «Polen er kun kul». Begge er for korte.\n\nIngen dør, tankeeksperimentet, igen, roligt. Sletten bliver. Lastbilen bliver. Kornet bliver. Importen af gas bliver nøgenere. Nøgen er ikke undergang som film. Nøgen er færre karmar og mere af det, du ikke styrer. Derfor byggede nogen kaj og rør. Funktionen er synlig, når du tør tage den væk i tanken et øjeblik, og så sætte den tilbage uden at juble.\n\nDu spiller ikke på vinter. Du ser kaj, rør, plan, kul.\n\nPause.\n\nKlokken er toogtyve nitten. Vi skal lukke.\n\nSkulder. Åndedræt. Ingen lektier i de sidste minutter. Kun lukning.\n\nKlokken er toogtyve tyve.\n\nFalsifikation. Luk de åbne spørgsmål.\n\nSæt ryggen til stolen. De sidste fire minutter er ikke et resumé, du skal præstere. De er lukning. Åbne løkker, der ikke lukkes, bliver til uro i sengen. Vi lukker dem. Så er du færdig.\n\nFalsifikation er det voksne ord for: hvad ville få mig til at opgive sætningen.\n\nUden det er simulering bare tre historier, du kan lide. Historier, du kan lide, er den søde kolonne alene. Den tunge kolonne er: hvad ville tvinge mig til at sige, at jeg tog fejl. Hvis du ikke kan sige det, har du ikke en model. Du har en smag.\n\nFørste åbne spørgsmål. Hvorfor én forudsigelse næsten altid lyver.\n\nFordi den gemmer de døre, den ikke valgte, og fordi den siger «vil» der, hvor du kun har «kan». Den lyver ikke altid i udfaldet. Den lyver i formen. Den lader, som om verden var ét spor. Vi kørte tre døre. På hver dør stod mindst tre spor. En sætning kunne have ramt ét spor og stadig have været en dårlig lærer, fordi den havde trænet dig til at være sikker.\n\nDerfor: én forudsigelse er næsten altid for lidt sand, selv når den «rammer».\n\nPause.\n\nAndet spørgsmål. Hvorfor Polen kan være vigtig og alligevel uerstattelig. Eller rettere: vigtig, og alligevel ikke den, der erstatter alt. Og omvendt: visse funktioner, der ikke er «vigtige» i avisen, kan være svære at erstatte.\n\nGdańsk er vigtig som blandet dør på Østersøen. Den er ikke erstatning for Rotterdam. Fire hundrede otteogtyve komma fire millioner tons er en anden skala. Świnoujście og Baltic Pipe er vigtige som karmar for gas. De erstatter ikke hele Europas gas. De erstatter ikke Nordsøen. De gør en slette mindre nøgen.\n\nUerstattelig i aften betyder: få karmar ud af Østersøen. Polen ejer dem ikke. Derfor kan Polen være vigtig i funktion og alligevel stå uden nøglerne til karmene. Vigtig er Gdańsk for visse strømme. Uerstattelig er ikke «Polen». Uerstattelig er karmen, og karmen sidder i vand, Polen ikke ejer.\n\nHvis du kun husker «Polen er vigtig», har du et adjektiv. Hvis du husker «hvilken dør, hvem ejer karmen», har du et kort.\n\nTredje spørgsmål. Hvorfor et tal uden dør er teater.\n\nFirs komma fire uden «blandetet havn, væske vejer». Otte komma tre uden «LNG-kaj, kapacitet, år». To komma otte millioner TEU uden «ikke Hamborgs otte komma tre». Seks komma en uden «ikke drift». Tallet kan være hentet og alligevel være teater, hvis du river døren af.\n\nTeater klapper. Kortet bærer.\n\nPause.\n\nHvad ville falsificere aftenens metode, ikke bare ét spor.\n\nHvis du i morgen kan handle bedre ved at vælge én fremtid og glemme dørene. Så er jeg for kedelig, og du skal ikke lade mig styre. Jeg tror ikke, det er sandt. Jeg kan tage fejl. Fejl er tilladt. Fantasi-procenter er det ikke.\n\nHvis nye kilder, hentet som kilder, viser, at FSRU kører, at TEU er noget andet, at kanalens dybde er en anden. Så opdaterer vi baseline. Vi opdaterer ikke, fordi en stemning skiftede.\n\nKristus-ankeret, én gang, ærligt. Når du ikke ved, er det tilladt ikke at digte. Du skal ikke fylde hullet med et helligt tal. Du skal heller ikke fylde det med et kækt tip. Stille er en handling. Valg, når du må vælge, sker på det, du kan se: dør, karm, plan versus drift. Resten er ikke dit at opfinde. Atlaset er stadig geografi.\n\nDu har observeret. Du har ikke løst Europa. Godt.\n\nTyve sekunder. Opgaven i aften var ikke at gætte én fremtid. Opgaven var at holde flere. Hvis du kan sige det uden at pynte, har timen ramt. Hvis du sidder med en vinder i munden, så spyt den ud. Listen er arbejdet.\n\nJeg gentager ikke atlas. Jeg gentager grebet.\n\nUden baseline er sandsynligt gætteri. Uden dør er tal teater. Uden relativ er adjektiv identitet. Uden «jeg ved det ikke» er procent opdigt. Uden se er de tre første spørgsmål underholdning.\n\nDu må mærke, at det er lidt. Det er meningen. Lidt, der sidder, slår meget, der underholder.\n\nPause.\n\nKlokken er toogtyve treogtyve. Næsten.\n\nIngen lektier. Ingen «læs tre artikler». Ingen papir, medmindre du i morgen i neutral, tredive sekunder, skriver fire ord: kan, sandsynligt, koster, se. Så op. Jorden vinder.\n\nØjnene må lukkes, når jeg er færdig. Ikke før, hvis du stadig hører. Når jeg er færdig, er du fri.\n\nTre døre i kroppen. Kiel og stræder: dybde, ikke flag. Tjekkisk kasse: tre havne, vane, ikke sejr. Gas: kaj og rør, plan er ikke hane.\n\nFire spørgsmål. Hvad kan. Hvor sandsynligt i fire skuffer. Hvad koster. Hvad gør du. Se. Ikke spille.\n\nFire kasser. Kontinent. Klub. Møntzone. Mønt. Bland dem ikke.\n\nHvis du i morgen hører «Europa går godt», så mærk hvilken sten de kaster. Hvis du hører et tal, så mærk døren. Hvis du hører «sikkert», så mærk skuffen. Høj. Middel. Lav. Jeg ved det ikke. Hvis du mærker trangen til at spille, så husk fjerde spørgsmål. Se.\n\nDet er ikke lektier. Det er det, øret allerede har. Du skal ikke åbne en skærm. Du skal ikke tjekke en havn. Øjnene må lukkes.\n\nPause.\n\nDu trykkede start. Klokken var enogtyve fireogtyve. Du sidder stadig. Det var arbejdet.\n\nHvis noget af timen faldt ud, så lad det falde. Du skal ikke samle den op med skærmen. Det, der sad, sad. Det, der ikke sad, kommer igen, når du hører Kiel, når du hører et tal uden kaj, når du hører «Europa» brugt som mønt.\n\nTre døre. Fire spørgsmål. Fire sten. Én kontrakt: jeg kørte, du så.\n\nJeg giver kontrollen tilbage. Ikke som belønning. Som slut.\n\nSid et åndedrag mere, før du rækker ud. Telefonen kan vente. Skærmen kan vente. Hvis øjnene vil lukkes, så lad dem. Hvis de vil blive åbne i mørket, så lad dem. Du har holdt tre spor. Du har ikke kåret en vinder. Det var timen.\n\nIngen lektier. Ingen tre artikler. Ingen havn at tjekke. Hvis du i morgen i neutral skriver fire ord — kan, sandsynligt, koster, se — så er det nok. Så op. Jorden vinder. I aften er du færdig.\n\nKlokken er toogtyve fireogtyve. Timen er gået."</script>

  btn.textContent = msg || "Kopieret. Indsæt i TTS.";
  btn.classList.add("ok");
  hint.textContent = "Gå til TTS-appen og indsæt. Dansk. Mand. Rolig. Ikke hastig.";
}
async function copyAll() {
  try {
    await navigator.clipboard.writeText(text);
    done();
    return;
  } catch (e) {}
  ta.value = text;
  ta.style.display = "block";
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    done();
  } catch (e) {
    done("Teksten er markeret. Tryk Kopiér.");
  }
}
btn.addEventListener("click", copyAll);
</script>
</body>
