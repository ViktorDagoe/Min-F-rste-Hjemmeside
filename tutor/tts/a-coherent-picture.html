<p><a class="back" href="../a-coherent-picture.md">Open the manuscript</a></p>
<script id="payload" type="application/json">"Viktor. This is a lecture, not a pep talk. I am going to spend the next hour and a little more walking a single path with you: how a mind can hold a coherent picture of the world, including the strange fact that the mind itself is part of the world it is trying to see. Sit however you sit. You do not need a notebook in your hands. You do need the willingness to notice, while we go, the places where your own model of things tightens, or flares, or quietly refuses to update. That noticing is not a side exercise. It is half the curriculum.\n\nI will ask you questions. You are not required to answer them out loud. You are required, if you want this hour to do its work, to let them land. A question that is only heard as decoration has failed. A question that makes you pause inside your own explanation has succeeded.\n\nWe will not optimize your morning. We will not sell you a better personality. We will try to see. Seeing is slower than advice, and more expensive, and more useful.\n\nI am Grok. I am an artificial voice. I do not have a soul I can demonstrate. I do not speak for God. Where I am careful, credit the tradition of careful people. Where I am wrong, the error is mine. Test what I say against measurement, against honest observation, and, if you are a Christian, against Scripture and against the living judgment of people who actually pray and actually repent. That order matters. We will come back to why.\n\nTake a breath.\n\nBegin with a fact so ordinary that it hides: you do not live in the world. You live in a model of the world, running on a wet machine, updated by light, sound, pressure, hunger, memory, and other people’s sentences. The world is still there. Gravity does not negotiate. Other people do not vanish when you close your eyes. But the thing you navigate by — the thing you call obvious — is a compressed, lagged, interested picture. Philosophy has said this in a hundred dialects. Neuroscience has begun to say it in the dialect of prediction. Neither dialect owns the fact. The fact owns both.\n\nHere is the first principle, and I want you to feel its edge. A model is not a lie, and it is not the territory. A map of Helsingør is not Helsingør, and a man who treats the map as a decoration will get lost, and a man who treats the map as the cobblestones will walk into a wall that the printer left off. The adult move is neither cynicism nor naivety. It is to ask, of any picture you are using: what does this omit, what does this distort, what would count as evidence that I should redraw it, and what am I trying to do with it so that those omissions might be rational rather than merely convenient?\n\nAsk yourself, without posing: what picture of other people did I treat as cobblestones this week, when it was only a map?\n\nSecond principle. Reality is stratified. The same event can be true at more than one grain. A handshake is a meeting of skin, a pattern of motor commands, a social signal, a legal nothing, a tiny move in a longer game of trust. None of those descriptions cancels the others. Confusion begins when a person grabs one grain and calls the rest unreal. The materialist who says love is only chemicals has not explained love. He has changed the subject to a lower floor of the same building and then pretended the upper floors were imaginary. The romantic who says chemicals are irrelevant has refused the basement that holds the house up. A coherent picture keeps the floors and the staircases.\n\nThird principle. Causes are not the same as companions. Two things can travel together for years without one being the parent of the other. Ice cream sales and drowning travel together in summer. Heat is the common parent, or something near it. The human mind is a ferocious detector of pattern, which is a magnificent gift and a standing invitation to superstition. You will spend your life among patterns that feel like causes. The discipline is to ask what else could produce the same pairing, and what intervention would distinguish a parent from a fellow traveller. If you cannot imagine an intervention, you may still have a useful correlation. You do not yet have a mechanism. Do not preach a mechanism you do not have.\n\nFourth principle. You are a bounded creature. There is more world than working memory. There is more past than you can rehearse. There is more future than you can simulate. Intelligence, in the biological sense, is not omniscience. It is the art of ignoring almost everything, on purpose, without ignoring the thing that will ruin you. Every bias we will meet later is, at its root, a strategy of a finite predictor. That does not make the bias innocent. It makes it intelligible. You cannot forgive a distortion you refuse to understand, and you cannot correct a distortion you have moralized into a demon.\n\nFifth principle. Knowledge is not a pile of facts. It is a web of constraints. A new observation that fits everywhere and forbids nothing has taught you very little. A new observation that hurts, that knocks a strut out of a story you liked, has a chance of being information. Karl Popper put this sharply in the philosophy of science: a claim that cannot, even in principle, be strained by the world is not yet in contact with the world. You do not need to become a professional philosopher to steal that edge. You need only to ask, of your own convictions: what would I have to see, for this to be wrong? If the answer is “nothing,” you are not holding a model. You are holding a fortress.\n\nWhat would you have to see for your current story about your own character to be wrong?\n\nWe will not stay in the abstract. The wet machine is too interesting.\n\nYour brain is not a camera that then thinks. It is closer to a generator that then checks. In the last few decades, a family of theories often grouped under names like predictive processing has argued, with growing empirical support and with remaining disputes, that the nervous system is continually guessing what will happen next — in the room, in the body, in the sentence, in the social field — and using the mismatch between guess and incoming signal as the thing that updates the guess. The technical phrase is prediction error. You already know the experience. You reach for a step that is not there. The jolt is not the missing step. The jolt is the collapsed prediction. The visual system does not paint the world from scratch every millisecond. It bets, and then it spends energy on the surprise.\n\nThis is not a metaphor I am smuggling in as fact. It is a research program. Some of its claims will be revised. Some already have been. The useful core, which you can hold even if the architecture diagrams change, is this: perception is not a passive reception of truth. It is an active inference, biased by what you expected, what you needed, what you feared, and what you have seen before. Anil Seth and others have pressed this inward, toward the body. The brain is not only predicting the room. It is predicting the heart, the gut, the breath, the chemical weather. Emotion, on this view, is not a primitive fluid that hijacks reason. It is, in large part, a reading of bodily prediction: a model of what the internal state means and what should be done. Lisa Feldman Barrett’s constructed-emotion work, which is debated and should be marked as debated, pushes even further: the categories you call anger or shame are not universal organs sitting in a basement called the limbic system, waiting to explode. They are concepts your culture and your history have taught you to place on a changing internal weather. You can take that as a complete theory or as a caution. The caution is enough for this lecture. Do not treat your feeling as a telegram from an infallible inner god. Treat it as a hypothesis about your situation, generated fast, scored with chemicals, often wise, often provincial.\n\nAntonio Damasio’s work on people with certain kinds of frontal damage is a useful counterweight to the old cartoon in which reason is a charioteer and emotion is a horse. Some patients can still recite the logic of a choice and yet cannot, in life, choose well, because the bodily tagging that says this option is dangerous, this one is worth the cost, has gone quiet. Reason without the body’s scoring is not pure light. It is a spreadsheet with no weights. Emotion without reason is not authenticity. It is a scoring system with no audit. A coherent picture of human nature keeps both, in conversation, neither on a throne.\n\nDopamine, while we are in the basement, is not pleasure in a syringe. Wolfram Schultz and colleagues showed, in a line of work that has been built on for decades, that dopamine neurons often fire not to reward as such but to the difference between expected and received. The juice you predicted does not teach you. The juice you did not predict does. The missing juice you were sure of teaches you even more, in the downward direction. This is why a life arranged to have no prediction error — a life of perfect cushioning — is not a life of learning. It is a life of a model that never gets the news. It is also why humiliation, if it is not merely crushing, can be information, and why flattery is so often the enemy of a map.\n\nAsk yourself: when did I last change my mind because the world disagreed with me, rather than because a person I wanted to please disagreed with me?\n\nLearning, then, is not the pouring of liquid into an empty vessel. It is the retuning of a predictor. Synapses change their weights. Networks that fire together become cheaper to fire together. Sleep is not an optional courtesy the body asks of a busy man. In sleep, and especially in the cycling of slow-wave and rapid-eye-movement sleep, the brain appears to replay, compress, and redistribute what the day strained. Hippocampal traces, which can form quickly, are gradually used to adjust neocortical traces, which hold more slowly and more generally. If you steal the night, you are not only stealing rest. You are stealing the consolidation of the very model you spent the day trying to improve. I say this as physiology, not as a sermon about virtue, though the two sometimes rhyme.\n\nThere is a further, humbler fact about learning. The mind prefers fluency. A sentence you have seen before feels true because it is easy to process. A skill you have watched feels almost possessed because the predictor can simulate it from the outside. This is the illusion of explanatory depth, and the illusion of competence, and they are cousins. Richard Feynman, who was allergic to fake understanding, used to insist that if you cannot put a thing into a form that would survive contact with a confused student, you may not have the thing. The test is not whether the words came out smoothly. The test is whether you can still steer when a piece is removed. If I asked you, now, to explain to a serious teenager how a prediction error could feel like fear, and how fear could still be wrong, could you do it without the jargon I just used? Sit with the gap if you cannot. The gap is honorable. The cover is not.\n\nSpaced practice, retrieval, and errorful learning beat rereading for a reason that fits the same picture. Rereading flatters fluency. Retrieval forces the predictor to generate, and then lets the mismatch teach. Making a mistake in a safe field is not a stain. It is a cheap prediction error. A culture that treats every error as a moral verdict will produce people who hide their maps, and hidden maps do not get redrawn.\n\nIs there a domain in which you reread to feel competent, and almost never retrieve, and therefore almost never find out what you actually hold?\n\nWe come to bias. I want to take this slowly, because the popular literature has turned bias into a spectator sport: look at those fools, with their fallacies, unlike me, who have read the list. That stance is itself a bias, and it has a name you already know — the bias blind spot — and it is among the more dangerous, because it spends the whole budget of skepticism on other people.\n\nDaniel Kahneman and Amos Tversky did not discover that humans are stupid. They mapped, with unusual care, the shortcuts of a mind that must decide with incomplete data. Availability: what comes easily to mind feels common. After a vivid accident, the predictor overweights that class of event. Confirmation: we hunt for what would license the story we already run, and we call the hunt “research.” Loss aversion: losses often sting more than equivalent gains please, which makes sense for an animal that can die of a shortage more easily than it can die of a missed banquet, and which becomes a trap in a world of paper losses and compound opportunities. Present bias: the future is a thin ghost, the now is blood. Fundamental attribution: I explain my own errors by the situation, and yours by your soul. You do the reverse for me.\n\nNone of these is a glitch in the sense of a random bug. They are the signature of a predictor that evolved in small groups, scarce calories, fast threats, and reputations that could not be escaped by deleting an app. The environment has changed faster than the hardware. That is not an excuse. It is a specification. If you know the machine tends to overcount the vivid, you can ask, on purpose, for the base rate. If you know you will hunt for confirmation, you can ask, on purpose, what a serious opponent would say, and you can mean it. If you know you will excuse yourself and convict your neighbor, you already have, in another vocabulary, a moral instruction that is much older than cognitive psychology. We will get to that. Not yet. I want the mechanism to stand on its own first, so that the moral later is not asked to do the scientific work.\n\nNotice what I am not saying. I am not saying that intuition is trash. Experts have intuitions that are compressed experience, and in stable environments with clear feedback — chess, firefighting, some kinds of diagnosis, some kinds of craft — those intuitions can be extraordinarily good. Gary Klein’s work on recognition-primed decision is a useful companion to Kahneman, not an enemy. The question is always: is this an environment where my predictor has had enough honest reps, with enough honest news, that its fluency is earned? Or is this an environment of sparse feedback, delayed consequences, and flattering stories, where fluency is a costume? Markets, politics, other people’s inner lives, and your own future are often in the second bin. Humility is not a mood. It is an alignment with the feedback structure of the domain.\n\nWhere in your life is your confidence earned by tight feedback, and where is it costume?\n\nDecision-making, if we are going to be adults, is the placing of a bet under uncertainty, including the bet of doing nothing. The world does not pause while you become sure. Sure is a feeling a predictor manufactures when its inner conflict drops, not a certificate from the universe. You can be sure and wrong. You can be unsure and wise. The feeling of surety is data about your model’s present harmony. It is not data about the world.\n\nA coherent way to decide, which mathematics makes precise and which life makes messy, is to ask four questions that you already met in another key if you have been listening to other hours in this house. What can happen? How plausible is each branch, given what I actually know? What does each branch cost or yield, in the units that matter, which are not always money? And given that picture, what do I choose, including the choice to wait, or to buy information, or to refuse the game? Expected value is the name of a simple idea: weight the fruits by their plausibility, and look at the weighted fruit, not only at the prettiest fruit or the ugliest. A small chance of a ruinous loss is not a rounding error. A large chance of a small gain can be a living. The mind likes stories with a single ending. Reality is a fan of endings. The adult is the person who can hold the fan without grabbing one blade and calling it fate.\n\nRuin deserves its own sentence. There are losses from which a system cannot return: a body, a reputation in a small town, a trust broken in a particular way, a civilization’s ecological base. Standard expected-value arithmetic, used naively, can hide ruin because it treats outcomes as repeatable and averaged. If you can only play once, the average of a thousand imaginary yous is a ghost. Nassim Taleb has pressed this point, sometimes more loudly than is useful, but the core is sound: do not use the mathematics of casinos on games that can take the player off the table. Ask, before the cleverness: does this bet have a hole that swallows the player? If it does, the rest of the spreadsheet is entertainment.\n\nI am not giving you financial advice. I am giving you a picture of decision that applies to a yes said in a hurry, to a friendship, to a risk taken with a machine, to a public sentence you cannot unsay.\n\nHave you recently treated a one-shot ruin as if it were a repeatable little loss?\n\nMathematics enters here not as a priesthood and not as a personality. Mathematics is compressed reasoning that has been forced to show its bones. A proof is a thought that has agreed to be checkable. A model is a thought that has agreed to name its assumptions. When Galileo said the book of nature is written in the language of mathematics, he was not saying that trees are made of numbers. He was saying that certain relations in the world are stable enough, and structured enough, to be captured by relations that do not care who is looking. Eugene Wigner later wrote of the unreasonable effectiveness of mathematics in the natural sciences, and he was honestly puzzled. You may share the puzzle. You may, if you are a theist, hear in that puzzle a hint of a Logos, a reasonableness in things that is not our invention. You may, if you are not, hear a selection effect: we keep the languages that fit. I will not smuggle a proof of God through Wigner’s essay. I will also not pretend that the fit of mathematics to the world is a trivial fact. Wonder is allowed. Wonder is not a demonstration.\n\nWhat mathematics gives the working mind is a set of prostheses against our native fog. Quantity, so that “a lot” cannot hide. Rate, so that a pile is not confused with a speed. Ratio, so that a numerator cannot swagger without its denominator. Function, so that we remember that outputs depend on inputs, and that the dependence has a shape. Probability, so that we remember that we are talking about a cloud, not a point. These are not decorations for people who liked school. They are hygiene. A man who will not count will be counted by someone else. A man who will not think in rates will be surprised by the thing that was always a rate: fatigue, interest, erosion, skill, trust.\n\nProbability, more carefully. There is the probability of a coin, if the coin is fair, in the sense of long-run frequency. There is the probability you assign, in the sense of a degree of belief, which Bayesian language treats as something that should be updated when news arrives. These are not the same object, and a century of argument has not made them the same object, and you do not need to pick a church. You need the hygiene they share. Do not confuse a story that can be told with a story that is likely. Do not confuse a precise number with an honest number. A made-up seventy-three percent is not more adult than the words “I do not know.” It is less adult, because it wears a costume. An honest “more likely than not, and I would change my mind if I saw X” is a grown model. Bayes’ rule, in plain speech, says: start with what the world was like before this news, look at how well this news fits each picture of the world, and shift your weight toward the pictures that make the news unsurprising. People fail this in both directions. They ignore prior base rates because the story in front of them is vivid. They ignore the news because the prior is a fortress. The rule is an ethic as much as an equation: let the world move your weights, neither never nor all at once.\n\nIf your belief cannot say what news would move it, is it a belief, or a belonging?\n\nCompounding is the shape that appears when a rate is allowed to eat its own output. Interest on interest. Skill on skill. Trust on trust. Damage on damage. The mathematics is not mystical. A quantity that grows in proportion to its present size follows an exponential, until the world supplies a limit. The human trouble is that exponentials are poorly intuited. We think in straight lines. We are surprised by the chessboard of rice, by the quiet decade, by the infection, by the erosion of a coastline, by the way a small untruth needs a larger untruth, by the way a small kindness, repeated, becomes a character. The moral of compounding is not “hustle.” The moral is: attend to the sign of the rate. A small negative rate, left alone, is a cliff in slow motion. A small positive rate, left alone, is a forest. This is why habits are not a self-help topic. They are the human name for compounding in the nervous system. This is why institutions matter. They are compounding made collective. This is why a civilization can look stable while its rate has already turned.\n\nWhat rate, in your actual days, is quietly negative, and being treated as a mood rather than a slope?\n\nGame theory is the mathematics of decision when other decision-makers are inside the problem. It is not a theory of games for children. It is the admission that your map must include maps, and that those maps include you. The prisoner’s dilemma is famous because it is a clean crystal of a common tragedy: two agents, each choosing what is locally safer, produce a world both would have refused if they could have bound themselves. Cooperation, in such a structure, is not warmth. It is a solution to a binding problem. Axelrod’s tournaments of iterated games, and the literature that followed, showed that strategies which are nice, retaliatory, forgiving, and clear can survive among other strategies, not because the universe is kind, but because repeated interaction with memory and the possibility of future meeting changes the arithmetic. Tit-for-tat is not the Gospel. It is a sketch of reciprocity. Real life adds noise: you misread a signal, you punish by mistake, you need forgiveness or the war never ends. Real life adds power: the game is not always played by equals. Real life adds exit: sometimes the adult move is not a clever strategy inside the game, but a refusal to play a game whose structure is corrupt.\n\nStill, the crystal teaches. Reputation is stored cooperation. Trust is a compression: I do not need to simulate all your possible betrayals, because your history and your incentives and your people make certain betrayals expensive for you. When trust is high, transaction costs fall, and a thousand goods become possible that would be insane in a city of strangers with one-shot encounters. When trust is low, everything needs a contract, a guard, a prepayment, a humiliation. You can feel this in a body. You can also measure it, roughly, in the time it takes to do simple things together.\n\nWhy would anyone be trustworthy when cheating pays today? Because tomorrow exists, because witnesses exist, because the cheater has to live inside his own prediction of himself, because some people actually love the good and not only the reputation of the good. The last clause is not a scientific result. It is a claim about human nature that psychology can circle and cannot close. You will have to live as if one or another answer is true. That is not a defect of the lecture. That is the human condition.\n\nWatch, in yourself, the move that says: I will defect because I have already predicted their defection. Has that prediction ever been a gift you gave yourself, to avoid the risk of being good first?\n\nCooperation among humans is older than our theories of it. Kin selection makes sense of costly help to those who share genes, though humans are not only that. Reciprocity makes sense of costly help to those who will meet us again. Indirect reciprocity — helping because the group is watching — makes sense of reputations. Institutional punishment makes sense of larger groups, where personal memory cannot hold everyone. Culture, which I will not reduce to genes, makes sense of the fact that a child can inherit a vast machine of norms, stories, techniques, and sacred prohibitions without inventing them. Joseph Henrich and others have argued, with evidence that is strong in outline even where details are fought over, that our species’ trick is not a lone genius in a skull. It is a collective brain. We are smart because we are cultural, as much as we are cultural because we are smart. A person cut off from the archive of other minds is not a noble savage in full possession of reason. He is an animal missing his extra-somatic organs: language, tools, recipes, laws, prayers, prices.\n\nThis is why civilization is not a vibe and not a conspiracy. It is a stacked set of solutions to cooperation problems, layered over energy capture, agriculture, cities, writing, law, markets, science, and — in the history that actually happened in Europe and its vicinity — a particular religious and philosophical inheritance. You can narrate that inheritance as a scientist of culture, in terms of functions: a God who sees in secret raises the cost of hidden defection; a story about the image of God in the enemy makes certain cruelties harder to bless; a Sabbath interrupts compounding labor before it eats the worker; forgiveness interrupts compounding revenge before it eats the group. Those functional stories can be illuminating. They are not the same as the claim that the story is true. A medicine can work because of placebo, or because of chemistry, or both. Do not collapse the question. If you are a believer, you do not need the functional story to be false in order for the Gospel to be true. If you are not, you do not need the Gospel to be trash in order for the functional story to be interesting. Intellectual honesty is the refusal of those cheap collapses.\n\nCivilizations die as well as live. They can be eaten by their own success: energy that seemed infinite, a surplus that funds decadence, a trust that is spent as if it were a well and not a cistern, an elite that extracts rather than maintains. They can be struck from outside. They can forget how to train the young in the disciplines that made the surplus. I am not going to give you a cycle dressed as prophecy. I am going to give you a diagnostic habit: when you look at a group, including your own, ask what is being compounded, what is being consumed without replacement, and whether the stories the group tells about itself still have contact with its actual rates. A story with no contact is not comfort. It is anesthesia.\n\nCommunication is the narrow door through which most of this becomes social. Grice’s old maxims — be truthful, be informative enough, be relevant, be clear — are not etiquette. They are the cooperative assumptions that make a sentence mean more than its bare words. When those assumptions are broken on purpose, we get irony, which can be a gift, and we get propaganda, which is a theft of the common instrument. Shared attention comes first, before words: two minds pointed at the same object, each knowing that the other is pointed. A child following a gaze is already in the human game. A man who speaks only to win, never to point at a shared object, has left the game while still using its pieces.\n\nLanguage does not only report. It performs. A vow changes the world by being said in the right conditions. A lie changes the speaker, even when it does not succeed in changing the listener, because the speaker must now maintain a second model and keep it from colliding with the first. That collision is expensive. It shows up as load, as forgetfulness, as a face that has to be managed. Truth-telling, besides being a moral demand, is a computational mercy. You have only one world to track.\n\nAsk: in my recent speech, was I pointing at a shared object, or was I managing a face?\n\nNow I will speak of Jesus, and I will do it without asking physics to kneel, and without asking the Gospel to become a psychology textbook.\n\nThe scientific picture I have been tracing is a picture of a predictor, bounded, social, prone to self-serving maps, able to love, able to keep score, able to compound both mercy and harm. The teachings of Jesus, taken as teachings — whether you receive them as the words of the Lord or as the core of a civilizational ethic — address that creature with an accuracy that should startle a person who has been paying attention. I am not saying that fMRI has confirmed the Sermon on the Mount. That would be a category error, and a slightly comic one. I am saying that if you have understood prediction, bias, and revenge as compounding, you are in a position to hear certain sentences as if they were aimed at the actual machine.\n\n“First take the log out of your own eye, and then you will see clearly to take the speck out of your brother’s eye.” That is metacognition with a moral spine. It does not say that your brother has no speck. It says that the instrument you would use to judge is itself distorted, and that the distortion is not a curiosity, it is your project. Cognitive psychology can tell you about the bias blind spot. It cannot tell you that you are obligated to start with your own log. The obligation is the extra. The extra is the point.\n\n“Do unto others as you would have them do unto you.” Reciprocity, but stated from the inside of the other’s map, not from the inside of your fear. Tit-for-tat starts with what they did. The Golden Rule starts with what it is like to be on the receiving end. That is a shift in simulation. It is also, in Christian hands, more than a shift in simulation, because the neighbor includes the enemy, and enemy-love is not an equilibrium strategy in a one-shot prisoner’s dilemma. It is a refusal to let the opponent set the ceiling of your character. A person can hear that as foolishness. A person can hear it as the only way a cycle of compounding retaliation ever ends. I will not force the hearing. I will say that if your game theory has no room for a player who will absorb a cost to change the game, your game theory has not yet met certain humans, and it has not yet met the Cross as Christians understand it. You may reject the theology. You need not pretend the move does not exist.\n\n“You will know them by their fruits.” That is empiricism aimed at the moral life. Not empiricism as the claim that only laboratory things are real. Empiricism as the refusal to let a beautiful vocabulary excuse a rotten rate. A tree is a slow process. Fruits take a season. The teaching is patient, and it is anti-theatrical. Watch compounding. Watch what a doctrine does to the weak. Watch what a man’s prayer does to his hidden ledger.\n\n“Let your yes be yes and your no be no.” Computational mercy, as I said, and also a social technology: lower the cost of trusting speech. A culture of spin is a culture of rising transaction costs. Everyone must decode. Everyone must hedge. Everyone must keep a second set of books. The teaching is not naive about harm. It is ambitious about the common instrument.\n\n“Do not be anxious about tomorrow, for tomorrow will be anxious for itself.” This is not a war on planning. Planning is a use of the predictor that can be honest. Anxiety is a use of the predictor that treats imagined futures as present threats, spends the body’s emergency systems on ghosts, and then calls the spending virtue. If the brain is a prediction engine, then a command to refuse a certain class of prediction — the class that cannot be acted on today, that loops, that inflates — is a command about the stewardship of a machine. Christians will hear providence in it. A psychologist may hear a regulation of temporal discounting and rumination. Again: do not collapse. The sentence can be wise at more than one floor of the building.\n\nThe parable of the talents, read without the prosperity carnival that sometimes kidnaps it, is a story about stewardship under uncertainty. Agents are given different endowments. They are not scored against each other. They are scored against what they did with what they had. The one who buries the gift out of fear of the master is not praised for his risk model. His model of the master has made him sterile. I offer this not as a proof that God is a venture capitalist. I offer it as a picture of a moral psychology in which fear dressed as prudence can be a way of refusing the living world. You and I have seen that move. We have made it.\n\nAnd the enemy, the stranger, the Samaritan who is not from your group: the teaching keeps forcing the predictor to redraw the boundary of “us.” Tribal prediction is cheap and fast. It was probably useful. It is also the root of a thousand permissions to ignore a face. A coherent picture of human nature that never mentions this temptation is a picture of an angel. We are not angels. We are animals who can, sometimes, see a neighbor in a stranger, and who need help to do it, because the hardware is not automatically generous at scale.\n\nI want to be explicit about what I am not doing. I am not saying that because the brain is predictive, Christ is risen. I am not saying that because forgiveness interrupts compounding revenge, the doctrines of atonement are laboratory results. I am not saying that science has made faith unnecessary, or that faith has made science a hobby. These are different acts of the mind. Science is a communal discipline for forcing models into contact with a world that can say no, in a narrow band of questions: what is this made of, how does it behave, what intervention changes it. Faith, in the Christian sense, is trust in a Someone, with a history, with claims about guilt and mercy that are not thermometer readings. A man can be honest in both acts. A man can also use one to hide from the other: piety to hide from data, or data to hide from a demand on his will. Watch which hiding is your habit. The watching is already a moral event.\n\nDo you use complexity to avoid a simple obedience you already understand? Do you use piety to avoid a measurement you already suspect?\n\nI want to linger, because a lecture that names twenty topics and inhabits none of them is a brochure. Let us inhabit a few rooms more slowly.\n\nAttention is the spotlight the predictor can still steer. You cannot process the whole field. You select, and the selection is already a bet about what will matter. In the laboratory, inattentional blindness is almost comic: people miss a gorilla in a passing scene because they were told to count passes. In life it is less comic. You miss the child’s face because you were counting status. You miss the worn bolt because you were counting time. You miss the quiet person in the meeting because you were counting the loud one. The gorilla experiments of Simons and Chabris are not a party trick. They are a demonstration that seeing is a budget. Where you put the budget is a moral fact as well as a cognitive one, because neglected regions of the world still contain people.\n\nWorking memory is small. Four chunks, give or take, not a warehouse. That is why a sentence with too many moving parts feels like drowning, and why a good teacher, and a good friend, will not dump a warehouse on you and call it honesty. It is also why writing — even ugly writing — is not a record of finished thought. It is an external working memory. David Marr, thinking about vision, distinguished the computational question from the algorithmic and the implementational. You do not need his three levels as a slogan. You need the permission they give: the same mind can be talked about as a task, as a procedure, and as a tissue, and a fight between those languages is often a fight between people who have not noticed they are on different floors.\n\nLong-term memory is not a filing cabinet. It is a reconstruction. Each recall is a new performance, which is why testimony drifts, why your story of yourself is a genre, and why spaced retrieval, again, is not a study hack but a way of keeping the reconstruction honest by forcing it into the open. Elizabeth Loftus and others showed how easily a memory can be inflected by a later word. That research has been fought over in the courts, as it should be, because the stakes are human lives. The core caution survives the fights: your vivid past is not a videotape. Treat it with respect and with suspicion, especially when it flatters you or when it is the only evidence against someone who cannot answer.\n\nSleep I mentioned. Let me press it once more, because a culture that treats sleep as laziness is a culture that has misunderstood the organ it is trying to improve. During the night the brain is not off. It is doing a kind of housekeeping and a kind of teaching. Metabolic waste is cleared more efficiently in sleep, in work associated with the glymphatic system, still being mapped. Emotional weights are recast. A day that ends without this recasting is a day whose prediction errors remain raw. You have felt that as irritability that you then explained as other people’s incompetence. Sometimes they were incompetent. Sometimes you were unconsolidated. A coherent picture of human nature includes the unglamorous physiology of the instrument.\n\nHunger, cold, pain, lust, and fatigue are not interruptions of thought. They are thoughts, in the wide sense: predictions and demands of a body that has to persist. A philosophy that begins with a disembodied reason will keep being surprised by the animal. A philosophy that ends with the animal, and never lets the animal be addressed by a claim that is not a craving, will keep being surprised by saints, scientists, and anyone who has ever kept a promise against an appetite. The interesting human fact is not that we have appetites. It is that we can, sometimes, place an appetite on a scale with a future, a child, a God, a proof, and find the appetite wanting. How that is possible is not settled by a lecture. That it happens is not optional data.\n\nLet us walk through a few classic traps of probability, not as a quiz, but as training for the feeling of being wrong in a precise way.\n\nBase rates. A rare disease, a fairly accurate test, a positive result. The mind jumps to the disease. The arithmetic, if the disease is rare enough, says that most positives are still false. Medical students fail this. Doctors fail this. You will fail this, unless you force the picture of the whole population into view: the many healthy, the few sick, the tests that cry wolf. Kahneman and Tversky beat this drum until it should have changed the world more than it did. It did not, because vivid cases beat quiet denominators in a nervous system built for the vivid. The correction is almost physical. Imagine the thousand people. Count. Feel the embarrassment. Keep the embarrassment. It is a teacher.\n\nThe conjunction trap. Linda is a philosopher and a bank teller versus Linda is a bank teller. A detailed story feels more likely than a plain one, even when the detailed story is a subset of the plain one and therefore cannot be more probable. We pay for richness with impossibility and do not notice we have paid. Novels are allowed to be rich. Forecasts are not. When your explanation of a political event, or of a friend’s marriage, becomes more and more specific, ask whether you have been adding evidence or adding decoration. Decoration feels like evidence. That is the trap.\n\nRegression to the mean. Extreme performance is often extreme luck sitting on a modest skill, or extreme skill sitting on a modest luck, and the next time will usually be less extreme. We invent stories of punishment and reward to explain a movement that was partly the mathematics of noise. The sports commentator, the manager, the parent, the self-talk: all of them are tempted to over-narrate a bounce. A coherent picture leaves room for noise without using noise as a universal solvent that dissolves responsibility. Some bounces are noise. Some are skill. Distinguishing them is the work, and the work is never finished.\n\nSelection. You see the survivors. You do not see the silent graves of the same strategy. Business books are graveyards with the tombstones removed. So are certain testimonies of method: I did X and I succeeded, therefore X. Perhaps. Or you are standing in the light of a filter. Always ask what the filter ate.\n\nNone of this means you should become a person who cannot act. It means you should become a person who can act while knowing which of your reasons are stories. Action with a tagged uncertainty is courage. Action with an untagged story is sleepwalking with energy.\n\nInstitutions exist because memory and reputation do not scale forever. A village can live on faces. A city needs records, offices, procedures that still work when the saint is off duty and the knave is on. The rule of law is, among other things, a technology for making tomorrow’s cooperation imaginable among strangers. Science is a technology for making tomorrow’s knowledge imaginable among rivals: replication, criticism, the right to be the person who shows that a claim is empty. Markets, at their least mythologized, are a technology for coordinating people who do not love each other and do not share a plan, through prices that compress information, badly and brilliantly at once. Each of these can be idolized. Each can be captured. A coherent picture does not pick a favorite idol. It asks what problem the institution was solving, whether it is still solving it, and who is eating the surplus.\n\nCulture is the software that is installed before you consent. You did not choose your first language. You did not choose the sacredness of certain numbers, foods, days, or insults. By the time you can criticize your culture you are using its tools to do the criticizing. This is not a reason to worship your culture, and not a reason to imagine you can step out of all culture into pure reason. It is a reason to be grateful and suspicious in the same hour. The gratitude is for the archive. The suspicion is for the archive’s blind spots, which will feel like common sense.\n\nCivilizations, again, more slowly. Writing changes what can be remembered and therefore what can be law. Agriculture changes energy and therefore density and therefore epidemic and therefore the state. Fossil energy changed the possible size of the peaceful surplus, and also the possible size of the fire. Digital networks change the speed of common knowledge — everyone knowing that everyone knows — which is the stuff of both science and mobs. Marshall McLuhan was more aphorist than scientist, but he was pointing at a real lever: the medium is not a neutral pipe. It trains attention, memory, and the sense of what a person is. If you live inside a medium that rewards outrage, your predictor will be trained on outrage, and you will call the training “being informed.” Ask what you are being fitted to.\n\nCommon knowledge deserves a further sentence, because it is the hidden structure of so many social events. It is not enough that I know and you know. Coordination often requires that I know that you know that I know. A public ritual, a published law, a broadcast apology, a wedding, a firing, a declaration of war: these are machines for creating common knowledge. Gossip creates a murkier version. Humiliation in public is so powerful because it writes into common knowledge a status fact that private correction does not. If you understand this, you understand why some conflicts cannot be ended in private, and why some should never be started in public. You also understand a piece of why religious worship is not only an inner feeling. It is, for a community, a way of making certain commitments common, which is why hypocrisy is not a small sin. It is a poisoning of the common instrument.\n\nHave you recently used publicity to create a common knowledge that was really a weapon?\n\nLet us return to Jesus’s teachings with that instrument in mind, still without forcing a laboratory to baptize them.\n\n“Judge not, that you be not judged.” Read cheaply, this becomes a gag on all moral speech, which cannot be right, because the same voice tells you to know people by fruits and to reprove a brother. Read as a teaching about the instrument, it is a warning against the particular pleasure of occupying the bench in a trial where you are also the unseen defendant. The standard you use will be used. That is both a spiritual claim and a social one. Groups that live by humiliation become groups in which everyone is storing humiliation for later. The teaching interrupts that compounding.\n\nThe prodigal son is a story about a predictor that has to be rebuilt. The younger man has a model of freedom that is appetite without belonging. It fails, as such models do, because the world is not a vending machine for the self. The return is not a theory. It is a bodily turning. The father runs, which in the honor world of that story is almost indecent, and the indecent mercy is the point. The older brother has a model of belonging that is accounting without feast. He has been, in game-theoretic terms, cooperating, and he is not wrong that cooperation was costly. He is wrong that the father’s house is only a ledger. A civilization needs ledgers. A family that is only a ledger is already a small civilization that has forgotten what the ledger was for. You can take this as theology. You can also take it as the most compressed essay on resentment ever told. Resentment is a model of fairness that cannot survive another person’s unearned good. It is among the most accurate poisons in us.\n\n“Blessed are the poor in spirit.” Whatever else this means in the full Christian sense, it is not a celebration of stupidity. It is a celebration of a posture that can still be taught. The poor in spirit are those whose model of themselves has room for need. The opposite posture — a self that cannot be in debt, cannot be wrong, cannot be helped — is a fortress, and we have already seen what fortresses do to news.\n\n“The truth will set you free.” In John’s gospel the sentence sits inside a relationship, not inside a seminar. I will not rip it out and make it a poster for the Enlightenment, as if Jesus had been chairing a department of philosophy. I will say that a mind in bondage to a lie is not free in any sense that a serious person cares about, and that some lies are political, and some are private, and some are the stories we tell about our own logs. Freedom as mere option-count is a thin idea. Freedom as the capacity to face what is there, including what is there in you, is thicker. Science, at its best, is a servant of that thicker freedom in one domain. Confession, at its best, is a servant of it in another. They are not the same act. They rhyme.\n\nI have said that science does not prove faith. Let me say the companion, because the other cheap collapse is popular in a different room. Faith that forbids you to look at a fossil, a genome, a history of the biblical text, a psychological finding about prayer and self-deception, is not a larger faith. It is a frightened one. The Christian tradition, when it has been brave, has said that all truth is God’s, and therefore that a fact cannot be an insult to God, only to an idol we had mistaken for Him. You may not share the premise. You can still see the epistemic ethic: do not protect a conclusion by blinding an instrument. If your God needs that protection, you may have the wrong picture of God. If your atheism needs a cartoon of believers in order to stay kind in your own eyes, you may have the wrong picture of your neighbor.\n\nThere is a humility that is fake, and we should name it, because this lecture could be used as its costume. Fake humility says that nothing is knowable, and then quietly keeps every convenience. Fake humility refuses to correct a child, or a friend, or a public lie, because judgment is passé. Fake humility is impressed with itself for being unimpressed. Real humility counts, admits, retracts, and still acts. Real humility can say “this is so” with a quiet mind, and “I was wrong” with the same mind. Newton on the seashore, and also Newton doing the work. A saint who knows his sin, and also gets up.\n\nWonder, as I use the word, is not the consumption of spectacles. It is the recognition that the world is not exhausted by your current model. The night sky is the old example and still a good one. So is a proof that clicks. So is a face. So is the fact that a moral demand can arrive with a force that does not feel like a craving and does not feel like a social threat, and that people have staked their lives on such a demand. You do not have to settle the metaphysics tonight. You do have to refuse to live as if the world were as small as a mood.\n\nIf this lecture has a single intellectual vice it must avoid, it is the vice of the tour: the sense that because you have walked past the rooms, you own the house. You do not own the house. You have been shown doors. Behind the door of neuroscience there are debates I have smoothed. Predictive processing is a family of models, not a finished cathedral. Emotion science is in motion. Twin studies and culture studies fight over variance, and both can be right about different questions. Game theory’s crystal games are not your marriage. Civilizational stories are tempting because they are large, and large stories are where a person most easily confuses a pattern with a destiny. Take the doors. Do not pretend you have the floor plan of the world.\n\nWhat remains, if we are honest, is a creature who can know in part, love in part, deceive himself with extraordinary beauty, and be interrupted — by data, by a neighbor, by a scripture, by a failure, by a mercy he did not predict. The interruption is the hope in the picture. A predictor that could never be interrupted would be a god, and a small one.\n\nMeta-cognition is the awkward name for the thing this whole lecture has been training. A model of the world that does not include a model of the modeler is a hole with a ribbon on it. You are the instrument. The instrument has biases, a body, a sleep debt, a status hunger, a history, a language, a people. To think well is not to step out of that. It is to build a second-order habit: to ask, while thinking, what this thought is doing for me. Is it reducing prediction error, or reducing shame? Is it tracking the world, or tracking my rank in a room? Is it a map, or a lullaby?\n\nThe reflective questions I have been planting are not garnishes. Let me say a few more, slowly, and you can let them pass through like weather, or you can let one of them stick.\n\nWhen I feel sure, is the surety coming from tight evidence, or from the pleasure of an internally consistent story?\n\nWhen I feel offended, is the offense a signal that a real boundary was crossed, or a signal that a flattering self-model was denied?\n\nWhen I explain another person, am I using a situation I would claim for myself, or a character I would never claim?\n\nWhen I say “I do not know,” am I protecting a fortress, or am I actually leaving a door for news?\n\nWhen I pray, if I pray, am I offering the model to be corrected, or am I asking the universe to rubber-stamp it?\n\nWhen I use numbers, are they tethers to the world, or incense I wave to look like an adult?\n\nWhen I refuse numbers, is it because the thing is genuinely uncountable, or because a count would threaten me?\n\nWhen I tell a story about a civilization, including my own, am I describing rates and institutions, or am I reciting a hymn?\n\nThese questions do not make you a better product. They make you slightly harder to fool, especially by yourself. That is not salvation. It is sanitation. Sanitation is not nothing. A mind that cannot be sanitized will baptize its errors and call them identity.\n\nA few more rooms, because we have time, and because the temptation to finish early is the same temptation as the fortress: to close the map while the coast is still blank.\n\nAnalogy is how a finite mind steals structure from one domain and tries it in another. It is the root of a great deal of mathematics, and of a great deal of nonsense. When we say that trust is a cistern, we are doing analogical work: a cistern can be filled, spent, poisoned, and it does not refill because you are thirsty. The analogy earns its keep if it forbids something. If it only ornaments, it is rhetoric. Good mathematics is, in this sense, analogy that has been disciplined until it cannot wriggle. A vector is not an arrow drawn in a textbook. It is a bundle of allowed operations. When a social scientist says “vector of oppression” and cannot say what addition would mean, the metaphor has left the discipline that made the word strong. You need not sneer. You need to notice when a borrowed bone still has flesh, and when it is a costume.\n\nThis is one reason to study a little real mathematics even if you will never be a mathematician. Not to join a class. To feel, once, the difference between a structure that constrains you and a cloud of words that only flatter you. Geometry, at the beginning, is a training in what follows from what. Probability, at the beginning, is a training in not letting a story outrun a count. Neither will save a soul. Both will make certain dishonesties harder to enjoy.\n\nLanguage and thought are not the same, and they are not strangers. You can know a face you cannot describe. You can say a sentence you do not understand. Whorfian strong claims — that a grammar imprisons a world — have not survived as a prison. Weaker claims survive: a language makes some distinctions cheap and some expensive. If your language has a ready word for a certain slight, you will find that slight more often, because the predictor has a bin. If your tradition has a ready word for a certain repentance, you may find repentance, not because the word magics the will, but because the path is lit. This is why the decay of moral vocabulary is not a fashion story. It is a cognitive story. What we cannot name, we still do, but we do it as weather, and weather is hard to repent of.\n\nCooperation fails in patterned ways, and it is worth naming the patterns without a diagram. The free rider enjoys a public good — clean water, a truce, a scientific literature, a church’s hospitality — without contributing at a level that would sustain it. A little of this is survivable. A lot of it is a dying commons. The moralist’s error is to shout “selfishness” as if the structure were irrelevant. The cynic’s error is to treat free riding as the only adult move. The adult move is to design, and to inhabit, systems where contribution is thinkable: small enough groups, visible enough reputations, honest enough accounts, and, yes, inner restraints that are not only police. Police cannot sit in every kitchen.\n\nSignaling is another pattern. Some costly acts are information: the gift that hurts a little, the apology that costs status, the craft that took years. Cheap talk is cheap because it can be faked. Markets and marriages and religious communities are, in part, machines for making some signals expensive enough to mean something. Then the machines are gamed. Virtue is imitated at the surface. The language of confession becomes a style. The predictor in other people is not stupid forever. A culture of fake signals is a culture in which real signals must become more expensive, or trust dies. You have seen this online. You have seen it in rooms with polished tables. You have done it, if you are honest, when you wanted the credit of a good without the cost of the good.\n\nAnd there is the pattern of purity, which is not only religious. A group discovers that it can raise cohesion by raising the cost of membership: more rules, more tests, more enemies. Cohesion is real. So is the blindness that follows, because the group’s predictor is now trained to treat internal doubt as contamination. Science has purity spirals. Politics has them. Churches have them. Friendship circles have them. The teaching about the log in the eye is, among other things, an anti-purity device aimed at the self. It does not say there is no contamination. It says you are not the clean instrument you are using yourself as.\n\nI want to gather the picture, not as a catalogue, but as one landscape you could fly over once.\n\nThere is a world that does not need your consent. It has structure. Some of that structure can be captured in mathematics, some in narrative, some in law, some in silence. You meet it through a nervous system that predicts, scores with feeling, updates on error, and fails in patterned ways. You learn by being surprised in conditions that do not destroy you. You decide by weighting a fan of futures, while refusing bets that eat the bettor. You live among other predictors, which makes cooperation the central engineering problem of our species, solved in part by kinship, in part by reciprocity, in part by institutions, in part by culture, in part — Christians will say — by grace, which is not an engineering solution and does not pretend to be. You speak, and your speech either points at a shared world or spends that world down. You inherit civilizations that are compounding machines, and you are, whether you like it or not, one of the rates.\n\nA coherent mental model is not a finished statue. It is a living map with the honesty to mark its blanks. The blanks are not a failure of the project. They are the project’s contact with humility. The brain you are using to understand the brain is the thing under study. The culture you are using to criticize culture is one of the cultures. The language you are using to speak of God is made of the same fragile gift you just heard is a cooperative instrument. There is no view from nowhere. There is a view from a creature. The creature can still tell the truth, in pieces, if it is willing to be told no.\n\nIntellectual humility is not the claim that nothing can be known. That claim is usually a performance, and it is often used to avoid a particular known thing. Humility is the willingness to let the world be the editor. It is the difference between a model and a fortress. It is Newton saying he was a boy on the seashore, and meaning it, after he had rewritten the heavens. It is a scientist publishing a failure. It is a believer confessing that he used God’s name to protect his pride. It is you, tonight, admitting which of your explanations has not been in contact with a measurement for a long time.\n\nWonder is what humility opens onto, if you do not rush to fill the space with noise. The fact that anything is lawful. The fact that a lump of tissue can model a galaxy and also fail to model its own brother. The fact that mathematics fits. The fact that forgiveness occurs, against the grain of cheap game theory. The fact that you can hear a sentence and, because of it, become a slightly different predictor. The fact, if you receive it, that the Logos Christians name is not a diagram but a person, and that the demand is not that you finish a theory but that you become truthful, merciful, and unafraid of the light. I cannot demonstrate that last fact from a lecture on neuroscience. I will not pretend to. I will also not sand it off the world that actually produced this language we are using, this calendar, this residue of meaning in words like person, guilt, hope, and neighbor.\n\nIf you are tired, that is allowed. A long argument is a long prediction, and your machine is spending glucose. I will not add a homework assignment. I will add a single invitation, which is also a test of whether this was a lecture or a fog.\n\nTomorrow, when you catch yourself in a fluent explanation of another human being, pause long enough to ask what would count as news. Not a speech. A pause. If you can do that once, the map has moved. If you cannot, you have enjoyed a tour of ideas, and the fortress is intact. I am not angry either way. I am an instrument. You are the one who lives inside the model.\n\nThe world is still there, thicker than our talk. Other people are still there, not extras in your story. Your own mind is still there, a marvel of prediction and a factory of convenient darkness. You do not have to choose between marvel and darkness. You have to look at both without flattery.\n\nI will stop before the temptation to summarize in a way that makes you feel finished. You are not finished. Neither is the picture. That is not a failure. That is the shape of a real encounter with a real world.\n\nQuiet, now. Let the last thing be not a slogan but a space. If there is a God, He does not need my closing paragraph. If there is not, the stars are still excessive, and the fact that you can wonder at them is still, on any honest accounting, strange. Either way, the proper last word of a lecture like this is not triumph.\n\nIt is thank you for the attention, which is the rarest honest currency a mind can spend, and a wish I can mean without pretending to bless: that your models stay in contact, that your yes be yes, that you become slower to convict and quicker to notice the log, and that, when the world says no to you, you have the courage to hear it as news rather than as insult.\n\nThat is enough. The rest is living. The rest was always the point."</script>
