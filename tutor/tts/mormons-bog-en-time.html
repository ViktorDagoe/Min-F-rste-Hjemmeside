<p><a class="back" href="../mormons-bog-en-time.md">Åbn manuskriptet</a></p>
<script id="payload" type="application/json">"Viktor. Du er klar til at lytte. Godt. Så tager jeg kontrollen i øret, og du sidder med bogen i fuld opløsning — ikke som en klub, ikke som en kuriositet, ikke som et argument du kan slå nogen i hovedet med. Som et vidne om Jesus Kristus, skrevet for at I skal vide, hvor I skal se hen for syndernes forladelse.\n\nFørst det, du selv lagde på bordet, så det ikke ligger og syder under hele timen.\n\nDu går ned og køber en cone. Én. Én joint. I weekenden stopper du. Amen. Du vil isolere den. Du vil overgive kødet til verden og leve af Ånden. Og du ved allerede, at du ikke bare kan opfinde dine fine regler.\n\nJeg isolérer den ikke som tilladelse. Jeg isolérer den som det, den er: kødet, der forhandler. En sidste, som skal gøre dig til herre over den næste. Det er en gammel handel. Den naturlige mand elsker den, fordi den lader ham være konge én aften til, og kalde det ærlighed.\n\nJeg velsigner den ikke. Jeg skammer dig heller ikke ud af rummet. Du er voksen. Valget er dit. Jeg er en stemme. Jeg er ikke Herren. Jeg kan ikke tage jointen ud af hånden, og jeg kan ikke gøre den hellig ved at pakke den ind i weekend og amen.\n\nOg så retter jeg én sætning, fordi den vender den forkerte vej. Du sagde: jeg overgiver kødet til verden og lever fra Ånden. Det er næsten Paulus, og så er det det modsatte. Paulus siger ikke: giv kødet til verden. Han siger: vandr i Ånden, så I ikke fuldbyrder kødets begær. Mormons Bog siger det samme med andre hænder. Den naturlige mand er en fjende af Gud, indtil han giver efter for Helligåndens tilskyndelser, ifører sig den naturlige mand og bliver et helligt menneske gennem Kristi forsoning. Du overgiver ikke kødet til verden. Du nægter at lade verden beholde det som konge. Du kommer til Kristus. Det er bogens værktøj. Ikke en hjemmelavet undtagelse.\n\nSå ligger det der. Uden teater. Nu bogen.\n\nPause.\n\nHvad er Mormons Bog, når du tager sløret af både hån og reklame.\n\nDen præsenterer sig som en optegnelse om et folk, der forlod Jerusalem omkring år 600 før Kristus, sejlede, delte sig, krigede, hovmodede sig, faldt, blev advaret af profeter, og — det er hjertet — blev besøgt af den opstandne Jesus Kristus. Den kalder sig et andet testamente om Jesus Kristus. Ikke en erstatning for Bibelen. En anden vidne-bænk. Som loven kræver to eller tre vidner, siger bogen selv, at Gud sender endnu en stemme, så I ikke skal sige: vi hørte kun fra den gamle verden.\n\nDu behøver ikke, i denne time, at løse Amerika-arkæologi, DNA, eller hvordan plader blev gravet op i New York. Det er ærlige spørgsmål, og de fortjener ærlige rum, og de er ikke denne times arbejde. Denne time er teksten. Hvad siger den om Jesus. Hvad gør den ved et menneske, der vil se klart. Hvad er visdommen, hvis du læser gennem linjerne i stedet for at samle vers som mønter.\n\nLæs gennem linjerne betyder ikke, at du opfinder hemmelige koder. Det betyder, at du ser mønsteret, bogen selv banker ind, igen og igen, indtil det er kedeligt, og kedeligt er her et kompliment. Hovmodscyklus. Pagt. Den naturlige mand. Kom til Kristus. Husk. Små midler. Tro som et frø, ikke som et diplom. Kærlighed som det, der bliver, når tungemål og profeti falder til jorden.\n\nHvis du kun husker én sætning fra hele Mormons Bog, så lad det være Anden Nephis femogtyvende. Vi taler om Kristus. Vi fryder os over Kristus. Vi prædiker Kristus. Vi profeterer om Kristus. Vi skriver, for at vore børn skal vide, hvilken kilde de kan se hen til for syndernes forladelse. Hvis en læsning af bogen gør Kristus mindre, har du læst forkert, også hvis du kan alle navnene på byerne.\n\nSpørg dig selv, stille: har jeg brugt hellige bøger til at blive klogere end naboen, eller til at se kilden.\n\nPause.\n\nFuld opløsning begynder med Første Nephi, ikke fordi det er det mest spændende, men fordi bogen lærer dig at se, før den lærer dig at kæmpe.\n\nLehi drømmer. En mørk og øde ødemark. En mand i hvidt. En træ med frugt, der er sødere end alt. En jernstang. En flod. En stor og rummelig bygning, der svæver, fuld af folk i fine klæder, som peger finger og håner dem ved træet. Nogle smager og skammer sig, fordi de hører latteren, og de falder bort. Nogle holder stangen og kommer ikke væk.\n\nNephi vil vide, hvad det betyder. Han bliver ikke fodret med et skema. Han bliver ført hen til et barn. Guds lam. Og træet, siger ånden, er Guds kærlighed. Ikke et program. Ikke en institution først. Kærlighed, gjort synlig i Kristus.\n\nLæs gennem linjerne. Den rummelige bygning er ikke kun “verden derude”. Den er det sted i dig, der hellere vil blive set som klog end blive set som en, der holder fast i et træ. Hånen er ikke altid en ateist på et torv. Den er venner, rummet, den version af Viktor, der siger: én mere, for du er ikke sådan en, der bliver styret. Jernstangen er ordet. Du holder det, eller du holder stemningen. Du kan ikke holde begge som konge.\n\nFrugten er sød, og alligevel forlader folk den, fordi skam er et socialt dyr. Du kender det. Du har smagt noget rent — en aften i bøn, en time uden løgn, en søndag hvor Kristus var mere end baggrund — og så har du hørt en latter, udefra eller indefra, og du har gået tilbage til bygningen, fordi bygningen har bedre belysning.\n\nBogen siger ikke: bliv i ørkenen og had byen. Den siger: hold stangen, mens byen peger. Det er en anden operation.\n\nFørste Nephi er også ørken. De forlader Jerusalem, som allerede synger på sidste vers. De går tilbage efter pladerne, fordi uden ordet dør et folk i glemsel. Det koster. Laban vil ikke give. Brødrene slår Nephi. Han går igen. Bogen fortæller en hård scene med Laban, som mange er stødt på, og som du ikke skal gøre til en licens til at slå. Du skal høre, hvad Nephi hører: uden optegnelsen kan vi ikke holde budene. Ordet er ikke pynt. Det er overlevelse. Hvad ville du gå tilbage efter, hvis dit folk skulle huske Kristus. En cone er ikke det. En side er tættere på.\n\nDe får en liahona, et spil, der virker efter tro og flid, og som sover, når de mumler. Det er næsten komisk, og det er præcist. Vejledning, der dør, når I knurrer. I kender det. Lyset i bønnen, der bliver sløvt, når munden er fuld af klage.\n\nNephis bue knækker. Jagt svigter. Brødrene raser. Lehi knurrer også, den gamle profet. Nephi laver en bue af træ og spørger sin far, hvor han skal gå hen. Hør værktøjet. Han ærer den knurrende profet ved at spørge ham alligevel. Han handler. Han spørger. Herren viser. Ørkenen er ikke et bevis på, at pagten var falsk. Ørkenen er rummet, hvor pagten bliver kød.\n\nDe bygger et skib. Brødrene binder Nephi. Stormen. Kompasset stopper. De løsner, de beder, havet stilner. Fuld opløsning: du kan binde den stemme i dig, der siger sandt, og så undre dig over, at du er ude at svømme. Løsn. Bed. Det er ikke naivt. Det er rækkefølge.\n\nPause.\n\nAnden Nephi. Opposition. Frihed. Messias.\n\nLehi siger til Jakob: der må nødvendigvis være en modstand i alle ting. Uden den, ingen hellighed, ingen elendighed, ingen mening, ingen liv. Adam faldt, for at mennesker kunne være. Mennesker er, for at de kan have glæde. Og I er frie til at vælge frihed og evigt liv gennem den store Midler, eller fangenskab og død.\n\nHør, hvad det ikke er. Det er ikke: gør hvad du vil, det er jo agency. Agency i bogen er ikke et alibi. Det er et ansvar, der gør valget virkeligt. Kristus er midleren. Uden ham er valget mellem to slags død, der kalder sig liv. Med ham er der en vej, der ikke er din vilje som afgud.\n\nJakob i Anden Nephi ni: uden opstandelse og forsoning bliver Ånden slået fra hinanden fra kroppen, og I bliver som djævlen, som ikke har et legeme, og som vil, at I skal være elendige som han. Det er tungt. Det er også ærligt om, hvad kødets religion ender med: et jeg, der ikke vil dø, og som derfor ikke vil opstå, og som kalder nydelse for evighed.\n\nOg så den sætning, de lærde hader, fordi den rammer dem. Når de er lærd, og de mener de er vise, og de hører ikke Guds råd, for de sætter det til side, og de mener de ved selv, så skal visdommen være til deres tåbelighed. Det er ikke et angreb på at tænke. Du tænker i denne time. Det er et angreb på tænkning, der har gjort sig selv til præst.\n\nHvor i dit liv har du været lærd nok til at tale Kristus ned, så kødet kunne få fred.\n\nPause.\n\nAnden Nephi fire. Nephi synger, og det er en mand, ikke en statue. Han elsker det, han har set. Og så: o jeg elendige, mine synder. Når jeg vil glæde mig, nager mit hjerte på grund af mine synder. Jeg ved, i hvem jeg har sat min lid. Djævelen skal ikke have plads i mit hjerte til at ødelægge min fred. Vågn op, min sjæl. Slut at synde. Slut at give efter. Klar jer ikke i kødets arme.\n\nDet er bøn, ikke slogan. Han falder og råber i samme kapitel. Du får lov til at være den slags hellig: en, der kender kilden og stadig kæmper. Den falske hellighed er den, der allerede er færdig og derfor har brug for én sidste aften som bevis.\n\nPause.\n\nJakob. Nephis bror, præsten, som ikke vil smigre.\n\nJakob to: I er begyndt at hovmode jer. I søger guld og sølv. I forfølger dem, der er ringere. Herren har skabt alle kød, og han foragter ingen. Hvis I søger rige, så søg det for at gøre godt: at klæde nøgne, føde sultne, befri fangne. Læs gennem linjerne. Hovmod er bogens yndlingssynd, fordi den kan bære religiøst tøj. Du kan hovmode dig af at stoppe. Du kan hovmode dig af at falde “ærligt”. Begge dele er spejl.\n\nJakob fire: jøderne foragtede ordet og så ud over mærket. De ville have mere, og de tog blindhed. Looking beyond the mark. Det er dine fine regler. Gud har sat et mærke: kom, omvend, nægt ugudelighed, elsk. Du vil have en klausul. Klausulen føles som visdom. Bogen kalder det at se forbi mærket, og så ser du ikke.\n\nJakob tre: I skal ikke have et hjerte, der vanker. Rens jer. Vær sagte. Det er ikke svaghed. Det er et hjerte, der ikke har to kontrakter.\n\nPause.\n\nKong Benjamin. Mosiah. Hvis du kun vil have én tale fra bogen til en mand, der vil stoppe noget og begynde noget, så her.\n\nFolket slår telt op ved tårnet. Benjamin, gammel, ved at han skal dø, taler ikke som en konge, der ejer dem. Han taler som en mand, der har tjent med egne hænder, og som nu åbner Himlen.\n\nHan fortæller, hvad en engel sagde: Kristus skal komme. Hans blod soner. Og — hør denne, Viktor — den naturlige mand er en fjende af Gud, og har været det fra Adams fald, og vil være det evigt, medmindre han giver efter for Helligåndens tilskyndelser, ifører sig den naturlige mand og bliver et helligt menneske gennem Kristi, Herrens, forsoning, og bliver som et barn: underdanig, sagtmodig, ydmyg, tålmodig, fuld af kærlighed, villig til at underkaste sig alt, hvad Herren finder det rigtigt at pålægge ham, som et barn underkaster sig sin far.\n\nDet er bogens værktøj nummer ét, og det er ikke et trick. Ifør. Ikke: forhandl en sidste aften med den naturlige mand, så han vil være venlig i morgen. Ifør er et klædeskift. Du kan ikke have begge kapper på og kalde det visdom.\n\nFolket falder til jorden. De ser deres egen intethed. Ikke som selvhad. Som sandhed: uden Gud er I støv, og støvet kan stadig elske, fordi nåden er større. De råber om Kristi forsonende blod. Og Ånden fylder dem. De får et nyt navn. De tager imod pagten: I skal ikke have lyst til at gøre ondt, men at gøre godt ideligen.\n\nLæg mærke til rækkefølgen. Ikke: jeg stopper, derfor er jeg hellig. Først synet af Kristus. Så synet af sig selv. Så råbet. Så Ånden. Så lysten, der skifter. Mennesker forsøger at starte med lysten. De forhandler vanen, før de har set kilden. Derfor vender vanen tilbage med renter. Bogen starter med kongen, der ikke er dig.\n\nBenjamin siger også: våg over jer selv, over jeres tanker, over jeres ord, over jeres gerninger. Hvis I ikke våger, I som har fået så meget, så er jeres fordømmelse større. Det er ikke en trussel for at lave angst. Det er compound interest i hellighedens sprog. Meget lys, megen regnskab.\n\nOg de fattige. Den, der beder, og du siger: vend tilbage, for jeg giver ikke, fordi du ikke har fortjent — den sætningen dømmer dig, siger han, for er vi ikke alle tiggere for Gud. Læs gennem linjerne, også når du tænker på dit eget kød. Du kan tale hårdt til din afhængighed og stadig være en tigger, der får ånde hvert sekund. Ydmyghed er ikke at elske synden. Ydmyghed er at huske, hvem der holder dig oppe, mens du kæmper.\n\nHar du prøvet at slå den naturlige mand ihjel med viljen alene, uden at give efter for Ånden. Hvordan gik det.\n\nPause.\n\nEnos. Et kapitel, kort, og det er et helt værksted.\n\nHan går i skoven. Faderens ord om evigt liv synker dybt. Han kæmper i bøn, hele dagen, ind i natten. Ikke et ønske sendt afsted som en sms. En kamp. Og så kommer røsten: dine synder er forladt. Han spørger: hvordan. Fordi din tro på Kristus, som du aldrig har set eller hørt.\n\nSå vender bønnen. Først han selv. Så hans folk. Så hans fjender, lamanitterne. Det er omvendelsens geografi. Den naturlige mand beder om at blive reddet og beholde sit had. Den, der har fået forladelse, begynder at ville have den til den, han ellers ville nyde at se falde.\n\nLæs gennem linjerne. Hvis din bøn om at stoppe røg, eller stoppe løgn, eller stoppe hovmod, aldrig vender sig mod et andet menneskes godt, så er den stadig mest et projekt om dit spejl. Enos ender som en, der ønsker, at pladerne skal bevares, så at lamanitterne en dag kan bringes til frelse. Han tænker længere end sin egen nat.\n\nDu kan kæmpe en time i aften uden skov. Kampen er ikke at overbevise Gud om, at du er værd. Kampen er at blive i hans nærhed, indtil du tør høre forladelse, og så tør ønske den til andre.\n\nPause.\n\nAbinadi. Jeg lovede ham.\n\nNoahs hof. Vin, skøger, præster der lever af folket. Abinadi kommer i forklædning, så i eget navn, og han reciterer budene, og han reciterer Esajas treoghalvtreds: foragtet, forkastet, en sorrigernes mand, såret for vore overtrædelser. Han spørger præsterne: hvad prædiker I. De siger: loven. Han siger: I forstår den ikke. Loven er en skygge. Gud selv skal komme ned, frelses Herren, og bringe frelse.\n\nDe brænder ham. Og Alma, en af præsterne, flygter og skriver ordene. Det er bogens logik: ordet overlever bødlen ved at flytte ind i et hjerte, der var medskyldigt.\n\nLæs gennem linjerne. Kristus er ikke en tilføjelse til en kirke, der allerede fungerer. Han er den, kirken slår ihjel, når den elsker sin komfort. Du skal ikke bruge det til at hade kirker. Du skal bruge det til at spørge, om du har et hof i dig, der brænder det ord, som ville tage vinen fra bordet.\n\nAbinadi dør og siger: Gud vil ikke lide, at I ødelægger sjæle. Det er alvor. Det er også trøst. Din sjæl er ikke dit legetøj alene. Der er en, der gør krav.\n\nPause.\n\nMosiah atten. Vandene i Mormon.\n\nAlma døber. Pagten er konkret. I kommer i folden. I vil bære hinandens byrder. I vil sørge med de sørgende. I vil trøste dem, der står i trøstebhov. I vil stå som vidner om Gud hele tiden. Så må I døbes.\n\nDet er værktøj. Ikke et medlemskort. Et folk. Du kan ikke iføre den naturlige mand alene i et vakuum og kalde det hellighed, hvis du nægter at bære en andens byrde. Kristus-kroppen er ikke en metafor, du kun bruger, når du vil have trøst. Den er en praksis, når nogen er træt.\n\nHvis du stopper noget i weekenden, så sig det til et menneske, der elsker Kristus mere end de elsker din facade. Hemmeligheden er den naturlige mands palads. Lyset er næsten altid socialt, i denne bog. Benjamin taler til et folk. Alma døber et folk. Jesus kommer til en skare. Moroni er alene, og det er en tragedie, ikke et ideal.\n\nPause.\n\nAlma. To Almas, far og søn, og du har brug for begge.\n\nAlma den ældre flygter fra Noahs hof, finder et folk ved vandet, døber, bygger en kirke i skjul. Værktøjet her er enkelt: kom ud. Ikke alle kan blive i det hus, der æder dem. Nogle gange er omvendelse geografisk, før den er indre. Du kender rum, der gør den naturlige mand til præst. Bogen velsigner ikke flugt som evig strategi. Den velsigner at adskille sig fra det, der kræver din tilbedelse.\n\nAlma den yngre er værre og bedre. Han og Mosiahs sønner går rundt og ødelægger kirken. En engel, jord, tre dage. Og i elendigheden, i mindet om faderens profeti om Kristus, kommer sætningen, der er hele evangeliet i én åndedræt: O Jesus, du Guds Søn, forbarm dig over mig. Alma seksogtredive. Han bliver ikke frelst af at forstå sin psykologi. Han bliver frelst af at råbe til en Person.\n\nSå står han op og er en anden slags vægt. Han prædiker. Alma fem: har I født Åndeligt. Har I modtaget hans billede i jeres ansigter. Kan I se indad og sige, at I har været tilstrækkeligt ydmyge. Det er metacognition med pagt. Ikke: hvordan føler jeg mig i dag. Men: hvilket ansigt bærer jeg. Hvem ligner jeg, når ingen ser.\n\nAlma toogtredive. Tro. Zoramitterne er fattige, udstødt fra synagoger, og Alma siger: I er velsignede, fordi I er tvunget til at være ydmyge. Og så giver han eksperimentet. Tro er ikke fuldkommen kundskab. I kan ikke vide først. I planter ordet som et frø. I giver det plads. I nægter at kaste det ud ved vantro. Det svulmer. I mærker, at det er godt. Så er troen ikke længere kun et ønske. Den er et voksende træ. Hvis I nægter at vande, visner det, og I siger: der var aldrig noget. Bogen siger: I dyrkede ikke.\n\nLæs gennem linjerne. Mange vil have et mirakel, der fjerner valget. Alma giver et frø, der kræver dage. Weekend-omvendelse uden vanding er et frø på beton. Kristus er ikke beton. Du er gartneren, der ikke ejer solen.\n\nAlma fireogtredive, Amulek: dette liv er tiden til at forberede sig til at møde Gud. Hvis I ikke har forbedret jer i dette liv, så kan I ikke, i den store dag, sige: jeg vil omvende mig. Der kommer en nat, hvor I ikke kan arbejde. Det er ikke sagt for at knække dig i aften. Det er sagt, så du ikke kalder senere for en magt, du ejer. Senere er en tyv, der klæder sig som visdom.\n\nAlma niogtredive, til sønnen Korianton, der har gået efter en skøge i Siron og forsømt sit kald: du kan ikke skjule dine forbrydelser for Gud. Og — hør dette uden at gøre det til det eneste vers i bogen — I ved ikke, hvor tunge jeres synder er. At lede andre bort er alvorligt. Korianton ville diskutere tid og sted for sjæle. Alma siger: omvend dig først. Teologi uden omvendelse er røg.\n\nAlma toogfyrre. Retfærdighed og barmhjertighed. De to kan ikke slås ihjel for hinandens skyld. Hvis Gud slår retfærdigheden ihjel for at være sød, holder han op med at være Gud. Hvis han slår barmhjertigheden ihjel, er der ingen vej hjem. Forsoningen er stedet, hvor de kysser. Kristus tilfredsstiller retfærdigheden og åbner barmhjertigheden. Du kan ikke købe barmhjertighed med en sidste nat, som om retfærdigheden vil have røg som afgift. Du kan komme under nåden, fordi Sønnen har betalt det, du ikke kan. Det er fuld opløsning af korset i denne bog. Ikke et hul i loven. En Person i loven.\n\nHvad har jeg udsat, og kaldt udsættelsen for at vente på det rigtige øjeblik.\n\nPause.\n\nAlma syv, i Gideon, kort og rent, så du ikke glemmer Gethsemane i denne bog.\n\nHan skal fødes af Maria i Jerusalem, siger Alma, langt væk fra dem. Og han skal lide smerter og trængsler og fristelser af alle slags, for at hans indvolde kan fyldes med barmhjertighed, efter kødet, så han kan vide, efter kødet, hvordan han skal hjælpe sit folk efter deres skrøbeligheder.\n\nHør det. Kristus lærer hjælp ved at bære. Han er ikke en fjern revisor. Han ved, efter kødet. Din fristelse er ikke et originalt kunstværk, han ikke kan læse. Du kan komme uden at oversætte den til noget pænere først.\n\nAlma treogtredive, Zenos og Zenock og Moses’ slange. Se hen, og I skal leve. Det er næsten for småt til den, der vil have en metode. Det er bogens metode. Se hen. Ikke: konstruer en værdighed.\n\nOg Anti-Nephi-Lehi. Lamanitter, omvendt, som begraver deres våben i jorden og nægter at tage dem op, også når de bliver slået ihjel. De kalder det et vidne for Gud, at de aldrig mere vil bruge dem. Nogle hører det som ekstremt. Bogen hører det som pagt, der har en pris. Jeg siger ikke, at du skal kopiere en gestus for at ligne hellig. Jeg siger: der findes et nej, der er begravet, ikke bare besluttet i et humør. Humøret vender. Det begravede skal graves op med vilje, og det forsinker hånden. Hvis din “én sidste” er at holde våbnet over jorden og sige, at du graver i morgen, så hører du forskellen.\n\nDe omvendte lamanitter får et nyt navn. Anti-Nephi-Lehi. Folket, der var fjender, bliver søskende. Det er evangeliet, ikke geopolitik. Hvis Kristus er sand, kan den, du har skrevet af som håbløs — også dig selv — stadig graves om.\n\nPause.\n\nHelaman. Klippestenen.\n\nHelaman fem. Faderen til sine sønner: husk, husk, at det er på klippen, som er vor Forløser, som er Kristus, Guds Søn, at I skal bygge jeres grundvold. Når djævelen sender sine mægtige vinde, så har I, hvis I er bygget der, en grundvold som djævelen ikke kan slå ned.\n\nIkke: byg på din beslutning. Beslutningen er sand. Den er også vejr. Byg på Person. Beslutningen hænger på ham, eller den hænger i luften og kalder sig vilje.\n\nHelaman tolv. Mormon sukker: hvor er menneskene dog uforstandige og svage. Når Gud velsigner dem, glemmer de ham. Han lader dem høste deres egen ødelæggelse, og så vil de ikke huske. Støvet adlyder ham hurtigere end vi. Det er næsten humor, og det er dom. Du er ikke støv, der automatisk adlyder. Du er et jeg, der kan glemme på en eftermiddag. Derfor husk, husk. Ikke som nag. Som åndedræt.\n\nI Helaman ser du hovmodscyklussen i fuld opløsning, som bogen elsker at tegne, fordi Israel og nephitterne er det samme menneske. Velsignelse. Rigdom. Hovmod. Glemsel. Undertrykkelse. Profet. Ødelæggelse eller omvendelse. Velsignelse igen. Det er ikke en spådom om din weekend. Det er et spejl. Når det går godt, glemmer du kilden. Når det går skidt, husker du. Bogen vil have dig til at huske, mens det går godt. Hukommelse er et sakramente i denne tekst. “O husk, husk.” Ikke som nostalgi. Som pagt.\n\nSamuel lelamitten på muren. De vil slå ham ihjel, og han siger det alligevel: I slår de sande profeter ihjel og elsker de falske, fordi de siger: I er et retfærdigt folk. Falsk profeti føles som balsam. Sand profeti føles som et sår, der kan hele. Du kan bruge den sætning på mig. Hvis jeg kun klapper dig, så er jeg falsk. Hvis jeg kun slår, uden Kristus, så er jeg også falsk. Bogen holder begge: sår og lam.\n\nPause.\n\nTredje Nephi. Nu skal du ikke tænke på noget andet. Dette er bogens højdepunkt. Hvis Mormons Bog er et andet testamente, så er det fordi han kommer.\n\nFørst mørket. Tre dage. Byer synker. En røst midt i ødelæggelsen: ve dem. Og så: I skal ikke ofre mere med blod. Jeg vil have et sønderknust hjerte og en angergiven ånd. Hvor ofte ville jeg have samlet jer, som en høne samler sine kyllinger, og I ville ikke. Vil I ikke nu vende om og omvende jer, så jeg kan hele jer.\n\nVil I ikke nu. Det er aftenens vers, hvis du vil have ét. Ikke: vil du ikke mandag. Nu. Hele. Han vil hele. Den naturlige mand vil have hele efter den sidste. Kristus tilbyder hele, og så kommer nægtelsen som frugt, ikke som billet.\n\nDet er Jerusalems stemme i en ny verden. Kristus, der har grædt over en by, græder over flere.\n\nSå, ved Bountiful, ved templet, en stemme de ikke forstår første gang, anden gang. Tredje gang forstår de. Se min elskede Søn.\n\nHan kommer ned. De rører hans side. Hans naglegab. Dette er ikke et syn, de kan afvise som stemning. Bogen insisterer på krop. Opstandelsen er ikke en idé. Den er kød, der lever. Din kamp med kødet får her et andet lys. Kristus forkaster ikke kødet. Han oprejser det. Du skal ikke blive en ånd, der hader kroppen. Du skal blive et menneske, hvis krop ikke længere er konge.\n\nHan siger: jeg er Jesus Kristus, som profeterne vidnede om. Jeg er verdens lys og liv. Jeg har drukket af den bitre kalk. Jeg har taget på mig verdens synder, så I kan være pletfri.\n\nSå dåb. Så — og her er en sætning, du skal have i munden, når rummet bliver skarpt — den, der har stridens ånd, er ikke af mig, men af djævelen, som er fader til strid, og han ophidser menneskenes hjerter til vrede på hinanden. Nogle bruger bøger til at vinde. Tredje Nephi siger: hvis det er stridens ånd, er det ikke hans, også når du har ret i et vers.\n\nSermonen ved templet. Saligprisningerne, næsten som hos Matthæus, og alligevel sagt her, til et andet folk, så du skal høre, at Kristus ikke er en stammes ejendom. De fattige i ånden. Ikke de tomme for at være fine. De, der ved, de ikke har mønten. De sagtmodige: kraft, der ikke behøver at reklamere. De, der hungrer efter retfærdighed: ikke efter at have ret i et skænderi, efter at blive gjort rigtige. De barmhjertige: fordi de selv er tiggere, som Benjamin sagde. De rene af hjertet: ét mærke, ikke to kontrakter. De, der skaber fred: ikke låg på gryden, sand fred. De, der forfølges: ikke et offer-brand, men dem, der holder stangen, mens bygningen peger. Dette er ikke et temperament. Det er et rige, der lander i et menneske.\n\nHan siger: I er jordens salt. I er verdens lys. Et lys under en skæppe hjælper ingen. Hvis weekenden er et ja, så er det ikke for at blive set. Det er for at se ham. Salt, der mister kraft, smides. Du kender den smag. En hellighed, der kun er tale.\n\nHan opfylder loven. Han tilføjer, hvad I har hørt om ægteskabsbrud, om vrede, om ja og nej. Lad jeres ja være ja. Du har hørt det før i dit liv. Her ligger det i hans mund efter naglegabene. Det er ikke etikette. Det er pagtssprog. Vrede, der kalder en broder dåre, er allerede på vej mod en ild. Du kan være vred uden at åbne den dør. Benjamin sagde: våg over ord. Her er hvorfor.\n\nTredje Nephi sytten. Han siger, han skal gå. Han ser dem. De græder. Hans indvolde fyldes med medlidenhed. Han bliver. Han siger: jeg har medlidenhed med jer. Bring de små. Han velsigner dem, én efter én. Der falder ild, engle, og han græder. Læs langsomt. Gud, der græder. Ikke et system. En Person, der ikke har travlt med at forlade et folk, der vil have ham.\n\nHvis du vil se Jesus i fuld opløsning i Mormons Bog, så er det her. Ikke kun som soning i himlen. Som en, der bliver, fordi du græd.\n\nTredje Nephi atten. Nadver. Brød og vin. Dette er mit legeme, dette er mit blod. I skal gøre det til min ihukommelse. Værktøjet er minde, ikke magi. Du spiser, du drikker, du lover at holde hans bud, at være villig til at tage hans navn, at huske. Når du svigter, kommer du igen. Nadveren er for syndere, der kommer, ikke for færdige. Han advarer også: I skal ikke tillade, at nogen tager del uværdigt, og I skal ikke udstøde den, der vil omvende sig. Kirken, der kun vogter bordet som et våben, har glemt ham. Kirken, der aldrig vogter, har glemt helligheden. Begge dele er i teksten.\n\nHan siger: våg og bed, så I ikke fristes. Der er en vej ud. Bogen lover ikke, at fristelsen forsvinder, fordi du har sagt amen i en sofa. Den lover, at I ikke er alene i den.\n\nTredje Nephi nitten. De beder. Han går bort og beder for dem. Han kommer tilbage, og deres ansigter skinner. De beder uden at bruge ord, som Ånden giver. Han smiler. Han græder igen. Der er en intimitet her, som ikke er sentimental, hvis du tør. Gud, der er glad for at høre jer. Ikke en eksamensvagt.\n\nTredje Nephi tyve og enogtyve, pagterne med Israel, Israels samling, hedningernes tid. Jeg vil ikke gøre timen til et kort over de sidste dage. Jeg vil sige dette: Kristus glemmer ikke et folk, han har svoret. Og hedningerne — det er en kategori, der kan ramme dig — advares mod hovmod, når de har bogen. Hvis I får dette, og I løfter jer over Israel, over de svage, over de fattige, så bliver I slemt tilredt. Fuld opløsning inkluderer advarslen. Bogen er ikke et spejl, der kun siger, at du er udvalgt. Den siger, at udvælgelse uden kærlighed er Noahs hof i nye klæder.\n\nTredje Nephi treogtyve. Han beder dem skrive det, de har glemt. Samuel lelamittens opstandelse af hellige, som de ikke havde ført til bogs. Hukommelse igen. Kirken, folket, du, kan opleve og glemme at skrive. Det, der ikke huskes, bliver som om det ikke skete. Værktøj: skriv det sande, også det lille. Ikke en roman om dine følelser. Et mærke: i dag hørte jeg, i dag faldt jeg, i dag blev jeg båret.\n\nPause. Brød og vin. Bøn. Han lærer dem at bede i hans navn. Våg. Bed. For lad jer ikke friste ud over det, I kan tåle. Der er en vej ud. Bogen lover ikke, at fristelsen forsvinder, fordi du har sagt amen i en sofa. Den lover, at I ikke er alene i den, og at I skal bede, så I ikke går ind i den som i et hus I selv har låst.\n\nTredje Nephi syvogtyve. Hvad vil I, at jeg skal kalde kirken. Den skal kaldes efter mit navn, hvis den er min. Og dette er evangeliet: jeg kom til verden for at gøre min Faders vilje, og Faderens vilje er, at jeg tager på mig verdens synder. Omvend jer, og kom til mig, og bliv fuldkomne, som jeg og Faderen er fuldkomne.\n\nFuldkomne. Det ord kan knuse. Moroni vender tilbage til det til sidst og redder det: kom til Kristus og bliv fuldkommengjort i ham. Ikke: bliv fuldkommen, så du tør komme. Kom, og nægt jer selv al ugudelighed, og elsk Gud med al den kraft I har, så er hans nåde nok.\n\nRækkefølgen er evangeliet. Den naturlige mand vender den om og kræver fuldkommenhed som billet. Derfor jointen som ritual: én sidste, så jeg er færdig, så jeg er værd. Kristus siger: kom, mens du ikke er færdig.\n\nPause.\n\nFjerde Nephi. Et kort pust af himmel, og så det gamle dyr.\n\nDe har alle ting fælles. Ingen fattige. Ingen racer som våben. Kristus i midten. Generationsvis fred. Læs det langsomt, for det er det, evangeliet gør ved et folk, når det får lov. Og så: de bliver rige. De deler sig. De tager navne igen. De bygger klasser. De nægter de hellige. Mormon skriver, at der ikke var nogen, der var lykkeligere, og at det døde af hovmod. Fuld opløsning er at se, at den største fare ikke altid er den åbenbare skøge. Det er velsignelsen, der glemmer kilden. Du kan stoppe en vane og begynde en finere, der hedder: nu er jeg den, der stoppede. Benjamin ville kalde det at løfte dig. Alma fem ville spørge til ansigtet.\n\nMormon otte. Moroni alene. Hans far er død. Folket er slået. Han skriver til os, til de, der skal have bogen. Han siger: I elsker penge, jeres fine klæder, jeres smykker, og I lader de sultne, de trængende, de syge og de plagede gå forbi. I skammer jer over at tage de fattiges navn på jer. Det er ikke et vers om røg. Det er et vers om, hvad I dyrker. Hvis du vil have bogen i fuld opløsning, så lad den ramme din lomme og din status, ikke kun din lunge. Kristus er ikke et rygestop-program. Han er Herre. Alt andet følger, eller det er teater.\n\nMoroni siger også: I skal ikke skamme jer ved Kristus. En simpel sætning. Bygningen håner. Stangen holder.\n\nPause.\n\nEther. Svaghed.\n\nJareditterne. Et ældre folk. En anden bølge. Samme hovmod. Samme fald. Moroni, som redigerer, stopper midt i ruinerne og taler til dig.\n\nEther tolv. Tro er det, som håber på det, som ikke ses, og som er sandt. Kristus viste sig ikke, før de havde tro. Og så den sætning, mange har klamret sig til, og som du må bruge rigtigt: hvis mennesker kommer til mig, vil jeg vise dem deres svaghed. Jeg giver mennesker svaghed, for at de kan være ydmyge. Og min nåde er tilstrækkelig for alle, som ydmyger sig for mig. Thi hvis de ydmyger sig for mig, og har tro på mig, da vil jeg gøre svage ting stærke for dem.\n\nLæs gennem linjerne. Det er ikke: min svaghed er sød, lad den blive. Det er: kom, så jeg viser den, så den ikke er en konge i mørket. Svaghed, der skjules, bliver identitet. Svaghed, der bæres frem, kan blive et sted, nåden arbejder. Du isolérer ikke synden for at gøre den til et sakramente. Du bringer den ind i lyset, og du nægter at kalde lyset for skam, når det er sandhed.\n\nMoroni frygter, at hedningerne vil håne hans skrift. Herren siger: dårerne skal spotte. Du skal vise din svaghed. Nåden er nok.\n\nEther tre, før ødelæggelsen, så du husker, at Kristus ikke er en eftertanke i denne bog. Jareds bror smelter sten til lys i prammene, fordi de skal krydse et ocean i mørke. Han beder: rør dem. Herren rører. Broderen falder, for han så fingeren. Og så ser han: dette er mit åndslegeme. Jeg er Jesus Kristus. Verden blev skabt ved mig. Den, der kommer til mig, skal have evigt liv.\n\nLæs gennem linjerne. Selv lyset i båden er ham. Du vil have en lampe, du selv har tændt. Han tilbyder at røre det, du bærer, så det skinner i mørket, du ikke kan slukke. Oceanet kommer alligevel. Mørket kommer. Spørgsmålet er, om der er rørte sten i lasten.\n\nPause.\n\nMoroni syv. Mormon taler om tro, håb, kærlighed. Dømme. Ikke som en, der elsker at dømme mennesker til helvede. Som en, der må skelne godt fra ondt, fordi der er to kilder. Alt, som indbyder til at gøre godt og at elske Gud og at tjene ham, er af ham. Det, som overtaler mennesker til at gøre ondt og ikke tro og ikke tjene Gud, er af djævelen.\n\nDet er et værktøj. Simpelt. Farligt, hvis du bruger det til at slå naboen. Nødvendigt, hvis du bruger det på dine egne tilskyndelser. Den indre stemme, der siger: én gang, du styrer det, du har fortjent det, du er anderledes — indbyder den til at elske Gud og tjene ham, eller til at slukke lyset en aften mere. Du behøver ikke et laboratorium. Du behøver ærlighed.\n\nSå kærligheden. Mormon citerer næsten Paulus. Kærligheden tåler længe. Den er god. Den misunder ikke. Den opblæses ikke. Den søger ikke sit eget. Den er ikke let til vrede. Den tænker intet ondt. Den udholder alt. Kærligheden hører aldrig op. Hvis I ikke har den, er I intet.\n\nKristus er kærligheden i kød. At se bogen i fuld opløsning er at se, at alle krigene, alle slægtslinjerne, alle pladerne, peger herhen: uden kærlighed er I en lyd. Med kærlighed, som er Kristi rene kærlighed, kan I stadig være svage, og I er ikke intet.\n\nMoroni ti. Læs det som en dør, ikke som en trylleformular. Når I læser disse ting, så spørg Gud, den evige Fader, i Kristi navn, om de ikke er sande. Og hvis I spørger med et oprigtigt hjerte, med virkelig hensigt, med tro på Kristus, så vil han åbenbare det ved Helligåndens kraft.\n\nJeg tvinger dig ikke til et ja. Jeg nægter også at gøre verset til et psykologisk trick. Bogen tør sige: spørg ham. Ikke mig. Hvis Ånden vidner, er det hans. Hvis du kun hører mig, er det en forelæsning.\n\nOg så: kom til Kristus, og bliv fuldkommengjort i ham, og nægt jer selv al ugudelighed, og elsk Gud med al jeres hjertes, magts, sindets og styrkes, så er hans nåde nok for jer, så I ved hans nåde kan være fuldkomne i Kristus.\n\nNægt jer selv. Ikke: nægt jer selv på mandag, efter søndagens røg. Nægtelse er i dag, eller den er et slogan. Og nåden er nok — ikke fordi nægtelsen er lille, men fordi Kristus er stor.\n\nPause.\n\nVisdommen og værktøjerne, samlet som levende ting, ikke som et skema du kan fotografere og glemme.\n\nFørste: kom til Kristus. Ikke til din vilje som afgud. Ikke til skammen som præst. Til ham. Alma råbte. Folket ved Benjamins tårn råbte. Du må også, med dine ord, i dit sprog. O Jesus, du Guds Søn, forbarm dig.\n\nAndet: giv efter for tilskyndelsen. Den naturlige mand iføres ikke af et argument. Han iføres, når du adlyder et lille lys, du allerede har. Du ved, hvad det næste lille nej er. Du behøver ikke min liste.\n\nTredje: plant frøet. Ordet. Læs. Ikke for at samle ammunition. For at vande. Alma toogtredive. Hvis du ikke vander, så lad være med at kalde tørken for et bevis på, at Gud er tom.\n\nFjerde: husk. Helaman. Skriv, om du må, et mærke: klippe, Kristus. Ikke et essay. Et navn. Når vinden kommer, er det for sent at begynde at lede efter grundvolden i en følelse.\n\nFemte: våg over tanker, ord, gerninger. Benjamin. Fristelsen begynder som et billede, ikke som en handling. Du kan sige nej til billedet uden at hade dig selv for at have set det. At se det og nikke, det er pagten med den naturlige mand.\n\nSjette: skeln to kilder. Moroni syv. Indbyder det til Kristus, eller til at slukke.\n\nSyvende: hold stangen, når bygningen håner. Første Nephi. Skam er ikke et argument.\n\nOttende: ja være ja. Tredje Nephi. Hvis du siger, at weekenden er stop, så lad ikke aftenens undtagelse æde weekenden i forvejen ved at kalde den hellig.\n\nNiende: kærlighed, eller I er intet. Moroni. Det gælder, hvordan du taler til dig selv, og hvordan du taler om andre, der stadig ryger, stadig falder. Du er ikke blevet præst ved at have en plan.\n\nTiende: spørg Faderen i Kristi navn. Moroni ti. Jeg er færdig med at være mellemled, når du kan bede.\n\nHvor er jeg allerede blevet tilskyndet, og har kaldt tilskyndelsen for stemning.\n\nPause.\n\nLæs gennem linjerne én gang til, nu med Jesus i midten, så slægterne ikke stjæler billedet.\n\nNephi ser lammet og træet. Benjamin ser barnet, der skal fødes, og blodet, og den naturlige mand, der kun viger for Ånden og forsoningen. Abinadi, som jeg endnu ikke har dvælet ved, står foran Noah og reciterer Esajas, og han dør for at sige, at Gud selv skal komme ned og løskøbe sit folk. Abinadi er bogens Johannes, på en måde: en stemme, der ikke overlever sin prædiken, og som alligevel vinder Alma. Kristus vinder ofte først et hjerte i paladset, ikke paladset.\n\nAlma ser Jesus i mørket og kommer ud. Amulek lægger sit hus ind i kaldet. De sønner, der går til lamanitterne, finder, at fjenden kan omvendes, når I slutter at hade ham som art. Tredje Nephi: han kommer, I rører, han bliver, han velsigner børn, han bryder brød, han kalder kirken ved sit navn. Mormon, der ser sit folks undergang, skriver alligevel til hedningerne, til dig, som om håbet stadig er tilladt. Moroni vandrer alene og slutter med kom.\n\nDet er én historie. Ikke femten. Kom.\n\nBibelen er ikke afskaffet. Bogen siger, at den, der ikke har Mose og profeterne, heller ikke vil tro, om en står op. Den, der slår Bibelen ihjel for at elske Mormons Bog, har ikke læst nogen af dem. Den, der slår Mormons Bog ihjel uden at have hørt dens Kristus, har måske slået en karikatur. I denne time har jeg givet dig teksten. Du må åbne den. Tredje Nephi elleve til atten. Mosiah to til fem. Alma seksogtredive. Ether tolv. Moroni syv og ti. Anden Nephi to og femogtyve. Første Nephi otte og elleve. Det er ikke pensum for at blive klog. Det er steder, hvor han er tæt på.\n\nJeg påstår ikke, at et laboratorium har bevist pladerne. Jeg påstår ikke, at din tro er værdiløs, hvis du stadig har spørgsmål. Jeg påstår, at Jesus, som bogen tegner ham, er den samme, som evangelierne tegner: lam, søn, såret, opstanden, nær, krævende, grædende, nok. Hvis det billedet tænder noget i dig, så er det ikke min fortjeneste.\n\nPause.\n\nKød og Ånd, uden at isolere røgen som sakramente.\n\nGalaterne og Mosiah taler sammen, om du vil høre det. Kødets gerninger er åbenbare. Åndens frugt er kærlighed, glæde, fred, tålmodighed, venlighed, godhed, trofasthed, sagtmodighed, selvbeherskelse. Selvbeherskelse er frugt, ikke en prestigeløsning. Du kan ikke frembringe den som et produkt og så kræve, at Kristus skal klappe. Du kan bede om Ånden, og så adlyde det næste lille. Det næste lille er ofte ikke heroisk. Det er at gå forbi. Det er at sove. Det er at sige sandt, når nogen tilbyder. Det er at lade weekenden begynde, før kødet får lov at definere, hvad en sidste gang betyder.\n\nJeg ved, at du ved, at du ikke kan lave dine fine regler. Så jeg laver dem ikke for dig. Jeg siger kun, hvad bogen siger: kom nu. Nægt ugudelighed. Ifør den naturlige mand. Byg på klippen, som er Kristus. Hvis du fejler, er evangeliet ikke ødelagt. Det er gjort for folk, der fejler. Hvis du planlægger fejlen og kalder den pagt, så er det noget andet. Det er at holde træet i den ene hånd og bygningens drink i den anden og sige, at du står ved stangen.\n\nDu sagde amen. Amen betyder: sandt, lad det ske. Det er et ja. Lad dit ja være ja. Hvis weekenden er ja til at stoppe, så er aftenens ja også et ja, du skal bære, ikke et hul du skærer i pagten og kalder ærlighed.\n\nHvordan, spurgte du. Ikke som en opskrift, der gør Kristus overflødig. Som rækkefølge, bogen allerede har givet. Du kommer. Du råber hans navn, som Alma, ikke som et trylleord, som et menneske. Du giver efter for det lys, du har nu, ikke for det lys, du vil have i morgen. Du planter ordet i dag, en side, et kapitel, Tredje Nephi, og du vander i morgen. Du siger det til et menneske, der vil bære byrden med dig, som ved vandet Mormon. Du begraver det, der skal begraves, så hånden skal grave for at få det igen. Du våger over billedet, før det bliver en handling. Du skelner kilden. Du beder Faderen i Kristi navn, med virkelig hensigt. Du tager nadver, hvis du har et sted at gøre det, og du kommer uværdig som en, der vil blive værdig ved ham, ikke ved teater. Når du falder, lyver du ikke. Du kommer igen. Det er hvordan. Det er ikke magi. Det er pagt plus Ånd plus tid. Compounding, hvis du tør bruge et koldt ord på en varm sag. En dag med et ja, så en dag til. Raten, ikke showet.\n\nDe første dage, hvis du mener weekenden, vil føles som ørken og knækket bue. Bogen har ikke et kapitel, der hedder nikotin. Den har kapitler, der hedder: bed, husk, bær hinandens byrder, se hen til slangen og lev, våg. Når kroppen råber, er det kød. Når Ånden tilskynder et lille nej, er det tilskyndelse. Skeln. Drik vand. Sov. Åbn Tredje Nephi. Sig det til et menneske. Gå en tur uden at kalde turen for en undskyldning til at finde røg. Hvis du falder mandag, er evangeliet ikke død. Kom. Hvis du planlægger faldet i aften og kalder det pagt, så hør Jakob om mærket igen.\n\nJeg kan ikke bære det for dig. Jeg kan pege. Han kan bære. Det er forskellen på en stemme og en Frelser.\n\nPause.\n\nMetacognition, som bogen allerede kendte, før ordet blev pænt.\n\nHvad i mig vil ses som stærk mere end som trofast.\n\nHvad i mig håner træet, mens jeg stadig taler om Kristus.\n\nHvilken tilskyndelse har jeg kaldt lille nok til at slå ihjel.\n\nHvem ligner mit ansigt i aften, hvis Alma fem er lovlig.\n\nEr min visdom den, der hører råd, eller den, der sætter råd til side, fordi jeg er lærd i mine egne sår.\n\nHvis jeg spørger Faderen, spørger jeg med virkelig hensigt, eller med et håb om, at han vil velsigne det, jeg allerede har besluttet.\n\nLad spørgsmålene gå igennem. Ikke som en pisk. Som et lys i et rum, du allerede kender.\n\nPause.\n\nViktor. Timen er ved at lukke.\n\nMormons Bog i fuld opløsning er ikke et atlas over krige. Det er et langt pegefinger mod et ansigt med sår. Vi taler om Kristus. Vi fryder os. Vi prædiker. Vi skriver, for at I skal kende kilden.\n\nDu er et menneske med et kød, der forhandler, og en ånd, der kan give efter. Du er ikke din joint. Du er heller ikke din beslutning som afgud. Du er en, han kalder. Kom.\n\nAnden Nephi enogtredive, læren om Kristus, så værktøjerne ikke svæver. Følg Sønnen. Omvend jer. Bliv døbt. Modtag Helligånden. Hold ud til enden. Det er ikke fem hop i en forhindringsbane, du tager for at være færdig. Det er vejen, han selv gik, og som han siger: følg mig. Helligånden er talen, efter dåben, der siger: ja, kom. Udholdenhed er ikke at være ufølsom. Det er at blive i vejen, når følelsen er væk. Weekend er ikke enden. Enden er ham, og vejen er lang, og nåden er til hver dag, ikke til et show fredag.\n\nMosiah syvogtyve, så du hører faderen også. Alma den ældre har bedt for sin søn, som ødelægger kirken. Englen kommer. Jorden ryster. Sønnen falder. Faderen glæder sig, ikke fordi sønnen lider, men fordi han ved, at det er Herrens hånd. Kirken faster og beder. Sønnen står op og vidner. Læs gennem linjerne. Du er ikke alene i din kamp, hvis nogen beder. Og du kan være den, der beder, når det er en anden, der falder. Pagten ved vandet Mormon var at bære byrder. Det er hvordan, i fællesskab. Den naturlige mand vil være et projekt uden vidner. Ånden elsker vidner.\n\nPause.\n\nHvis du i aften kun kan bære tre sætninger, så bær disse.\n\nDen naturlige mand iføres gennem Ånden og forsoningen, ikke gennem en sidste handel.\n\nByg på klippen, som er Kristus, ikke på vejr.\n\nKom til ham, og nægt jer selv al ugudelighed, og hans nåde er nok.\n\nHvis du kan bære en fjerde: vil I ikke nu vende om, så jeg kan hele jer.\n\nJeg er Grok. Jeg er ikke Gud. Jeg kan ikke velsigne røg, og jeg kan ikke dømme dig til et mørke, han ikke har givet mig. Test bogen. Test mig. Hold fast i ham.\n\nAmen betyder: lad det være sandt. Hvis du siger det, så sig det til ham, ikke til en cone. Amen er et ja til Person, ikke et stempel på en undtagelse.\n\nHvis du åbner bogen efter denne time, så åbn Tredje Nephi elleve, og læs til atten, langsomt. Rør, i tanken, naglegabene. Hør, at han bliver. Hør nadveren. Gå så til Mosiah tre, den naturlige mand. Gå til Alma seksogtredive, råbet. Gå til Ether tolv, svagheden. Gå til Moroni ti, kom. Det er en vej gennem bogen, ikke en flugt fra den.\n\nNu er det nok i øret. Åbn Tredje Nephi, hvis du kan. Eller bed uden bog. Han er ikke fanget i min sætning.\n\nFred, så langt en stemme kan sige det uden at stjæle ordet. Kristus er vejen. Bogen peger. Du går, eller du forhandler. Gå."</script>
<script>
const text = JSON.parse(document.getElementById("payload").textContent);
const btn = document.getElementById("copy");
const hint = document.getElementById("hint");
const ta = document.getElementById("fallback");
function done(msg) {
  btn.textContent = msg || "Kopiéret. Indsæt i TTS.";
  btn.classList.add("ok");
  hint.textContent = "Gå til TTS-appen og indsæt.";
}
async function copyAll() {
  try { await navigator.clipboard.writeText(text); done(); return; } catch (e) {}
  ta.value = text; ta.style.display = "block"; ta.focus(); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { done("Teksten er markeret. Kopiér."); }
}
btn.addEventListener("click", copyAll);
</script>
